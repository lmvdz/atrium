# Atrium local + single-VPS stack (issue #18): one app server, one worker
# process, one database, one object store. The same file runs both places —
# only the .env differs.
#
#   docker compose up -d postgres minio   # infra only, then `pnpm dev`
#   docker compose up --build             # the whole stack in containers
#
# ┌─ CREDENTIALS ──────────────────────────────────────────────────────────────
# │ The values in `.env.example` — postgres `atrium:atrium`, MinIO
# │ `atrium:atrium-dev-secret` — are DEVELOPMENT CREDENTIALS. They exist so a
# │ laptop boots with no setup. They are published in this repository, so
# │ anyone can read them.
# │
# │ Never run this file on a public VPS with those values. The three secrets —
# │ POSTGRES_PASSWORD, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY — are each
# │ written `${VAR:?...}` with no default: compose refuses to start rather than
# │ quietly reusing a known password. Everything else here is a non-secret
# │ setting (POSTGRES_USER, POSTGRES_DB, S3_BUCKET, S3_REGION, log level, ports)
# │ and does keep a default, because a guessed database name costs nothing and
# │ a guessed password costs everything.
# │
# │ Set real values in `.env` (or the deployment's own secret store) before
# │ exposing any port to the internet, and do not publish 5432/9000/9001 at all
# │ unless you mean to.
# └────────────────────────────────────────────────────────────────────────────

name: atrium

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — there is no default; see the header}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atrium} -d ${POSTGRES_DB:-atrium}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env — there is no default; see the header}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env — there is no default; see the header}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` ships inside the minio server image (verified against
      # RELEASE.2025-09-07T16-13-09Z: /usr/bin/mc, with a preconfigured `local`
      # alias), and this is MinIO's own documented healthcheck. If a future
      # image ever drops it, `curl -fsS http://localhost:9000/minio/health/live`
      # is the equivalent — curl is present too. minio-init and, through it, the
      # server both gate on this check passing.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the attachments bucket, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set atrium http://minio:9000 ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env — there is no default; see the header} ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env — there is no default; see the header} &&
      mc mb --ignore-existing atrium/${S3_BUCKET:-atrium-attachments} &&
      echo 'bucket ready'
      "
    restart: 'no'

  # One-shot: apply drizzle migrations, then exit. The server waits for this.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['node', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Stated rather than inherited. apps/server/src/env.ts treats an unset
      # NODE_ENV as production anyway, and the image sets it — this is here so
      # the file says what this container is, without a reader having to chase
      # two defaults to find out. `loadMigrationEnv` asks for nothing else:
      # migrations touch no object store.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — there is no default; see the header}@postgres:5432/${POSTGRES_DB:-atrium}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — there is no default; see the header}@postgres:5432/${POSTGRES_DB:-atrium}
      # Must match the web app's value exactly, or every upgrade reads as
      # unauthenticated. There is no default: production refuses to start without it.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-30000}
      INTERPRET_WORKER_CONCURRENCY: ${INTERPRET_WORKER_CONCURRENCY:-2}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-atrium-attachments}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # This service runs NODE_ENV=production, so apps/server/src/env.ts requires
      # both of these — the development fallback does not apply here.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env — there is no default; see the header}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env — there is no default; see the header}
    ports:
      - '${SERVER_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      # The web app owns signup and invitations, so it reads and writes the
      # same tables the server does and needs them migrated first.
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}
      # The same secret the server uses — see the comment above.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  minio-data:
