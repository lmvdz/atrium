# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  DEVELOPMENT ONLY — THIS OVERRIDE SERVES CLEARTEXT HTTP ON localhost.      ║
# ║                                                                           ║
# ║      docker compose -f docker-compose.yml -f docker-compose.dev.yml up     ║
# ║                                                                           ║
# ║  It must be named explicitly. It is NOT `docker-compose.override.yml`,     ║
# ║  which compose would load on its own — a plaintext override that applies   ║
# ║  by default is the round-4 defect with a different filename.               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# What this is for, and what it is not
# ------------------------------------
# For: reproducing the *proxy topology* on a laptop — one proxy appending to
# `X-Forwarded-For`, `ATRIUM_TRUSTED_PROXY_HOPS=1`, no published ports on `app`
# or `server`. That arrangement is what the rate limiter's per-address dimension
# depends on, and the only honest way to exercise it is to run it. Round 4's
# per-address demonstration ran against exactly this shape.
#
# Not for: anything reachable from a network you do not own. It sets
# NODE_ENV=development, which switches on the published development credential
# fallbacks in `apps/server/src/env.ts` as well as the console mail transport.
# Round 5 relied on that sentence; the round-5 gauntlet pointed out that
# NODE_ENV=development stops the *processes* refusing to boot, and does nothing
# to stop an operator putting the pair on the internet. So it is enforced twice
# now, in the two places that decide reachability: the published port binds to
# 127.0.0.1 (below), and `deploy/Caddyfile.dev` answers only loopback Host
# headers. Neither is a variable; both are edits to a marked file.
#
# Why the plaintext lives here rather than behind a variable in the main file:
# under NODE_ENV=production both processes refuse to start with an `http://`
# APP_URL or a `ws://` realtime URL at all (packages/auth/src/transport.ts).
# There is no override for that, so a cleartext stack is only reachable by
# *also* declaring the environment development — two deliberate acts, in a file
# that says what it is, instead of one edited character.
#
# `app` still cannot serve a page in compose: `next build` inlined
# NODE_ENV=production into its standalone bundle, so `resolveMailer` refuses the
# console transport regardless of what this file sets at runtime. That is issue
# #40's, and it is why the useful half of this override is `server` + `proxy`.
# The everyday local loop needs none of this: `pnpm infra:up && pnpm dev`.

name: atrium

services:
  server:
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:${WEB_PORT:-3000}

  app:
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:${WEB_PORT:-3000}
      NEXT_PUBLIC_WS_URL: ws://localhost:${WEB_PORT:-3000}/ws

  proxy:
    environment:
      # Caddyfile.dev never reads it. It is still needed in `.env`, because the
      # base file interpolates `${ATRIUM_DOMAIN:?...}` before either file is
      # merged — set `ATRIUM_DOMAIN=localhost` there for this override. That is
      # the honest cost of making the guard unconditional in the base file, and
      # the guard is worth more than the convenience.
      ATRIUM_DOMAIN: localhost
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: !override
      # 127.0.0.1, not 0.0.0.0. Round 5 published `${WEB_PORT}:80`, which docker
      # expands to `0.0.0.0:${WEB_PORT}:80` — every interface on the host. The
      # NODE_ENV=development this file also sets disables the production
      # transport gate, so that pair put a cleartext auth stack on whatever
      # network the host is attached to, reachable by setting one variable. The
      # host-ip prefix is what makes "development only" a binding rather than a
      # comment; `Caddyfile.dev` refuses non-loopback Host headers as the second
      # half. Publishing to another address takes editing this line, in a file
      # whose first nine lines say not to.
      - '127.0.0.1:${WEB_PORT:-3000}:80'
