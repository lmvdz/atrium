  toast(`seen cursor moved for #${r.name} only · the group stays on the divider, muted — unmark to put it back`, "info");
}
function unmarkSeen() {
  const r = room();
  if (r.markFrom == null) return;
  r.seenAfter = r.markFrom;
  r.markFrom = null; r.markedAt = null; r.readGroup = 0;
  focusOn("#markSeen", "#unmarkSeen");
  render();
  toast("unmarked · the cursor is back where it was and the group is unread again", "info");
}

function switchRoom(id, quiet) {
  if (id === S.roomId) return;
  S.roomId = id;
  S.ui.feedFilter = null; S.ui.receiptId = null; S.ui.bound = null;
  S.ui.replyTo = null; S.ui.verifying = null; S.ui.pinOpen = null;
  S.ui.reopening = null; S.ui.trace = null;
  S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false;
  $("cinput").value = "";
  if (quiet) return;                              // caller renders and reports
  render();
  bootScroll();
  const r = room();
  toast("#" + r.name + " · " + unseenCount(r) + " unseen here · this room keeps its own cursor", "info");
}

let tgtTimer = null;
function jumpTo(msgId, roomId, why) {
  if (!msgId) { toast("that source is in another room and this prototype does not seed it", "warn"); return; }
  if (roomId && roomId !== S.roomId) {
    const target = S.rooms[roomId];
    if (!target || !msg(target, msgId)) { toast("that source is outside the loaded window", "warn"); return; }
    /* A CROSS-ROOM JUMP LEAVES A TRACE. The target highlight fades after two
       seconds and the toast after three; without a trace you are standing in a
       room you did not choose with nothing on screen saying why, or how to get
       back. The trace persists until you dismiss it or navigate again. */
    const from = S.roomId;
    switchRoom(roomId, true);
    S.ui.trace = { from, msgId, why: why || null, at: S.now };
    toast("#" + roomId + " — the source of that item lives here, not in the room you came from", "info");
  }
  const r = room();
  const m = msg(r, msgId);
  if (!m) { toast("that message is outside the loaded window", "warn"); return; }
  if (m.routine) S.ui.routineOpen = true;
  S.ui.jumpTo = msgId;
  render();
  const el = $("feed").querySelector(`[data-msg="${msgId}"]`);
  scrollIntoView(el, "center");
  clearTimeout(tgtTimer);
  tgtTimer = setTimeout(() => { S.ui.jumpTo = null; render(); }, 2200);
}

/* the toast reports the OUTCOME, glyph included — round 2 stamped ✓ on every
   one of them, including the ones announcing that something was reopened. */
const TOAST_GLYPH = { ok: "✓", warn: "◆", bad: "✗", info: "·" };
let toastTimer = null;
function toast(m, kind) {
  const k = kind || "ok";
  const t = $("toast");
  $("toastMsg").textContent = m;
  $("toastGlyph").textContent = TOAST_GLYPH[k] || "·";
  t.className = "toast show" + (k === "ok" ? "" : " " + k);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function scrollFeedToEnd() {
  const feed = $("feed");
  if (reduceMotion()) { feed.scrollTop = feed.scrollHeight; return; }
  feed.scrollTo({ top: feed.scrollHeight, behavior: "smooth" });
}

/* ===========================================================================
 * WHERE FOCUS GOES AFTER AN INTERACTION (round 6 minor; widened, round 7 D3)
 *
 * render() rebuilds every surface from state, so the element that had focus is
 * detached and the browser drops focus to BODY. That is not cosmetic: a
 * keyboard reader who signs off a commitment is returned to the top of the
 * document and has to walk the whole page back to where they were, once per
 * action. Round 6 had no spec for this at all, which is the actual finding —
 * the page had simply never decided.
 *
 * ROUND 7 WROTE THE SPEC FOR HALF THE PAGE. It covered writes, and it only ever
 * LOOKED at writes: `checkFocusInvariant()` returned early unless `S.ui.wrote`,
 * so the eight interactions that re-render without writing anything — routine
 * peek, mark seen, unmark, expanding an objective, opening a receipt from the
 * lens, the receipt's back button, switching rooms, expanding a pin card, which
 * between them are the core IA moves of this page — all landed on BODY and
 * nothing on the page could see it. Same-key restore was supposed to cover them
 * and structurally could not: it fails exactly when the trigger is REPLACED BY
 * WHAT IT OPENED, which is what every one of those eight does.
 *
 * THE SPEC, one sentence: FOCUS FOLLOWS THE RECORD. Every interaction that
 * re-renders leaves focus somewhere a keyboard reader can act from — the first
 * control inside the page's own record of a write, or the control that replaced
 * the one they used — and never on BODY.
 *
 * Three mechanisms, tried in order:
 *
 *   1. A DECLARED SUCCESSOR. A write calls focusAfter(), and an interaction that
 *      replaces its own trigger calls focusOn(), with the selectors for what it
 *      just put there, most specific first. Deliberate: the handler knows what
 *      it did.
 *   2. SAME-KEY RESTORE. Otherwise focus returns to whatever had it, matched by
 *      a key that survives the rebuild (an id, or the element's own data
 *      attributes scoped to its row). This is why the routine strip, each
 *      objective head and each rail row now carry a data key: a toggle that
 *      survives its own render should simply keep focus, and before this round
 *      three of them had nothing to be found by.
 *   3. THE SURFACE THAT OWNS WHAT CHANGED, never BODY.
 *
 * And a floor under all three: `checkFocusInvariant()` asserts, after ANY
 * interaction-driven render, that focus is somewhere a reader can act from.
 * IT LEARNS ABOUT THE INTERACTION FROM THE BROWSER, not from the handler —
 * a capture-phase listener on the document, ahead of every handler on the page,
 * which is what makes the check impossible for a new interaction to opt out of.
 * Round 7's check could only see writes because writes were the only thing that
 * announced themselves to it.
 * ======================================================================== */

/* an interaction is a fact about the browser. The flag is set before any
   handler runs and cleared on the next task, so exactly the renders that happen
   SYNCHRONOUSLY inside an interaction are the ones held to the rule — a timer
   firing 2.2s later is not an interaction and is not judged as one. */
let actTimer = null;
function noteInteraction() {
  S.ui.acted = true;
  clearTimeout(actTimer);
  actTimer = setTimeout(() => { S.ui.acted = false; }, 0);
}
document.addEventListener("click", noteInteraction, true);
document.addEventListener("keydown", noteInteraction, true);

/* the element's own attributes, as a selector — stable across a rebuild
   because they are derived from the record, not from DOM position */
function attrSel(el) {
  const ds = el.dataset || {};
  const keys = Object.keys(ds).filter(k => k !== "fresh").sort();
  if (!keys.length) return null;
  return el.tagName.toLowerCase() + keys.map(k =>
    `[data-${k.replace(/[A-Z]/g, ch => "-" + ch.toLowerCase())}="${CSS.escape(ds[k])}"]`).join("");
}
function focusKey(el) {
  if (!el || el.nodeType !== 1 || el === document.body) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  const own = attrSel(el);
  if (!own) return null;
  /* scope to the row that owns it, so restoring a Reply button does not land on
     some other message's Reply button that happens to carry the same attribute */
  const row = el.closest("[data-msg]");
  return (row && row !== el ? `[data-msg="${CSS.escape(row.dataset.msg)}"] ` : "") + own;
}
function focusAfter() {
  S.ui.focusNext = Array.prototype.slice.call(arguments).filter(Boolean);
  S.ui.wrote = true;
}
/* the same declaration for an interaction that CHANGES NOTHING ON THE RECORD
   but replaces the control you used — opening a receipt over the lens item that
   opened it, closing it back onto that item, expanding a compact pin row into a
   card. Same-key restore cannot serve these: the key it would restore is the
   element the interaction removed. Round 7 had no way to say this at all, so
   all of them fell through to BODY (D3). */
function focusOn() {
  S.ui.focusNext = Array.prototype.slice.call(arguments).filter(Boolean);
}
function tryFocus(sel) {
  if (!sel) return false;
  let el = null;
  try { el = document.querySelector(sel); } catch (e) { return false; }
  if (!el || !shown(el)) return false;
  el.focus({ preventScroll: true });
  return document.activeElement === el;
}
function restoreFocus(prev) {
  const a = document.activeElement;
  /* HELD MEANS HELD BY SOMETHING STILL ON SCREEN. A control that survived the
     rebuild but was just hidden — the composer's context bar after Cancel — is
     holding focus nowhere a reader can see or use, which is the BODY problem
     wearing a tag name. Found by widening the check to non-write renders. */
  const held = a && a !== document.body && a !== document.documentElement && shown(a);
  const wrote = !!S.ui.wrote;
  const acted = !!S.ui.acted;
  const want = S.ui.focusNext;
  S.ui.focusNext = null;
  /* nothing was lost — a prompt that focused its own input, or a reader who
     tabbed somewhere during an async render, keeps it */
  if (held) return;
  /* NOTHING HAD FOCUS, NOTHING WAS WRITTEN AND NOBODY TOUCHED THE PAGE, so
     there is nothing to restore and nothing to announce. A page nobody has
     interacted with does not get focus put into it: taking focus is a thing you
     do in response to an action, and boot is not one. (Caught by this file's
     own focus check on the first draft, which forced focus into the lens on the
     boot render.) */
  if (!prev && !wrote && !acted) return;
  if (want && want.some(tryFocus)) return;
  if (tryFocus(prev)) return;
  /* last resort, after a write OR any other interaction that rebuilt the page:
     the surface that owns what changed, never BODY. These carry tabindex="-1"
     so they can hold focus without ever entering the tab order, and a reader's
     next Tab continues from inside the surface rather than from the masthead. */
  if (wrote || acted) ["#lens", "#pin", "#feed"].some(tryFocus);
}
/* somewhere a keyboard reader can ACT from: a control, or a surface container
   that holds one — from which the next Tab lands on something usable. BODY is
   neither, and neither is a container with nothing in it. */
function canActFrom(el) {
  if (!el || el === document.body || el === document.documentElement) return false;
  if (el.matches(CONTROL_SEL)) return true;
  return !!Array.from(el.querySelectorAll(CONTROL_SEL)).find(shown);
}
function checkFocusInvariant() {
  /* ANY INTERACTION THAT RE-RENDERED, not only a write (round 7 D3). The flag is
     set by a capture-phase listener on the document, so an interaction cannot
     avoid being seen by forgetting to announce itself — which is precisely how
     eight of them stayed invisible to round 7's version of this check. */
  const judged = !!S.ui.wrote || !!S.ui.acted;
  S.ui.wrote = false;
  if (!DEV || !judged) return;
  const a = document.activeElement;
  if (!canActFrom(a))
    console.error("[atrium invariant] an interaction rebuilt the page and left focus on " +
      (a ? (a.id ? "#" + a.id : a.tagName) : "nothing") +
      " — a keyboard reader has to walk back from the top of the document after every action");
}

/* ===========================================================================
 * RENDER — one call, every surface
 * ======================================================================== */

function render() {
  /* captured before anything is torn down — see restoreFocus() */
  const hadFocus = focusKey(document.activeElement);
  normalizeFilter();
  renderRail();
  renderHead();
  renderPin();
  renderFeed();
  renderTrace();
  renderComposer();
  renderLens();
  /* a prompt this render put on the page — or a control it moved focus to —
     has to be reachable in this frame, so both are revealed BEFORE the geometry
     check reads any boxes (round 5 D1, extended in round 7). */
  /* focus is re-established BEFORE the reveal, because the reveal's job includes
     scrolling whatever now holds focus clear of a sticky band — and before the
     checks, so checkFocusInvariant() reads the frame a reader actually gets
     rather than the instant between teardown and repair */
  restoreFocus(hadFocus);
  revealOpenPrompts();
  /* the DOM-level invariants run against what was actually painted, not against
     the functions that drew it. Geometry last, because it needs layout: the
     browser has already flushed style by the time these read boxes, and every
     one of them is synchronous with the paint that produced them. */
  checkFocusInvariant();
  checkRowScopeInvariant(room());
  checkQuotationInvariant();
  checkRecordTextInvariant();
  checkRecordInvariant();
  checkAnswerIdentityInvariant();
  checkCorrectionInvariant();
  checkLayoutInvariant();
  setTimeout(clearFresh, 400);
}

/* geometry is a function of the viewport as well as of the state, and resizing
   does not re-render. Round 4's D1 was width-independent, but the class of
   defect it belongs to is not — a track that survives 1440 and collapses at
   1124 is the same failure with a narrower repro. */
let layoutTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(layoutTimer);
  /* a resize can move a prompt back under the sticky band — the dead band round
     5's D1 lived in was a range of viewport HEIGHTS — so the reveal is part of
     the resize response too, not only of render(). */
  layoutTimer = setTimeout(() => { revealOpenPrompts(); checkLayoutInvariant(); }, 120);
});

/* --- static wiring ------------------------------------------------------- */
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("atr-dark");
  $("themeBtn").title = dark ? "Switch to light" : "Switch to dark";
  toast(dark ? "dark theme" : "light theme", "info");
});
$("pinFold").addEventListener("click", () => { S.ui.pinFolded = !S.ui.pinFolded; render(); });
$("ctxCancel").addEventListener("click", cancelContext);
$("sendBtn").addEventListener("click", send);
$("cinput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === "Escape" && (S.ui.bound || S.ui.replyTo)) cancelContext();
});
$("cinput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
$("surfConv").addEventListener("click", () => {
  S.ui.feedFilter = null;
  if (S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  scrollIntoView($("syl"), "start");
  toast("conversation · unfiltered. All three surfaces stay on screen — these focus them, they do not navigate", "info");
});
$("surfNeeds").addEventListener("click", () => {
  const r = room();
  const f = S.ui.feedFilter;
  S.ui.feedFilter = (f && f.k === "need" && f.scope === "room") ? null : { k: "need", scope: "room" };
  render();
  scrollIntoView($("pin"), "nearest");
  if (!S.ui.feedFilter) { toast("filter cleared", "info"); return; }
  /* the exact relationship between the two numbers, out loud. Round 2 said
     "same set the pin counts", which is the claim that made the miscount
     invisible: one item can own four rows, and an item sourced in another room
     owns none here. */
  const items = attention(r).length;
  const rows = attentionRows(r).length;
  const off = offRoomItems(r);
  toast(`needs you · ${items} item${items === 1 ? "" : "s"} owe you here · ${rows} row${rows === 1 ? " in this room is" : "s in this room are"} linked to them` +
        (off.length ? ` · ${off.length} ${off.length === 1 ? "has its source" : "have their sources"} in another room — jump from the pin` : "") +
        " · matches are highlighted, and nothing else is dimmed", "warn");
});
$("surfState").addEventListener("click", () => {
  S.ui.lensFocus = !S.ui.lensFocus;
  S.ui.receiptId = null;
  if (S.ui.lensFocus) room().objectives.forEach(o => o.open = true);
  render();
  $("lensBody").scrollTop = 0;
  toast(S.ui.lensFocus
    ? "current state focused — every objective expanded in the right-hand pane, which never left the screen"
    : "lens focus released", "info");
});

/* --- boot ---------------------------------------------------------------- */
function bootScroll() {
  requestAnimationFrame(() => {
    const syl = $("syl");
    $("feed").scrollTop = syl ? Math.max(0, syl.offsetTop - 60) : 0;
  });
}
/* the record's own starting point, captured before anything can amend it —
   a field history that begins at the first amendment has no "before" to offer */
seedRecord();
render();
bootScroll();
</script>
</body>
</html>
