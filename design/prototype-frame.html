  if (!o || (o.kind !== "decision" && o.kind !== "question")) return false;
  const who = askedOf(o);
  return who == null || who === S.me;
}
function canBind(o) { return !!boundKind(o) && canAnswer(o); }
/* the sentence the page says when it refuses. Never invents a name. */
function refusalFor(o) {
  if (!o) return "there is nothing here to record an answer against";
  if (o.kind === "commitment")
    return `${fieldOr(commitmentOwner(o), "someone else")} owns this commitment — typing at it would record your sentence as theirs and accept it in your name`;
  if (o.kind === "claim")
    return "a claim moves by being checked with evidence, by someone other than the claimant — typing at it is not a verification";
  const who = askedOf(o);
  if (who && who !== S.me)
    return `${who} is being asked this, not you — recording an answer in your name would be a decision you were not asked to make`;
  return "this is not something the composer can put on the record — say it in the room instead";
}

/* ===========================================================================
 * REVERSIBILITY IN FACT — NOT A GLYPH (round 12 D6)
 *
 * The friction rule this page shipped for ten rounds partitioned actions by a
 * glyph: `■` meant destructive, and a destructive action needed a press-and-
 * hold. Round 11's own honesty report said the tier was unexercised, and it was
 * right — `glyphOf()` has no branch that can return `■`, so no object on this
 * page is destructive and every action defaults to the reversible tier.
 *
 * A rule that partitions by a glyph nothing can produce partitions nothing. And
 * under it, `Ask justin instead` — one unconfirmed click — set the assignee,
 * cleared `owedTo`, and left `canAnswer` false, `canReopen` false, and NO
 * CONTROL ANYWHERE that takes it back. The most consequential action on the
 * page sat in the safest tier because the glyph it does not have is not `■`.
 *
 * THE RULE, REWRITTEN TO KEY ON REVERSIBILITY IN FACT:
 *
 *   1. Every action that amends a record must leave the object in a state where
 *      the page still offers you an action that amends it. An action that
 *      empties your action set is irreversible in the only sense that matters:
 *      you cannot get back, because you have no move.
 *   2. An action that no offered action restores must NAME, IN ITS OWN LABEL,
 *      the value it will write — so the one thing you cannot undo is the one
 *      thing you were told before you clicked.
 *
 * Both are checked by checkReversibilityInvariant(), which drives this table
 * rather than reading the code. `Ask justin instead` failed (1); it is
 * reversible now, by a control that exists. `Reschedule` fails (2) — no control
 * puts a due date back — so its label says the date it will write.
 * ======================================================================== */
const RESCHED_TO = "today 17:00";

/* WHAT AN ACTION WRITES — the fields that decide what the page offers NEXT,
   which is the only thing the audit projects and therefore the only thing this
   table may claim. A write path does more than this (an answer, a provenance
   entry, a correction, a permanent row); those do not move the control set, so
   they are not here and the table does not say they are.

   AND THE TABLE IS COMPARED AGAINST THE REAL WRITE (round 12 self-review,
   raised by the codex reviewer). The first version of this comment said "a
   table that drifts from a write path is caught by the render that follows it",
   and nothing compared them — the claim was exactly the shape this round exists
   to kill, inside the fix for it. Three entries were already wrong when the
   reviewer looked: `opt` and `verify` projected a `resolvedAt` neither write
   sets. `beginAction()` snapshots the object before the write and
   checkActionEffectInvariant() re-reads it after, on the render the write
   causes. */
const RESOLVED = "resolved";     // "some timestamp", not a particular one
const ACTION_EFFECT = {
  signed:   o => ({ verification: "self_reported", resolvedAt: RESOLVED, owedTo: null }),
  answered: o => ({ verification: "unverified", resolvedAt: RESOLVED, owedTo: null }),
  /* the bound composer's Send — answerQuestion for a question, answerDecision
     for a decision. The two write different fields, which is the whole reason
     round 9 D4 happened, so the projection branches the same way the write does. */
  typed:    o => (o.kind === "decision" ? { verification: "accepted", owedTo: null }
                                        : { verification: "unverified", resolvedAt: RESOLVED, owedTo: null }),
  opt:      o => ({ verification: "accepted", owedTo: null }),
  verify:   o => ({ verification: "verified" }),
  resched:  o => ({ verification: "self_reported", due: RESCHED_TO, owedTo: commitmentOwner(o) }),
  reassign: o => ({ owedTo: null, assignee: o.reassignTo }),
  takeback: o => ({ owedTo: S.me, assignee: (handedOnBy(o) || {}).from }),
  /* AND A REOPEN SYNTHESISES AN OPTION (round 13, D8). `reopen()` gives a
     decision that never carried options the one option that is not invented, and
     `(o.options || []).length` is a term in offeredActions() — so reopening D1
     really offers ["opt","typed"] while this table projected ["typed"], and
     `offeredAfter(D1,"reopen")` was wrong about the page one click ahead of
     itself. The synthesis is one function now, called by the write and by the
     projection, so the two cannot say different things. */
  reopen:   o => ({ verification: REOPEN_TO[o.kind], resolvedAt: null, owedTo: reopenOwner(o),
                    options: reopenOptions(o) })
};
/* the options a reopen leaves on an object. Options that existed survive; a
   decision that never carried any gets the one option that is not invented —
   re-affirming the statement already on the record.

   `agrees: true` IS NOT A DETAIL (round 6 D1). A re-affirmation is the proposal,
   by construction: its statement is `o.text`, verbatim. Round 6 left the flag
   off, `answerDecision`'s `!answer.agrees` read `!undefined` as a departure, and
   the correction chain then asserted that two byte-identical sentences differed.
   That is round 4's D7 arriving back through the fallback round 4 itself added —
   which is why the relationship is now ASSERTED by
   checkAnswerIdentityInvariant() instead of trusted to a literal. */
function reopenOptions(o) {
  if (o.kind !== "decision" || (o.options || []).length) return o.options || [];
  /* "the PRIOR call" quantified over the statement history in a label nothing
     read (round 13, D9 — found by the repaired splitter, on the run
     `lars chose: Re-affirm the prior call · statement recorded verbatim`, where
     "prior" and `statement`'s own word sat in different middot fragments of one
     line). The option points at the value standing on the record, which is what
     it re-affirms and what two point reads can support. */
  return [{ label: "Re-affirm the statement of record", statement: o.text, synthesized: true, agrees: true }];
}
/* the object as it stood before a write, with its histories copied rather than
   shared — otherwise a projection that reads the assignee history (takeback)
   would read the entry the write just added */
function preSnapshot(o) {
  const p = Object.assign({}, o);
  p.recorded = {};
  Object.keys(o.recorded || {}).forEach(f => { p.recorded[f] = (o.recorded[f] || []).slice(); });
  return p;
}
let PENDING_ACTION = null;
function beginAction(id, o) { if (DEV && o) PENDING_ACTION = { id: id, pre: preSnapshot(o), o: o }; }
/* two projected values are the same when they say the same thing about the
   offered set. Arrays of options compare by content — `sameValue` compares
   objects by identity, and the table necessarily builds a fresh array. */
function sameEffect(want, got) {
  if (Array.isArray(want) || Array.isArray(got))
    return Array.isArray(want) && Array.isArray(got) && JSON.stringify(want) === JSON.stringify(got);
  return sameValue(want, got);
}
/* THE FIELDS A WRITE MOVED THAT CHANGE WHAT THE PAGE OFFERS, DERIVED FROM THE
   WRITE (round 13, D8). The old check iterated `Object.keys(eff)` — the keys the
   table already names — so a field the write moves and the table omits was
   undetectable BY CONSTRUCTION, which is exactly the shape of a gate that passes
   when the suite never ran. This asks the opposite question: take the object as
   it stands AFTER the write, put ONE field back to what it held before, and see
   whether the offered set moves. If it does, that field decides what the page
   offers next, and the table has to name it. Probing forward from `pre` would
   miss it (options alone changes nothing while `resolvedAt` is still set) —
   the probe has to be backward, from the state the write actually produced. */
function offerRelevantMoves(pre, post) {
  const out = [];
  const base = offeredActions(post).join(",");
  const keys = {};
  Object.keys(pre).forEach(k => { keys[k] = 1; });
  Object.keys(post).forEach(k => { keys[k] = 1; });
  Object.keys(keys).forEach(f => {
    if (f === "recorded" || f === "history" || f === "corrections" || f === "facts") return;
    if (sameEffect(pre[f], post[f])) return;
    const probe = Object.assign(Object.create(Object.getPrototypeOf(post) || Object.prototype), post);
    probe[f] = pre[f];
    if (offeredActions(probe).join(",") !== base) out.push(f);
  });
  return out;
}
function checkActionEffectInvariant() {
  if (!DEV) return;
  const a = PENDING_ACTION;
  PENDING_ACTION = null;
  if (!a || !ACTION_EFFECT[a.id]) return;
  const eff = ACTION_EFFECT[a.id](a.pre);
  Object.keys(eff).forEach(f => {
    const want = eff[f], got = a.o[f];
    const ok = want === RESOLVED ? got != null : sameEffect(want, got);
    if (!ok)
      console.error("[atrium invariant] the action table says this write moves a field the write did not move — the " +
        "reversibility audit projects from this table, so a table that drifts from its write path is an audit of a " +
        "page that does not exist:", a.o.id, a.id, f, "projected", want === RESOLVED ? "(some timestamp)" : want,
        "· record holds", got);
  });
  offerRelevantMoves(a.pre, a.o).forEach(f => {
    if (f in eff) return;
    console.error("[atrium invariant] this write moved a field that decides what the page offers next and the action " +
      "table does not name it — the table's key set was the only thing the old check iterated, so an omitted field " +
      "was undetectable by construction and the projection was wrong one click ahead of the reader:",
      a.o.id, a.id, f, "before", a.pre[f], "· after", a.o[f]);
  });
}
/* which action puts which back. Declared, so rule 2 is decidable rather than
   argued: an action absent from every list here is one nothing restores. */
const ACTION_RESTORES = {
  reopen:   ["signed", "answered", "opt", "verify", "typed"],
  signed:   ["reopen"], answered: ["reopen"], opt: ["reopen"], verify: ["reopen"], typed: ["reopen"],
  takeback: ["reassign"], reassign: ["takeback"],
  /* a due date only moves forward, to a fixed target: nothing restores one, so
     the control names the date it will write (rule 2) */
  resched:  []
};
/* `ACTION_NAMES_VALUE` — a second hand-written table naming the value each
   unrestorable action writes — was REMOVED in round 13. It said `resched` writes
   RESCHED_TO, which ACTION_EFFECT already says, and nothing held the two in
   step. The control declares the FIELD (`data-writes="due"`) and the value comes
   out of ACTION_EFFECT, so there is one table and the label is proved against
   it by checkWriteLabelInvariant(). */

/* DID YOU HAND THIS ON, AND CAN YOU TAKE IT BACK? The assignee history answers
   both: the last amendment is a reassign, and you are the person who made it. */
function handedOnBy(o) {
  const h = (o && o.recorded && o.recorded.assignee) || [];
  const last = h[h.length - 1];
  if (!last || last.how !== "reassigned" || last.by !== S.me) return null;
  return { to: last.value, from: h.length > 1 ? h[h.length - 2].value : null, at: h.length - 1 };
}
function canTakeBack(o) { return !!o && !o.resolvedAt && !!handedOnBy(o); }

/* THE ACTIONS THIS PAGE OFFERS YOU ON AN OBJECT, decided in ONE place. The
   renders below build their buttons from this list and the audit asks the same
   function, so a control that exists on screen and not in the audit — the way
   every completeness claim on this page has failed before — cannot happen. */
function offeredActions(o) {
  const a = [];
  if (!o) return a;
  if (o.kind === "commitment" && commitmentOwner(o) === S.me && !o.resolvedAt) a.push("signed", "resched");
  if (o.kind === "decision" && (o.options || []).length && canAnswer(o) && !o.resolvedAt) a.push("opt");
  if (o.kind === "question" && o.answerOption && canAnswer(o) && !o.resolvedAt) a.push("answered");
  /* AND THE BOUND COMPOSER IS A WRITE PATH (round 12 self-review, raised by the
     grok reviewer). `Answer in your own words →` opens the composer and Send
     then calls answerQuestion / answerDecision — the same amend, through a
     control that carries no `data-fx`. It was outside this set, so the
     reversibility audit could not see the ONE action a reader takes when the
     card carries no wording: on a question with no `answerOption` the pin
     offers nothing else. `typed` is that action. */
  if (canBind(o) && !o.resolvedAt) a.push("typed");
  if (o.kind === "question" && o.reassignTo && canAnswer(o) && !o.resolvedAt) a.push("reassign");
  if (canTakeBack(o)) a.push("takeback");
  if (o.kind === "claim" && isClaim(o) && o.claimant !== S.me) a.push("verify");
  if (canReopen(o)) a.push("reopen");
  return a;
}
/* the same question asked of a PROJECTION — the object as an action would leave
   it. `recorded` travels with it so handedOnBy() and canReopen() read the same
   history the real object would. */
function offeredAfter(o, id) {
  const eff = ACTION_EFFECT[id] && ACTION_EFFECT[id](o);
  if (!eff) return null;
  const p = Object.assign(Object.create(Object.getPrototypeOf(o) || Object.prototype), o, eff);
  /* the amendment this action makes, replayed onto a COPY of the history, so a
     projection cannot write on the record it is projecting from */
  p.recorded = Object.assign({}, o.recorded || {});
  Object.keys(eff).forEach(f => {
    if (!RECORDED[f] || !p.recorded[f]) return;
    const h = p.recorded[f].slice();
    if (!sameValue(h[h.length - 1].value, eff[f]))
      h.push({ value: eff[f], tm: S.now, by: S.me, how: id === "reassign" ? "reassigned" : id });
    p.recorded[f] = h;
  });
  /* settlement is derived, so the projection recomputes it rather than carrying
     the value the object had before the action */
  if (p.recorded.settlement) {
    const s = RECORDED.settlement.get(p), h = p.recorded.settlement.slice();
    if (!sameValue(h[h.length - 1].value, s)) h.push({ value: s, tm: S.now, by: S.me, how: id });
    p.recorded.settlement = h;
  }
  return offeredActions(p);
}

function pinActions(o, primaryOnly) {
  const off = offeredActions(o);
  let acts = [];
  if (o.kind === "decision") {
    acts = off.indexOf("opt") >= 0 ? (o.options || []).map((opt, i) =>
      `<button class="btn ${i === 0 ? "amber" : ""}" data-opt="${i}" title="${esc(opt.statement)}">${esc(opt.label)}</button>`) : [];
    if (canBind(o)) acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
    else acts.push(aboutButton(o, "ghost sm"));
  } else if (o.kind === "commitment") {
    /* only the person who owes it can sign it off (round 4 D5). When a
       commitment that is not yours ends up owed to you, the honest action is
       the one you can actually take: say something about it in the room. The
       bound composer is NOT that action — it would record your sentence as the
       commitment's own text and accept it in your name (round 9 D4). */
    /* AND THE RESCHEDULE NAMES THE DATE IT WILL WRITE (round 12 D6, rule 2).
       Nothing on this page puts a due date back, so the one thing you cannot
       undo is the one thing the label tells you before you click it. */
    acts = off.indexOf("signed") >= 0
      ? [`<button class="btn sm" data-fx="signed">Mark signed off</button>`,
         `<button class="btn ghost sm" data-fx="resched" data-writes="due" title="No control puts a due date back — this writes ${esc(RESCHED_TO)}">Reschedule to ${esc(RESCHED_TO)}</button>`]
      : [aboutButton(o, "sm")];
  } else if (o.kind === "question") {
    /* the one-click control is only offered when the card actually carries an
       answer to record — the page does not word an answer on a human's behalf
       (round 5 D2). Typing one yourself is always available to whoever is being
       asked, and it now writes the question's `answer`, not its statement. */
    acts = off.indexOf("answered") >= 0
      ? [`<button class="btn sm" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer — ${esc(o.answerOption.label)}</button>`]
      : canBind(o)
        ? [`<button class="btn sm" data-bind="1">Answer in your own words →</button>`]
        : [aboutButton(o, "sm")];
    /* the page does not invent a name to hand a question to */
    /* AND THE NAME IN THE LABEL IS THE ASSIGNEE THIS CLICK WRITES, DECLARED AND
       PROVED (round 13, D1). Hand Q1 to justin and take it back and the assignee
       history reads [null, "justin", null] — so this label states a value the
       record holds, and the walk fires on it, live, once the card is a full card
       rather than a compact row. `data-writes` is not an exemption: it is the
       claim that clicking this writes `assignee = justin`, checked against
       ACTION_EFFECT.reassign by checkWriteLabelInvariant(). */
    if (off.indexOf("reassign") >= 0) acts.push(`<button class="btn ghost sm" data-fx="reassign" data-writes="assignee">Ask ${esc(o.reassignTo)} instead</button>`);
    else if (off.indexOf("takeback") >= 0) acts.push(takeBackButton(o, "ghost sm"));
    /* AND AN OFFERED ACTION GETS A CONTROL (round 13, found by this round's own
       sequence enumerator on the artifact it was written to check). This was an
       `else if`, so on the opening screen `typed` was in Q1's offered set and
       `Ask justin instead` won the slot — the page offered an action and painted
       nothing anywhere that reaches it, which is checkActionSetInvariant's rule
       read in the other direction and is the same "an audit of a page that does
       not exist". The composer is how you answer a question in your own words
       and it does not compete with handing it on. */
    if (off.indexOf("typed") >= 0 && acts.join("").indexOf("data-bind") < 0)
      acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
  } else {
    /* a claim moves by being checked, not by being typed at — and anything else
       that ends up owed still gets a way out */
    acts = [aboutButton(o, "ghost sm")];
  }
  return primaryOnly ? (acts[0] || "") : acts.join("");
}
/* the honest alternative to a bound composer: a message in the room, which is
   what a person can always do about anything and which amends no record. */
function aboutButton(o, cls) {
  return `<button class="btn ${cls}" data-about="1">Say something about this in the room →</button>`;
}
/* the control that makes handing a question on reversible in fact (round 12 D6).
   It names the person it takes it back FROM, because the page never invents a
   name and the record holds this one. */
/* and the name in the label is READ, not fetched — the widened value rule
   caught this control on the render that introduced it (round 12 self-review) */
function takeBackButton(o, cls) {
  return `<button class="btn ${cls}" data-fx="takeback">` +
    voiced(stated(o, ["assignee"], a => "Take it back from " + recordedLabel(a.value, "them"))) +
    `</button>`;
}

function wireActions(el, o) {
  el.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    const opt = o.options[Number(b.dataset.opt)];
    beginAction("opt", o);
    answerDecision(o.id, { origin: "chosen", statement: opt.statement, label: opt.label, agrees: !!opt.agrees },
      /* A PROVENANCE NOTE DESCRIBES THE ACTION, NOT THE RECORD (round 12
         self-review, found by the enumerating driver on the artifact this round
         shipped). Round 11 fixed exactly this in the one-click ANSWER's note —
         "so it stays unverified", a claim about the verification history
         written into a provenance string — and did not sweep it to the branch
         beside it. This one read `the statement already on the record, recorded
         again verbatim`: "already" and "again" are quantifiers over the
         statement history, in a plain string that reads nothing, painted inside
         `data-obj="D1"`. Repro on r11 and on this round's own first build:
         open D1's receipt → Reopen → give a reason → "Re-affirm the prior
         call". What the record holds is on the receipt's state line and in the
         chain, both read; what this says is what the action did. */
      opt.synthesized
        ? `one-click re-affirmation · the option's statement recorded verbatim · ${S.me} chose it, the page worded it · no model in the path`
        : `one-click answer · reversible gate · the card's statement recorded verbatim · ${S.me} chose it, the page worded it · no model in the path`);
  }));
  const bind = el.querySelector("[data-bind]");
  if (bind) bind.addEventListener("click", () => bindComposer(o.id));
  const about = el.querySelector("[data-about]");
  if (about) about.addEventListener("click", () => startAbout(o.id));
  el.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(o.id, b.dataset.fx)));
  el.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jump, b.dataset.jumproom, b.dataset.why)));
}

/* ===========================================================================
 * FEED
 * ======================================================================== */

/* A COUNT NAMES ITS OWN UNIT, AND THEN NOTHING HAS TO RECONCILE IT (round 14,
   D9 — the prune, swept as a class rather than applied where it was noticed).
   `2 NEED YOU` on the divider counted feed ROWS; `NEEDS YOU 3` on the tab
   counted ITEMS; and a two-clause sentence on the same divider, on the first
   screen, existed only to tell the reader which was which — `chips count rows ·
   NEEDS YOU counts the items behind them`. That is ¶118's own shape: a count
   that needs a sentence beside it to be read correctly is the wrong count to
   show, and round 12 wrote that rule while this line was two panes to the left.
   The honest fix is fewer words, not more: the chip says ROWS, so there is
   nothing left to reconcile and the reconciliation is gone. */
const FILTER_LABEL = { need: "NEED-YOU", change: "CHANGE", discussion: "DISCUSSION", routine: "ROUTINE" };

function renderFeed() {
  const r = room();
  const feed = $("feed");
  const keepTop = feed.scrollTop;
  feed.innerHTML = "";
  feed.classList.toggle("filtered", !!S.ui.feedFilter);

  /* two dividers, never one: the absence window (frozen at return) and whatever
     has landed since. They are different groups with different labels and
     separately-scoped chips, which is what stops your own post-return typing
     from being reported back to you as something you missed. */
  const cursorI = idx(r, r.seenAfter);
  const absStartI = idx(r, r.absenceFrom);      // pinned: marking seen never moves it
  const returnI = idx(r, r.absenceEnd);
  const absence = hasAbsenceGroup(r);
  let routineBuffer = [];

  const flushRoutine = () => {
    if (!routineBuffer.length) return;
    feed.appendChild(routineStrip(r, routineBuffer));
    routineBuffer = [];
  };

  r.messages.forEach((m, i) => {
    if (absence && i === absStartI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "absence")); }
    if (i === returnI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "return")); }
    if (m.routine) { routineBuffer.push(m); return; }
    flushRoutine();
    feed.appendChild(messageRow(r, m));
  });
  flushRoutine();
  if (cursorI === r.messages.length - 1) feed.appendChild(sylDivider(r, "seen"));
  feed.scrollTop = keepTop;
}

function messageRow(r, m) {
  const g = msgGlyph(r, m);
  const o = linkedObject(r, m);
  const cls = msgClass(r, m);
  const seen = idx(r, m.id) <= idx(r, r.seenAfter);
  const row = document.createElement("div");
  row.className = ["mrow", gclass(g), m.system ? "sys" : "", m.actor === S.me ? "me" : "",
                   seen ? "dim" : "", matchesFilter(r, m) ? "hit" : "",
                   S.ui.jumpTo === m.id ? "tgt" : "", m.fresh ? "rise" : ""].filter(Boolean).join(" ");
  row.dataset.msg = m.id;
  if (o) row.dataset.obj = o.id;       // a row about an object narrates it, permanently
  row.dataset.cls = cls;
  row.dataset.origin = m.origin || "seeded";

  let inner = "";
  if (m.replyTo) {
    const t = msg(r, m.replyTo);
    /* A QUOTATION IS NEVER SHORTENED BEFORE IT IS PAINTED (round 15, D1).
       Round 2 wrote `plain(t.body).slice(0, 60)` here and it survived thirteen
       review rounds because BOTH instruments passed it honestly. The provenance
       rule is satisfied — a 60-character prefix genuinely IS contained in the
       message it cites. The legibility rule is satisfied — `scrollWidth ===
       clientWidth` on a string that was cut in JS before the browser ever
       measured it, so `text-overflow: ellipsis` had nothing left to elide. The
       defect lived in the SEAM BETWEEN TWO CORRECT CHECKS, which is why the
       answer here is a different rendering and not a third checker.
       What it painted was a person's sentence stopped mid-word, presented as
       their words, with no ellipsis, no quotation marks and no route: `↩ priya
       29 Jul · Honestly I'd keep dual-write until we've had a full clean we`.
       11 of 14 replyable rows in #users-migration exceeded 60 characters and 9
       of them cut mid-word, at every width, in both themes.
       The whole quotation is in the DOM now; the clamp is CSS, so the browser
       paints its own ellipsis and `textContent` is still the record. */
    if (t) inner +=
      `<button class="mreply" data-jump="${esc(t.id)}">` +
        `<span class="rh">↩ ${esc(t.actor)} ${esc(t.t)} ·</span>` +
        `<span class="quoted" data-quoted="msg:${esc(t.id)}" data-voice="human"` +
        ` data-clamp="expands on hover and on focus; this control jumps to the row it quotes">` +
        `“${esc(plain(t.body))}”</span>` +
        `<span class="jump">go to it →</span>` +
      `</button>`;
  }
  /* the dotted treatment is derived from the object's epistemic state, not from
     the glyph — so a proposal that is ALSO a gate renders ◆ and dotted.
     `data-voice` says who authored the characters inside: a human's own words
     are exempt from the page-integrity rules that police what the PAGE writes
     (stray quotation marks, `undefined` in a record). A row the page authored
     on a human's behalf is 'system', not 'human' — that is the whole of D3. */
  const voice = (!m.system && (m.origin === "typed" || m.origin === "seeded")) ? "human" : "system";
  const claimWrap = msgIsClaim(r, m);
  /* `mbody` names the row's own sentence, so a checker can read what the row
     says without also reading the tag and the actions around it (round 8 D2) */
  inner += `<span class="mbody ${claimWrap ? "claim" : ""}" data-voice="${voice}">${bodyHtml(m.body)}</span>`;
  if (m.note) inner += `<span class="mnote">${esc(m.note)}</span>`;
  if (o && !m.sysFor) inner += objectTag(r, m, o);
  /* A TRANSITION ROW GETS A WAY INTO WHAT IT REPORTS ON (round 7 D7). Round 7
     declared `[data-msg="…"] .tag` and `[data-msg="…"] button` as the focus
     successors of every write, and a transition row rendered neither — no tag,
     because objectTag() is skipped for `sysFor` rows, and no Reply, because
     system rows do not get one. So two thirds of the declared chain could never
     apply and focus always fell through to the lens. The honest fix is not to
     delete the declaration: it is that a row saying "commitment K2 · rescheduled
     by lars" had no route to K2's receipt, which is the one thing a reader wants
     from it. The tag is DELIBERATELY STATELESS — this row's glyph is frozen at
     the state the transition landed in (round 4 D6), so a tag re-deriving the
     object's current state would contradict the row it sits on. */
  else if (m.sysFor && o) inner += sysTag(r, m, o);

  /* THE ACTION STRIP IS A SIBLING OF THE TEXT, NOT A THING ON TOP OF IT (round
     16, D1 and D2). It used to be the last child of `.m` and `position:
     absolute`, which is how it came to be painted across the row's own first
     line and across 42px of the `go to it →` label round 15 put beside it. It
     is the row's fifth grid track now, so the text column ends where the lane
     begins and there is nothing left to overlap. A row with no actions renders
     NO strip: an empty one still painted a 4px box of `--bg3` on hover. */
  const acts = rowActions(r, m, o);
  row.innerHTML =
    `<div class="t">${esc(m.t)}</div><div class="g" aria-hidden="true">${g}</div><div class="a">${esc(m.actor)}</div>
     <div class="m">${inner}</div>${acts ? `<div class="acts">${acts}</div>` : ""}`;

  row.querySelectorAll("[data-receipt]").forEach(b => b.addEventListener("click", () => openReceipt(b.dataset.receipt, b.dataset.rcroom)));
  /* the reply preview's route to the row it quotes (round 15, D1) */
  row.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jump, b.dataset.jumproom, b.dataset.why)));
  row.querySelectorAll("[data-reply]").forEach(b => b.addEventListener("click", () => startReply(m.id)));
  row.querySelectorAll("[data-verify]").forEach(b => b.addEventListener("click", () => { S.ui.verifying = b.dataset.verify; render(); focusVerify(); }));
  row.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(b.dataset.obj, b.dataset.fx)));
  row.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.pinroom) switchRoom(b.dataset.pinroom, true);
    S.ui.pinOpen = b.dataset.pin; render(); scrollIntoView($("pin"), "nearest");
  }));

  if (o && S.ui.verifying === o.id) row.appendChild(verifyBox(o));
  return row;
}

function plain(body) { return body.map(s => typeof s === "string" ? s : isStated(s) ? voicedText(s) : (s.code || s.at || s.h || s.text || "")).join(""); }

/* the tag on a row is a render of the object's *current* state. Reopen an
   object and the historical row that settled it re-renders here — glyph,
   tag text and tone all downgrade together. (Round-1 defect B2.) */
/* the transition row's route into the object it reports on. It states no state:
   the row's own glyph already records the state this transition landed in, and
   the receipt is where the current one lives. */
function sysTag(r, m, o) {
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  return `<button class="tag" data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}>` +
         `the receipt for ${esc(o.id)}${home ? " · in #" + esc(home) : ""} →</button>`;
}

function objectTag(r, m, o) {
  const g = glyphOf(o);
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  const rc = `data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}`;
  const where = home ? ` · in #${esc(home)} →` : "";

  /* ANSWER-ROW IDENTITY. Exactly one message — the one whose id is o.answerMsg
     — may carry the resolves/answer-bound tag, and only while the object is
     actually settled. Every other answer-bound row to the same object is a
     historical answer and says so, with the time it stopped being the answer.
     Round 2 compared nothing: answer → reopen → answer left the FIRST answer
     still dressed as the resolution. */
  if (m.boundTo) {
    const current = o.answerMsg === m.id;
    /* the tag says which kind of answer settled it, because "answer-bound" on a
       row the page wrote reads as a sentence the human composed (round 4 D3) */
    if (current && o.verification === "accepted")
      return `<button class="tag green" ${rc}>resolves ◆ · ${m.origin === "chosen" ? "chosen from the card" : "answer-bound"} · nothing inferred${where}</button>`;
    /* it was NOT superseded — nothing replaced it. The object it settled was
       reopened, so this is still the answer of record and the decision is
       pending again. Round 3 called this "superseded", which is the word for
       the other case entirely (a later answer), and the two now read apart. */
    /* AND IT SAYS SO ONLY WHILE IT IS TRUE (round 8 D3). `reopenedAt` is the
       fact that this object is STANDING reopened; round 8 set it and never
       cleared it, so after answer → reopen → answer the question's own current
       answer row said it had been reopened at 09:14 — a minute before that
       answer existed — and that the question was pending, while the receipt
       header, the lens and the object's state all said answered. The gate is
       the settlement the record derives, so a stale field cannot outvote it. */
    /* AND THE ROW TAG IS A RECORD READ TOO (round 11 D1/D4). This is the tag
       the critic read beside a receipt saying the question was unanswered: it
       says "still the answer on the record" and "pending again", two claims
       about two field histories, written as a literal on a row that never goes
       away. Both come out of the record now. */
    if (current && o.reopenedAt && RECORDED.settlement.get(o) === "pending")
      return `<button class="tag amber" ${rc}>` +
        /* the field that CARRIES the answer of record differs by kind — a
           question keeps it in `answer`, a decision in `statement` — so the
           sentence reads THAT field and no other. Reading both and or-ing them
           made the first query decoration, because the second can never be
           false, and declaring the unused one made the checkers verify a claim
           the sentence never consulted. */
        voiced(stated(o, [o.kind === "question" ? "answer" : "statement", "settlement"], (c, s) =>
          `answer reopened ${fieldOr(o.reopenedAt, "· time not recorded")} · ` +
          /* and it calls the field by ITS name: a decision's answer of record is
             its statement, and saying "answer" about a read of `statement` is
             CONVENTIONS line 230 in one word (round 11 self-review) */
          (c.everSet() ? `still the ${c.of} on the record · ` : `nothing is recorded as its ${c.of} · `) +
          `${o.kind} ${enumText(s.value)}${s.before(s.value) ? " again" : ""}`)) +
        `${where}</button>`;
    /* SETTLED WITHOUT BEING ACCEPTED (round 5 D2). An answered question is not
       accepted and has not been reopened; before the answer was recorded at all
       this case could not arise, and the reopened branch above would have
       claimed a reopen that never happened. It says what it is instead. */
    if (current)
      return `<button class="tag" ${rc}>` +
        voiced(stated(o, ["verification"], v => `records the answer · ${o.kind} ${enumText(v.value)} · no sign-off attached`)) +
        `${where}</button>`;
    /* THE LAST LITERAL IN THIS FAMILY (round 13, D9). Five branches above this
       one were minted in rounds 5, 8, 11 and 12; this one still read `superseded
       answer · replaced 09:17 · kept on the record` — the field's own word and a
       continuity quantifier, on a permanent feed row, with nothing reading
       either. Every instrument walked past it: clausesOf() split it on `·` and
       so never had "answer" and "kept" in the same clause to pair. Both ends of
       the record are read here, and the clause that used to say "kept" says what
       the two reads support. */
    const sfield = m.supersededOf || (o.kind === "question" ? "answer" : "statement");
    return `<button class="tag amber" ${rc}>` +
      voiced(say([fieldView(o, sfield, m.supersededIndex), fieldView(o, sfield)], (was, now) =>
        `superseded ${was.of} · replaced ${fieldOr(m.supersededAt, "· time not recorded")} · ` +
        /* two point reads support "these two are the same value" and cannot
           support "again", which is a question about the whole history — the
           distinction this file has had to make in four separate places */
        (sameValue(was.value, now.value)
          ? `the ${was.of} of record is this one`
          : `the ${was.of} of record is a different one now`), o)) +
      `${where}</button>`;
  }
  /* A ◆ BADGE MEANS "THIS ROOM OWES YOU THIS" (round 4 minor). When the object
     lives in ANOTHER room, this room's Needs-you filter correctly does not count
     this row — so under that filter the row dimmed to .3 while still wearing an
     amber ◆ badge saying it needed you. The toast was honest and the badge was
     not. A cross-room gate now renders as a neutral pointer that says where the
     need actually is and goes there; amber is reserved for what this room owes. */
  /* AND THE STATE TAG IS A RECORD READ, LIKE THE FOUR ABOVE IT (round 12,
     raised by the grok reviewer). The answer-row tags were minted in rounds 5,
     8 and 11; the six branches BELOW them were still literals — `verified ·
     checks`, `accepted · lars`, `claim · unverified`, and one that interpolated
     `o.verification` raw. They painted a value the record holds, on a permanent
     feed row, with nothing reading it, and every instrument on the page missed
     them: the quantifier walk needs a quantifier and these have none, and round
     10's value rule was scoped by a three-selector list to the lens. The walk
     owns that rule now, and these are what it found. The neighbour-branch
     pattern again — the fix went to the branches that had been embarrassed. */
  const stateTag = (fields, phrase) => voiced(stated(o, fields, phrase));
  if (needsYou(o) && home)
    return `<button class="tag" data-pin="${esc(o.id)}" data-pinroom="${esc(home)}">` +
      stateTag(["verification"], v => (v.value === "open" ? "? open question" : "◆ gate") +
        ` · needs ${S.me} in #${home} →`) + `</button>`;
  if (needsYou(o))
    return `<button class="tag amber" data-pin="${esc(o.id)}">` +
      stateTag(["verification"], v => (v.value === "open" ? "? open question · needs " : "◆ needs ") + S.me) +
      `</button>`;
  return `<button class="tag ${o.verification === "verified" || o.verification === "accepted" ? "green" : ""}" ${rc}>` +
    stateTag(["verification", "due"], (v, d) => {
      if (v.value === "verified") return `verified · ${fieldOr(o.verifiedBy, "no verifier on record")}`;
      if (v.value === "accepted") return `accepted · ${fieldOr(o.acceptedBy, "no acceptor on record")}`;
      /* the glyph comes out of the same read rather than from glyphOf(), which
         would be a second derivation of the state beside the sentence about it */
      const gv = v.value === "failed" ? "✗" : v.value === "open" ? "?" : UNSETTLED.includes(v.value) ? "~" : "·";
      if (o.kind === "commitment")
        return `commitment · ${fieldOr(o.owner || o.claimant, "no owner on record")} · ` +
               `${recordedLabel(d.value, "no due date")} ${gv}`;
      return `${o.kind} ${gv} ${enumText(v.value)}`;
    }) + `${where}</button>`;
}

/* Only actions that do something are rendered. Round 1 shipped 32 inert
   buttons; the rule now is wire it or delete it. */
function rowActions(r, m, o) {
  const acts = [];
  if (!m.system) acts.push(`<button data-reply="1">Reply</button>`);
  /* you verify CLAIMS. A decision is answered, not verified, and a commitment is
     signed off — offering Verify on either would be a control that lies. */
  if (o && o.kind === "claim" && isClaim(o) && o.claimant !== S.me && !m.sysFor) {
    /* a disclosure, not a write: it opens the box that asks for the evidence,
       and says so in the DOM so the reversibility audit can read it (round 12) */
    acts.push(`<button data-verify="${esc(o.id)}" aria-expanded="${S.ui.verifying === o.id}">Verify</button>`);
  }
  /* AND ONLY THE PERSON BEING ASKED (round 10 self-review). This control had no
     ownership check at all: after handing Q1 to justin — which clears `owedTo`
     and sets the assignee — the row still offered Answer to everyone, and
     applyEffect() would have recorded `answeredBy: lars` on a question that is
     justin's. Same class as the bound composer, on a different control. */
  if (o && o.kind === "question" && o.verification === "open" && o.answerOption && !m.sysFor && canAnswer(o)) {
    acts.push(`<button data-obj="${esc(o.id)}" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer</button>`);
  }
  return acts.join("");
}

/* the ~ → ✓ pair, exercisable: verifying asks for the evidence, and records it */
/* AND ITS QUESTION IS SHORT ENOUGH TO BE READ AT THE NARROWEST SUPPORTED WIDTH
   (round 15, N5 — D3's class, one prompt over). `#vinput` asked `what checked
   it? e.g. July AWS bill, write-throughput line: $912` — 448px of text — into a
   397px box at 1440 and a 193px box at 1120, so what a reader saw ended
   `write-throughp`. A placeholder contributes nothing to `scrollWidth`, so no
   instrument on the page could see it. Two things changed: the row wraps, and
   the question is now measured against the 1120 floor rather than against 1440. */
function verifyBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  /* an OPEN PROMPT, not a passive record entry: the page opened it, put the
     cursor in it, and is waiting. render() scrolls it clear of any sticky
     overlay and the layout invariant refuses to whitelist anything painting
     over it — both keyed on this attribute (round 5 D1). */
  box.dataset.prompt = "verify";
  box.innerHTML =
    `<div class="hd"><span class="lbl">VERIFY THIS CLAIM</span></div>
     <div class="row">
       <input id="vinput" type="text" aria-label="Evidence note" placeholder="what checked it? e.g. the July AWS bill, $912">
       <button class="btn sm" id="vgo">Attach &amp; verify</button>
       <button class="btn ghost sm" id="vcancel">Cancel</button>
     </div>
     <div class="hint">${esc(o.claimant)} said it, you are checking it — that is what makes it green. Verifying your own claim is not offered.</div>`;
  box.querySelector("#vgo").addEventListener("click", () => doVerify(o.id, box.querySelector("#vinput").value.trim()));
  /* the prompt closes back onto the Verify button that opened it (D3) */
  const closeVerify = () => { S.ui.verifying = null; focusOn(`[data-verify="${o.id}"]`, `[data-lens-obj="${o.id}"]`); render(); };
  box.querySelector("#vcancel").addEventListener("click", closeVerify);
  box.querySelector("#vinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doVerify(o.id, e.target.value.trim()); }
    if (e.key === "Escape") closeVerify();
  });
  return box;
}
/* render() has already scrolled the prompt clear of the sticky band, so focus
   must not scroll again — preventScroll keeps the two from fighting. */
function focusVerify() { const i = $("vinput"); if (i) i.focus({ preventScroll: true }); }
function focusReopen() { const i = $("rinput"); if (i) i.focus({ preventScroll: true }); }

/* --- since you left ------------------------------------------------------ */

/* mode: "absence" — the frozen window you were away for
 *       "return"  — everything that has landed since you got back / marked seen
 *       "seen"    — the caught-up marker at the end of the room
 * A chip counts MESSAGES in its own group; the pin above counts the ITEMS those
 * messages are about. The when-line says so, and a chip that counts nothing is
 * disabled rather than a clickable no-op. */
/* WHAT THE FILTER DOES TO THE ROWS IT DID NOT MATCH, said on screen and counted
   rather than asserted (round 6 D2). CONVENTIONS: "If the affordance's own copy
   claims a dimmed row is still checkable, the measurement has to back it." This
   copy claims the opposite of dimming, and the CSS is what backs it. */
function filterNote(scope) {
  const f = S.ui.feedFilter;
  if (!f || f.scope !== scope) return "";
  const r = room();
  const hits = groupMessages(r, scope).filter(m => msgClass(r, m) === f.k).length;
  const rest = groupMessages(r, scope).length - hits;
  return `<span aria-hidden="true">·</span><span class="fnote">${FILTER_LABEL[f.k].toLowerCase()} filter on · ` +
         `${hits} row${hits === 1 ? "" : "s"} highlighted · the other ${rest} ` +
         `${rest === 1 ? "row is" : "rows are"} neither hidden nor dimmed — they read exactly as they did unfiltered</span>`;
}

function sylDivider(r, mode) {
  const read = mode !== "seen" && groupRead(r, mode === "absence" ? "absence" : "return");
  const el = document.createElement("div");
  el.className = "syl" + (mode === "seen" ? " seen" : mode === "return" ? " ret" : "") + (read ? " muted" : "");
  if (mode === "absence" || (mode === "seen" && !hasAbsenceGroup(r))) el.id = "syl";

  if (mode === "seen") {
    el.innerHTML =
      `<div class="bar"><span class="lbl">SEEN FROM HERE</span><span class="rule"></span></div>
       <div class="when"><span>caught up — ${r.readGroup || 0} message${r.readGroup === 1 ? "" : "s"} read · ${esc(r.away.len)} away · the seen cursor sits at the end of #${esc(r.name)} and moves for this room only</span></div>`;
    return el;
  }

  const scope = mode === "absence" ? "absence" : "return";
  const c = counts(r, scope);
  const own = ownInGroup(r, scope);
  const cursorPastAbsence = idx(r, r.seenAfter) > idx(r, r.absenceEnd);
  const label = mode === "absence" ? "SINCE YOU LEFT"
              : cursorPastAbsence ? "SINCE YOU MARKED THIS SEEN" : "SINCE YOU RETURNED";

  /* A CHIP THAT FILTERS NOTHING IS NOT A CONTROL (round 13, D10 — the prune
     applied as a class rather than where it was noticed).
     `SINCE YOU RETURNED · 0 NEED YOU · 0 CHANGES · 0 DISCUSSION · 0 ROUTINE`
     appeared one column left of the pane round 12 pruned, on every screen after
     your first write: four permanently-disabled zero chips — and the four
     controls the driver reported as enumerated-but-never-driven, because there
     is nothing to drive. Round 12's own doctrine names that shape and round 12
     did not sweep it. A zero chip is not rendered at all now; when the whole row
     is zero the group says what is in it in one clause instead of four zeros and
     a disclaimer explaining them. */
  const chips = ["need", "change", "discussion", "routine"].filter(k => c[k]).map(k => {
    const n = c[k], on = !!S.ui.feedFilter && S.ui.feedFilter.k === k && S.ui.feedFilter.scope === scope;
    const title = `${n} message${n === 1 ? "" : "s"} in this group are ${k === "need" ? "linked to something that needs you" : FILTER_LABEL[k].toLowerCase()}`;
    return `<button class="cnt${k === "need" ? " need" : ""}" data-filter="${k}" data-scope="${scope}"` +
           ` title="${esc(title)}" aria-pressed="${on}">${n} ${FILTER_LABEL[k]} ROW${n === 1 ? "" : "S"}</button>`;
  }).join("");

  /* marking seen mutes this divider; it does not delete it. The window, the
     count and the four chips stay exactly where they were, and the mark is
     reversible from the same line that reports it. */
  const when = mode === "absence"
    /* and the clause that tells the two numbers apart is printed only while
       there are two numbers to tell apart (round 13, D10 — same class) */
    ? `<span>${esc(r.away.from)} → ${esc(r.away.to)} · ${esc(r.away.len)} away · ${c.total} messages · frozen at return</span>` +
      filterNote(scope) + `
       <span aria-hidden="true">·</span>` +
      (read
        ? `<span class="marked">marked seen ${esc(r.markedAt || "")} · the group stays here, muted</span>
           <span aria-hidden="true">·</span>
           <button class="mark" id="unmarkSeen">unmark</button>`
        : `<button class="mark" id="markSeen">mark this group seen</button>`)
    /* AND THE DISCLAIMER GOES WITH THE ZERO IT EXPLAINED (round 13, D10).
       `0 unseen since 09:12 today · 5 rows here are yours — your own activity is
       never counted back to you as unseen` is a zero, then two clauses
       explaining the zero. With nothing unseen there is one fact worth printing
       and it is what IS here. The rule that your own rows are never unseen has
       not changed and is not being hidden: it is said where it is doing work —
       on a group that has both — and the toast on send says it too. */
    : (!c.total
        ? `<span>${own ? `${own} row${own === 1 ? "" : "s"} here, ${own === 1 ? "yours" : "all yours"}` : "nothing here yet"}</span>`
        : `<span>${c.total} ${read ? "message" + (c.total === 1 ? "" : "s") + " here, all read" : "unseen since " + esc(cursorPastAbsence ? "you marked this seen" : r.away.to)}</span>` +
          (own ? `<span aria-hidden="true">·</span><span class="own">${own} row${own === 1 ? " here is yours" : "s here are yours"} — your own activity is never counted back to you as unseen</span>` : "")) +
      filterNote(scope) +
      (c.total
        ? read
          ? `<span aria-hidden="true">·</span><span class="marked">marked seen ${esc(r.markedAt || "")}</span>
             <span aria-hidden="true">·</span><button class="mark" id="unmarkSeen">unmark</button>`
          : `<span aria-hidden="true">·</span><button class="mark" id="markSeen">mark this group seen</button>`
        : "");

  el.innerHTML =
    `<div class="bar">
       <span class="lbl">${label}</span>
       <div class="counts">${chips}</div>
       <span class="rule"></span>
     </div>
     <div class="when">${when}</div>`;
  el.querySelectorAll(".cnt").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter, b.dataset.scope)));
  const mk = el.querySelector("#markSeen");
  if (mk) mk.addEventListener("click", markSeen);
  const un = el.querySelector("#unmarkSeen");
  if (un) un.addEventListener("click", unmarkSeen);
  return el;
}

/* --- routine collapse: count, range and actors all derived from the rows --- */

function routineStrip(r, rows) {
  const wrap = document.createElement("div");
  wrap.className = "routine";
  const actors = [...new Set(rows.map(m => m.actor))];
  const routineFilter = !!S.ui.feedFilter && S.ui.feedFilter.k === "routine";
  const open = S.ui.routineOpen || routineFilter;
  const showAll = routineFilter || S.ui.routineAll;
  const shown = open ? (showAll ? rows : rows.slice(0, 6)) : [];

  const strip = document.createElement("button");
  strip.className = "strip";
  /* a toggle that survives its own render keeps focus, which needs a key that
     survives the rebuild. Round 7's strip carried neither id nor data attribute,
     so focusKey() had nothing to return and a peek dropped focus to BODY (D3). */
  strip.dataset.strip = "routine";
  strip.setAttribute("aria-expanded", String(open));
  strip.innerHTML =
    `<span aria-hidden="true">·</span><span><b>${rows.length} routine</b></span>
     <span aria-hidden="true">·</span><span>${esc(rows[0].t)}–${esc(rows[rows.length - 1].t)}</span>
     <span aria-hidden="true">·</span><span>${esc(actors.join(", "))}</span>
     <span class="peek">${open ? "click to collapse" : "click to peek"}</span>`;
  strip.addEventListener("click", () => {
    S.ui.routineOpen = !open;
    S.ui.routineOpenedByFilter = false;      // opened or closed by hand from here on
    if (!S.ui.routineOpen) S.ui.routineAll = false;   // collapsing puts the peek back to a peek
    if (!S.ui.routineOpen && routineFilter) S.ui.feedFilter = null;
    render();
  });
  wrap.appendChild(strip);

  if (open) {
    const body = document.createElement("div");
    body.className = "peekbody scroll rise-s";
    shown.forEach(m => body.appendChild(messageRow(r, m)));
    /* A COUNT OF ROWS YOU CANNOT REACH IS NOT A DISCLOSURE (round 15, N6). The
       peek expanded six of thirty-one and then printed `+ 25 more routine
       events` as INERT TEXT: it named exactly what it was withholding and
       offered no control anywhere on the page that would show it, so the only
       route to those rows was the routine filter, which is a different
       interaction reached from a different surface. "Wire it or delete it"
       (round 1) applies to a sentence that promises rows as much as to a button
       that promises a write, and the rows are real, so it is wired. */
    if (shown.length < rows.length) {
      const more = document.createElement("button");
      more.className = "more";
      more.dataset.strip = "routine-all";
      more.textContent = `show the other ${rows.length - shown.length} routine events · none owed you attention`;
      more.addEventListener("click", () => {
        S.ui.routineAll = true;
        /* the control this replaces is gone once it has done its job, so the
           successor is declared rather than left to fall through to BODY (D3) */
        focusOn(`[data-strip="routine"]`);
        render();
      });
      body.appendChild(more);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

/* --- cross-room jump trace ----------------------------------------------- */
function renderTrace() {
  const el = $("trace");
  const tr = S.ui.trace;
  if (!tr) { el.hidden = true; el.innerHTML = ""; return; }
  const from = S.rooms[tr.from];
  el.hidden = false;
  el.innerHTML =
    `<span class="g" aria-hidden="true">→</span>
     <span class="tx">you came from <b>#${esc(from ? from.name : tr.from)}</b>${tr.why ? " · following " + esc(tr.why) : ""} · ${esc(tr.at)}</span>
     <button class="back" id="traceBack">← back to #${esc(from ? from.name : tr.from)}</button>
     <button class="x mono" id="traceX" aria-label="Dismiss this trace">✕</button>`;
  $("traceBack").addEventListener("click", () => {
    const back = tr.from;
    switchRoom(back, true);          // clears the trace: you are home, not lost
    render();
    bootScroll();
    toast(`back in #${back} — the row you left is where you left it`, "info");
  });
  $("traceX").addEventListener("click", () => { S.ui.trace = null; render(); });
}

/* ===========================================================================
 * LENS + RECEIPT — both are renders of the same objects the pin and the feed
 * read. There is no separate receipt store any more; a receipt IS an object,
 * drawn with its history, provenance and correction chain.
 * ======================================================================== */

const KIND_LABEL = { decision: "DECISIONS", commitment: "COMMITMENTS", question: "OPEN QUESTIONS", claim: "CLAIMS" };
const KIND_ORDER = ["decision", "commitment", "question", "claim"];

function renderLens() {
  const r = room();
  const body = $("lensBody");

  /* ===========================================================================
   * TWO COUNTS, AND NEITHER OF THEM NEEDS A DISCLAIMER (round 12 — the pruning)
   *
   * The top three lines of this pane used to be a summary, a reconciliation and
   * a caveat: `13 objects · 4 settled · 8 unverified · 2 items awaiting you`,
   * then `4 + 8 + 1 open = 13 of 13 · awaiting you overlaps them, it does not
   * add to them`, then `the need-you counts below sum to 4, not 3 — an object
   * under two objectives is counted by both`. Three lines explaining why the
   * numbers did not add, above the numbers, on the most valuable real estate a
   * returning reader has.
   *
   * Every one of those clauses was demanded by a round that was individually
   * right, and eleven rounds of correction only ever ADDED: nothing was ever
   * removed. The honest fix is fewer numbers, not more prose about them — a
   * number that needs a disclaimer to be read correctly is the wrong number to
   * show. So:
   *
   *   REMOVED  `N settled`                      (r2, f425f5b) — and it was the
   *            wrong number twice over: it was counted off `verification` and
   *            painted with `settlement`'s word, so a signed-off commitment was
   *            partitioned into the unverified while the receipt twenty pixels
   *            below called it NOW SETTLED. Five surfaces, one screenshot, two
   *            answers. The word `settled` now appears only where `settlement`
   *            is read, and the aggregate clause of the completeness walk holds
   *            the whole pane to that rather than this comment doing it: inside
   *            a `data-agg` host, a field's own vocabulary outside a mint is an
   *            error with no quantifier required.
   *   REMOVED  `#lensSums`, the reconciliation   (r4, f370854) — an equation
   *            nobody asked for, printed to apologise for a partition the pane
   *            no longer claims.
   *   REMOVED  `.lensnote`, the overlap caveat   (r4, f370854) — it printed a
   *            SUM THE PAGE NEVER SHOWED (the per-objective counts added up),
   *            then apologised for it. Each objective header is true of its own
   *            section; nothing on screen adds them together but that note.
   *
   * KEPT: how many objects there are, how many nothing outside the claimant has
   * checked, and how many are waiting on you. Two of those are why a person
   * opens this pane and the third is the page's whole thesis.
   * ======================================================================== */
  const vviews = r.objects.map(o => fieldView(o, "verification"));
  /* AND THE SUMMARY IS MINTED FROM EVERY RECORD IT COUNTS (round 12, D2/D3).
     It was a literal composed beside thirteen objects, outside `paintSaid` and
     outside the walk — the same escape `clearSummary`'s lead was closed for in
     round 11, one pane over. Each claim carries the record it came from, so the
     checkers re-read thirteen records rather than one. */
  const sum = say(vviews, function () {
    const vs = Array.prototype.slice.call(arguments);
    /* ONE COUNT WHERE THERE WERE THREE. `4 settled + 8 unverified + 1 open` was
       a partition that needed an equation under it to be read; "nothing outside
       the claimant has checked this" is the single fact those three were
       circling, and it subsumes the open question and the proposal without a
       reconciliation. A failure is a check that came back — it is not this
       count's business, and the pin's lead says it in its first branch. */
    const unver = vs.filter(v => isUnchecked(v.value)).length;
    /* AND "AWAITING YOU" IS COUNTED OUT OF THE SAME READS. `attention(r)` is
       `needsYou` over the objects, which is `owedTo` AND a verification — so
       counting it outside the phrase would put a number about thirteen
       verifications next to thirteen reads it did not use. */
    const owedN = vs.filter(v => needsYouAt(v.owner, v.value)).length;
    /* AND THE COUNT CARRIES ITS OWN DENOMINATOR (round 14, D10). This said
       `13 objects · 9 unverified` while the pin trailer, one pane left, said
       `~ 6 of 10 unverified` — two true counts of "unverified" over two
       different scopes, arithmetically consistent (10 = 13 − 3 in the pin) and
       with nothing on screen saying so. The doctrine's own answer to that shape
       is to make the difference visible in the count rather than to explain it
       in a sentence beside it, so both lines read `N of M` now and the M is
       where a reader sees the two scopes are not the same one. It is also one
       number fewer: `9 of 13` says what `13 objects · 9` said. */
    return `${unver} of ${vs.length} unverified · ${owedN} awaiting you`;
  }, r.objects[0]);
  $("lensSummary").innerHTML = voiced(sum) +
    `<span aria-hidden="true"> · </span><span class="upd">updated ${esc(S.now)}</span>`;

  if (S.ui.receiptId && obj(r, S.ui.receiptId)) { renderReceipt(obj(r, S.ui.receiptId)); return; }

  body.innerHTML = "";
  r.objectives.forEach(ob => {
    const mine = r.objects.filter(o => o.objectives.includes(ob.id));
    const owedHere = mine.filter(needsYou).length;
    const wrap = document.createElement("section");
    wrap.className = "obj";

    const head = document.createElement("button");
    head.className = "obj-head";
    head.dataset.objective = ob.id;          // survives the rebuild it triggers (D3)
    head.dataset.agg = mine.map(o => o.id).join(",");   // the records this header speaks for
    head.setAttribute("aria-expanded", String(!!ob.open));
    /* THE OVERLAP IS A PROPERTY OF THE OBJECTS, NOT OF WHAT YOU ARE OWED
       (round 13, D4). Round 12 moved the caveat off the pane and into this
       accessible name, and gated it on `owedHere` — so the objective whose
       overlap is TOTAL (`Keep mobile clients on supported auth`, both of whose
       objects also sit under the first objective) carried no overlap sentence at
       all, because nothing under it was owed. The condition is whether an
       overlap exists.

       AND IT IS VISIBLE, NOT ONLY IN A TOOLTIP. The headers stack 11, 3 and 2
       above a pane that says 13, and the arithmetic a reader does is addition.
       `11 of 13 objects` gives every header the same denominator, so the counts
       read as three overlapping slices of one room rather than three parts of a
       sum — which is the information the deleted caveat was carrying, in the
       place where the mistake is made rather than in prose apologising for it
       afterwards. */
    const overlapping = mine.filter(o => (o.objectives || []).length > 1).length;
    head.title = `${mine.length} object${mine.length === 1 ? "" : "s"} of the ${r.objects.length} in this room sit under this objective` +
      (owedHere ? `, ${owedHere} of which need you. ` : ". Nothing here is waiting on you. ") +
      (overlapping
        ? `${overlapping} of them also sit${overlapping === 1 ? "s" : ""} under another objective, so the objective counts overlap each other and the pin and do not add up to ${r.objects.length}.`
        : "No object here sits under another objective.");
    /* AN OBJECTIVE HEADER IS AN AGGREGATE TOO (round 12, D3). `11 of 13 objects
       · 3 need you` counts a verification per object — `needsYou` is `owedTo`
       AND not accepted AND not verified — so it is minted from a read of every
       one of them, exactly like the pane summary above it. The denominator is
       how many objects the room holds, which is not a record read and is not
       claimed as one. */
    const roomTotal = r.objects.length;
    const headCount = say(mine.map(o => fieldView(o, "verification")), function () {
      const vs = Array.prototype.slice.call(arguments);
      const owedN = vs.filter(v => needsYouAt(v.owner, v.value)).length;
      /* "all clear" read as a verdict on the objective — `Retire the legacy
         identity path · 3 objects · all clear · BLOCKED` is a contradiction on
         one line, and only the tooltip said the clearance was of YOU (round 13,
         minor). It says whose clearance it is now. */
      return `${vs.length} of ${roomTotal} objects · ` + (owedN ? `${owedN} need${owedN === 1 ? "s" : ""} you` : "none need you");
    }, mine[0]);
    head.innerHTML =
      `<span class="tw" aria-hidden="true">${ob.open ? "▾" : "▸"}</span>
       <span><span class="ttl">${esc(ob.title)}</span>
         <span class="ct ${owedHere ? "warn" : ""}">${voiced(headCount)}</span></span>
       <span class="st ${esc(ob.status)}">${esc(ob.status.toUpperCase())}</span>`;
    head.addEventListener("click", () => { ob.open = !ob.open; render(); });
    wrap.appendChild(head);

    if (ob.open) {
      KIND_ORDER.forEach(kind => {
        const items = mine.filter(o => o.kind === kind);
        if (!items.length) return;
        const grp = document.createElement("div");
        grp.className = "grp";
        grp.innerHTML = `<div class="glbl"><span class="lbl">${KIND_LABEL[kind]}</span><span class="n">${items.length}</span><span class="rule"></span></div>`;
        items.forEach(o => grp.appendChild(lensItem(o)));
        wrap.appendChild(grp);
      });
    }
    body.appendChild(wrap);
  });
}

/* an object's own text is the page's until a human's typed answer BECOMES it —
   `textVoice` records which, and every surface that renders the title reads it
   rather than guessing (round 5 D4). */
function titleFrag(o) { return o.textVoice === "human" ? human(o.text) : o.text; }
function pinTitleFrag(o) { return o.question ? o.question : titleFrag(o); }

function lensItem(o) {
  const g = glyphOf(o);
  const b = document.createElement("button");
  b.className = "oitem " + gclass(g) + (o.fresh ? " rise" : "");
  /* the object's own item in the lens, addressable by the object it is about —
     the last resort in the focus chain, and stable across a rebuild */
  b.dataset.lensObj = o.id;
  b.dataset.obj = o.id;
  const facts = (o.facts || []).map((f, i) =>
    factHtml(o, f, i, /overdue|not accepted|open |blocked|reopened/i.test(voicedText(f)) ? "warn" : ""))
    .join('<span aria-hidden="true">·</span>');
  b.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <span><span class="tt ${isClaim(o) ? "claim" : ""}">${voiced(titleFrag(o))}</span><span class="mt">${facts}</span></span>`;
  b.addEventListener("click", () => openReceipt(o.id));
  return b;
}

/* THE RECEIPT'S STATE LINE IS A RECORD READ (round 10 self-review, raised by
   both foreign reviewers as a hole in the completeness claim). It is the
   loudest sentence in a receipt — `ACCEPTED · commitment · by lars` — and it
   branched on `o.verification`, `o.due` and `o.assignee` read straight off the
   object. Those are recorded fields and checkRecordInvariant() pins each of
   them to the last value its own history holds, so it could not paint a state
   the record did not have; but the sentence was not PRODUCED by the read, which
   is the property the doctrine is about, and the checkers could not see it. It
   is minted now, and `.rc-state` is read back against it.
   `o.due` is read through recordedLabel(), so K3's `"no due date"` — a value the
   record genuinely holds, not an absent one — prints as itself rather than as
   "due no due date". */
function receiptState(o) {
  return say(reads(o, ["verification", "due", "assignee", "answer"]), (v, d, n, a) => {
    const st = v.value;
  if (st === "accepted") return ["ACCEPTED", o.kind, `by ${fieldOr(o.acceptedBy, "nobody on record")} · ${fieldOr(o.acceptedAt, "time not recorded")}`];
  if (st === "verified") return ["VERIFIED", o.kind, `checked by ${fieldOr(o.verifiedBy, "nobody on record")} · ${fieldOr(o.verifiedAt, "time not recorded")}`];
  /* "until a human answers" named the `answer` field in a sentence that reads
     the verification — the noun is about acceptance, and that is what it says */
  if (st === "proposed") return ["PROPOSED", "not accepted", `confidence ${fieldOr(o.confidence, "—")}`, "renders as a claim until a human accepts it"];
  /* HOW LONG IT HAS BEEN OPEN IS DERIVED FROM WHEN IT WAS ASKED (round 17, D1).
     This read a seeded `openFor` and printed it, which is how `open 3h` came to
     sit forty pixels above this receipt's own `priya raised it … 09:11`. It is
     `askedAt` against `S.now` now, re-derived on every paint — and where the
     record does not carry a clock time this page can subtract, it says when it
     was asked rather than inventing how long ago that was. Once a question has
     been reopened the elapsed time is about the original ask rather than about
     the state on screen, so the reopened case reports the reopen instead. */
  if (st === "open") return ["OPEN", "question",
    o.reopenedAt ? `reopened ${o.reopenedAt}` : openClause(o),
    n.value != null ? `assigned to ${n.value}` : "nobody assigned"];
  if (st === "self_reported") return ["SELF-REPORTED", o.kind, `${fieldOr(o.owner || o.claimant, "no owner on record")}`,
    /* K3's due is the STRING "no due date" — a value the record genuinely holds,
       not an absent one — so it prints as itself instead of "due no due date"
       (round 10 self-review) */
    d.value == null ? "no due date on record"
      : /due date/i.test(String(d.value)) ? recordedLabel(d.value) : "due " + recordedLabel(d.value),
    /* AND THE LOUDEST LINE IN THE RECEIPT STOPS DENYING A VERIFICATION TWO ROWS
       ABOVE IT (round 11 D2). This was a hardcoded literal inside a say()
       branch, using none of the four views it was handed, so `receiptState()`
       passed every clause the round-10 checkers had — it was minted, its point
       reads were re-read, and it rendered a negation the record denies. Reopen
       K0, a commitment a deploy record verified, and the state line read
       "nothing other than the claimant has checked it" two lines above a green
       WHAT HAPPENED entry saying `deploy 2f81c3 carried the flag into staging —
       checked by something other than the claimant`. Whether anything ever
       checked it is a question for the verification history, and the sign-off
       path one screen away was already asking it correctly. */
    v.ever("verified") || v.ever("accepted")
      ? "something other than the claimant checked it before, and that check is still on the record"
      : "nothing other than the claimant has checked it"];
  /* A QUESTION IS ASKED, NOT CLAIMED (round 5 D2). There was no branch for a
     question that had been answered but not signed off, so it fell through to
     the CLAIM line below and the receipt header read
     `CLAIM · unverified · claimant: priya` over a sentence priya had ASKED.
     That is the record asserting a person said something they did not say —
     the same family as fabricated attribution, reached through a missing
     switch branch rather than through a fabricated string. A question gets its
     own states, and none of them uses the word claimant. */
  if (o.kind === "question") {
    const asker = `asked by ${fieldOr(o.askedBy || o.claimant, "nobody on record")}`;
    if (a.value != null) return ["ANSWERED", "question", asker,
      `answered by ${fieldOr(o.answeredBy, "nobody on record")} · ${fieldOr(o.answeredAt, "time not recorded")}`,
      `no sign-off attached, so the answer is ${enumText(st)}`];
    return ["QUESTION", enumText(st), asker,
      n.value != null ? `assigned to ${n.value}` : "nobody assigned"];
  }
  /* round 2 carried a REASSIGNED branch here and never wrote that value: an
     assignment changes who owes the answer, not whether it is verified. The
     assignee is reported by the OPEN branch above, where it actually lives. */
  return ["CLAIM", enumText(st), `claimant: ${fieldOr(o.claimant, "nobody on record")}`];
  }, o);
}

/* ---------------------------------------------------------------------------
 * A CORRECTION ENTRY HAS TWO VOICES AND THEY NEVER MIX.
 *
 *   system voice — `was → after`, plus an optional `fact` line: what the page
 *                  knows happened. Mono, muted, no quotation marks, no first
 *                  person, no "X said". It is visibly not speech.
 *   human voice  — `quote`, present only when a person actually typed a reason.
 *                  Rendered in <q>, attributed, and carrying data-quoted so the
 *                  invariant checker can prove the words are theirs.
 *
 * Round 3 had exactly one voice and put a machine-written first-person sentence
 * in it. `text:` is gone from the shape so that failure cannot be re-typed.
 * ------------------------------------------------------------------------ */
function correctionHtml(c, o, i) {
  /* THE LABEL ON THE ROUTE IS A SENTENCE ABOUT THE OBJECT (round 11 minor). The
     arrow checker deliberately excludes link text — a route ends in an arrow for
     a reason that has nothing to do with a change — and the record-narration
     rule had quietly inherited the exclusion, so a RE-AFFIRMED entry, where
     nothing was replaced, carried "the proposal it replaced is still in the room
     →". It goes through voiced() like every other minted sentence, which is also
     what puts it inside clause 0's sweep. */
  const link = c.msg
    ? ` · <button class="lnk" data-jump="${esc(c.msg)}"${c.room ? ` data-jumproom="${esc(c.room)}"` : ""}>${voiced(c.link)}</button>`
    : "";
  /* the quote is by construction a person's own characters, so it is marked as
     theirs — the page-integrity rules are about what the PAGE writes (D4) */
  const quote = c.quote
    ? `<div class="reason"><q data-quoted="${esc(quoteRef(c.quote))}" data-voice="human">${esc(c.quote.text)}</q>
         <span class="src">— ${esc(c.quote.by)}, typed here${c.quote.seeded ? " on the record" : ""}</span></div>`
    : "";
  /* THE FACT LINE IS A SURFACE (round 10 self-review, found independently by
     both foreign reviewers). It sits inside the correction entry, below two
     operands and a header that are all record reads, and it was a literal — so
     rescheduling to the date already on the record printed "rescheduled by lars
     · the original date is not erased" under a header saying the date had not
     moved. `.ftx` is where the checker reads it back. */
  const fact = c.fact ? `<div class="fact"><span aria-hidden="true">·</span> <span class="ftx">${voiced(c.fact)}</span></div>` : "";
  /* THE ARROW IS A CLAIM (round 6 D1). Round 6 rendered `was → now: after` for
     every entry unconditionally, so an entry recording that nothing changed
     still asserted a swap — and did it with two byte-identical sentences either
     side of the arrow. An entry that carries no `change` gets no arrow, and
     checkCorrectionInvariant() holds every entry to the same distinction. */
  /* both operands are spans the checker can find and read back against the
     entry they were minted from — the render path is the layer round 8's D1
     went through, so it is the layer that gets asserted (see
     checkRenderedRecordInvariant) */
  const body = c.change && operandsMoved(c)
    ? `<span class="was">${voiced(c.was)}</span> → now: <span class="aft">${voiced(c.after)}</span>`
    : `<span class="was">${voiced(c.was)}</span> <span class="same">— unchanged ·</span> <span class="aft">${voiced(c.after)}</span>`;
  /* THE HEADER IS AN ASSERTION TOO (round 9 D1b). `RESCHEDULED · DUE DATE
     AMENDED` was a literal, so rescheduling to the date already on the record
     stated an amendment in the English word "AMENDED" — where the change-less
     guard, deliberately written as syntax rather than as a keyword sniffer,
     could not see it. The header is a record read now, so the word is produced
     by the branch that read the two values, and `.hdt` is where the checker
     compares the characters on screen against the ones that were minted. */
  return `<div class="corr"${o ? ` data-corr-obj="${esc(o.id)}" data-corr="${i}"` : ""}><div class="hd"><span class="hdt">${voiced(c.hd)}</span> · ${esc(c.who)} · ${esc(c.tm)}</div>
     <div class="bd">${body}${link}</div>
     ${fact}${quote}</div>`;
}
/* a quotation's provenance token: "typed" for text in the human-speech register,
   "msg:<id>" or "msg:<id>@<room>" for a line that is in the loaded record */
function quoteRef(q) { return q.src === "typed" ? "typed" : "msg:" + q.msg + (q.room ? "@" + q.room : ""); }

function renderReceipt(o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "receipt rise";
  el.dataset.obj = o.id;
  const st = receiptState(o);

  /* WHAT HAPPENED IS THE FIRST THING IN THE RECEIPT AND WAS THE LAST THING READ
     OUT OF THE RECORD (round 9 D1a). Every line here is a sentence about the
     object, so every line here is minted from a record read and is addressable:
     `.htx` is the sentence, and the checker compares those characters against
     the ones `stated()` produced. Round 9 composed this line from `fromClause`
     and `RECORDED.due.get(o)` read beside the record, so rescheduling to the
     date already on the record narrated a move the record denied — two surfaces
     below a chain body correctly saying nothing had changed. */
  const happened = o.history.map((h, i) => {
    const hg = histGlyph(h.k);
    return `<div class="hap ${gclass(hg)}" data-hap-obj="${esc(o.id)}" data-hap="${i}"><span class="g" aria-hidden="true">${hg}</span>
       <span class="tt"><span class="who">${esc(h.who)}</span> <span class="htx">${voiced(h.text)}</span><span class="tm">${esc(h.tm)}</span></span></div>`;
  }).join("");

  /* every excerpt is a quotation, so every excerpt must be provably a real line:
     either a message in the loaded record, or text this human typed into the
     page. There is no third case, and no way to render one. */
  /* A PROVENANCE ENTRY IS EITHER A QUOTATION OR A SYSTEM RECORD, NEVER BOTH.
     `voice: "system"` marks the entries the page authored on a human's behalf —
     a one-click answer. Those render with no quotation marks, no <q>/.ex, no
     data-quoted, and with their disclosure ALWAYS ON SCREEN. Round 4 rendered a
     chosen answer exactly like a typed one, quoted, with the single word
     "chosen" buried in `.full` behind a hover: the receipt's resting state said
     the human wrote a sentence they had never written. */
  const prov = o.provenance.map(p => {
    /* A MACHINE'S OUTPUT IS NOT SPEECH (round 7 D6). `checks` writes parity runs
       and deploy records; those lines are verbatim and correctly credited, so
       nothing here was ever fabricated — but round 7 rendered them with curly
       quotation marks and `data-voice="human"`, which says "a person said this"
       about a CI job, and exempted a machine's string from the record-text rules
       that exist to catch `undefined` in a record. The feed already renders the
       same strings in mono. So does this, now.
       It KEEPS ITS CITATION: `data-cited` resolves against the loaded record on
       every render exactly as `data-quoted` does, minus the human-authorship
       rule, which is the one part of the quotation contract that does not apply
       to a machine. Dropping the check along with the quotation marks would have
       traded a presentation defect for an attribution hole. */
    if (p.voice === "machine") {
      const cite = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : null;
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to the run${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">recorded here · no message carries it</span>`}</span>
       <span class="sysex"${cite ? ` data-cited="${esc(cite)}"` : ""}>${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    if (p.voice === "system") {
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span><span class="jump">jump to the row →</span></span>
       <span class="sysex">${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    /* a quotation context is human speech BY RULE — checkQuotationInvariant()
       refuses any excerpt that does not resolve to a message a person wrote or
       to text this person typed — so it carries data-voice="human" and the
       page-integrity rules leave the words alone (round 5 D4). */
    const ref = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : "typed";
    return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
