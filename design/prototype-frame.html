}

/* an owed item whose source message is not in this room says where it is and
   goes there. Round 2 counted it and highlighted nothing. */
function sourceChip(r, o, compact) {
  const xr = sourceRoomOf(o);
  if (xr) return `<span aria-hidden="true">·</span><button class="xroom" data-jump="${esc(o.sourceMsg || "")}" data-jumproom="${esc(xr)}">source in #${esc(xr)} →</button>`;
  if (!o.sourceMsg) return "";
  /* the time already appears in the facts beside this, so the link is the link */
  return `<span aria-hidden="true">·</span><button class="lnk" data-jump="${esc(o.sourceMsg)}">${compact ? "source →" : "jump to source →"}</button>`;
}

function pinCard(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("article");
  el.className = "acard" + (g === "◆" ? " gate" : "") + (o.fresh ? " rise" : "");
  const facts = (o.facts || []).map(esc).join(" · ");
  el.innerHTML =
    `<div class="g" aria-hidden="true">${g}</div>
     <div>
       <div class="ttl"><span class="${isClaim(o) ? "claim" : ""}">${esc(o.question || o.text)}</span></div>
       <div class="why">${esc(whyOf(r, o))}</div>
       <div class="foot">
         <div class="mt">${facts}${sourceChip(r, o)}</div>
         <div class="acts">${pinActions(o)}</div>
       </div>
     </div>`;
  wireActions(el, o);
  return el;
}

/* turn-17 compression: still visible, still glyphed, still one click to act */
function pinCompact(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "acomp";
  const primary = pinActions(o, true);
  const xr = sourceRoomOf(o);
  el.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <button class="ct" data-open="${esc(o.id)}" title="Expand this item">${esc(o.question || o.text)}</button>
     <span class="mt">${esc((o.facts || []).slice(0, xr ? 1 : 2).join(" · "))}${xr ? sourceChip(r, o, true) : ""}${primary}</span>`;
  el.querySelector("[data-open]").addEventListener("click", () => { S.ui.pinOpen = o.id; render(); });
  wireActions(el, o);
  return el;
}

/* NO DEAD ATTENTION ITEMS. Every pending decision offers the bound composer,
   whether or not it ever carried one-click options; reopening one that had
   options keeps them, and reopening one that never had any mints the single
   honest option there is — re-affirming the statement already on the record.
   checkAttentionInvariant() shouts if this ever returns nothing. */
function pinActions(o, primaryOnly) {
  let acts = [];
  if (o.kind === "decision") {
    acts = (o.options || []).map((opt, i) =>
      `<button class="btn ${i === 0 ? "amber" : ""}" data-opt="${i}" title="${esc(opt.statement)}">${esc(opt.label)}</button>`);
    acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
  } else if (o.kind === "commitment") {
    acts = [`<button class="btn sm" data-fx="signed">Mark signed off</button>`,
            `<button class="btn ghost sm" data-fx="resched">Reschedule</button>`];
  } else if (o.kind === "question") {
    acts = [`<button class="btn sm" data-fx="answered">${o.answerHint ? "Answer — " + esc(o.answerHint) : "Answer it"}</button>`,
            `<button class="btn ghost sm" data-fx="reassign">Ask ${esc(o.reassignTo || "someone else")} instead</button>`];
  } else {
    /* anything else that ends up owed still gets a way out */
    acts = [`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`];
  }
  return primaryOnly ? (acts[0] || "") : acts.join("");
}

function wireActions(el, o) {
  el.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    const opt = o.options[Number(b.dataset.opt)];
    answerDecision(o.id, opt.statement, opt.synthesized
      ? "one-click re-affirmation · the statement already on the record, recorded again verbatim · no model in the path"
      : "one-click answer · reversible gate · the button's statement recorded verbatim · no model in the path");
  }));
  const bind = el.querySelector("[data-bind]");
  if (bind) bind.addEventListener("click", () => bindComposer(o.id));
  el.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(o.id, b.dataset.fx)));
  el.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jump, b.dataset.jumproom)));
}

/* ===========================================================================
 * FEED
 * ======================================================================== */

const FILTER_LABEL = { need: "NEED YOU", change: "CHANGES", discussion: "DISCUSSION", routine: "ROUTINE" };

function renderFeed() {
  const r = room();
  const feed = $("feed");
  const keepTop = feed.scrollTop;
  feed.innerHTML = "";
  feed.classList.toggle("filtered", !!S.ui.feedFilter);

  /* two dividers, never one: the absence window (frozen at return) and whatever
     has landed since. They are different groups with different labels and
     separately-scoped chips, which is what stops your own post-return typing
     from being reported back to you as something you missed. */
  const cursorI = idx(r, r.seenAfter);
  const returnI = Math.max(cursorI, idx(r, r.absenceEnd));
  const absence = hasAbsenceGroup(r);
  let routineBuffer = [];

  const flushRoutine = () => {
    if (!routineBuffer.length) return;
    feed.appendChild(routineStrip(r, routineBuffer));
    routineBuffer = [];
  };

  r.messages.forEach((m, i) => {
    if (absence && i === cursorI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "absence")); }
    if (i === returnI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "return")); }
    if (m.routine) { routineBuffer.push(m); return; }
    flushRoutine();
    feed.appendChild(messageRow(r, m));
  });
  flushRoutine();
  if (cursorI === r.messages.length - 1) feed.appendChild(sylDivider(r, "seen"));
  feed.scrollTop = keepTop;
}

function messageRow(r, m) {
  const g = msgGlyph(r, m);
  const o = linkedObject(r, m);
  const cls = msgClass(r, m);
  const seen = idx(r, m.id) <= idx(r, r.seenAfter);
  const row = document.createElement("div");
  row.className = ["mrow", gclass(g), m.system ? "sys" : "", m.actor === S.me ? "me" : "",
                   seen ? "dim" : "", matchesFilter(r, m) ? "hit" : "",
                   S.ui.jumpTo === m.id ? "tgt" : "", m.fresh ? "rise" : ""].filter(Boolean).join(" ");
  row.dataset.msg = m.id;
  row.dataset.cls = cls;

  let inner = "";
  if (m.replyTo) {
    const t = msg(r, m.replyTo);
    if (t) inner += `<span class="mreply">↩ ${esc(t.actor)} ${esc(t.t)} · ${esc(plain(t.body)).slice(0, 60)}</span>`;
  }
  /* the dotted treatment is derived from the object's epistemic state, not from
     the glyph — so a proposal that is ALSO a gate renders ◆ and dotted. */
  const claimWrap = msgIsClaim(r, m);
  inner += claimWrap ? `<span class="claim">${bodyHtml(m.body)}</span>` : bodyHtml(m.body);
  if (m.note) inner += `<span class="mnote">${esc(m.note)}</span>`;
  if (o && !m.sysFor) inner += objectTag(r, m, o);

  row.innerHTML =
    `<div class="t">${esc(m.t)}</div><div class="g" aria-hidden="true">${g}</div><div class="a">${esc(m.actor)}</div>
     <div class="m">${inner}<div class="acts">${rowActions(r, m, o)}</div></div>`;

  row.querySelectorAll("[data-receipt]").forEach(b => b.addEventListener("click", () => openReceipt(b.dataset.receipt, b.dataset.rcroom)));
  row.querySelectorAll("[data-reply]").forEach(b => b.addEventListener("click", () => startReply(m.id)));
  row.querySelectorAll("[data-verify]").forEach(b => b.addEventListener("click", () => { S.ui.verifying = b.dataset.verify; render(); focusVerify(); }));
  row.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(b.dataset.obj, b.dataset.fx)));
  row.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.pinroom) switchRoom(b.dataset.pinroom, true);
    S.ui.pinOpen = b.dataset.pin; render(); scrollIntoView($("pin"), "nearest");
  }));

  if (o && S.ui.verifying === o.id) row.appendChild(verifyBox(o));
  return row;
}

function plain(body) { return body.map(s => typeof s === "string" ? s : (s.code || s.at || s.text || "")).join(""); }

/* the tag on a row is a render of the object's *current* state. Reopen an
   object and the historical row that settled it re-renders here — glyph,
   tag text and tone all downgrade together. (Round-1 defect B2.) */
function objectTag(r, m, o) {
  const g = glyphOf(o);
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  const rc = `data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}`;
  const where = home ? ` · in #${esc(home)} →` : "";

  /* ANSWER-ROW IDENTITY. Exactly one message — the one whose id is o.answerMsg
     — may carry the resolves/answer-bound tag, and only while the object is
     actually settled. Every other answer-bound row to the same object is a
     historical answer and says so, with the time it stopped being the answer.
     Round 2 compared nothing: answer → reopen → answer left the FIRST answer
     still dressed as the resolution. */
  if (m.boundTo) {
    const current = o.answerMsg === m.id;
    if (current && o.verification === "accepted")
      return `<button class="tag green" ${rc}>resolves ◆ · answer-bound · nothing inferred${where}</button>`;
    if (current)
      return `<button class="tag amber" ${rc}>answer superseded · reopened ${esc(o.reopenedAt || "")} · kept on the record${where}</button>`;
    return `<button class="tag amber" ${rc}>superseded answer · replaced ${esc(m.supersededAt || "")} · kept on the record${where}</button>`;
  }
  if (needsYou(o)) return `<button class="tag amber" data-pin="${esc(o.id)}"${home ? ` data-pinroom="${esc(home)}"` : ""}>${g === "?" ? "? open question · needs " + esc(S.me) : "◆ needs " + esc(S.me)}${where}</button>`;
  if (o.verification === "verified") return `<button class="tag green" ${rc}>verified · ${esc(o.verifiedBy)}${where}</button>`;
  if (o.verification === "accepted") return `<button class="tag green" ${rc}>accepted · ${esc(o.acceptedBy)}${where}</button>`;
  if (o.kind === "commitment") return `<button class="tag" ${rc}>commitment · ${esc(o.owner)} · ${esc(o.due)} ~${where}</button>`;
  if (o.kind === "claim") return `<button class="tag" ${rc}>claim · unverified${where}</button>`;
  return `<button class="tag" ${rc}>${esc(o.kind)} · ${esc(o.verification)}${where}</button>`;
}

/* Only actions that do something are rendered. Round 1 shipped 32 inert
   buttons; the rule now is wire it or delete it. */
function rowActions(r, m, o) {
  const acts = [];
  if (!m.system) acts.push(`<button data-reply="1">Reply</button>`);
  /* you verify CLAIMS. A decision is answered, not verified, and a commitment is
     signed off — offering Verify on either would be a control that lies. */
  if (o && o.kind === "claim" && isClaim(o) && o.claimant !== S.me && !m.sysFor) {
    acts.push(`<button data-verify="${esc(o.id)}">Verify</button>`);
  }
  if (o && o.kind === "question" && o.verification === "open" && !m.sysFor) {
    acts.push(`<button data-obj="${esc(o.id)}" data-fx="answered">Answer</button>`);
  }
  return acts.join("");
}

/* the ~ → ✓ pair, exercisable: verifying asks for the evidence, and records it */
function verifyBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  box.innerHTML =
    `<div class="hd"><span class="lbl">VERIFY THIS CLAIM</span></div>
     <div class="row">
       <input id="vinput" type="text" aria-label="Evidence note" placeholder="what checked it? (e.g. “July AWS bill, write-throughput line: $912”)">
       <button class="btn sm" id="vgo">Attach &amp; verify</button>
       <button class="btn ghost sm" id="vcancel">Cancel</button>
     </div>
     <div class="hint">${esc(o.claimant)} said it, you are checking it — that is what makes it green. Verifying your own claim is not offered.</div>`;
  box.querySelector("#vgo").addEventListener("click", () => doVerify(o.id, box.querySelector("#vinput").value.trim()));
  box.querySelector("#vcancel").addEventListener("click", () => { S.ui.verifying = null; render(); });
  box.querySelector("#vinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doVerify(o.id, e.target.value.trim()); }
    if (e.key === "Escape") { S.ui.verifying = null; render(); }
  });
  return box;
}
function focusVerify() { const i = $("vinput"); if (i) i.focus(); }

/* --- since you left ------------------------------------------------------ */

/* mode: "absence" — the frozen window you were away for
 *       "return"  — everything that has landed since you got back / marked seen
 *       "seen"    — the caught-up marker at the end of the room
 * A chip counts MESSAGES in its own group; the pin above counts the ITEMS those
 * messages are about. The when-line says so, and a chip that counts nothing is
 * disabled rather than a clickable no-op. */
function sylDivider(r, mode) {
  const el = document.createElement("div");
  el.className = "syl" + (mode === "seen" ? " seen" : mode === "return" ? " ret" : "");
  if (mode === "absence" || (mode === "seen" && !hasAbsenceGroup(r))) el.id = "syl";

  if (mode === "seen") {
    el.innerHTML =
      `<div class="bar"><span class="lbl">SEEN FROM HERE</span><span class="rule"></span></div>
       <div class="when"><span>caught up — ${r.readGroup || 0} message${r.readGroup === 1 ? "" : "s"} read · ${esc(r.away.len)} away · the seen cursor sits at the end of #${esc(r.name)}, and only this room's</span></div>`;
    return el;
  }

  const scope = mode === "absence" ? "absence" : "return";
  const c = counts(r, scope);
  const own = ownInGroup(r, scope);
  const cursorPastAbsence = idx(r, r.seenAfter) > idx(r, r.absenceEnd);
  const label = mode === "absence" ? "SINCE YOU LEFT"
              : cursorPastAbsence ? "SINCE YOU MARKED THIS SEEN" : "SINCE YOU RETURNED";

  const chips = ["need", "change", "discussion", "routine"].map(k => {
    const n = c[k], on = !!S.ui.feedFilter && S.ui.feedFilter.k === k && S.ui.feedFilter.scope === scope;
    const title = n
      ? `${n} message${n === 1 ? "" : "s"} in this group are ${k === "need" ? "linked to something that needs you — the pin counts the items, this counts the rows" : FILTER_LABEL[k].toLowerCase()}`
      : `no ${FILTER_LABEL[k].toLowerCase()} messages in this group — nothing to filter to`;
    return `<button class="cnt${k === "need" && n ? " need" : ""}" data-filter="${k}" data-scope="${scope}"` +
           `${n ? "" : " disabled"} title="${esc(title)}" aria-pressed="${on}">${n} ${FILTER_LABEL[k]}</button>`;
  }).join("");

  const when = mode === "absence"
    ? `<span>${esc(r.away.from)} → ${esc(r.away.to)} · ${esc(r.away.len)} away · ${c.total} messages · frozen at return</span>
       <span aria-hidden="true">·</span>
       <span>chips count rows · NEEDS YOU counts the items behind them</span>
       <span aria-hidden="true">·</span>
       <button class="mark" id="markSeen">mark this group seen</button>`
    : `<span>${c.total} unseen since ${esc(cursorPastAbsence ? "you marked this seen" : r.away.to)}</span>` +
      (own ? `<span aria-hidden="true">·</span><span class="own">${own} row${own === 1 ? " here is yours" : "s here are yours"} — your own activity is never counted back to you as unseen</span>` : "") +
      (c.total ? `<span aria-hidden="true">·</span><button class="mark" id="markSeen">mark this group seen</button>` : "");

  el.innerHTML =
    `<div class="bar">
       <span class="lbl">${label}</span>
       <div class="counts">${chips}</div>
       <span class="rule"></span>
     </div>
     <div class="when">${when}</div>`;
  el.querySelectorAll(".cnt").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter, b.dataset.scope)));
  const mk = el.querySelector("#markSeen");
  if (mk) mk.addEventListener("click", markSeen);
  return el;
}

/* --- routine collapse: count, range and actors all derived from the rows --- */

function routineStrip(r, rows) {
  const wrap = document.createElement("div");
  wrap.className = "routine";
  const actors = [...new Set(rows.map(m => m.actor))];
  const routineFilter = !!S.ui.feedFilter && S.ui.feedFilter.k === "routine";
  const open = S.ui.routineOpen || routineFilter;
  const showAll = routineFilter;
  const shown = open ? (showAll ? rows : rows.slice(0, 6)) : [];

  const strip = document.createElement("button");
  strip.className = "strip";
  strip.setAttribute("aria-expanded", String(open));
  strip.innerHTML =
    `<span aria-hidden="true">·</span><span><b>${rows.length} routine</b></span>
     <span aria-hidden="true">·</span><span>${esc(rows[0].t)}–${esc(rows[rows.length - 1].t)}</span>
     <span aria-hidden="true">·</span><span>${esc(actors.join(", "))}</span>
     <span class="peek">${open ? "click to collapse" : "click to peek"}</span>`;
  strip.addEventListener("click", () => {
    S.ui.routineOpen = !open;
    S.ui.routineOpenedByFilter = false;      // opened or closed by hand from here on
    if (!S.ui.routineOpen && routineFilter) S.ui.feedFilter = null;
    render();
  });
  wrap.appendChild(strip);

  if (open) {
    const body = document.createElement("div");
    body.className = "peekbody scroll rise-s";
    shown.forEach(m => body.appendChild(messageRow(r, m)));
    if (shown.length < rows.length) {
      const more = document.createElement("div");
      more.className = "more";
      more.textContent = `+ ${rows.length - shown.length} more routine events · none owed you attention`;
      body.appendChild(more);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

/* ===========================================================================
 * LENS + RECEIPT — both are renders of the same objects the pin and the feed
 * read. There is no separate receipt store any more; a receipt IS an object,
 * drawn with its history, provenance and correction chain.
 * ======================================================================== */

const KIND_LABEL = { decision: "DECISIONS", commitment: "COMMITMENTS", question: "OPEN QUESTIONS", claim: "CLAIMS" };
const KIND_ORDER = ["decision", "commitment", "question", "claim"];

function renderLens() {
  const r = room();
  const body = $("lensBody");

  const accepted = r.objects.filter(o => o.verification === "accepted" || o.verification === "verified").length;
  const owed = attention(r).length;
  const claims = r.objects.filter(isClaim).length;
  $("lensSummary").textContent =
    `${r.objects.length} objects · ${accepted} settled · ${claims} unverified · ${owed} item${owed === 1 ? "" : "s"} awaiting you · updated ${S.now}`;

  if (S.ui.receiptId && obj(r, S.ui.receiptId)) { renderReceipt(obj(r, S.ui.receiptId)); return; }

  body.innerHTML = "";
  r.objectives.forEach(ob => {
    const mine = r.objects.filter(o => o.objectives.includes(ob.id));
    const owedHere = mine.filter(needsYou).length;
    const wrap = document.createElement("section");
    wrap.className = "obj";

    const head = document.createElement("button");
    head.className = "obj-head";
    head.setAttribute("aria-expanded", String(!!ob.open));
    head.innerHTML =
      `<span class="tw" aria-hidden="true">${ob.open ? "▾" : "▸"}</span>
       <span><span class="ttl">${esc(ob.title)}</span>
         <span class="ct">${mine.length} objects · ${owedHere ? `<span class="warn">${owedHere} need you</span>` : "all clear"}</span></span>
       <span class="st ${esc(ob.status)}">${esc(ob.status.toUpperCase())}</span>`;
    head.addEventListener("click", () => { ob.open = !ob.open; render(); });
    wrap.appendChild(head);

    if (ob.open) {
      KIND_ORDER.forEach(kind => {
        const items = mine.filter(o => o.kind === kind);
        if (!items.length) return;
        const grp = document.createElement("div");
        grp.className = "grp";
        grp.innerHTML = `<div class="glbl"><span class="lbl">${KIND_LABEL[kind]}</span><span class="n">${items.length}</span><span class="rule"></span></div>`;
        items.forEach(o => grp.appendChild(lensItem(o)));
        wrap.appendChild(grp);
      });
    }
    body.appendChild(wrap);
  });
}

function lensItem(o) {
  const g = glyphOf(o);
  const b = document.createElement("button");
  b.className = "oitem " + gclass(g) + (o.fresh ? " rise" : "");
  const facts = (o.facts || []).map((f, i) =>
    `<span class="${/overdue|not accepted|open |blocked|reopened/i.test(f) ? "warn" : ""}">${esc(f)}</span>`)
    .join('<span aria-hidden="true">·</span>');
  b.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <span><span class="tt ${isClaim(o) ? "claim" : ""}">${esc(o.text)}</span><span class="mt">${facts}</span></span>`;
  b.addEventListener("click", () => openReceipt(o.id));
  return b;
}

function receiptState(o) {
  if (o.verification === "accepted") return ["ACCEPTED", o.kind, `by ${o.acceptedBy} · ${o.acceptedAt}`];
  if (o.verification === "verified") return ["VERIFIED", o.kind, `checked by ${o.verifiedBy} · ${o.verifiedAt}`];
  if (o.verification === "proposed") return ["PROPOSED", "not accepted", `confidence ${o.confidence || "—"}`, "renders as a claim until a human answers"];
  if (o.verification === "open") return ["OPEN", "question", `open ${o.openFor || "—"}`, o.assignee ? `assigned to ${o.assignee}` : "nobody assigned"];
  if (o.verification === "self_reported") return ["SELF-REPORTED", o.kind, `${o.owner || o.claimant}`, "nothing other than the claimant has checked it"];
  /* round 2 carried a REASSIGNED branch here and never wrote that value: an
     assignment changes who owes the answer, not whether it is verified. The
     assignee is reported by the OPEN branch above, where it actually lives. */
  return ["CLAIM", "unverified", `claimant: ${o.claimant}`];
}

function renderReceipt(o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "receipt rise";
  const st = receiptState(o);

  const happened = o.history.map(h => {
    const hg = histGlyph(h.k);
    return `<div class="hap ${gclass(hg)}"><span class="g" aria-hidden="true">${hg}</span>
       <span class="tt"><span class="who">${esc(h.who)}</span> ${esc(h.text)}<span class="tm">${esc(h.tm)}</span></span></div>`;
  }).join("");

  const prov = o.provenance.map(p =>
    `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to source${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">not in the loaded window</span>`}</span>
       <span class="ex">“${esc(p.ex)}”</span>
       <span class="full">${esc(p.note)}</span>
     </button>`).join("");

  const corr = o.corrections.length
    ? o.corrections.map(c =>
        `<div class="corr"><div class="hd">${esc(c.hd)} · ${esc(c.who)} · ${esc(c.tm)}</div>
         <div class="bd"><q>${esc(c.text)}</q> → now: ${esc(c.after)}${c.msg ? ` · <button class="lnk" data-jump="${esc(c.msg)}"${c.room ? ` data-jumproom="${esc(c.room)}"` : ""}>${esc(c.link || "the prior answer is still in the room →")}</button>` : ""}</div></div>`).join("")
    : `<div class="corr"><div class="bd">no corrections — this object has never been amended</div></div>`;

  const canReopen = o.verification === "accepted" || o.verification === "verified";

  el.innerHTML =
    `<div class="rc-top">
       <button class="rc-back" id="rcBack">← BACK TO CURRENT STATE</button>
       <div class="rc-ttl ${gclass(g)}"><span class="g" aria-hidden="true">${g}</span><span class="h ${isClaim(o) ? "claim" : ""}">${esc(o.text)}</span></div>
       <div class="rc-state">${st.map((s, i) => i === 0
          ? `<span class="st ${g === "✓" ? "active" : "blocked"}">${esc(s)}</span>` : `<span>${esc(s)}</span>`).join('<span aria-hidden="true">·</span>')}
          <span aria-hidden="true">·</span><span>in ${o.objectives.length} objective${o.objectives.length > 1 ? "s" : ""}</span></div>
     </div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">WHAT HAPPENED</span><span class="rule"></span></div>${happened}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">PROVENANCE</span><span class="lbl">${o.provenance.length} SOURCES · HOVER TO EXPAND</span><span class="rule"></span></div>${prov}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">CORRECTION CHAIN</span><span class="rule"></span></div>${corr}</div>
     <div class="rc-foot">
       <span class="note">${esc(o.note || "")}</span>
       ${canReopen ? `<button class="btn sm" id="rcReopen">Reopen</button>` : ""}
     </div>`;

  const body = $("lensBody");
  body.innerHTML = "";
  body.appendChild(el);
  body.scrollTop = 0;
  el.querySelector("#rcBack").addEventListener("click", () => { S.ui.receiptId = null; render(); });
  const rb = el.querySelector("#rcReopen");
  if (rb) rb.addEventListener("click", () => reopen(o.id));
  el.querySelectorAll("[data-jump]").forEach(p => p.addEventListener("click", () => jumpTo(p.dataset.jump, p.dataset.jumproom)));
}

/* a receipt can be opened from a row in another room; the lens follows the
   object home rather than rendering an empty pane. */
function openReceipt(id, roomId) {
  if (roomId && roomId !== S.roomId && S.rooms[roomId] && obj(S.rooms[roomId], id)) {
    switchRoom(roomId, true);
    toast("#" + roomId + " — that object lives in this room's Current state", "info");
  }
  S.ui.receiptId = id;
  render();
}

/* ===========================================================================
 * TRANSITIONS
 *
 * Every one of these does the same three things: mutate the object, append a
 * system row to the conversation (the conversation is the record), re-render.
 * Nothing writes to the DOM directly and nothing sets a glyph.
 * ======================================================================== */

let clock = 9 * 60 + 13;
function tick() {
  const t = clock++;
  S.now = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  return S.now;
}
function nextId(p) { return p + (++S.seq); }

function appendMessage(r, m) { r.messages.push(m); return m; }
/* a transition row is your activity — you caused it, watching. `byMe` keeps it
   out of every unseen count, and `sysFor` lets it derive its glyph from the
   object it reports on instead of flattening to the routine dot. */
function appendSystem(r, text, objectId) {
  return appendMessage(r, { id: nextId("s"), t: S.now, actor: "atrium", system: true, fresh: true, byMe: true,
                            body: [text], objectId: null, sysFor: objectId });
}
function clearFresh() {
  Object.values(S.rooms).forEach(r => { r.messages.forEach(m => delete m.fresh); r.objects.forEach(o => delete o.fresh); });
}

/* --- B1: the answer IS the decision -------------------------------------
 * `statement` is whatever the human produced — the label of the button they
 * clicked, or the exact text they typed. It is recorded verbatim as the
 * decision, quoted verbatim in the receipt, and escaped at every render.
 * If it contradicts the proposal on the card, the contradiction is what gets
 * recorded: the human's answer is the decision.
 * ----------------------------------------------------------------------- */
function answerDecision(objectId, statement, provenanceNote) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();

  const m = appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, body: [statement], boundTo: o.id });

  /* the answer that WAS the answer stops being it, on the message itself. That
     is what makes the resolves/answer-bound tag identity-checked rather than
     state-checked: answer → reopen → answer leaves exactly one settled row. */
  const prior = o.answerMsg ? msg(r, o.answerMsg) : null;
  const priorText = prior ? plain(prior.body) : null;
  if (prior) { prior.supersededAt = t; prior.supersededBy = m.id; }

  const proposal = o.proposedText || o.text;
  const contradicts = statement !== proposal;

  o.proposedText = proposal;
  o.text = statement;                       // the decision statement is the answer, verbatim
  o.verification = "accepted";
  o.acceptedBy = S.me;
  o.acceptedAt = t + " today";
  o.owedTo = null;
  o.answerMsg = m.id;
  o.facts = ["accepted by " + S.me, t + " today", "answer-bound"];
  o.fresh = true;
  o.history.push({ k: "accepted", who: S.me, tm: t,
    text: "answered it directly — the resolution was recorded from the answer, not interpreted from it" });
  o.provenance.unshift({ who: S.me, tm: t, msg: m.id, ex: statement, note: provenanceNote });

  /* an answer that is not the proposal is a correction to the record, and the
     correction chain is where corrections live. Round 2 recorded the
     contradiction in the note and left the chain empty. */
  if (prior || contradicts) {
    o.corrections.push({
      hd: prior ? "RE-ANSWERED · PRIOR ANSWER SUPERSEDED" : "ANSWERED · PROPOSAL → DECISION",
      who: S.me, tm: t,
      text: prior ? priorText : proposal,
      after: statement + (contradicts && !prior ? " — not what was proposed; your answer is the decision" : ""),
      msg: prior ? prior.id : (o.sourceMsg || null),
      room: prior ? null : sourceRoomOf(o),
      link: prior ? "the superseded answer is still in the room →" : "the proposal it replaced is still in the room →"
    });
  }

  o.note = "Answer-binding skips the proposal machinery entirely: the statement above is your words, recorded verbatim. " +
           (contradicts ? "It is not the same as what was proposed — that is allowed, and the correction chain records the swap. " : "") +
           (prior ? "It replaces your earlier answer, which is still on the record and still in the room." : "");

  appendSystem(r, `decision ${o.id} · ${prior ? "re-answered" : "proposed → accepted"} · recorded verbatim from ${S.me}' answer · nothing inferred`, o.id);
  S.ui.bound = null; S.ui.replyTo = null; S.ui.pinOpen = null;
  $("cinput").value = "";
  render();
  scrollFeedToEnd();
  toast(prior ? "re-answered · the earlier answer is now marked superseded, not deleted"
              : "recorded as a decision · answer-bound, your wording verbatim");
}

/* --- B2: reopen re-renders EVERYTHING, including the historical row ------ */
function reopen(objectId) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();
  const wasDecision = o.kind === "decision";

  o.verification = wasDecision ? "proposed" : "unverified";
  o.reopenedAt = t;
  o.fresh = true;
  if (wasDecision) {
    o.owedTo = S.me; o.priority = 20;
    /* NO DEAD ATTENTION ITEMS. Options that existed survive the reopen. A
       decision that never carried options gets the one option that is not
       invented — re-affirming the statement already on the record — plus the
       bound composer, which pinActions() offers on every pending decision. */
    if (!o.options || !o.options.length) {
      o.options = [{ label: "Re-affirm the prior call", statement: o.text, synthesized: true }];
    }
  }
  o.facts = ["reopened by " + S.me, "prior answer kept", "pending again"]
    .concat(sourceRoomOf(o) ? ["source in #" + o.sourceRoom] : []);
  o.history.push({ k: "gate", who: S.me, tm: t,
    text: "reopened it — the prior answer stays on the record and is still reachable from here" });
  o.corrections.push({
    hd: wasDecision ? "REOPENED · ACCEPTED → PENDING" : "REOPENED · VERIFIED → UNVERIFIED",
    who: S.me, tm: t,
    text: "Reopening — the evidence under this was never checked and the whole call rests on it.",
    after: wasDecision ? "Proposal (prior answer preserved on the record)" : "Claim (prior verification preserved)",
    msg: o.answerMsg || o.sourceMsg || (o.provenance[0] && o.provenance[0].msg) || null,
    room: o.answerMsg ? null : sourceRoomOf(o),
    link: o.answerMsg ? "the prior answer is still in the room →" : "the source is still in the room →"
  });
  o.note = "Reopening is append-only. The answer at " + (o.acceptedAt || o.verifiedAt || "") +
           " is still in the conversation, still in this history, and the row that carried it now renders as superseded rather than settled.";

  appendSystem(r, `${o.kind} ${o.id} · ${wasDecision ? "accepted → proposed" : "verified → unverified"} · reopened by ${S.me} · prior answer kept`, o.id);
  render();
  /* the toast reports what actually happened to THIS object, not a fixed line:
     reopening a decision routes it back to you, reopening a verified claim does
     not put it in anyone's list. */
  toast(needsYou(o)
    ? "reopened · back in Needs you as a pending decision, the prior answer on record"
    : "reopened · it is a ~ claim again and owes nobody an answer — nothing was added to your list", "warn");
}

/* --- the ~ → ✓ pair ----------------------------------------------------- */
function doVerify(objectId, evidence) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  if (!evidence) { toast("verification needs a note — green means something checked it, and this records what", "bad"); focusVerify(); return; }
  if (o.claimant === S.me) { toast("you cannot verify your own claim — that is what ~ is for", "bad"); return; }
  const t = tick();
  o.verification = "verified";
  o.verifiedBy = S.me;
  o.verifiedAt = t + " today";
  o.evidence = evidence;
  o.fresh = true;
  o.facts = [o.claimant, "verified by " + S.me + " " + t, evidence];
  o.history.push({ k: "verified", who: S.me, tm: t, text: "attached evidence: " + evidence });
  o.provenance.unshift({ who: S.me, tm: t, msg: null, ex: evidence,
    note: "verification note · attached by lars · the claimant did not check their own claim" });
  o.note = "Verified by someone other than the claimant, which is the only thing that makes a line green. " +
           "Reopening it puts the ~ back and keeps this note on the record.";
  appendSystem(r, `claim ${o.id} · unverified → verified by lars · evidence: ${evidence}`, o.id);
  S.ui.verifying = null;
  render();
  toast("verified · " + o.claimant + " said it, you checked it");
}

/* --- pin effects -------------------------------------------------------- */
function applyEffect(objectId, fx) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();
  let line = "", msgText = "", kind = "ok";

  /* everything a transition writes about itself is derived: the actor is S.me,
     the objectives are the object's own, the assignee is the object's own.
     Round 2 typed "lars", "justin" and "o2" into these strings. */
  const blocked = o.objectives.length;
  const blocks = `${blocked} objective${blocked === 1 ? "" : "s"}`;

  if (fx === "signed") {
    const wasDue = o.due;
    o.verification = "self_reported"; o.owedTo = null; o.overdue = null;
    o.facts = [S.me, "marked done " + t, "self-reported"];
    o.history.push({ k: "claim", who: S.me, tm: t, text: "marked it signed off — your own word, nothing has checked it" });
    o.note = "You signed your own sign-off. Nobody verifies their own commitment, so this stays ~.";
    line = `commitment ${o.id} · marked signed off by ${S.me} · was due ${wasDue} · self-reported, not verified`;
    msgText = "signed off · recorded as self-reported, not verified — nobody verifies their own commitment";
    kind = "info";
  } else if (fx === "resched") {
    const wasDue = o.due;
    o.verification = "self_reported"; o.owedTo = null; o.overdue = null; o.due = "today 17:00";
    o.facts = [S.me, "due today 17:00", "rescheduled " + t];
    o.history.push({ k: "claim", who: S.me, tm: t, text: `moved the due date from ${wasDue} to today 17:00 — the original date stays above` });
    o.note = "Rescheduling never erases the original date; both are in the history.";
    line = `commitment ${o.id} · due ${wasDue} → today 17:00 · rescheduled by ${S.me}`;
    msgText = "rescheduled · the original due date stays on the record";
    kind = "info";
  } else if (fx === "answered") {
    o.verification = "unverified"; o.owedTo = null;
    o.facts = ["answered by " + S.me + " " + t, "no sign-off attached", "still blocks " + blocks];
    o.history.push({ k: "claim", who: S.me, tm: t, text: "answered from memory — no written sign-off is attached, so it stays a claim" });
    o.note = "Answering a question is not the same as verifying the answer. It stays ~ until a sign-off is attached, which is why the objectives it blocks are still blocked.";
    line = `question ${o.id} · open → answered by ${S.me} · unverified (no sign-off attached) · still blocking ${blocks}`;
    msgText = `answered · stays ~ with no sign-off attached, and still blocks ${blocks}`;
    kind = "warn";
  } else if (fx === "reassign") {
    const to = o.reassignTo || "justin";
    o.owedTo = null; o.assignee = to;
    o.facts = ["asked by " + o.askedBy, "now " + to + "'s", "still open"];
    o.history.push({ k: "question", who: S.me, tm: t, text: `reassigned it to ${to} — out of your list, unchanged in the record` });
    o.note = "Reassigning moves it off your surface. It is still open and still blocking the objectives it blocked.";
    line = `question ${o.id} · reassigned to ${to} by ${S.me} · still open · still blocking ${blocks}`;
    msgText = `reassigned to ${to} · out of your list, still open, still blocking ${blocks}`;
    kind = "warn";
  }
  o.fresh = true;
  appendSystem(r, line, o.id);
  S.ui.pinOpen = null;
  render();
  toast(msgText, kind);
}

/* ===========================================================================
 * COMPOSER
 * ======================================================================== */

function renderComposer() {
  const r = room();
  const bar = $("ctxbar"), input = $("cinput"), comp = $("composer");
  comp.classList.toggle("bound", !!S.ui.bound);
  comp.classList.toggle("replying", !!S.ui.replyTo);

  if (S.ui.bound) {
    const o = obj(r, S.ui.bound);
    bar.hidden = false; bar.className = "ctxbar rise-s";
    $("ctxGlyph").textContent = "◆";
    $("ctxLabel").textContent = "ANSWER-BINDING";
    $("ctxText").textContent = "what you type is recorded as the decision, verbatim";
    $("ctxIn").textContent = "in: " + (o ? o.text : "");
    input.placeholder = "Answer in your own words — this text becomes the decision";
    $("cstate").textContent = "bound to ◆ " + (o ? o.id : "") + " · your wording is the record · interpretation is skipped";
  } else if (S.ui.replyTo) {
    const m = msg(r, S.ui.replyTo);
    bar.hidden = false; bar.className = "ctxbar reply rise-s";
    $("ctxGlyph").textContent = "↩";
    $("ctxLabel").textContent = "REPLYING";
    $("ctxText").textContent = m ? m.actor + " · " + m.t : "";
    $("ctxIn").textContent = m ? "“" + plain(m.body).slice(0, 70) + "”" : "";
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = "reply · interpretation runs on send · anything derived lands in Current state as ~";
  } else {
    bar.hidden = true;
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = "interpretation runs on send · proposals land in Current state as ~ until accepted";
  }
}

function bindComposer(objectId) {
  S.ui.bound = objectId; S.ui.replyTo = null;
  render();
  $("cinput").focus();
}
function startReply(msgId) {
  const r = room();
  const m = msg(r, msgId);
  S.ui.replyTo = msgId; S.ui.bound = null;
  const input = $("cinput");
  if (m && m.actor !== S.me && !m.system) input.value = "@" + m.actor + " ";
  render();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
function cancelContext() { S.ui.bound = null; S.ui.replyTo = null; render(); }

function send() {
  const r = room();
  const input = $("cinput");
  const v = input.value.trim();
  if (S.ui.bound) {
    if (!v) { toast("type your answer — the composer records what you write, not what the card suggested", "bad"); input.focus(); return; }
    answerDecision(S.ui.bound, v, "answer-bound reply · typed by lars and recorded verbatim · no model in the path");
    return;
  }
  if (!v) return;
  const t = tick();
  appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, body: [v], replyTo: S.ui.replyTo || null });
  input.value = "";
  S.ui.replyTo = null;
  render();
  scrollFeedToEnd();
  toast("sent · your own message, so it is never counted back to you as unseen", "info");
}

/* ===========================================================================
 * NAVIGATION / FILTERS / MISC WIRING
 * ======================================================================== */

function setFilter(k, scope) {
  const f = S.ui.feedFilter;
  const off = f && f.k === k && f.scope === scope;
  S.ui.feedFilter = off ? null : { k, scope };
  /* the routine chip opens the collapse; turning it off closes it again unless
     you had already opened it by hand. Round 2 left the peek hanging open. */
  if (!off && k === "routine" && !S.ui.routineOpen) { S.ui.routineOpen = true; S.ui.routineOpenedByFilter = true; }
  if ((off || k !== "routine") && S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  const syl = $("syl");
  if (syl) scrollIntoView(syl, "start");
}

/* a filter whose group no longer contains anything of that class cannot stay on
   — otherwise a cleared pin leaves a filter highlighting nothing. */
function normalizeFilter() {
  const f = S.ui.feedFilter;
  if (!f) return;
  const n = groupMessages(room(), f.scope).filter(m => msgClass(room(), m) === f.k).length;
  if (!n) S.ui.feedFilter = null;
}

function markSeen() {
  const r = room();
  const scope = hasAbsenceGroup(r) ? "absence" : "return";
  r.readGroup = counts(r, scope).total;          // what the cursor just swallowed
  r.seenAfter = r.messages[r.messages.length - 1].id;
  render();
  toast("seen cursor moved for #" + r.name + " only — every other room keeps its own", "info");
}

function switchRoom(id, quiet) {
  if (id === S.roomId) return;
  S.roomId = id;
  S.ui.feedFilter = null; S.ui.receiptId = null; S.ui.bound = null;
  S.ui.replyTo = null; S.ui.verifying = null; S.ui.pinOpen = null;
  S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false;
  $("cinput").value = "";
  if (quiet) return;                              // caller renders and reports
  render();
  bootScroll();
  const r = room();
  toast("#" + r.name + " · " + unseenCount(r) + " unseen here · this room keeps its own cursor", "info");
}

let tgtTimer = null;
function jumpTo(msgId, roomId) {
  if (!msgId) { toast("that source is in another room and this prototype does not seed it", "warn"); return; }
  if (roomId && roomId !== S.roomId) {
    const target = S.rooms[roomId];
    if (!target || !msg(target, msgId)) { toast("that source is outside the loaded window", "warn"); return; }
    switchRoom(roomId, true);
    toast("#" + roomId + " — the source of that item lives here, not in the room you came from", "info");
  }
  const r = room();
  const m = msg(r, msgId);
  if (!m) { toast("that message is outside the loaded window", "warn"); return; }
  if (m.routine) S.ui.routineOpen = true;
  S.ui.jumpTo = msgId;
  render();
  const el = $("feed").querySelector(`[data-msg="${msgId}"]`);
  scrollIntoView(el, "center");
  clearTimeout(tgtTimer);
  tgtTimer = setTimeout(() => { S.ui.jumpTo = null; render(); }, 2200);
}

/* the toast reports the OUTCOME, glyph included — round 2 stamped ✓ on every
   one of them, including the ones announcing that something was reopened. */
const TOAST_GLYPH = { ok: "✓", warn: "◆", bad: "✗", info: "·" };
let toastTimer = null;
function toast(m, kind) {
  const k = kind || "ok";
  const t = $("toast");
  $("toastMsg").textContent = m;
  $("toastGlyph").textContent = TOAST_GLYPH[k] || "·";
  t.className = "toast show" + (k === "ok" ? "" : " " + k);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function scrollFeedToEnd() {
  const feed = $("feed");
  if (reduceMotion()) { feed.scrollTop = feed.scrollHeight; return; }
  feed.scrollTo({ top: feed.scrollHeight, behavior: "smooth" });
}

/* ===========================================================================
 * RENDER — one call, every surface
 * ======================================================================== */

function render() {
  normalizeFilter();
  renderRail();
  renderHead();
  renderPin();
  renderFeed();
  renderComposer();
  renderLens();
  setTimeout(clearFresh, 400);
}

/* --- static wiring ------------------------------------------------------- */
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("atr-dark");
  $("themeBtn").title = dark ? "Switch to light" : "Switch to dark";
  toast(dark ? "dark theme" : "light theme", "info");
});
$("pinFold").addEventListener("click", () => { S.ui.pinFolded = !S.ui.pinFolded; render(); });
$("ctxCancel").addEventListener("click", cancelContext);
$("sendBtn").addEventListener("click", send);
$("cinput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === "Escape" && (S.ui.bound || S.ui.replyTo)) cancelContext();
});
$("cinput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
$("surfConv").addEventListener("click", () => {
  S.ui.feedFilter = null;
  if (S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  scrollIntoView($("syl"), "start");
  toast("conversation · unfiltered. All three surfaces stay on screen — these focus them, they do not navigate", "info");
});
$("surfNeeds").addEventListener("click", () => {
  const r = room();
  const f = S.ui.feedFilter;
  S.ui.feedFilter = (f && f.k === "need" && f.scope === "room") ? null : { k: "need", scope: "room" };
  render();
  scrollIntoView($("pin"), "nearest");
  if (!S.ui.feedFilter) { toast("filter cleared", "info"); return; }
  /* the exact relationship between the two numbers, out loud. Round 2 said
     "same set the pin counts", which is the claim that made the miscount
     invisible: one item can own four rows, and an item sourced in another room
     owns none here. */
  const items = attention(r).length;
  const rows = attentionRows(r).length;
  const off = offRoomItems(r);
  toast(`needs you · ${items} item${items === 1 ? "" : "s"} owe you here · ${rows} row${rows === 1 ? " in this room is" : "s in this room are"} linked to them` +
        (off.length ? ` · ${off.length} ${off.length === 1 ? "has its source" : "have their sources"} in another room — jump from the pin` : ""), "warn");
});
$("surfState").addEventListener("click", () => {
  S.ui.lensFocus = !S.ui.lensFocus;
  S.ui.receiptId = null;
  if (S.ui.lensFocus) room().objectives.forEach(o => o.open = true);
  render();
  $("lensBody").scrollTop = 0;
  toast(S.ui.lensFocus
    ? "current state focused — every objective expanded in the right-hand pane, which never left the screen"
    : "lens focus released", "info");
});

/* --- boot ---------------------------------------------------------------- */
function bootScroll() {
  requestAnimationFrame(() => {
    const syl = $("syl");
    $("feed").scrollTop = syl ? Math.max(0, syl.offsetTop - 60) : 0;
  });
}
render();
bootScroll();
</script>
