    const body = document.createElement("div");
    body.className = "peekbody scroll rise-s";
    shown.forEach(m => body.appendChild(messageRow(r, m)));
    if (shown.length < rows.length) {
      const more = document.createElement("div");
      more.className = "more";
      more.textContent = `+ ${rows.length - shown.length} more routine events · none owed you attention`;
      body.appendChild(more);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

/* --- cross-room jump trace ----------------------------------------------- */
function renderTrace() {
  const el = $("trace");
  const tr = S.ui.trace;
  if (!tr) { el.hidden = true; el.innerHTML = ""; return; }
  const from = S.rooms[tr.from];
  el.hidden = false;
  el.innerHTML =
    `<span class="g" aria-hidden="true">→</span>
     <span class="tx">you came from <b>#${esc(from ? from.name : tr.from)}</b>${tr.why ? " · following " + esc(tr.why) : ""} · ${esc(tr.at)}</span>
     <button class="back" id="traceBack">← back to #${esc(from ? from.name : tr.from)}</button>
     <button class="x mono" id="traceX" aria-label="Dismiss this trace">✕</button>`;
  $("traceBack").addEventListener("click", () => {
    const back = tr.from;
    switchRoom(back, true);          // clears the trace: you are home, not lost
    render();
    bootScroll();
    toast(`back in #${back} — the row you left is where you left it`, "info");
  });
  $("traceX").addEventListener("click", () => { S.ui.trace = null; render(); });
}

/* ===========================================================================
 * LENS + RECEIPT — both are renders of the same objects the pin and the feed
 * read. There is no separate receipt store any more; a receipt IS an object,
 * drawn with its history, provenance and correction chain.
 * ======================================================================== */

const KIND_LABEL = { decision: "DECISIONS", commitment: "COMMITMENTS", question: "OPEN QUESTIONS", claim: "CLAIMS" };
const KIND_ORDER = ["decision", "commitment", "question", "claim"];

function renderLens() {
  const r = room();
  const body = $("lensBody");

  /* AND THE HEADER COUNTS ARE COUNTED OFF THE RECORD (round 11). They were
     counted off `o.verification`, which is only pinned to the record by an
     invariant one function away; the histories ARE the record, so the summary
     that sits above thirteen of them reads them. */
  const held = (o, f) => { const h = recordOf(o, f); return h[h.length - 1].value; };
  const accepted = r.objects.filter(o => held(o, "verification") === "accepted" || held(o, "verification") === "verified").length;
  const owed = attention(r).length;
  const claims = r.objects.filter(o => UNSETTLED.includes(held(o, "verification"))).length;
  const open = r.objects.filter(o => held(o, "verification") === "open").length;
  $("lensSummary").textContent =
    `${r.objects.length} objects · ${accepted} settled · ${claims} unverified · ${owed} item${owed === 1 ? "" : "s"} awaiting you · updated ${S.now}`;
  /* SUB-COUNTS THAT DO NOT SUM ARE EXPLAINED WHERE THEY ARE SHOWN. settled +
     unverified + open partition the objects; "awaiting you" cuts across all
     three, so it is not a fourth slice of the same pie. Saying so costs one
     line and removes the only reading in which these numbers look wrong. */
  $("lensSums").textContent =
    `${accepted} + ${claims}${open ? " + " + open + " open" : ""} = ${accepted + claims + open} of ${r.objects.length}` +
    ` · awaiting you overlaps them, it does not add to them`;

  if (S.ui.receiptId && obj(r, S.ui.receiptId)) { renderReceipt(obj(r, S.ui.receiptId)); return; }

  body.innerHTML = "";
  /* one object can sit under two objectives, so the per-objective owed counts
     can sum to more than the pin's item count. Where that is true, the lens
     says it in prose rather than leaving two numbers to contradict each other. */
  const perObjectiveOwed = r.objectives.reduce((n, ob) =>
    n + r.objects.filter(o => o.objectives.includes(ob.id) && needsYou(o)).length, 0);
  if (perObjectiveOwed !== owed) {
    const note = document.createElement("div");
    note.className = "lensnote";
    note.textContent = `the need-you counts below sum to ${perObjectiveOwed}, not ${owed} — an object under two objectives is counted by both, and is still one item in Needs you`;
    body.appendChild(note);
  }
  r.objectives.forEach(ob => {
    const mine = r.objects.filter(o => o.objectives.includes(ob.id));
    const owedHere = mine.filter(needsYou).length;
    const wrap = document.createElement("section");
    wrap.className = "obj";

    const head = document.createElement("button");
    head.className = "obj-head";
    head.dataset.objective = ob.id;          // survives the rebuild it triggers (D3)
    head.setAttribute("aria-expanded", String(!!ob.open));
    head.title = `${mine.length} object${mine.length === 1 ? "" : "s"} sit under this objective` +
      (owedHere ? `, ${owedHere} of which need you. An object can sit under more than one objective, so these counts overlap the other objectives and the pin.`
                : ". Nothing here is waiting on you.");
    head.innerHTML =
      `<span class="tw" aria-hidden="true">${ob.open ? "▾" : "▸"}</span>
       <span><span class="ttl">${esc(ob.title)}</span>
         <span class="ct">${mine.length} objects · ${owedHere ? `<span class="warn">${owedHere} need you</span>` : "all clear"}</span></span>
       <span class="st ${esc(ob.status)}">${esc(ob.status.toUpperCase())}</span>`;
    head.addEventListener("click", () => { ob.open = !ob.open; render(); });
    wrap.appendChild(head);

    if (ob.open) {
      KIND_ORDER.forEach(kind => {
        const items = mine.filter(o => o.kind === kind);
        if (!items.length) return;
        const grp = document.createElement("div");
        grp.className = "grp";
        grp.innerHTML = `<div class="glbl"><span class="lbl">${KIND_LABEL[kind]}</span><span class="n">${items.length}</span><span class="rule"></span></div>`;
        items.forEach(o => grp.appendChild(lensItem(o)));
        wrap.appendChild(grp);
      });
    }
    body.appendChild(wrap);
  });
}

/* an object's own text is the page's until a human's typed answer BECOMES it —
   `textVoice` records which, and every surface that renders the title reads it
   rather than guessing (round 5 D4). */
function titleFrag(o) { return o.textVoice === "human" ? human(o.text) : o.text; }
function pinTitleFrag(o) { return o.question ? o.question : titleFrag(o); }

function lensItem(o) {
  const g = glyphOf(o);
  const b = document.createElement("button");
  b.className = "oitem " + gclass(g) + (o.fresh ? " rise" : "");
  /* the object's own item in the lens, addressable by the object it is about —
     the last resort in the focus chain, and stable across a rebuild */
  b.dataset.lensObj = o.id;
  b.dataset.obj = o.id;
  const facts = (o.facts || []).map((f, i) =>
    factHtml(o, f, i, /overdue|not accepted|open |blocked|reopened/i.test(voicedText(f)) ? "warn" : ""))
    .join('<span aria-hidden="true">·</span>');
  b.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <span><span class="tt ${isClaim(o) ? "claim" : ""}">${voiced(titleFrag(o))}</span><span class="mt">${facts}</span></span>`;
  b.addEventListener("click", () => openReceipt(o.id));
  return b;
}

/* THE RECEIPT'S STATE LINE IS A RECORD READ (round 10 self-review, raised by
   both foreign reviewers as a hole in the completeness claim). It is the
   loudest sentence in a receipt — `ACCEPTED · commitment · by lars` — and it
   branched on `o.verification`, `o.due` and `o.assignee` read straight off the
   object. Those are recorded fields and checkRecordInvariant() pins each of
   them to the last value its own history holds, so it could not paint a state
   the record did not have; but the sentence was not PRODUCED by the read, which
   is the property the doctrine is about, and the checkers could not see it. It
   is minted now, and `.rc-state` is read back against it.
   `o.due` is read through recordedLabel(), so K3's `"no due date"` — a value the
   record genuinely holds, not an absent one — prints as itself rather than as
   "due no due date". */
function receiptState(o) {
  return say(reads(o, ["verification", "due", "assignee", "answer"]), (v, d, n, a) => {
    const st = v.value;
  if (st === "accepted") return ["ACCEPTED", o.kind, `by ${fieldOr(o.acceptedBy, "nobody on record")} · ${fieldOr(o.acceptedAt, "time not recorded")}`];
  if (st === "verified") return ["VERIFIED", o.kind, `checked by ${fieldOr(o.verifiedBy, "nobody on record")} · ${fieldOr(o.verifiedAt, "time not recorded")}`];
  /* "until a human answers" named the `answer` field in a sentence that reads
     the verification — the noun is about acceptance, and that is what it says */
  if (st === "proposed") return ["PROPOSED", "not accepted", `confidence ${fieldOr(o.confidence, "—")}`, "renders as a claim until a human accepts it"];
  /* `openFor` is how long it had been open when the record was loaded. Once a
     question has been reopened that number is about the original ask, not about
     the state on screen, so the reopened case reports the reopen instead. */
  if (st === "open") return ["OPEN", "question",
    o.reopenedAt ? `reopened ${o.reopenedAt}` : `open ${fieldOr(o.openFor, "—")}`,
    n.value != null ? `assigned to ${n.value}` : "nobody assigned"];
  if (st === "self_reported") return ["SELF-REPORTED", o.kind, `${fieldOr(o.owner || o.claimant, "no owner on record")}`,
    /* K3's due is the STRING "no due date" — a value the record genuinely holds,
       not an absent one — so it prints as itself instead of "due no due date"
       (round 10 self-review) */
    d.value == null ? "no due date on record"
      : /due date/i.test(String(d.value)) ? recordedLabel(d.value) : "due " + recordedLabel(d.value),
    /* AND THE LOUDEST LINE IN THE RECEIPT STOPS DENYING A VERIFICATION TWO ROWS
       ABOVE IT (round 11 D2). This was a hardcoded literal inside a say()
       branch, using none of the four views it was handed, so `receiptState()`
       passed every clause the round-10 checkers had — it was minted, its point
       reads were re-read, and it rendered a negation the record denies. Reopen
       K0, a commitment a deploy record verified, and the state line read
       "nothing other than the claimant has checked it" two lines above a green
       WHAT HAPPENED entry saying `deploy 2f81c3 carried the flag into staging —
       checked by something other than the claimant`. Whether anything ever
       checked it is a question for the verification history, and the sign-off
       path one screen away was already asking it correctly. */
    v.ever("verified") || v.ever("accepted")
      ? "something other than the claimant checked it before, and that check is still on the record"
      : "nothing other than the claimant has checked it"];
  /* A QUESTION IS ASKED, NOT CLAIMED (round 5 D2). There was no branch for a
     question that had been answered but not signed off, so it fell through to
     the CLAIM line below and the receipt header read
     `CLAIM · unverified · claimant: priya` over a sentence priya had ASKED.
     That is the record asserting a person said something they did not say —
     the same family as fabricated attribution, reached through a missing
     switch branch rather than through a fabricated string. A question gets its
     own states, and none of them uses the word claimant. */
  if (o.kind === "question") {
    const asker = `asked by ${fieldOr(o.askedBy || o.claimant, "nobody on record")}`;
    if (a.value != null) return ["ANSWERED", "question", asker,
      `answered by ${fieldOr(o.answeredBy, "nobody on record")} · ${fieldOr(o.answeredAt, "time not recorded")}`,
      `no sign-off attached, so the answer is ${enumText(st)}`];
    return ["QUESTION", enumText(st), asker,
      n.value != null ? `assigned to ${n.value}` : "nobody assigned"];
  }
  /* round 2 carried a REASSIGNED branch here and never wrote that value: an
     assignment changes who owes the answer, not whether it is verified. The
     assignee is reported by the OPEN branch above, where it actually lives. */
  return ["CLAIM", enumText(st), `claimant: ${fieldOr(o.claimant, "nobody on record")}`];
  }, o);
}

/* ---------------------------------------------------------------------------
 * A CORRECTION ENTRY HAS TWO VOICES AND THEY NEVER MIX.
 *
 *   system voice — `was → after`, plus an optional `fact` line: what the page
 *                  knows happened. Mono, muted, no quotation marks, no first
 *                  person, no "X said". It is visibly not speech.
 *   human voice  — `quote`, present only when a person actually typed a reason.
 *                  Rendered in <q>, attributed, and carrying data-quoted so the
 *                  invariant checker can prove the words are theirs.
 *
 * Round 3 had exactly one voice and put a machine-written first-person sentence
 * in it. `text:` is gone from the shape so that failure cannot be re-typed.
 * ------------------------------------------------------------------------ */
function correctionHtml(c, o, i) {
  /* THE LABEL ON THE ROUTE IS A SENTENCE ABOUT THE OBJECT (round 11 minor). The
     arrow checker deliberately excludes link text — a route ends in an arrow for
     a reason that has nothing to do with a change — and the record-narration
     rule had quietly inherited the exclusion, so a RE-AFFIRMED entry, where
     nothing was replaced, carried "the proposal it replaced is still in the room
     →". It goes through voiced() like every other minted sentence, which is also
     what puts it inside clause 0's sweep. */
  const link = c.msg
    ? ` · <button class="lnk" data-jump="${esc(c.msg)}"${c.room ? ` data-jumproom="${esc(c.room)}"` : ""}>${voiced(c.link)}</button>`
    : "";
  /* the quote is by construction a person's own characters, so it is marked as
     theirs — the page-integrity rules are about what the PAGE writes (D4) */
  const quote = c.quote
    ? `<div class="reason"><q data-quoted="${esc(quoteRef(c.quote))}" data-voice="human">${esc(c.quote.text)}</q>
         <span class="src">— ${esc(c.quote.by)}, typed here${c.quote.seeded ? " on the record" : ""}</span></div>`
    : "";
  /* THE FACT LINE IS A SURFACE (round 10 self-review, found independently by
     both foreign reviewers). It sits inside the correction entry, below two
     operands and a header that are all record reads, and it was a literal — so
     rescheduling to the date already on the record printed "rescheduled by lars
     · the original date is not erased" under a header saying the date had not
     moved. `.ftx` is where the checker reads it back. */
  const fact = c.fact ? `<div class="fact"><span aria-hidden="true">·</span> <span class="ftx">${voiced(c.fact)}</span></div>` : "";
  /* THE ARROW IS A CLAIM (round 6 D1). Round 6 rendered `was → now: after` for
     every entry unconditionally, so an entry recording that nothing changed
     still asserted a swap — and did it with two byte-identical sentences either
     side of the arrow. An entry that carries no `change` gets no arrow, and
     checkCorrectionInvariant() holds every entry to the same distinction. */
  /* both operands are spans the checker can find and read back against the
     entry they were minted from — the render path is the layer round 8's D1
     went through, so it is the layer that gets asserted (see
     checkRenderedRecordInvariant) */
  const body = c.change && operandsMoved(c)
    ? `<span class="was">${voiced(c.was)}</span> → now: <span class="aft">${voiced(c.after)}</span>`
    : `<span class="was">${voiced(c.was)}</span> <span class="same">— unchanged ·</span> <span class="aft">${voiced(c.after)}</span>`;
  /* THE HEADER IS AN ASSERTION TOO (round 9 D1b). `RESCHEDULED · DUE DATE
     AMENDED` was a literal, so rescheduling to the date already on the record
     stated an amendment in the English word "AMENDED" — where the change-less
     guard, deliberately written as syntax rather than as a keyword sniffer,
     could not see it. The header is a record read now, so the word is produced
     by the branch that read the two values, and `.hdt` is where the checker
     compares the characters on screen against the ones that were minted. */
  return `<div class="corr"${o ? ` data-corr-obj="${esc(o.id)}" data-corr="${i}"` : ""}><div class="hd"><span class="hdt">${voiced(c.hd)}</span> · ${esc(c.who)} · ${esc(c.tm)}</div>
     <div class="bd">${body}${link}</div>
     ${fact}${quote}</div>`;
}
/* a quotation's provenance token: "typed" for text in the human-speech register,
   "msg:<id>" or "msg:<id>@<room>" for a line that is in the loaded record */
function quoteRef(q) { return q.src === "typed" ? "typed" : "msg:" + q.msg + (q.room ? "@" + q.room : ""); }

function renderReceipt(o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "receipt rise";
  el.dataset.obj = o.id;
  const st = receiptState(o);

  /* WHAT HAPPENED IS THE FIRST THING IN THE RECEIPT AND WAS THE LAST THING READ
     OUT OF THE RECORD (round 9 D1a). Every line here is a sentence about the
     object, so every line here is minted from a record read and is addressable:
     `.htx` is the sentence, and the checker compares those characters against
     the ones `stated()` produced. Round 9 composed this line from `fromClause`
     and `RECORDED.due.get(o)` read beside the record, so rescheduling to the
     date already on the record narrated a move the record denied — two surfaces
     below a chain body correctly saying nothing had changed. */
  const happened = o.history.map((h, i) => {
    const hg = histGlyph(h.k);
    return `<div class="hap ${gclass(hg)}" data-hap-obj="${esc(o.id)}" data-hap="${i}"><span class="g" aria-hidden="true">${hg}</span>
       <span class="tt"><span class="who">${esc(h.who)}</span> <span class="htx">${voiced(h.text)}</span><span class="tm">${esc(h.tm)}</span></span></div>`;
  }).join("");

  /* every excerpt is a quotation, so every excerpt must be provably a real line:
     either a message in the loaded record, or text this human typed into the
     page. There is no third case, and no way to render one. */
  /* A PROVENANCE ENTRY IS EITHER A QUOTATION OR A SYSTEM RECORD, NEVER BOTH.
     `voice: "system"` marks the entries the page authored on a human's behalf —
     a one-click answer. Those render with no quotation marks, no <q>/.ex, no
     data-quoted, and with their disclosure ALWAYS ON SCREEN. Round 4 rendered a
     chosen answer exactly like a typed one, quoted, with the single word
     "chosen" buried in `.full` behind a hover: the receipt's resting state said
     the human wrote a sentence they had never written. */
  const prov = o.provenance.map(p => {
    /* A MACHINE'S OUTPUT IS NOT SPEECH (round 7 D6). `checks` writes parity runs
       and deploy records; those lines are verbatim and correctly credited, so
       nothing here was ever fabricated — but round 7 rendered them with curly
       quotation marks and `data-voice="human"`, which says "a person said this"
       about a CI job, and exempted a machine's string from the record-text rules
       that exist to catch `undefined` in a record. The feed already renders the
       same strings in mono. So does this, now.
       It KEEPS ITS CITATION: `data-cited` resolves against the loaded record on
       every render exactly as `data-quoted` does, minus the human-authorship
       rule, which is the one part of the quotation contract that does not apply
       to a machine. Dropping the check along with the quotation marks would have
       traded a presentation defect for an attribution hole. */
    if (p.voice === "machine") {
      const cite = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : null;
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to the run${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">recorded here · no message carries it</span>`}</span>
       <span class="sysex"${cite ? ` data-cited="${esc(cite)}"` : ""}>${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    if (p.voice === "system") {
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span><span class="jump">jump to the row →</span></span>
       <span class="sysex">${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    /* a quotation context is human speech BY RULE — checkQuotationInvariant()
       refuses any excerpt that does not resolve to a message a person wrote or
       to text this person typed — so it carries data-voice="human" and the
       page-integrity rules leave the words alone (round 5 D4). */
    const ref = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : "typed";
    return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to source${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">typed here · no message carries it</span>`}</span>
       <span class="ex" data-quoted="${esc(ref)}" data-voice="human">“${esc(p.ex)}”</span>
       <span class="full">${esc(p.note)}</span>
     </button>`; }).join("");

  const corr = o.corrections.length
    ? o.corrections.map((c, i) => correctionHtml(c, o, i)).join("")
    : `<div class="corr"><div class="bd">no corrections — this object has never been amended</div></div>`;

  const reopenable = canReopen(o);
  const reopening = S.ui.reopening === o.id;

  el.innerHTML =
    `<div class="rc-top">
       <button class="rc-back" id="rcBack">← BACK TO CURRENT STATE</button>
       <div class="rc-ttl ${gclass(g)}"><span class="g" aria-hidden="true">${g}</span><span class="h ${isClaim(o) ? "claim" : ""}">${voiced(titleFrag(o))}</span></div>
       <div class="rc-state" data-rstate-obj="${esc(o.id)}" ${paintParts(st)}>${st.said.map((s, i) => i === 0
          ? `<span class="st ${stateChip(g)}" data-rstate="0">${esc(s)}</span>` : `<span data-rstate="${i}">${esc(s)}</span>`).join('<span aria-hidden="true">·</span>')}
          <span aria-hidden="true">·</span><span>in ${o.objectives.length} objective${o.objectives.length > 1 ? "s" : ""}</span></div>
     </div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">WHAT HAPPENED</span><span class="rule"></span></div>${happened}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">PROVENANCE</span><span class="lbl">${o.provenance.length} SOURCE${o.provenance.length === 1 ? "" : "S"} · HOVER OR FOCUS TO EXPAND</span><span class="rule"></span></div>${prov}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">CORRECTION CHAIN</span><span class="rule"></span></div>${corr}</div>
     <div class="rc-sec" id="rcReopenBox"></div>
     <div class="rc-foot">
       <span class="note"${isStated(o.note) ? ` data-note-obj="${esc(o.id)}"` : ""}>${voiced(o.note || "")}</span>
       ${reopenable ? `<button class="btn sm" id="rcReopen" aria-expanded="${reopening}">Reopen</button>` : ""}
     </div>`;

  const body = $("lensBody");
  body.innerHTML = "";
  body.appendChild(el);
  body.scrollTop = 0;
  /* and back out onto the item you came in from, which the lens re-renders in
     place — the reverse of openReceipt()'s successor, and for the same reason */
  el.querySelector("#rcBack").addEventListener("click", () => {
    S.ui.receiptId = null;
    focusOn(`[data-lens-obj="${o.id}"]`);
    render();
  });
  const rb = el.querySelector("#rcReopen");
  if (rb) rb.addEventListener("click", () => { S.ui.reopening = reopening ? null : o.id; render(); focusReopen(); });
  if (reopening) el.querySelector("#rcReopenBox").appendChild(reopenBox(o));
  el.querySelectorAll("[data-jump]").forEach(p => p.addEventListener("click", () => jumpTo(p.dataset.jump, p.dataset.jumproom, p.dataset.why || "a link in this receipt")));
}

/* a receipt can be opened from a row in another room; the lens follows the
   object home rather than rendering an empty pane. */
function openReceipt(id, roomId) {
  if (roomId && roomId !== S.roomId && S.rooms[roomId] && obj(S.rooms[roomId], id)) {
    const from = S.roomId;
    switchRoom(roomId, true);
    S.ui.trace = { from, msgId: null, why: "the receipt for " + id + ", which lives in this room", at: S.now };
    toast("#" + roomId + " — that object lives in this room's Current state", "info");
  }
  S.ui.receiptId = id;
  /* the receipt REPLACES the lens item that opened it, so there is no key to
     restore — the successor is the receipt's own way back out (D3) */
  focusOn("#rcBack", "#rcReopen");
  render();
}

/* ===========================================================================
 * TRANSITIONS
 *
 * Every one of these does the same three things: mutate the object, append a
 * system row to the conversation (the conversation is the record), re-render.
 * Nothing writes to the DOM directly and nothing sets a glyph.
 * ======================================================================== */

let clock = 9 * 60 + 13;
function tick() {
  const t = clock++;
  S.now = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  return S.now;
}
function nextId(p) { return p + (++S.seq); }

function appendMessage(r, m) { r.messages.push(m); return m; }
/* a transition row is your activity — you caused it, watching. `byMe` keeps it
   out of every unseen count, and `sysFor` links it to the object it reports on
   instead of flattening to the routine dot.
   THE GLYPH IS FROZEN HERE (round 4 D6). `o` is passed AFTER the mutation, so
   glyphOf(o) is the state this transition landed in — and that is what the row
   records forever. It is not re-derived on later renders, because the object
   moves on and the record must not: a row that says "accepted → proposed ·
   reopened" turned green again the moment the object was re-accepted, which is
   a permanent record of a downgrade rendering as a verified fact. */
/* `text` is a page-authored string, or an array of parts when the sentence has
   to quote a human's characters back — `human(s)` marks those, so the record
   rules keep checking the page's half of the line (round 5 D4). */
/* `change` is what amend() minted for the transition this row reports, when the
   row states one. A row that paints an arrow is making the same claim a
   correction chain's arrow makes and is held to the same proof (round 8 D2):
   checkRenderedRecordInvariant() reads it back off the message. */
function appendSystem(r, text, o, change) {
  const g = glyphOf(o);
  return appendMessage(r, { id: nextId("s"), t: S.now, actor: "atrium", system: true, fresh: true, byMe: true,
                            origin: "system", body: Array.isArray(text) ? text : [text], objectId: null, sysFor: o.id,
                            transition: change || null, tglyph: g, tclaim: isClaim(o) });
}
function clearFresh() {
  Object.values(S.rooms).forEach(r => { r.messages.forEach(m => delete m.fresh); r.objects.forEach(o => delete o.fresh); });
}

/* --- B1: the answer IS the decision -------------------------------------
 * `answer` is what the human produced:
 *   { origin: "typed",  statement }               — they wrote this sentence
 *   { origin: "chosen", statement, label, agrees } — they clicked this option
 * The statement is recorded verbatim as the decision either way. What differs
 * is WHO AUTHORED THE WORDS, and round 4's D3 is that the page did not track
 * that at all: a chosen answer was appended as a message actored to the human,
 * containing the card's sentence, and the receipt then quoted it under their
 * name. The human clicked a button; the page wrote the sentence and signed it
 * for them. design/CONVENTIONS.md now names this as the same defect class as
 * inventing the sentence outright, because it is.
 *
 * A chosen answer is therefore recorded as a SYSTEM ROW in system voice —
 * "lars chose: Cut over Friday" — with the statement it recorded stated beside
 * it, unquoted, and the receipt's source entry rendered the same way with its
 * disclosure on screen at rest. No quotation marks anywhere near it.
 * ----------------------------------------------------------------------- */
function answerDecision(objectId, answer, provenanceNote) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  /* guarded on the write, for the reason answerQuestion() states */
  if (!canAnswer(o)) { toast(refusalFor(o), "bad"); return; }
  const t = tick();
  const typed = answer.origin === "typed";
  const statement = answer.statement;

  /* Only typed text enters the human-speech register. A statement the page
     offered is not a thing the human said, so it is not quotable. */
  let m;
  if (typed) {
    S.typed.push(statement);
    m = appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, origin: "typed",
      body: [statement], boundTo: o.id });
  } else {
    /* system voice, third person, no quotation marks, no first person, and the
       actor column says `atrium` because atrium is who wrote these characters. */
    m = appendMessage(r, { id: nextId("m"), t, actor: "atrium", system: true, byMe: true, fresh: true,
      origin: "chosen", chosenBy: S.me, chosenLabel: answer.label,
      body: [`${S.me} chose: ${answer.label}`], boundTo: o.id,
      note: `statement recorded: ${statement} · chosen from the card's options, not typed — these are not ${S.me}'s words` });
  }

  /* the answer that WAS the answer stops being it, on the message itself. That
     is what makes the resolves/answer-bound tag identity-checked rather than
     state-checked: answer → reopen → answer leaves exactly one settled row. */
  const prior = o.answerMsg ? msg(r, o.answerMsg) : null;
  if (prior) { prior.supersededAt = t; prior.supersededBy = m.id; }

  /* DEPARTURE IS OPTION IDENTITY, NOT STRING EQUALITY (round 4 D7). Choosing
     the option that IS the proposal is agreement even when its wording differs
     — P1's proposal reads "Cut over Friday 1 Aug and drop legacy tokens" and
     its agreeing option reads "Cut over Friday 1 Aug; legacy tokens are
     dropped…". Round 4 compared the two strings, found them different, and
     recorded "not what was proposed" against an answer that agreed exactly.
     A typed answer has no option identity to compare, so there the text
     comparison is the only question there is — and it is the right one. */
  const proposal = o.proposedText || o.text;
  const contradicts = typed ? !sameText(statement, proposal) : !answer.agrees;
  /* AND SEPARATELY: DID THE SENTENCE ON THE RECORD ACTUALLY CHANGE? (round 6 D1)
     "Departs from the proposal" is a fact about which option was chosen.
     "The record now says something else" is a fact about the STATEMENT OF
     RECORD before this write and after it. Round 6 had only the first and
     rendered the second from it; round 7 had the second but read its "before"
     out of `prior.body` — the row that DISPLAYS a chosen answer reads "lars
     chose: Cut over Friday", which is not, and never was, the statement. So
     `changed` is not computed here at all any more: amend() answers it, from
     the object's own statement history, and hands back the before and after
     that the correction chain is allowed to assert. */
  /* where the statement of record stands BEFORE this write. Not the value — the
     POSITION: the correction entry below reads the value back out of the
     history at this index, so the sentence a reader sees is a record read and
     not a copy of one taken a few lines earlier (round 8 D1). */
  const statementAt = recordOf(o, "statement").length - 1;
  const verificationAt = recordOf(o, "verification").length - 1;
  const priorVoice = o.textVoice;

  o.proposedText = proposal;
  /* the decision statement is the answer, verbatim — written through the
     record, which is what makes the two values below provable */
  const change = amend(o, "statement", statement, { tm: t, by: S.me, how: typed ? "typed answer" : "chosen from the card" });
  /* and who authored those characters travels with them: a typed answer makes
     the object's own text a human's sentence, on every surface that renders it
     (round 5 D4). A chosen one is the card's wording, which is the page's. */
  o.textVoice = typed ? "human" : "page";
  const vAcc = amend(o, "verification", "accepted", { tm: t, by: S.me, how: "answered" });
  /* answering it again ends the reopen: `reopenedAt` is the fact that it is
     STANDING reopened, and it stopped being true on this line. Round 8 never
     cleared it, so a re-answered question's own current answer row claimed it
     had been reopened a minute before that answer existed (round 8 D3). */
  o.reopenedAt = null;
  o.acceptedBy = S.me;
  o.acceptedAt = t + " today";
  amend(o, "settlement", null, { tm: t, by: S.me, how: "answered" });
  o.owedTo = null;
  o.answerMsg = m.id;
  /* "answer-bound" means the human's own wording became the record. A chosen
     answer is bound to an option, not to a sentence they wrote, and the fact
     chip in the lens has to say which — it is the one line about this object a
     reader sees without opening anything. */
  /* ONE READ, AND EVERY SURFACE THIS TRANSITION NARRATES IS WRITTEN FROM IT
     (round 9 D1). The chain body was already a record read; the header, WHAT
     HAPPENED, the fact chips, the permanent row and the toast were not. */
  const rd = reads(o, [{ of: "statement", at: statementAt }, "statement",
                       { of: "verification", at: verificationAt }, "verification"]);
  const wasSt = rd[0], nowSt = rd[1], wasVf = rd[2], nowVf = rd[3];
  /* "did the statement of record move" — a comparison of two RECORD READS, which
     is what makes every sentence branching on it a sentence about the record */
  const stMoved = !sameValue(wasSt.value, nowSt.value);
  o.facts = [say([nowVf], v => enumText(v.value) + " by " + S.me), t + " today",
             typed ? "answer-bound" : "chosen from the card"];
  o.fresh = true;
  o.history.push({ k: "accepted", who: S.me, tm: t,
    text: say([wasSt, nowSt], (ws, ns) => {
      const moved = !sameValue(ws.value, ns.value);
      return typed
        ? (moved
            ? "answered it directly — the resolution was recorded from the typed answer, not interpreted from it"
            : "typed the sentence already on the record, word for word — it was recorded again and the statement itself was not amended")
        : `chose the option ${answer.label} from the card — ` +
          (moved
            ? `the statement it carries was recorded verbatim, and none of it is worded by ${S.me}`
            : "it is word for word the statement already on the record, so the statement itself was not amended");
    }) });
  /* the source entry for a chosen answer is a system record of a click, not a
     quotation of a sentence. `voice: "system"` is what renderReceipt() reads to
     drop the quotation marks and put the disclosure on screen at rest. */
  o.provenance.unshift(typed
    ? { who: S.me, tm: t, msg: m.id, ex: statement, note: provenanceNote }
    : { who: "atrium", tm: t, msg: m.id, voice: "system",
        ex: `${S.me} chose: ${answer.label} — statement recorded: ${statement}`,
        note: provenanceNote });

  /* AN ANSWER IS ALWAYS A CHAIN EVENT (round 7 D1, second half). Round 7 wrote
     an entry when there was a prior answer, when the option contradicted the
     proposal, or when nothing changed — which left exactly one case unrecorded:
     THE AGREEING OPTION WHOSE WORDING IS NOT THE PROPOSAL'S. P1's agreeing
     option reads "Cut over Friday 1 Aug; legacy tokens are dropped and the 4.7%
     tail is force-re-authed" against a proposal of "Cut over Friday 1 Aug and
     drop legacy tokens": clicking it genuinely replaces the statement of record
     and the chain said the object had never been amended. The mirror image of
     the same defect, in the same function — one asserting a change that did not
     happen, one silent about a change that did. Whether the statement moved is
     now the only question, and amend() has already answered it. */
  {
    const c = {
      /* AND THE HEADER IS A READ TOO (round 9 D1b). `changed` is honest — it is
         `!!change` — but it was a value carried into a literal, and the literal
         is what a reader sees. Reading the two statements here means the words
         "PRIOR ANSWER SUPERSEDED" are produced by the branch that compared
         them, so no header can claim a supersession the record did not make. */
      hd: say([wasSt, nowSt], (ws, ns) => !sameValue(ws.value, ns.value)
        ? (prior ? "RE-ANSWERED · PRIOR ANSWER SUPERSEDED" : "ANSWERED · PROPOSAL → DECISION")
        : (prior ? "RE-ANSWERED · THE SAME SENTENCE, RECORDED AGAIN" : "RE-AFFIRMED · THE PRIOR CALL, UNCHANGED")),
      who: S.me, tm: t,
      /* THE BEFORE IS THE STATEMENT, NOT A REFERENCE TO THE ROW THAT DISPLAYED
         IT. Round 7 rendered "Answer of 09:13" here and put `prior.body` in the
         change — so the words on screen and the values being compared were two
         different things, and only one of them was the record. Both are the
         statement now, and the human's sentence is marked as theirs only when
         it IS theirs (a prior answer they typed).
         AND THE SENTENCE IS A READ, NOT A COPY (round 8 D1): `stated()` hands
         the phrase the value the record holds for `statement`, so what is
         painted is the record's own value and checkCorrectionInvariant() can
         re-read it. `priorStatement` was captured off the same field a moment
         ago and the two are asserted to agree. */
      was: say([wasSt],
               v => [prior ? "Answer of " + prior.t + ": " : "Proposal: ",
                     priorVoice === "human" ? human(recordedLabel(v.value, "nothing was on the record")) : recordedLabel(v.value, "nothing was on the record")]),
      /* one END of the record per operand: a `was` asserts the value before and
         an `after` asserts the value now, so checkStatedOperand() can hold each
         to its own side of the minted change. Whether the two ends DIFFER is a
         comparison of two record reads — and it is made HERE, from the values
         handed in, rather than read off a flag computed twenty lines up. A
         phrase that branches on a closed-over boolean is a phrase whose reads
         could hold anything without a word on screen moving, which is what the
         mutation at the bottom of say() now measures (round 11 self-review). */
      after: say([nowSt], v => !sameValue(v.value, wasSt.value)
        ? [typed ? human(recordedLabel(v.value)) : recordedLabel(v.value),
           contradicts && !prior ? " — not what was proposed; your answer is the decision" : ""]
        : ["recorded again, verbatim — ", recordedLabel(v.value), " is the sentence that was already there, so the statement itself was not amended"]),
      /* THE ENTRY CARRIES WHAT IT CLAIMS DIFFERS, and carries it only when it
         claims something differs — and it carries what amend() minted, which is
         the only before/after pair on this page that the record can vouch for.
         checkCorrectionInvariant() holds every entry to all three of those. */
      change: change,
      fact: say([wasSt, nowSt], (ws, ns) => {
            const moved = !sameValue(ws.value, ns.value);
            return (prior ? (moved ? `re-answered by ${S.me} at ${t}` : `re-recorded by ${S.me} at ${t}`)
                          : (moved ? `answered by ${S.me} at ${t}` : `re-affirmed by ${S.me} at ${t}`)) +
            (typed ? " · typed" : ` · chosen: ${answer.label} — the page wrote the sentence, ${S.me} chose it`) +
            (moved ? "" : " · the statement on the record is unchanged, so the statement itself was not amended") +
            (moved && !contradicts && !prior
              ? " · the option agrees with the proposal, and its wording — the card's, not yours — is what is now on the record"
              : "");
          }),
      msg: prior ? prior.id : (o.sourceMsg || null),
      room: prior ? null : sourceRoomOf(o),
      /* AND THE LABEL ON THE ROUTE IS A RECORD READ (round 11 minor). "the
         proposal it replaced" was unconditional, so a RE-AFFIRMED entry — the
         branch whose whole point is that nothing was replaced — routed the
         reader to a replacement that never happened. */
      link: say([wasSt, nowSt], (ws, ns) => !sameValue(ws.value, ns.value)
        ? (prior ? "the statement it superseded is still in the room →"
                 : "the proposal it replaced is still in the room →")
        : (prior ? "the identical statement it re-recorded is still in the room →"
                 : "the proposal it re-affirmed is still in the room →"))
    };
    /* only a prior answer the human TYPED may be quoted back at them. A prior
       CHOSEN answer is a page-authored row; quoting it would re-open exactly
       the loophole D3 closes, one step removed. */
    if (prior && prior.origin === "typed") c.quote = { text: plain(prior.body), by: S.me, src: "typed" };
    else if (prior) c.fact = say([wasSt, nowSt], (ws, ns) => [c.fact.said,
      ` · the ${sameValue(ws.value, ns.value) ? "identical" : "superseded"} statement it replaces was chosen from the card, so there is nothing of ${S.me}'s to quote`]);
    o.corrections.push(c);
  }

  o.note = say([wasSt, nowSt], (ws, ns) => {
    const moved = !sameValue(ws.value, ns.value);
    return (typed
      ? "Answer-binding skips the proposal machinery entirely: the statement above is your words, recorded verbatim. "
      : "You chose one of the statements the card offered. It is recorded verbatim as the decision, and the row that records it is in the system's voice — the page wrote that sentence, so it is not attributed to you as something you said. ") +
           (moved && contradicts ? "It is not the same as what was proposed — that is allowed, and the correction chain records the swap. " : "") +
           (moved ? "" : "It is word for word the sentence already on the record, so the statement itself was not amended — the chain records that it was affirmed again, not that it changed. ") +
           (prior ? "It replaces what you chose before, which is still on the record and still in the room." : "");
  });

  /* the arrow states the verification the record moved through — round 8 wrote
     `proposed → accepted` as a literal, which is a claim about the state this
     object was in and not a reading of it (D2's class) */
  appendSystem(r, [`${o.kind} ${o.id} · ${prior ? "re-answered · " : ""}`,
                  say([wasVf, nowVf], (wv, nv) => !sameValue(wv.value, nv.value)
                    ? `${enumText(wv.value)} → ${enumText(nv.value)}`
                    : `${enumText(nv.value)} throughout`),
                  " · " +
                  (typed ? `recorded verbatim from ${S.me}'s typed answer` : `${S.me} chose: ${answer.label} · statement recorded verbatim, not worded by ${S.me}`) +
                  ` · nothing inferred`], o, vAcc || change);
  S.ui.bound = null; S.ui.replyTo = null; S.ui.pinOpen = null;
  S.ui.prefill = null;
  $("cinput").value = "";
  /* the record of this write, most specific first: the correction entry it just
     added to an open receipt, then the row it appended, then the object's item
     in the lens. FOCUS FOLLOWS THE RECORD. */
  focusAfter(S.ui.receiptId === o.id ? ".rc-sec .corr:last-of-type .lnk" : null,
             `[data-msg="${m.id}"] .tag`, `[data-msg="${m.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  scrollFeedToEnd();
  /* the toast says which kind of answer it was. Round 3 told you your wording
     was recorded verbatim even when the wording was the card's, not yours. */
  toast(say([wasSt, nowSt], (ws, ns) => sameValue(ws.value, ns.value)
    ? "re-affirmed · the same sentence is on the record, recorded again — the statement itself was not amended"
    : prior
      ? "re-answered · the earlier answer is now marked superseded, not deleted"
      : typed ? "recorded as a decision · answer-bound, your wording verbatim"
              : "recorded as a decision · the option you chose, recorded verbatim — the row is in the system's voice, not yours"));
}

/* --- A QUESTION'S RECORD IS ITS ANSWER, NOT ITS STATEMENT (round 9 D4) ----
 * The bound composer used to send every kind through answerDecision(), which
 * amends `statement` — so typing an answer to a question REWROTE THE QUESTION
 * and recorded the typist as having accepted it. A question is answered here
 * instead: `answer` is amended, the verification lands on `unverified` because
 * no sign-off is attached, and the objectives it blocks stay blocked.
 *
 * `label` is the card's option when the answer was chosen from one, and null
 * when the human typed it. That is the ONLY difference between the two, and it
 * is a difference about authorship: a chosen answer is recorded as a system row
 * in the system's voice, a typed one as the person's own message. Both record
 * the statement verbatim.
 * ----------------------------------------------------------------------- */
function answerQuestion(objectId, statement, provenanceNote, label) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  /* THE GUARD IS ON THE WRITE, NOT ONLY ON THE CONTROL (round 10 self-review).
     Both callers check first; this is the one that cannot be walked around by
     a control somebody forgets to gate, which is exactly how the feed row's
     Answer button came to have no check at all. */
  if (!canAnswer(o)) { toast(refusalFor(o), "bad"); return; }
  const t = tick();
  const typed = label == null;
  const blocked = o.objectives.length;
  const blocks = `${blocked} objective${blocked === 1 ? "" : "s"}`;
  const m = typed
    ? appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, origin: "typed",
        body: [statement], boundTo: o.id })
    : appendMessage(r, { id: nextId("m"), t, actor: "atrium", system: true, byMe: true, fresh: true,
        origin: "chosen", chosenBy: S.me, chosenLabel: label,
        body: [`${S.me} answered: ${label}`], boundTo: o.id,
        note: `statement recorded: ${statement} · chosen from the card's options, not typed — these are not ${S.me}'s words` });
  if (typed) S.typed.push(statement);
  const vAt2 = recordOf(o, "verification").length - 1;
  const aAt = recordOf(o, "answer").length - 1;
  /* THE ANSWER THAT WAS THE ANSWER STOPS BEING IT, AND THE RECORD SAYS WHEN
     (round 8 D4). The decision path has always stamped the row it supersedes;
     this one never did, so a superseded answer row printed "replaced · time
     not recorded" about a time the record was holding two fields away — the
     superseding row is stamped and `o.answerMsg` points straight at it. Same
     family as "was due undefined": a fallback painted over a fact. */
  const priorAns = o.answerMsg ? msg(r, o.answerMsg) : null;
  if (priorAns) { priorAns.supersededAt = t; priorAns.supersededBy = m.id; }
  const ac = amend(o, "answer", statement, { tm: t, by: S.me, how: typed ? "typed answer" : "chosen from the card" });
  o.answerLabel = label; o.answerMsg = m.id;
  o.answerVoice = typed ? "human" : "page";
  o.answeredBy = S.me; o.answeredAt = t + " today";
  o.resolvedAt = t; o.resolvedBy = S.me;
  /* answering it again ends the reopen — see the sign-off branch (round 8 D3) */
  o.reopenedAt = null;
  const vc3 = amend(o, "verification", "unverified", { tm: t, by: S.me, how: "answered" });
  o.owedTo = null;
  const sc2 = amend(o, "settlement", null, { tm: t, by: S.me, how: "answered" });
  /* ONE READ, AND EVERY SURFACE THIS TRANSITION NARRATES IS WRITTEN FROM IT
     (round 9 D1). `wasV` was captured off the object and pasted into the
     header; "still blocks" and "recorded:" were composed from the card. */
  const rd = reads(o, [{ of: "answer", at: aAt }, "answer",
                       { of: "verification", at: vAt2 }, "verification"]);
  const wasA = rd[0], nowA = rd[1], wasV2 = rd[2], nowV2 = rd[3];
  const aMoved = !sameValue(wasA.value, nowA.value);
  /* the answer is the human's characters only when the human typed them — the
     same rule the decision path applies to a statement (round 5 D4) */
  const ansFrag = v => (typed ? human(recordedLabel(v.value)) : recordedLabel(v.value));
  const chose = typed ? `typed the answer` : `chose the answer ${label} from the card`;
  o.corrections.push({
    hd: say([wasA, nowA, wasV2, nowV2], (wa, na, wv, nv) =>
      (priorAns ? "RE-ANSWERED · " : "ANSWERED · ") +
      (!sameValue(wv.value, nv.value) ? enumLabel(wv.value) + " → " + enumLabel(nv.value)
                                      : enumLabel(nv.value) + " THROUGHOUT") +
      (!sameValue(wa.value, na.value) ? "" : " · THE SAME ANSWER, RECORDED AGAIN")),
    who: S.me, tm: t,
    /* "NOTHING WAS ON THE RECORD AS ITS ANSWER" IS A CLAIM ABOUT THE RECORD
       (round 8 D1). Round 8 painted it as a literal, so re-answering a
       question rendered it at 09:15 while the answer field had held its value
       continuously since 09:13 — and the minted `change` sitting beside it
       was about `settlement`, so the checker read a true pair and never saw
       the false sentence. The answer history is what knows. */
    was: say([wasA], a => a.value == null
      ? "Open question — nothing was on the record as its answer"
      : "Answer of record" + (a.tm ? " from " + a.tm : "") + ": " + a.value),
    after: say([nowA], a => aMoved ? ansFrag(a)
      : "recorded again, verbatim — nothing about the answer changed"),
    change: ac || sc2,
    fact: say([wasA, nowA, nowV2], (wa, na, nv) =>
      (!sameValue(wa.value, na.value) ? `answered by ${S.me} at ${t} · ` : `re-recorded by ${S.me} at ${t} · the answer itself was not amended · `) +
      (typed ? "typed — your own words are the answer of record" : `chosen: ${label} — the page wrote the sentence, ${S.me} chose it`) +
      ` · no sign-off is attached, so the answer is on the record and ${enumText(nv.value)}`),
    msg: o.sourceMsg || m.id, room: sourceRoomOf(o),
    link: say([nowA], () => "the question is still in the room →")
  });
  o.facts = ["answered by " + S.me + " " + t,
             say([nowA], a => ["recorded: ", ansFrag(a)]),
             "no sign-off attached", "still blocks " + blocks];
  o.history.push({ k: "question", who: S.me, tm: t,
    text: say([wasA, nowA, nowV2], (wa, na, nv) => [
      /* THE CLAIM IS SCOPED TO THE FIELD IT READ (round 10 self-review). "so
         nothing was amended" was absolute, and re-answering after a reopen
         moves the verification and the settlement in the same tick — so one
         sentence denied an amendment the header beside it correctly announced.
         A sentence written from one field may only make a claim about that
         field, and the other field it names is read too. */
      `${chose} — ` +
      (!sameValue(wa.value, na.value)
        ? (typed ? "it is on the record verbatim, in your own words: "
                 : `the statement it carries was recorded verbatim and none of it is worded by ${S.me}: `)
        : "it is word for word the answer already on the record, so the answer itself was not amended: "),
      ansFrag(na), ` · ${enumText(nv.value)}`]) });
  o.provenance.unshift(typed
    ? { who: S.me, tm: t, msg: m.id, ex: statement, note: provenanceNote }
    : { who: "atrium", tm: t, msg: m.id, voice: "system",
        ex: `${S.me} answered: ${label} — statement recorded: ${statement}`, note: provenanceNote });
  o.note = say([nowV2], v =>
    (typed
      ? "The answer above is your own sentence, recorded verbatim as the answer of record. "
      : "The answer above is the statement the card carried, recorded verbatim, and the row that records it is in the system's voice — the page wrote that sentence, so it is not attributed to you as something you said. ") +
    `Answering a question is not the same as verifying the answer. It is ${enumText(v.value)} until a sign-off is attached, which is why the objectives it blocks are still blocked.`);
  /* the arrow is the verification the record moved through, not a literal
     "open →" that a re-answer would have made false (D2) */
  const sys = appendSystem(r, [`question ${o.id} · `,
          say([wasV2, nowV2], (wv, nv) => !sameValue(wv.value, nv.value)
            ? `${enumText(wv.value)} → ${enumText(nv.value)}`
            : `${enumText(nv.value)} throughout`),
          ` · ${priorAns ? "re-answered" : "answered"} by ${S.me} · ` +
          (typed ? `recorded verbatim from ${S.me}'s typed answer` : `${S.me} chose: ${label} · statement recorded verbatim, not worded by ${S.me}`) +
          ` · unverified (no sign-off attached) · still blocking ${blocks}`],
          /* the row's arrow paints the VERIFICATION move, so the verification
             change is the one that travels with it */
          o, vc3 || ac || sc2);
  o.fresh = true;
  S.ui.bound = null; S.ui.replyTo = null; S.ui.about = null; S.ui.pinOpen = null; S.ui.prefill = null;
  $("cinput").value = "";
  focusAfter(S.ui.receiptId === o.id ? ".rc-sec .corr:last-of-type .lnk" : null,
             `[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  scrollFeedToEnd();
  /* "stays ~ with no sign-off" is a claim about the verification, and round 10
     minted it from two reads of the answer (round 11 D1's class) */
  toast(say([wasA, nowA, nowV2], (wa, na, nv) => !sameValue(wa.value, na.value)
    ? (typed ? `answered · your wording is the answer of record · it stays ${enumText(nv.value)} with no sign-off, and still blocks ${blocks}`
             : `answered · the card's statement recorded verbatim in the system's voice · it stays ${enumText(nv.value)} with no sign-off, and still blocks ${blocks}`)
    : `re-recorded · it is the answer already on the record, so the answer itself was not amended · still blocks ${blocks}`), "warn");
}

/* --- B2: reopen re-renders EVERYTHING, including the historical row ------
 *
 * ROUND 3'S CARDINAL DEFECT LIVED HERE. This function used to write a canned
 * first-person sentence — "Reopening — the evidence under this was never
 * checked…" — into the correction chain, where the receipt rendered it in <q>
 * under the actor's name and time. Nobody said it. It was also false in
 * context: it asserted an evidence concern after an answer about cutover
 * timing.
 *
 * What replaces it: the correction states what the page actually knows, in
 * system voice (`was → after` plus a `fact` line), and the human is *offered*
 * the chance to say why. If they type a reason it is quoted as theirs, tagged
 * with its provenance, and provable. If they do not — and empty is fine — the
 * entry simply carries no quotation. The page never speaks for anyone.
 * ----------------------------------------------------------------------- */

/* which objects can be reopened. BRIEF §5: an item you settled carries the
   affordance, and "settled" includes a question you answered and a commitment
   you signed off — round 3 only offered it on accepted/verified. */
function canReopen(o) {
  if (needsYou(o)) return false;
  return o.verification === "accepted" || o.verification === "verified" || !!o.resolvedAt;
}

/* the reopen states, per kind — all of them land somewhere with an action path */
const REOPEN_TO = { decision: "proposed", question: "open", commitment: "self_reported", claim: "unverified" };

/* --- WHO OWES IT AGAIN (round 4 D5) --------------------------------------
 * Reopening undoes a state. It does not transfer ownership, and round 4 made it
 * do exactly that: `o.owedTo = S.me` unconditionally, so reopening justin's
 * commitment K0 moved it onto YOUR list, offered you "Mark signed off", and —
 * if you took it — rewrote its facts to your name and asserted "You signed your
 * own sign-off" in a receipt that still named justin as the claimant.
 *
 * A commitment goes back to whoever owed it. A decision or question goes back
 * to whoever settled it. When that is not you it does not join your list at
 * all, and the toast says whose it is instead of pretending it is yours.
 * ---------------------------------------------------------------------- */
function reopenOwner(o) {
  if (o.kind === "claim") return null;                 // a reopened claim owes nobody an answer
  if (o.kind === "commitment") return o.owner || o.claimant || null;
  return o.resolvedBy || o.acceptedBy || o.assignee || o.owedTo || o.claimant || null;
}

function reopen(objectId, reason) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();
  const from = o.verification;
  const wasResolved = !!o.resolvedAt;
  /* WHEN THE STATE BEING PRESERVED WAS ACTUALLY REACHED (round 6 minor).
     Captured BEFORE the mutation, because `o.reopenedAt` is about to be set and
     `o.resolvedAt` is about to be cleared. Round 6's note fell through to
     `o.reopenedAt` and so read "the state at 09:14 is still in the
     conversation" under a correction header dated 09:14 for the reopen itself —
     the record timestamping a preserved state with the moment it was undone. */
  const settledAt = o.acceptedAt || o.verifiedAt || o.answeredAt || o.resolvedAt || null;
  /* where the verification stands before this write — the entry below reads its
     "was" back out of the history at this index (round 8 D1) */
  const vAt = recordOf(o, "verification").length - 1;
  const sAt2 = recordOf(o, "settlement").length - 1;
  /* and where the thing being PRESERVED stands — a reopen's whole claim is that
     what was on the record stays on it, and round 10 made that claim about a
     field it never opened (round 11 D3) */
  const aAt = recordOf(o, "answer").length - 1;
  const stAt = recordOf(o, "statement").length - 1;
  const vChange = amend(o, "verification", REOPEN_TO[o.kind] || "unverified", { tm: t, by: S.me, how: "reopened" });
  o.reopenedAt = t;
  o.resolvedAt = null;
  /* the fact a reopen always changes, even when the verification enum does not:
     it stopped being settled. Derived, so amend() reads it back rather than
     being told — see RECORDED.settlement. */
  const sChange = amend(o, "settlement", null, { tm: t, by: S.me, how: "reopened" });
  o.fresh = true;

  /* a reopened decision, question or commitment owes SOMEONE an answer again —
     whoever owned it, which is not automatically you. A reopened claim owes
     nobody one; it is simply unverified. */
  const back = reopenOwner(o);
  const owed = !!back;
  o.owedTo = back;
  if (owed) o.priority = o.priority || (o.kind === "decision" ? 20 : 12);
  if (o.kind === "decision" && (!o.options || !o.options.length)) {
    /* NO DEAD ATTENTION ITEMS. Options that existed survive the reopen. A
       decision that never carried options gets the one option that is not
       invented — re-affirming the statement already on the record — plus the
       bound composer, which pinActions() offers on every pending decision.

       `agrees: true` IS NOT A DETAIL (round 6 D1). A re-affirmation is the
       proposal, by construction: its statement is `o.text`, verbatim. Round 6
       left the flag off, `answerDecision`'s `!answer.agrees` read `!undefined`
       as a departure, and the correction chain then asserted that two
       byte-identical sentences differed. That is round 4's D7 arriving back
       through the fallback round 4 itself added — which is why the relationship
       is now ASSERTED by checkAnswerIdentityInvariant() instead of trusted to
       a literal, and why answerDecision derives "did it change" from the two
       strings rather than from this flag alone. */
    o.options = [{ label: "Re-affirm the prior call", statement: o.text, synthesized: true, agrees: true }];
  }
  if (o.kind === "commitment" && o.priorOverdue) o.overdue = o.priorOverdue;

  /* the label names the object's OWN kind. Round 4's table hard-coded
     "Verified claim" for every verified object, so reopening a verified
     COMMITMENT (K0) recorded that a claim had been reopened. The state it
     names is READ back out of the verification history at the point this
     transition started from, so the sentence and the record cannot disagree
     about what was being undone (round 8 D1). */
  const stateLabel = v => ({ accepted: "Accepted " + o.kind,
                     verified: "Verified " + o.kind,
                     unverified: o.kind === "question" ? "Answered question" : "Unverified " + o.kind,
                     self_reported: o.kind === "commitment" ? "Signed off, self-reported" : "Self-reported " + o.kind,
                     proposed: "Proposed " + o.kind,
                     open: "Open " + o.kind }[v] || enumText(v));
  /* ONE READ, AND EVERY SURFACE THIS TRANSITION NARRATES IS WRITTEN FROM IT
     (round 9 D1). `from`, `vChanged` and `o.verification` were read off the
     object beside the record and pasted into the header, the permanent row and
     the toast; only the two chain operands were reads. */
  const rd = reads(o, [{ of: "verification", at: vAt }, "verification",
                       { of: "settlement", at: sAt2 }, "settlement"]);
  const wasVr = rd[0], nowVr = rd[1], wasSr = rd[2], nowSr = rd[3];
  const wasLabel = say([wasVr], v => stateLabel(v.value));
  /* AND WHAT IS BEING PRESERVED IS READ TOO. Each kind's "prior X kept" clause
     is a claim about one particular recorded field, so it is written from that
     field: a commitment nobody ever signed off does not get a sentence about a
     preserved sign-off, and a claim nobody ever checked does not get one about
     a preserved verification. Round 8 painted both of those unconditionally in
     the sign-off and verify entries, two rows below the record contradicting
     them. */
  /* WHAT IS PRESERVED IS NAMED BY THE RECORD, NOT BY THE KIND (round 11 D3).
     `settlement.ever("settled")` answers WHETHER it settled. It cannot answer
     HOW, and round 10 printed the second question's answer from the first
     one's: K0 is a commitment a deploy record VERIFIED and nobody has ever
     signed off, and its reopen said "the prior sign-off preserved on the
     record" — a claim about how it settled, minted from whether it settled,
     one kind-keyed table away from the truth. The word comes out of the
     verification value standing when this transition started, which is the
     same read `wasLabel` prints as "Verified commitment" two spans to the
     left, so the two halves of one sentence cannot disagree. */
  /* AND THE BRANCH THAT COULD ONLY EVER SAY ONE THING IS GONE (round 11 D3).
     Round 10 keyed the "what is preserved" clause off the object's kind and
     then tested `p.value == null` on a field that, for a decision, is the
     statement — never null. One arm of that branch was structurally
     unreachable, which is line 201's missing `case` wearing an if/else. The
     question "was anything ever settled here" is asked of the settlement
     history, and the answer names itself out of the verification standing at
     the time, with the moment and the person the settlement itself records. */
  /* the field this kind keeps its answer of record in — a question's `answer`,
     a decision's `statement`. Round 11's first pass read BOTH so that whichever
     noun `preservedName` produced would be backed by a read; the read mutation
     then showed the unused one for what it was, a claim the checkers verify on
     the sentence's behalf for nothing. One field, and it is used. */
  const wasContent = o.kind === "question" ? fieldView(o, "answer", aAt)
                   : o.kind === "decision" ? fieldView(o, "statement", stAt) : null;
  /* AND THE CLAUSE ABOUT WHAT IS PRESERVED LEAVES THE `after` OPERAND. An
     operand asserts ONE END of the amendment — that is what lets round 7's
     clause hold each side to the change it carries — so a sentence about the
     state being undone cannot live in the side that describes the state now.
     It belongs to the entry's prose line, which narrates the whole transition.
     Round 10 had it in the `after`, where it was constrained to say something
     about the after value while talking about the before one. */
  /* ONE VIEW DECIDES WHAT IS PRESERVED, AND IT IS THE FIELD THAT HOLDS IT.
     Where the record keeps CONTENT for this kind — a question's answer, a
     decision's statement — that is what a reopen preserves and that is what the
     sentence reads. Where it does not, what is preserved is the state, named
     out of the verification standing when the transition began. Reading both
     and naming one is how `preservedName` came to turn an `unverified`
     verification into the word "answer" — a noun belonging to another field —
     in a sentence that never opened it (round 11 self-review). */
  const keptView = wasContent || wasVr;
  const keptShort = (s, k) => !s.ever("settled") ? "nothing had settled it"
    : k.of === "verification" ? preservedName(k.value) + " kept"
    : k.value != null ? k.of + " kept" : "no " + k.of + " on the record";
  const keptClause = (s, k) => {
    const at = s.last("settled");
    if (!at) return "nothing had settled it";
    return k.of === "verification"
      ? "the " + preservedName(k.value) + (at.by ? " by " + at.by : "") + (at.tm ? " at " + at.tm : "") +
        " stays on the record"
      : k.value != null
        ? "the " + k.of + " on the record" + (k.tm ? ", recorded at " + k.tm + "," : "") + " stays on it"
        : "nothing is recorded as its " + k.of;
  };
  const nowLabel = say([nowVr, nowSr], (v, s) => {
    /* "pending again" is a claim that this record has stood pending BEFORE,
       and it is false the first time (round 11 D4). The query is asked in the
       branch that uses it — a table literal computes every arm, so asking it
       for all four kinds and discarding three answers is a query that could not
       have changed the sentence, which is the eighth door this round found in
       its own fix. */
    /* and every head is produced by the state the record now holds, not by a
       table keyed on the kind: "Awaiting sign-off" is a claim about the
       verification, and a literal cannot be one (round 11 self-review) */
    const head = o.kind === "decision" ? "Pending" + (s.before("pending") ? " again" : "")
               : o.kind === "commitment" ? "Awaiting " + preservedName(v.value)
               : enumText(v.value).replace(/^./, c => c.toUpperCase()) + " " + o.kind;
    return head + (owed && back !== S.me ? ` · back to ${back}, not to ${S.me}` : "");
  });

  /* AND THE CHIP FOR THE SAME TRANSITION SAYS THE SAME THING (round 11 D3).
     Round 10's chain entry read `settlement.ever("settled")` and its lens chip
     branched on `wasResolved || o.answerMsg` — one transition, two surfaces,
     two predicates, opposite claims about the same click. Both are minted from
     the views this transition read. */
  o.facts = [say([nowVr], () => "reopened by " + S.me + " " + t),
             say([wasSr, keptView], keptShort),
             say([nowVr, nowSr], (v, s) => !owed
               ? enumText(v.value) + (v.before(v.value) ? " again" : "")
               : enumText(s.value) + (s.before(s.value) ? " again" : "") + (back === S.me ? "" : " · " + back + "'s"))]
    .concat(sourceRoomOf(o) ? ["source in #" + o.sourceRoom] : []);
  /* system voice: what happened, not what anyone said about it — and what it
     says moved is read out of the record rather than asserted beside it, so the
     first thing in the receipt cannot narrate a move the chain denies (D1a) */
  o.history.push({ k: "gate", who: S.me, tm: t,
    text: say([wasVr, nowVr, wasSr, nowSr], (wv, nv, ws, ns) =>
      "reopened it · " +
      (!sameValue(wv.value, nv.value)
        ? enumText(wv.value) + " became " + enumText(nv.value)
        : enumText(nv.value) + " throughout") +
      (!sameValue(ws.value, ns.value) ? ", and it is no longer settled" : ", and it was not settled") +
      /* "the prior state is kept" was a quantifier over a history nothing here
         asked (round 11). What this clause can honestly point at is the entry
         directly below it, which carries the state it came from as a record
         read of its own — a structural fact about the chain, not a claim about
         everything the field has ever held. */
      " · the state it came from is in the chain below, and it stays reachable from here") });

  /* A TRANSITION HEADER NAMES WHAT MOVED (round 6 minor). Reopening a
     signed-off commitment puts back `self_reported` — the verification it
     already had — so round 6's header read `SELF-REPORTED → SELF_REPORTED`:
     a prettifier applied to one side, and an arrow claiming a verification
     change that did not happen. What changed there is that it stopped being
     settled, and that is what the header now says. */
  const c = {
    /* and the header is a record read, so no branch of it can name a state the
       object was not in or a settlement it did not lose (round 9 D1b) */
    hd: say([wasVr, nowVr, wasSr, nowSr], (wv, nv, ws, ns) => "REOPENED · " +
      (!sameValue(wv.value, nv.value)
        ? enumLabel(wv.value) + " → " + enumLabel(nv.value)
        : enumLabel(nv.value) + " THROUGHOUT · " +
          (!sameValue(ws.value, ns.value) ? "NO LONGER SETTLED" : "AND IT WAS NOT SETTLED"))),
    who: S.me, tm: t,
    was: wasLabel,
    after: nowLabel,
    /* WHAT THE ENTRY ASSERTS IS THE RECORDED MOVE; `wasLabel` and `nowLabel` are
       the sentences that describe it. Round 7 put the two LABELS in the change —
       page-composed prose, derived from the enum and the kind, that the object
       never held as a value. They differed, so the check passed; they were still
       not the record. The change is the enum the object actually moved through,
       or — when the enum did not move — the settlement it lost. */
    change: vChange || sChange,
    fact: say([nowVr, wasSr, nowSr, keptView],
      (v, ws, ns, k) => `reopened by ${S.me} at ${t} · now ${enumText(v.value)}` +
      (!sameValue(ws.value, ns.value) ? " and no longer settled" : "") +
      " · " + keptClause(ws, k) +
      (reason ? "" : " · no reason given, and none was invented")),
    msg: o.answerMsg || o.sourceMsg || (o.provenance[0] && o.provenance[0].msg) || null,
    room: o.answerMsg ? null : sourceRoomOf(o),
    link: say(wasContent ? [wasContent] : [], c => o.answerMsg && c && c.everSet()
      ? `the ${c.of} on the record is still in the room →` : "the source is still in the room →")
  };
  /* the ONLY quotation this transition can produce: words the human typed into
     the reason field a moment ago, registered in the human-speech register. */
  if (reason) { S.typed.push(reason); c.quote = { text: reason, by: S.me, src: "typed" }; }
  o.corrections.push(c);

  o.note = say([nowVr], () => "Reopening is append-only. The state " +
           (settledAt ? "reached at " + settledAt : "it was settled in — no time was ever recorded for it —") +
           " is still in the conversation, still in this history, and the row that carried it re-renders to say so. " +
           (owed && back !== S.me
             ? `It went back to ${back}, who owed it — reopening undoes a state, it does not move ownership onto you. `
             : "") +
           (reason ? "The reason above is your own sentence, recorded verbatim."
                   : "No reason was given, and the page does not write one for you."));

  /* THE PERMANENT ROW IS THE RECORD, AND IT GETS THE SAME RULE AS THE HEADER
     (round 8 D2). Round 6 fixed `SELF-REPORTED → SELF_REPORTED` in the
     correction-chain header — an arrow with identical sides asserting a change
     that did not happen, in two spellings — and left this line, which is the
     one that goes into the conversation and stays there, writing
     `self_reported → self_reported` in raw snake_case. Same branch, same
     prettifier, and the minted change travels with the row so
     checkRenderedRecordInvariant() can hold a painted arrow to the record. */
  const sys = appendSystem(r, [`${o.kind} ${o.id} · `,
                  say([wasVr, nowVr, wasSr, nowSr], (wv, nv, ws, ns) =>
                    !sameValue(wv.value, nv.value)
                      ? `${enumText(wv.value)} → ${enumText(nv.value)}`
                      : `${enumText(nv.value)} throughout · ` +
                        (!sameValue(ws.value, ns.value) ? "no longer settled" : "and it was not settled")),
                  ` · reopened by ${S.me}` +
                  (owed && back !== S.me ? ` · back to ${back}, whose it is` : "") +
                  (reason ? " · reason recorded" : " · no reason given") + " · ",
                  say([wasSr, keptView], keptShort)],
                  o, vChange || sChange);
  S.ui.reopening = null;
  /* the reopen is normally driven from the receipt, and the receipt stays open —
     so the record of this write is the correction entry that was just appended
     to the chain the reader is already looking at. */
  focusAfter(S.ui.receiptId === o.id ? ".rc-sec .corr:last-of-type .lnk" : null,
             S.ui.receiptId === o.id ? "#rcBack" : null,
             `[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  /* the toast reports what actually happened to THIS object, not a fixed line —
     including, since round 4's D5, whose list it landed on when it is not yours */
  /* and "again" is a query, not a suffix, and "a"/"an" is decided by the word
     the record produced rather than typed in front of it (round 11 D4/minor) */
  toast(say([nowVr, wasSr, keptView], (v, s, k) => {
    const kept = keptShort(s, k) + (s.ever("settled") ? " on the record" : "");
    return needsYou(o)
      ? `reopened · back in Needs you as ${an(enumText(v.value))} ${o.kind} · ${kept}`
      : owed
        ? `reopened · back to ${back} as ${an(enumText(v.value))} ${o.kind} · ${kept} — it is not yours, so it did not join your list`
        : `reopened · it is ${an(enumText(v.value))} ${o.kind}${v.before(v.value) ? " again" : ""} · ${kept} — it owes nobody a reply, so nothing was added to your list`;
  }), "warn");
}

/* the optional reason prompt. Empty is fine and says so: a reason you did not
   give is not a reason the page may supply. */
function reopenBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  box.dataset.prompt = "reopen";            // see verifyBox: round 5 D1
  box.innerHTML =
    `<div class="hd"><span class="lbl">REOPEN THIS ${esc(o.kind.toUpperCase())}</span></div>
     <div class="row">
       <input id="rinput" type="text" aria-label="Reason for reopening (optional)" placeholder="why are you reopening it? (optional — recorded as your words, verbatim)">
       <button class="btn sm" id="rgo">Reopen</button>
       <button class="btn ghost sm" id="rcancel">Cancel</button>
     </div>
     <div class="hint">Leave it empty if you like. The correction chain records the state change either way, in the system's voice — nothing is ever written in yours.</div>`;
  box.querySelector("#rgo").addEventListener("click", () => reopen(o.id, box.querySelector("#rinput").value.trim()));
  /* and this one back onto Reopen, which is where it came from (D3) */
  const closeReopen = () => { S.ui.reopening = null; focusOn("#rcReopen", "#rcBack"); render(); };
  box.querySelector("#rcancel").addEventListener("click", closeReopen);
  box.querySelector("#rinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); reopen(o.id, e.target.value.trim()); }
    if (e.key === "Escape") closeReopen();
  });
  return box;
}

/* --- the ~ → ✓ pair ----------------------------------------------------- */
function doVerify(objectId, evidence) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  if (!evidence) { toast("verification needs a note — green means something checked it, and this records what", "bad"); focusVerify(); return; }
  if (o.claimant === S.me) { toast("you cannot verify your own claim — that is what ~ is for", "bad"); return; }
  const t = tick();
  const vAt = recordOf(o, "verification").length - 1;
  const sAt3 = recordOf(o, "settlement").length - 1;
  const vChange = amend(o, "verification", "verified", { tm: t, by: S.me, how: "verified" });
  o.reopenedAt = null;                    // it is settled again (round 8 D3)
  o.verifiedBy = S.me;
  o.verifiedAt = t + " today";
  const sChange = amend(o, "settlement", null, { tm: t, by: S.me, how: "verified" });
  o.evidence = evidence;
  o.fresh = true;
  /* ONE READ, AND EVERY SURFACE THIS TRANSITION NARRATES IS WRITTEN FROM IT
     (round 9 D1). `from` was captured off the object and pasted into the header
     and the permanent row. */
  const rd = reads(o, [{ of: "verification", at: vAt }, "verification",
                       { of: "settlement", at: sAt3 }, "settlement"]);
  const wasVv = rd[0], nowVv = rd[1], wasSv = rd[2], nowSv = rd[3];
  /* the evidence note is the verifier's own sentence, and it travels marked as
     theirs into every place it is rendered (round 5 D4) */
  o.facts = [o.claimant, say([nowVv], v => enumText(v.value) + " by " + S.me + " " + t), human(evidence)];
  /* AND THIS LINE STARTS WITH A VERB, LIKE EVERY OTHER ONE IN THE SECTION
     (round 11 minor). WHAT HAPPENED renders the actor in its own column, so
     round 10's line read "lars unverified became verified and it is settled
     again" — the only sentence in the receipt with no verb in it.
     AND "again" IS A QUERY (round 11 D4). It was appended on the strength of
     "the settlement moved", so a first settlement — C3's history is
     ["pending","settled"] — was announced as a repeat. Whether the record has
     stood here before is a question for the history, asked of both fields the
     sentence names. */
  o.history.push({ k: "verified", who: S.me, tm: t,
    text: say([wasVv, nowVv, wasSv, nowSv], (wv, nv, ws, ns) => [
      "checked it" + (nv.before("verified") ? " again" : "") + " — " +
      (!sameValue(wv.value, nv.value) ? enumText(wv.value) + " became " + enumText(nv.value)
                                      : enumText(nv.value) + " throughout") +
      (!sameValue(ws.value, ns.value) ? (ns.before("settled") ? " and it is settled again" : " and it is settled now") : "") +
      " · attached evidence: ", human(evidence)]) });
  S.typed.push(evidence);      // your evidence note is your words, so it is quotable
  o.provenance.unshift({ who: S.me, tm: t, msg: null, ex: evidence,
    note: `verification note · attached by ${S.me} · the claimant did not check their own claim` });
  /* A VERIFICATION AMENDS A RECORDED FIELD, SO IT IS IN THE CHAIN (round 7 D5,
     same class). WHAT HAPPENED said the claim had been checked; the chain, forty
     pixels below, said the object had never been amended. */
  o.corrections.push({
    /* the header is a record read, so "VERIFIED · X → Y" is produced by the
       branch that compared the two states rather than pasted beside them (D1b) */
    hd: say([wasVv, nowVv, wasSv, nowSv], (wv, nv, ws, ns) => "VERIFIED · " +
