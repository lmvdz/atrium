<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atrium v1 — three-surface app frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===========================================================================
 * TOKENS — mirrored verbatim from design/tokens.css.
 * Duplicated here (not linked) only because this prototype must open as a
 * single self-contained file. design/tokens.css remains the source of truth;
 * if these drift, tokens.css wins. No hex appears anywhere below this block.
 * ======================================================================== */

/* light — warm paper (default) */
:root {
  --bg0: #E6E2DA; --bg1: #F4F1EA; --bg2: #ECE8DF; --bg3: #FAF8F3;
  --bg4: #EAE5DA; --bg5: #E2DCCF; --bg6: #DDD6C8; --bg7: #EFEAE0;

  --line: #D4CDBD; --line2: #C8C1B4; --line3: #B0A896;

  --tx0: #171A18; --tx1: #3A362E; --tx2: #57534A; --tx3: #7D7666; --tx4: #A39B89;

  --grn: #4E9161; --grn2: #3E7B52; --grn3: #5B8A6B;
  --grnbd: #9DC4A8; --grnbg: #E3EDE2; --grnav: #CBE0CE;

  --amb: #B07D2A; --amb2: #8A6220; --ambbd: #D9B36A; --ambbd2: #E3C88F;
  --ambbg: #F5E9CD; --ambbg2: #F0E2C2; --ambbg3: #EBDAB1; --ambbg4: #EFDFB9; --ambbg5: #F6EDDA;

  --red: #B3402E; --red2: #A63A28; --red3: #8F3222;
  --redbd: #DBA090; --redbg: #F6DFD7; --redbg2: #F1D3CA; --redbg3: #E4B8AC;

  --blu: #3D6BB3; --blu2: #2F5590; --blu3: #8A97AC;
  --replybg: #DFE7F2; --filebg: #DFE9F4; --filebd: #B7CCE4;

  /* call-era — unused in v1, kept for Phase 4 */
  --live: #9BB3A0; --strip: #173A32;
  --stile: rgba(244,241,234,.10); --stileac: #F4F1EA; --stbd: rgba(244,241,234,.25);
  --stx: #C9D6CB; --stxac: #173A32;
}

/* dark — near-black (opt-in via `atr-dark` on <html>) */
html.atr-dark {
  --bg0: #0a0b0c; --bg1: #0c0d0f; --bg2: #0b0c0e; --bg3: #0d0f10;
  --bg4: #101214; --bg5: #15181b; --bg6: #1a1d21; --bg7: #0e1012;

  --line: #1f2226; --line2: #2a2e33; --line3: #3a3f45;

  --tx0: #e8eaec; --tx1: #c9ced3; --tx2: #9aa1a8; --tx3: #6d747c; --tx4: #575e66;

  --grn: #5CB27A; --grn2: #4EA76B; --grn3: #6FA383;
  --grnbd: #2E5A40; --grnbg: #14261B; --grnav: #1E3A2A;

  --amb: #C99A3F; --amb2: #E0C077; --ambbd: #6E5320; --ambbd2: #57431C;
  --ambbg: #221C0E; --ambbg2: #2A2210; --ambbg3: #332A14; --ambbg4: #332A14; --ambbg5: #201A0E;

  --red: #D4604A; --red2: #C25340; --red3: #E06A52;
  --redbd: #6E3427; --redbg: #261311; --redbg2: #2E1714; --redbg3: #57271E;

  --blu: #8AB4F8; --blu2: #AECBFA; --blu3: #6B89B3;
  --replybg: #1C2836; --filebg: #16222f; --filebd: #24435f;

  /* call-era — unused in v1, kept for Phase 4 */
  --live: #3E5748; --strip: #0E1A15;
  --stile: #16241D; --stileac: #1E3A2A; --stbd: #2E5A40;
  --stx: #7FA98A; --stxac: #5CB27A;
}

/* ===========================================================================
 * COLOR USAGE RULES (round 2)
 *
 *   TEXT never uses --tx3 or --tx4. Measured against every surface it lands
 *   on, --tx3 tops out at 4.25:1 and --tx4 at 2.60:1 in the light theme — both
 *   under AA for the 10–12.5px sizes this shell is built from. The whole page
 *   therefore reads on --tx0 / --tx1 / --tx2 only (--tx2 is 5.61–7.22:1 light,
 *   6.82–7.54:1 dark). --tx3 and --tx4 are consequently not referenced anywhere
 *   below this block — grep them and you find their definitions and nothing
 *   else. Quiet-but-legible is done with the mono/sans split and --line*,
 *   not with a grey a third of readers cannot resolve.
 *
 *   Amber and green foregrounds use --amb2 / --grn2, not --amb / --grn: the
 *   bare names measure 2.64–3.57:1 in light and cannot carry text. Amber text
 *   is only ever placed on --bg1 / --bg3 / --bg7 / --ambbg / --ambbg5 (4.53+).
 *   Green text on a green fill fails, so green chips carry --tx1 on --grnbg
 *   with a --grnbd border — the hue rides the border, the contrast rides tx1.
 *
 *   The amber button is --amb2 fill (bg3-on-amb2 = 5.14 light / 10.96 dark),
 *   which is also why it no longer needs a per-theme override.
 *
 *   TYPE FLOOR: nothing below 10px. LABEL IDIOM: exactly one — 10px / .14em /
 *   uppercase / mono. Round 2 claimed `letter-spacing` appeared nowhere but
 *   `.lbl`; it appeared in nine other rules. It is now declared exactly once,
 *   in the grouped rule below, for every element that wears the label idiom.
 *   Exactly one rule in this stylesheet sets it; the rest inherit the idiom.
 * ======================================================================== */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg0);
  color: var(--tx1);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 12.5px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--line3); outline-offset: 1px; border-radius: 3px; }
::selection { background: var(--ambbg3); color: var(--tx0); }

.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

/* THE ONLY `letter-spacing` DECLARATION IN THIS STYLESHEET.
   Every element that wears the label idiom is listed here; nothing else is
   tracked. Round 2's comment claimed this and nine other rules contradicted it. */
.lbl, .surf .lbl, .pin-head .fold, .acard .why::before,
.st, .rc-back, .corr .hd, .empty, .ctxbar b { letter-spacing: .14em; }

/* the single label idiom: 10px / .14em / written uppercase */
.lbl {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  color: var(--tx2);
  line-height: 1;
}
/* machine metadata — mono, 10px, no tracking (tracking belongs to labels only) */
.meta {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px;
  color: var(--tx2);
}

.scroll { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.scroll::-webkit-scrollbar { width: 9px; height: 9px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--line2); border: 3px solid transparent; background-clip: content-box; border-radius: 9px; }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--line3); background-clip: content-box; }

/* ===========================================================================
 * MOTION — three keyframes, per design/CONVENTIONS.md.
 * JS-driven scrolling consults the same media query (see reduceMotion() ).
 * ======================================================================== */
/* gl-blink is NOT DEFINED HERE, deliberately. CONVENTIONS assigns it to live and
   recording indicators only, and Atrium v1 has no live surface — the call strip
   arrives in Phase 4 alongside the `--live` token family that tokens.css already
   keeps under a marked, unconsumed section. Round 6 defined the keyframe, used
   it nowhere, and drove the one dot on the page off gl-pulse in verified green,
   so the file carried a rule it did not follow and a colour it had not earned.
   The rule is followed by having nothing to break: an animation this file does
   not use is an animation this file does not define. */
@keyframes gl-pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@keyframes gl-rise  { from { opacity: 0; transform: translateY(2px) } to { opacity: 1; transform: none } }
/* `backwards`, never `both` — CONVENTIONS § Animation fill mode forbids `both`
   by name, and this file is the spec the component library implements, whose
   e2e asserts exactly this rule. `both` keeps the keyframes' final `opacity: 1`
   applied FOREVER after the animation ends, so every later declaration on a
   `.rise` element — a dim, a filter treatment, a state style — is silently
   overridden by an animation that finished 200ms ago. Proved live on round 7:
   an `opacity: .3` declaration on a `.rise` element computed to `1`.
   `backwards` keeps what the fill mode is actually for: the from-state applies
   during the delay, so nothing flashes at full opacity before it rises. */
.rise  { animation: gl-rise .2s ease backwards; }
.rise-s { animation: gl-rise .15s ease backwards; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===========================================================================
 * FRAME
 * ======================================================================== */

.app {
  display: grid;
  grid-template-columns: 52px 234px minmax(560px, 1fr) 376px;
  height: 100vh;
  min-width: 1120px;
}
/* grid and flex items default to min-width:auto, which lets a long mono line
   push a column past its track and paint over its neighbour. Every track in
   this shell is authoritative; content ellipsises or wraps inside it. */
.app > *, .center > * { min-width: 0; }

/* --- workspace strip ----------------------------------------------------- */
.ws {
  background: var(--bg5);
  border-right: 1px solid var(--line2);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 12px;
  gap: 8px;
}
.ws-tile {
  width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid var(--tx1);
  background: var(--tx1); color: var(--bg1);
  display: grid; place-items: center;
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; font-weight: 600;
}
.ws-spacer { flex: 1; }
.ws-you {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--replybg); border: 1px solid var(--filebd);
  display: grid; place-items: center;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; color: var(--blu2);
}

/* --- rail ---------------------------------------------------------------- */
.rail {
  background: var(--bg2);
  border-right: 1px solid var(--line);
  display: grid; grid-template-rows: auto 1fr auto;
  min-height: 0;
}
.rail-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
.rail-head h1 { margin: 0; font-size: 13px; font-weight: 600; color: var(--tx0); }
.rail-head .sub { margin-top: 4px; }
.rail-body { overflow-y: auto; padding: 4px 0 10px; min-height: 0; }
.rail-sec { padding: 12px 12px 5px; }

.rrow {
  display: flex; align-items: center; gap: 7px;
  width: 100%; text-align: left;
  padding: 4px 12px 4px 11px;
  border-left: 2px solid transparent;
  color: var(--tx2);
  transition: background .12s ease, color .12s ease;
}
.rrow:hover { background: var(--bg4); color: var(--tx1); }
.rrow.on { background: var(--bg4); border-left-color: var(--tx1); color: var(--tx0); }
.rrow .hash { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--tx2); width: 9px; }
.rrow .nm { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow.unread .nm { font-weight: 600; color: var(--tx0); }
.rrow .ct { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
.rrow .pill {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
  color: var(--amb2); background: var(--ambbg); border: 1px solid var(--ambbd);
  border-radius: 8px; padding: 0 5px 1px; line-height: 1.3;
  display: inline-flex; align-items: center; gap: 3px;
}

/* humans are a roster, not navigation — non-interactive rows */
.hrow { display: flex; align-items: center; gap: 7px; padding: 3.5px 12px 3.5px 13px; }
/* presence uses BLUE (= human), never green: green is reserved for "verified". */
.pres { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pres.here { background: var(--blu); }
.pres.idle { background: transparent; border: 1.5px solid var(--blu2); }
.pres.away { background: transparent; border: 1.5px solid var(--line3); }
.hrow .nm { font-size: 11.5px; color: var(--tx2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow.me .nm { color: var(--tx1); font-weight: 500; }

.rail-foot { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.rail-foot .av {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--replybg); border: 1px solid var(--filebd);
  display: grid; place-items: center;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; color: var(--blu2);
}
.rail-foot .nm { font-size: 11.5px; color: var(--tx1); line-height: 1.25; }

.iconbtn {
  width: 22px; height: 22px; border-radius: 5px;
  display: grid; place-items: center;
  border: 1px solid transparent;
  color: var(--tx2);
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.iconbtn:hover { background: var(--bg7); color: var(--tx0); border-color: var(--line); }
.iconbtn svg { width: 13px; height: 13px; display: block; }

/* --- center -------------------------------------------------------------- */
/* FIVE CHILDREN, FIVE TRACKS, EACH ONE PLACED BY NAME.
   roomhead · pin · trace · feed · composer.

   Round 4 declared four tracks for five children. The fifth fell into an
   implicit `auto` track and the whole column shifted by one: the FEED got
   `auto` (unbounded — it sizes to its content) and the TRACE got
   `minmax(0,1fr)` (whatever is left, which is nothing). The trace resolved to
   0px, the feed painted straight through it, and both trace controls failed
   hit-testing — measured with trace.top === feed.top === 306.14 at 1440.

   Declaring the fifth track is NOT sufficient, and this is the part worth
   keeping: the trace is `hidden` most of the time, `[hidden]` is
   `display: none`, and a display:none child is not a grid item at all. With
   auto-placement, hiding it slid the last three children up one track — the
   feed onto `auto`, the composer onto `1fr`, which resolved to 0 — and the
   composer left the viewport entirely at top: 900. One template cannot be
   correct for both states under auto-placement, so nothing is auto-placed:
   every child names its own row and hiding one leaves an empty track behind
   rather than renumbering its siblings. checkLayoutInvariant() proves all of
   it against the painted geometry on every render and every resize. */
.center {
  background: var(--bg1);
  display: grid;
  grid-template-rows: auto auto auto minmax(0,1fr) auto;
  min-width: 0; min-height: 0;
}
.center > .roomhead { grid-row: 1; }
.center > .pin      { grid-row: 2; }
.center > .trace    { grid-row: 3; }
.center > .feed     { grid-row: 4; }
.center > .composer { grid-row: 5; }

.roomhead { border-bottom: 1px solid var(--line); padding: 8px 16px 0; background: var(--bg1); }
.roomhead .top { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.roomhead h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--tx0); flex: none; white-space: nowrap; }
.roomhead h2 .hash { color: var(--tx2); font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 400; }
.roomhead .topic {
  font-size: 11.5px; color: var(--tx2); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border-left: 1px solid var(--line); padding-left: 10px;
}
.roomhead .faces { display: flex; align-items: center; flex: none; }
.roomhead .faces .av {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--bg1); background: var(--bg5);
  display: grid; place-items: center; margin-left: -5px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; color: var(--tx2);
}

/* the three surfaces are all on screen at once — these focus, they do not
   navigate. That fact lives in the group's accessible name and in the toast the
   buttons raise; round 2 printed it into the product header as commentary. */
.surfaces { display: flex; align-items: center; gap: 3px; margin-top: 5px; min-width: 0; overflow: hidden; }
.surf {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px 5px;
  border-bottom: 2px solid transparent;
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
.surf .lbl { transition: color .12s ease; }
.surf:hover .lbl { color: var(--tx0); }
.surf[aria-pressed="true"] { border-bottom-color: var(--tx1); }
.surf[aria-pressed="true"] .lbl { color: var(--tx0); }
.surf:hover { background: var(--bg7); }
/* INACTIVE IS A TOKEN STEP AND A SHAPE CHANGE, NEVER ALPHA (#39 r2/r3, applied
   here in #10 r10). `opacity: .55` measured 2.49:1 light / 2.43:1 dark — the two
   numbers design/CONVENTIONS.md cites verbatim as the defect its "no exemption
   for inactive controls" rule exists to prevent. The doctrine was written from
   #39's findings and never swept back across this artifact; `.cnt[disabled]`
   below had it right the whole time, which is where this pattern comes from.
   No fade clears AA at any alpha, so there is no gentler value to reach for. */
.surf[disabled] { cursor: default; border-bottom-style: dashed; border-bottom-color: var(--line2); }
.surf[disabled] .lbl { color: var(--tx2); }
.surf[disabled]:hover { background: none; }
.surf[disabled]:hover .lbl { color: var(--tx2); }
.surf .n {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  background: var(--bg7); border: 1px solid var(--line); border-radius: 7px; padding: 0 4px;
}
.surf.warn .n { color: var(--amb2); background: var(--ambbg); border-color: var(--ambbd); }
.surf.warn[disabled] .n { color: var(--tx2); background: var(--bg7); border-color: var(--line); }

/* --- attention pin ------------------------------------------------------- */
/* corpus turn 17: owed floats up and opens, clean compresses to a count,
   the pin folds rather than scrolls. Budgeted to stay under ~240px at 820h. */
.pin { background: var(--bg3); border-bottom: 1px solid var(--line2); padding: 6px 16px 5px; }
.pin-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.pin-head .g { color: var(--amb2); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
.pin-head .lbl { color: var(--amb2); }
.pin-head .rule { flex: 1; height: 1px; background: var(--line); }
.pin-head .fold {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  color: var(--tx2); padding: 1px 6px 2px; border-radius: 4px; border: 1px solid transparent;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.pin-head .fold:hover { background: var(--bg7); color: var(--tx0); border-color: var(--line); }
.pin-list { display: flex; flex-direction: column; gap: 4px; }

.acard {
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--bg1);
  padding: 6px 10px 6px 9px;
  display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 8px;
}
.acard .g { font-family: "IBM Plex Mono", monospace; font-size: 11px; line-height: 1.4; color: var(--amb2); }
.acard.gate { background: var(--ambbg5); border-color: var(--ambbd); box-shadow: inset 2px 0 0 var(--amb2); }
.acard .ttl { font-size: 12.5px; color: var(--tx0); font-weight: 500; line-height: 1.3; }
.acard .why {
  margin-top: 2px; font-size: 11px; color: var(--tx1);
  display: flex; gap: 6px; line-height: 1.3;
  max-height: 29px; overflow: hidden;
}
.acard .why::before {
  content: "WHY YOU"; flex: none;
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  color: var(--amb2); padding-top: 1px;
}
/* a proposal is still a claim even while it is also a gate: show the ◆ AND the
   dotted underline. Round 2 let the owed glyph suppress the claim treatment. */
.acard .ttl .claim { border-bottom: 1px dotted var(--line3); padding-bottom: 1px; }
/* the source of an owed item can live in another room; it says so and jumps */
.acard .xroom, .acomp .xroom { color: var(--blu2); border-bottom: 1px solid var(--filebd); white-space: nowrap; }
.acard .xroom:hover, .acomp .xroom:hover { color: var(--tx0); border-bottom-color: var(--line3); }
.acard .foot { margin-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.acard .mt {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0;
}
.acard .lnk { color: inherit; border-bottom: 1px solid var(--line2); }
.acard .lnk:hover { color: var(--tx0); border-bottom-color: var(--line3); }
.acard .acts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; }
.acard .acts .btn { padding: 2px 9px 3px; }

/* compressed owed row — still visible, still actionable, never folded away.
   THE TITLE IS THE ROW (round 7 D2). Round 7 gave the metadata an `auto` track
   and the title a `1fr` one. Grid sizes auto tracks before it distributes free
   space to flex tracks, so the fact chips, the cross-room chip and the primary
   button — all `nowrap` — took their full max-content width at every viewport
   and the title got whatever was left: 209px at 1440, 61px at 1180 and 5.36px
   at 1124, where an owed item is counted, glyphed and actionable and cannot be
   identified. A reachable click path drove it to 0.
   Every flexible track is now `fr`, so they SHARE the shortfall in a fixed
   ratio instead of one of them absorbing all of it, and the title's share is
   the largest. The primary action keeps its own `auto` track, because a control
   you cannot read the label of is not one click to act. */
.acomp {
  display: grid; grid-template-columns: 14px minmax(0, 2fr) minmax(0, 1fr) auto;
  column-gap: 8px; align-items: center;
  border: 1px solid var(--line); border-radius: 5px; background: var(--bg1);
  padding: 2px 5px 3px 9px; width: 100%; text-align: left;
  transition: background .12s ease, border-color .12s ease;
}
.acomp:hover { background: var(--bg7); border-color: var(--line3); }
.acomp .g { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--amb2); }
.acomp .ct { font-size: 11.5px; color: var(--tx1); text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acomp .mt {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); white-space: nowrap;
  display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden;
}
/* the facts give way first: they are the only thing on this row that is also
   somewhere else. The cross-room chip is a control, so it never shrinks. */
.acomp .mt .fx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.acomp .ac {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); white-space: nowrap;
}
.acomp .ac .xroom { flex: none; }
.acomp .btn { font-size: 11px; padding: 1px 7px 2px; white-space: nowrap; }

.btn {
  font-size: 11.5px; font-weight: 500;
  padding: 3px 9px 4px;
  border: 1px solid var(--line2); border-radius: 4px;
  background: var(--bg3); color: var(--tx1);
  transition: background .12s ease, border-color .12s ease, color .12s ease, transform .1s ease;
}
.btn:hover { background: var(--bg7); border-color: var(--line3); color: var(--tx0); }
.btn:active { transform: translateY(1px); }
.btn.amber { background: var(--amb2); border-color: var(--amb2); color: var(--bg3); }
.btn.amber:hover { background: var(--amb2); border-color: var(--tx1); color: var(--bg3); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--tx2); }
.btn.ghost:hover { background: var(--bg7); color: var(--tx0); }
.btn.sm { font-size: 11px; padding: 2px 7px 3px; }

/* the trailer WRAPS rather than clipping. Below 1340 the nowrap version ate the
   checkable half of the sentence — the objective, commitment and failure counts
   — and left only the lead clause, which is the one part that is a summary
   rather than a fact. A fact you cannot read is not on the page. */
.pin-trailer {
  margin-top: 5px; padding-top: 5px; border-top: 1px dashed var(--line);
  display: flex; align-items: baseline; gap: 8px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  line-height: 1.5; min-width: 0;
}
/* `✗` AND `■` WEAR `--red3`, NOT `--red2` (#39, applied here in #10 r10).
   `--red2` measures 4.21:1 in dark at the 10.5px these glyphs render at — the
   exact number design/CONVENTIONS.md names — and `--red3` clears both themes
   (7.03:1 light, 5.85:1 dark). One live site (the toast) and three latent ones
   (this trailer, the feed row glyph, the lens item glyph), all four corrected;
   the token values are untouched, because the rule is about which token the
   usage picks. */
.pin-trailer .g { flex: none; }
.pin-trailer .g { color: var(--grn2); }
.pin-trailer .g.warn { color: var(--amb2); }
.pin-trailer .g.bad { color: var(--red3); }
.pin-trailer .g.claim { color: var(--tx2); }
.pin-trailer b { color: var(--tx1); font-weight: 500; }

/* --- cross-room jump trace ----------------------------------------------- */
/* a highlight fades in two seconds; the reason you are in this room should not */
.trace {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 16px 6px;
  border-bottom: 1px solid var(--line);
  background: var(--replybg);
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--blu2);
}
.trace .g { flex: none; }
.trace .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace b { font-weight: 600; }
.trace .back { margin-left: auto; flex: none; color: var(--blu2); border-bottom: 1px solid var(--filebd); }
.trace .back:hover { color: var(--tx0); border-bottom-color: var(--line3); }
.trace .x { flex: none; color: inherit; padding: 0 2px; }

/* --- feed ---------------------------------------------------------------- */
.feed { position: relative; overflow-y: auto; padding: 8px 0 14px; min-height: 0; }

/* --- THE FILTER HIGHLIGHTS; IT DOES NOT DIM (round 6 D2) ------------------
 * design/CONVENTIONS.md § "De-emphasis must stay readable": dimming may not
 * drop any text below AA at the size it renders. Round 6 put `opacity: .3` on
 * every non-matching row and measured 1.48–1.75:1 light, 1.12–2.14:1 dark —
 * a third of the floor this file states, and below the contrast it already
 * rejects `--tx4` for. Fifty-seven text elements, every one of them failing.
 *
 * THERE IS NO OPACITY THAT FIXES IT. A row's smallest text is `--tx2` at 10px,
 * which sits close to the AA floor at full strength, so any alpha below 1 puts
 * it under; and `--tx0` body text would need α ≥ .84 to clear 4.5:1, which is
 * not a dim, it is a rounding error. The affordance had to change shape, not
 * value. The rule's other branch — hide the row and say so — throws away the
 * thing this feed is for: seeing a match IN ITS CONTEXT, with the conversation
 * around it still legible.
 *
 * #39 r2 measured the same arithmetic against the same tokens at the same time
 * and reached the same place independently — the weakest thing a row can
 * legitimately carry (`--amb2` on `--ambbg`) is 4.53:1 at FULL opacity, so no
 * fade clears AA at any alpha. That is now the standing rule: lift the matches,
 * never dim the rest. This file and the component library express filtering the
 * same way, which matters because this file is the interaction spec that one
 * implements.
 *
 * So the filter highlights instead. A match gets a band, a left rule and
 * full-strength body text; every other row keeps exactly the legibility it had
 * with no filter on. Nothing on this page is less readable than it was, and the
 * divider says out loud that the rest of the room is neither hidden nor dimmed.
 * The band is NEUTRAL, not amber: amber means "this room owes you", and the
 * routine filter's matches owe nobody anything.
 *
 * AND THE BAND BRIGHTENS, in both themes — `--bg3` on paper, `--bg5` on
 * near-black. It is an alias over the existing ramp, not a new colour. This is
 * not a cosmetic preference: highlighting by DARKENING the light theme took
 * `--amb2` on `◆` from 4.84:1 to 3.99:1 — measured, mid-round — and a fix for a
 * contrast defect that introduces a contrast defect is not a fix. Every text
 * token on a highlighted row is now on more contrast than it had unfiltered,
 * not less, which is the only version of "emphasis" that cannot fail this rule.
 * ---------------------------------------------------------------------- */
:root { --hitbg: var(--bg3); }
html.atr-dark { --hitbg: var(--bg5); }
.feed.filtered .mrow.hit { background: var(--hitbg); box-shadow: inset 3px 0 0 var(--line3); }
/* hover feedback on a match moves the RULE, never the background — the band's
   luminance is load-bearing for every ratio measured on the row */
.feed.filtered .mrow.hit:hover { background: var(--hitbg); box-shadow: inset 3px 0 0 var(--tx2); }
.feed.filtered .mrow.hit .m { color: var(--tx0); }
.feed.filtered .mrow.hit .t, .feed.filtered .mrow.hit .a { color: var(--tx1); }

.mrow {
  display: grid;
  grid-template-columns: 44px 14px 76px 1fr;   /* time · glyph · actor · text */
  column-gap: 8px;
  padding: 2.5px 16px 2.5px 12px;
  position: relative;
  transition: background .12s ease, opacity .15s ease;
}
.mrow:hover { background: var(--bg3); }
.mrow.tgt { background: var(--ambbg5); box-shadow: inset 2px 0 0 var(--amb2); }
/* a jump target keeps its amber even when it is also a filter match — "you were
   sent here" outranks "this matches", and the two must not cancel out */
.feed.filtered .mrow.hit.tgt { background: var(--ambbg5); box-shadow: inset 2px 0 0 var(--amb2); }
.mrow .t { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); text-align: right; padding-top: 2px; }
.mrow .g { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--tx2); text-align: center; padding-top: 1px; }
.mrow .a {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--tx2);
  text-align: right; padding-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mrow .m { font-size: 12px; color: var(--tx1); min-width: 0; }

/* --grn2 is the darkest green in the token set, and on --bg1 it measures
   4.48:1 — under AA at this size. Every other verified glyph in the shell
   already sits on --bg3 (the pin, the lens, the receipt), where the same
   colour clears it. This is a usage fix, not a new colour: the feed's ✓ gets
   the same surface the rest of them stand on. */
.mrow.gv .g { color: var(--grn2); background: var(--bg3); border-radius: 2px; }
.mrow.ga .g { color: var(--amb2); }
.mrow.gr .g { color: var(--red3); }
.mrow.sys .m { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--tx2); }
.mrow.me .a { color: var(--blu2); font-weight: 600; }
.mrow.dim .m { color: var(--tx2); }

/* a claim never dresses as a fact */
.claim { border-bottom: 1px dotted var(--line3); padding-bottom: 1px; }
.mnote { display: block; margin-top: 2px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
.mreply {
  display: block; margin-bottom: 1px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--blu2);
  border-left: 2px solid var(--filebd); padding-left: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.mrow .m code {
  font-family: "IBM Plex Mono", monospace; font-size: 11px;
  background: var(--bg7); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px;
  color: var(--tx1);
}
.mrow .m .at { color: var(--blu2); font-weight: 500; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  border-radius: 3px; padding: 0 5px 1px; margin-left: 6px;
  vertical-align: 1px;
  border: 1px solid var(--line); background: var(--bg7); color: var(--tx2);
}
.tag.amber { border-color: var(--ambbd); background: var(--ambbg); color: var(--amb2); }
.tag.green { border-color: var(--grnbd); background: var(--grnbg); color: var(--tx1); }
button.tag { cursor: pointer; transition: border-color .12s ease, color .12s ease; }
button.tag:hover { border-color: var(--line3); color: var(--tx0); }

/* row hover affordances — every one of these is wired; unwired ones were deleted */
.mrow .acts {
  position: absolute; right: 12px; top: -9px;
  display: flex; gap: 1px; opacity: 0;
  background: var(--bg3); border: 1px solid var(--line2); border-radius: 4px;
  padding: 1px; transition: opacity .12s ease;
  z-index: 3;
}
.mrow:hover .acts, .mrow:focus-within .acts { opacity: 1; }
.mrow .acts button {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  padding: 2px 6px 3px; border-radius: 3px;
  transition: background .12s ease, color .12s ease;
}
.mrow .acts button:hover { background: var(--bg7); color: var(--tx0); }

/* inline verification prompt — the ~ → ✓ pair, exercisable */
.vbox {
  grid-column: 4; margin: 4px 0 6px;
  border: 1px solid var(--grnbd); border-radius: 5px; background: var(--bg3);
  padding: 7px 9px 8px;
}
.vbox .hd { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
.vbox .row { display: flex; align-items: center; gap: 7px; }
.vbox input {
  flex: 1; min-width: 0;
  font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--tx1);
  background: var(--bg1); border: 1px solid var(--line2); border-radius: 4px;
  padding: 5px 7px;
}
.vbox input::placeholder { color: var(--tx2); }
.vbox input:focus { outline: none; border-color: var(--line3); }
.vbox .hint { margin-top: 5px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }

/* since-you-left / since-you-returned dividers */
.syl { padding: 13px 16px 9px 12px; }
.syl .bar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.syl .rule { flex: 1; min-width: 20px; height: 1px; background: var(--ambbd); }
.syl.seen .rule, .syl.ret .rule { background: var(--line); }
.syl .lbl { color: var(--amb2); flex: none; }
.syl.seen .lbl, .syl.ret .lbl { color: var(--tx2); }
.syl .counts { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.cnt {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  border: 1px solid var(--line2); background: var(--bg3); color: var(--tx2);
  border-radius: 3px; padding: 1px 6px 2px;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.cnt:hover { border-color: var(--line3); color: var(--tx0); }
.cnt.need { border-color: var(--ambbd); background: var(--ambbg); color: var(--amb2); }
.cnt[aria-pressed="true"] { background: var(--tx1); border-color: var(--tx1); color: var(--bg1); }
/* a chip that counts nothing filters nothing: it is disabled, not a no-op */
.cnt[disabled] { cursor: default; border-style: dashed; border-color: var(--line); background: transparent; }
.cnt[disabled]:hover { border-color: var(--line); color: var(--tx2); }
.syl .own { color: var(--blu2); }
/* what the active filter is doing to the rows it did not match — same register
   as the rest of the when-line, because it is another counted fact about it */
.syl .fnote { color: var(--tx2); }
/* BRIEF concept 1: marking a group seen FADES IT TO MUTED. It does not vanish,
   it keeps its window and its counts, and the unmark link sits on the same line
   that reports the mark. */
.syl.muted .lbl { color: var(--tx2); }
.syl.muted .rule { background: var(--line); }
.syl.muted .marked { color: var(--tx2); }
.syl.muted .cnt:not([aria-pressed="true"]):not([disabled]) { background: transparent; color: var(--tx2); }
.syl.muted .cnt.need:not([aria-pressed="true"]) { border-color: var(--line2); background: transparent; color: var(--tx2); }
.syl .when {
  margin-top: 5px; padding-left: 2px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
}
.syl .when .mark { color: var(--tx1); border-bottom: 1px solid var(--line2); }
.syl .when .mark:hover { color: var(--tx0); border-bottom-color: var(--line3); }

/* routine collapse — collapses legibly, never to a bare "N hidden" */
.routine { padding: 4px 16px 4px 12px; }
.routine .strip {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 8px;
  border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line);
  padding: 5px 4px 5px 46px;
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--tx2);
  transition: background .12s ease, color .12s ease;
}
.routine .strip:hover { background: var(--bg3); color: var(--tx0); }
.routine .strip b { font-weight: 600; color: var(--tx1); }
.routine .strip .peek { margin-left: auto; color: var(--tx1); border-bottom: 1px solid var(--line2); }
.routine .strip:hover .peek { border-bottom-color: var(--line3); }
.peekbody { border-left: 1px solid var(--line); margin: 4px 0 4px 46px; padding: 2px 0; max-height: 300px; overflow-y: auto; }
.peekbody .mrow { grid-template-columns: 34px 14px 76px 1fr; padding-left: 6px; }
.peekbody .more { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); padding: 4px 0 4px 62px; }

/* --- composer ------------------------------------------------------------ */
.composer { border-top: 1px solid var(--line); background: var(--bg1); padding: 9px 16px 8px; }
.ctxbar {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--ambbd); border-bottom: 0; border-radius: 5px 5px 0 0;
  background: var(--ambbg); color: var(--amb2);
  padding: 5px 9px 5px 10px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
}
.ctxbar.reply { border-color: var(--filebd); background: var(--replybg); color: var(--blu2); }
.ctxbar b { font-weight: 600; font-size: 10px; }
.ctxbar .in { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.ctxbar .x { color: inherit; padding: 0 2px; }

.cbox {
  border: 1px solid var(--line2); border-radius: 5px;
  background: var(--bg3);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end;
  transition: border-color .12s ease;
}
.cbox:focus-within { border-color: var(--line3); }
.composer.bound .cbox { border-color: var(--ambbd); border-radius: 0 0 5px 5px; }
.composer.replying .cbox { border-color: var(--filebd); border-radius: 0 0 5px 5px; }
.cbox textarea {
  border: 0; background: transparent; resize: none; outline: none;
  font-family: Inter, sans-serif; font-size: 12.5px; color: var(--tx1);
  padding: 8px 10px 8px 11px; min-height: 36px; min-width: 0; width: 100%; line-height: 1.45;
}
.cbox textarea::placeholder { color: var(--tx2); }
.cbox .right { display: flex; align-items: center; gap: 6px; padding: 0 8px 6px 0; }
.cfoot {
  margin-top: 5px; display: flex; align-items: center; gap: 10px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
}
.cfoot .k { border: 1px solid var(--line); background: var(--bg7); border-radius: 3px; padding: 0 3px; color: var(--tx1); }
.cfoot .sp { flex: 1; }

/* --- right pane: current state lens -------------------------------------- */
.lens {
  background: var(--bg3);
  border-left: 1px solid var(--line);
  display: grid; grid-template-rows: auto minmax(0,1fr);
  min-height: 0;
  transition: box-shadow .12s ease;
}
.lens.focused { box-shadow: inset 0 0 0 2px var(--line3); }
.lens-head { padding: 10px 14px 9px; border-bottom: 1px solid var(--line); background: var(--bg3); }
.lens-head .top { display: flex; align-items: center; gap: 8px; }
.lens-head .top .spacer { flex: 1; }
.lens-head .sub {
  margin-top: 5px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
/* THIS DOT IS NOT A LIVE INDICATOR AND IT IS NOT VERIFIED (round 6 minor).
   It marks that the pane beside it is continuously re-derived from the record —
   an in-progress state, which is what gl-pulse is for. Round 6 painted it
   `--grn2`, and green in this system means one thing: checked by something other
   than the claimant. A green dot in the CURRENT STATE header reads as a verdict
   on the state. It is neutral now, and named for what it does. */
.lens-head .sub .derived { width: 5px; height: 5px; border-radius: 50%; background: var(--tx2); animation: gl-pulse 1.6s infinite; }
/* sub-counts that do not sum, reconciled in prose right under the counts */
.lens-head .sums {
  margin-top: 3px; padding-left: 11px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); line-height: 1.4;
}
.lens-body { overflow-y: auto; overflow-x: hidden; min-height: 0; padding-bottom: 24px; }
.lensnote {
  padding: 7px 14px 8px; border-bottom: 1px solid var(--line);
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); line-height: 1.45;
}

.obj { border-bottom: 1px solid var(--line); }
.obj-head {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 12px 1fr auto; column-gap: 8px; align-items: start;
  padding: 9px 14px 9px;
  transition: background .12s ease;
}
.obj-head:hover { background: var(--bg1); }
.obj-head .tw { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); padding-top: 2px; }
.obj-head .ttl { display: block; font-size: 12px; font-weight: 600; color: var(--tx0); line-height: 1.35; }
.obj-head .ct { display: block; margin-top: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
.obj-head .ct .warn { color: var(--amb2); }
.st {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  border: 1px solid var(--line); background: var(--bg1); color: var(--tx2);
  border-radius: 3px; padding: 1px 4px 1px 5px; white-space: nowrap;
}
.st.active { border-color: var(--grnbd); background: var(--grnbg); color: var(--tx1); }
.st.blocked { border-color: var(--ambbd); background: var(--ambbg); color: var(--amb2); }
.st.failed { border-color: var(--redbd); background: var(--redbg); color: var(--red3); }

.grp { padding: 0 14px 4px; }
.grp .glbl { display: flex; align-items: center; gap: 7px; padding: 7px 0 4px; }
.grp .glbl .rule { flex: 1; height: 1px; background: var(--line); }
.grp .glbl .n { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }

.oitem {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 13px 1fr; column-gap: 7px;
  padding: 4px 6px 5px 5px; border-radius: 4px;
  border: 1px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}
.oitem:hover { background: var(--bg1); border-color: var(--line); }
.oitem .g { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--tx2); padding-top: 1px; text-align: center; }
.oitem.gv .g { color: var(--grn2); }
.oitem.ga .g { color: var(--amb2); }
.oitem.gr .g { color: var(--red3); }
.oitem .tt { font-size: 11.5px; color: var(--tx1); line-height: 1.4; }
.oitem.gv .tt { color: var(--tx0); }
.oitem .mt {
  margin-top: 2px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.oitem .mt .warn { color: var(--amb2); }

/* receipt */
.receipt { padding: 0 0 30px; }
.rc-top { position: sticky; top: 0; z-index: 2; background: var(--bg3); border-bottom: 1px solid var(--line); padding: 8px 14px 10px; }
.rc-back {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 3px 4px; border-radius: 4px;
  transition: background .12s ease, color .12s ease;
}
.rc-back:hover { background: var(--bg1); color: var(--tx0); }
.rc-ttl { display: grid; grid-template-columns: 14px 1fr; column-gap: 8px; margin-top: 8px; }
.rc-ttl .g { font-family: "IBM Plex Mono", monospace; font-size: 12px; padding-top: 1px; color: var(--tx2); }
.rc-ttl.gv .g { color: var(--grn2); }
.rc-ttl.ga .g { color: var(--amb2); }
.rc-ttl .h { font-size: 12.5px; font-weight: 600; color: var(--tx0); line-height: 1.35; }
.rc-state {
  margin-top: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
}
.rc-sec { padding: 10px 14px 3px; }
.rc-sec .glbl { display: flex; align-items: center; gap: 7px; padding-bottom: 6px; }
.rc-sec .glbl .rule { flex: 1; height: 1px; background: var(--line); }

.hap { display: grid; grid-template-columns: 13px 1fr; column-gap: 7px; padding: 3px 0; }
.hap .g { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; text-align: center; color: var(--tx2); padding-top: 1px; }
.hap.gv .g { color: var(--grn2); }
.hap.ga .g { color: var(--amb2); }

.hap .tt .tm { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); margin-left: 5px; }

/* provenance: truncated, hover/focus reveals the source excerpt */
.prov {
  display: block; width: 100%; max-width: 100%; min-width: 0; text-align: left;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg1);
  padding: 5px 8px 6px; margin-bottom: 5px;

}

.prov .hd { display: flex; align-items: baseline; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
.prov .hd .who { color: var(--tx1); }
.prov .hd .jump { margin-left: auto; opacity: 0; color: var(--blu2); transition: opacity .12s ease; }
.prov:hover .hd .jump, .prov:focus-visible .hd .jump { opacity: 1; }
.prov .ex {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; line-clamp: 1;

}
.prov:hover .ex, .prov:focus-visible .ex { -webkit-line-clamp: 4; line-clamp: 4; }
.prov .full {
  display: block; max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height .15s ease, opacity .12s ease, margin .15s ease;
  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);

.prov:hover .full, .prov:focus-visible .full { max-height: 44px; opacity: 1; margin-top: 4px; }

/* A SOURCE THE PAGE AUTHORED IS NOT A QUOTATION.
   When the human clicked an option rather than typing a sentence, the receipt's
   source entry is a system-voice record of that click — mono, muted, no
   quotation marks, no <q>, no data-quoted, and therefore outside the quotation
   checker's remit by construction rather than by exemption. Its disclosure is
   `.always`: on screen at rest, because "you chose this, you did not write it"
   is the one thing a receipt may never make you hover to discover. */
.prov .sysex {
  display: block; margin-top: 2px;
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px;
  color: var(--tx1); line-height: 1.4;

  display: block; margin-top: 3px;

/* the two voices of a correction, kept visibly apart.
   SYSTEM: mono, muted, no quotation marks — `.was` and `.fact`.
   HUMAN:  serif-italic inside <q>, attributed, and only ever real words. */
.corr .was { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
/* the "nothing changed" marker stands where the arrow would be — same weight,
   same register, so the two shapes of entry read as siblings and not as one
   being a degraded version of the other */
.corr .same { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); }
.corr .fact {
  margin-top: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10px;

  font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2);
}
.corr .lnk { color: var(--blu2); border-bottom: 1px solid var(--filebd); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
.corr .lnk:hover { color: var(--tx0); border-bottom-color: var(--line3); }

/* the receipt's own action stays reachable: a long correction chain used to push
   Reopen past the bottom of the pane, which is a dead end by scroll position */
.rc-foot {
  position: sticky; bottom: 0; z-index: 2;
  margin: 10px 0 0; padding: 10px 14px 10px; border-top: 1px dashed var(--line);
  background: var(--bg3);
  display: flex; align-items: center; gap: 8px;
}
.rc-foot .note { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--tx2); flex: 1; line-height: 1.4; }

.empty {
  padding: 12px; margin: 0; border: 1px dashed var(--line); border-radius: 5px;
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  color: var(--tx2); text-align: center;
}

/* --- toast (live region: stays in the a11y tree, fades visually) ---------
   Anchored over the CONVERSATION column, clear of the lens: round 2 parked it
   on top of the Current state pane it was reporting changes to. Its right edge
   stops at the lens boundary at every supported width. */
.toast {

}

/* the glyph reports the OUTCOME — round 2 stamped ✓ on every one of them */
.toast .g { color: var(--grn2); }
.toast.warn .g { color: var(--amb2); }
.toast.bad .g { color: var(--red3); }

/* --- responsive: laptop ------------------------------------------------- */
/* the topic survives to the narrowest supported width — it is what the room

@media (max-width: 1439px) {

<script>

/* ===========================================================================
 * ONE STATE OBJECT.
 *
 * Round 1's defect was architectural: the pin lived in the DOM, the lens lived

 * were typed in by hand. Nothing could stay in sync because there was nothing
 * to be in sync *with*.
 *
 * Round 2 has exactly one source of truth — `S` — and every surface is a pure
 * function of it: renderRail, renderPin, renderFeed, renderLens, renderReceipt,
 * and every count. Nothing is stored in the DOM. No glyph is ever written by
 * hand; `glyphOf()` derives it from the object's epistemic state, including for
 * objects at rest. Changing state and re-rendering is the only way anything on
 * this page moves.
 * ======================================================================== */

const S = {
  me: "lars",
  now: "09:12",
  roomId: "users-migration",
  seq: 9200,
  /* ---------------------------------------------------------------------
   * THE HUMAN-SPEECH REGISTER.
   *
   * Round 3's cardinal defect: reopen() invented a first-person sentence and
   * the receipt rendered it inside <q> under a real person's name. Words the
   * human never said, in the artifact whose entire job is being the record.
   *
   * The standing invariant now: nothing on this page is rendered as a person's
   * words unless it is (a) text a human actually typed into this page, or (b)
   * text of a seeded message that is in the loaded record. Everything else —
   * every transition, every reopen, every state change — is stated as a system
   * fact, in system voice, in a visually distinct treatment that is not
   * quotation. `S.typed` is the register for (a); `msg:<id>` provenance covers
   * (b); and checkQuotationInvariant() proves it on every single render.
   * ------------------------------------------------------------------- */
  typed: [],
  people: [
    { id: "lars",   presence: "here", note: "you" },
    { id: "priya",  presence: "here", note: "now" },
    { id: "justin", presence: "here", note: "now" },
    { id: "dana",   presence: "idle", note: "14m" },
    { id: "mateo",  presence: "away", note: "2h" }
  ],
  ui: {
    /* A filter carries its SCOPE as well as its class, because a count is only
       honest next to the set it counts. Round 3 also fixes what the two numbers
       ARE: the pin and every badge count owed OBJECTS; the feed filter
       highlights every ROW LINKED to an owed object. Those are different
       cardinalities on purpose — one object can be carried by four rows, and an
       object whose source message lives in another room has none here. No copy
       on this page claims they are the same set. */
    feedFilter: null,      // null | { k: 'need'|'change'|'discussion'|'routine', scope: 'absence'|'return'|'room' }
    routineOpen: false,
    routineOpenedByFilter: false,
    pinFolded: false,
    pinOpen: null,         // which owed item is expanded (turn-17: one open, rest compressed)
    lensFocus: false,
    receiptId: null,
    bound: null,           // object id the composer is answer-bound to
    about: null,           // object id the composer is talking ABOUT — a message, not a record write
    replyTo: null,         // message id being replied to
    prefill: null,         // the characters the PAGE put in the composer, so it can take them back out

    jumpTo: null

/* --- epistemic derivation ------------------------------------------------
 * Precedence, applied in this order and nowhere else:
 *   failed            → ✗
 *   owed to you       → ◆   (a gate: a decision or sign-off waiting on you)
 *   open question     → ?   (explicitly unverified, whether or not it is yours)
 *   verified/accepted → ✓   (checked by someone other than the claimant)
 *   proposed / unverified / self-reported → ~
 *   otherwise         → ·
 * `~` also drives the dotted underline, everywhere, via isClaim().
 * ----------------------------------------------------------------------- */
const GLYPH_CLASS = { "✓": "gv", "◆": "ga", "?": "ga", "✗": "gr", "~": "", "·": "" };

/* the three verification states that mean "nothing outside the claimant has
   checked this". They drive the dotted underline INDEPENDENTLY of the glyph:
   a proposal that is also a gate is still a claim, so it renders ◆ *and*
   dotted. Round 2 derived the underline from the glyph, so being owed to you
   silently dressed a proposal as settled prose. */
const UNSETTLED = ["proposed", "unverified", "self_reported"];

function glyphOf(o) {
  if (o.verification === "failed") return "✗";
  if (o.owedTo === S.me && o.verification !== "accepted" && o.verification !== "verified") {
    return o.kind === "question" ? "?" : "◆";
  }
  if (o.verification === "open") return "?";
  if (o.verification === "verified" || o.verification === "accepted") return "✓";
  if (UNSETTLED.includes(o.verification)) return "~";
  return "·";
}
function isClaim(o) { return !!o && UNSETTLED.includes(o.verification); }
function needsYou(o) { return o.owedTo === S.me && o.verification !== "accepted" && o.verification !== "verified"; }
function gclass(g) { return GLYPH_CLASS[g] || ""; }

/* --- THE RECEIPT HEADER CHIP DERIVES FROM THE GLYPH (round 6 minor) --------
 * Round 6 asked one question — "is it ✓?" — and gave every other state the
 * amber chip through a class literally named `.blocked`, so an unverified claim
 * that owes nobody anything wore "needs you". CONVENTIONS makes `~` NEUTRAL and
 * `·` neutral; amber is `◆` and `?`, red is `■` and `✗`. Every other surface in
 * this file already honours that table through gclass(); the receipt header was
 * the one place that re-derived it by hand and got it wrong. Same table, one
 * source: the chip is a restatement of the glyph beside it, never a second
 * opinion about it.
 * ---------------------------------------------------------------------- */
const STATE_CHIP = { "✓": "active", "◆": "blocked", "?": "blocked", "■": "failed", "✗": "failed", "~": "", "·": "" };
function stateChip(g) { return STATE_CHIP[g] || ""; }

/* history entries carry a semantic kind; their glyph derives from it too */
const HIST_GLYPH = { claim: "~", verified: "✓", accepted: "✓", gate: "◆", question: "?", routine: "·", failed: "✗" };
function histGlyph(k) { return HIST_GLYPH[k] || "·"; }

/* --- seed: 31 genuinely-present routine events, so "31 routine" is counted,
 *     not asserted. The peek renders these same rows. -------------------- */
const ROUTINE_SEED = [
  ["08:45", "checks", "deploy 2f81c3 → staging · 41s"],
  ["08:45", "checks", "container users-api:2f81c3 pushed · 84MB"],
  ["08:46", "checks", "staging health green · 12/12 pods ready"],

  ["09:01", "checks", "advisory lock 44120 released"],
  ["09:02", "checks", "shadow-write lag 36ms p50 · 99ms p99"],
  ["09:03", "checks", "deploy 9ac10e → staging · 38s"],
  ["09:03", "checks", "cache warm 100% · 4 regions"],

  ["09:05", "dana", "tagged the iOS cohort query for reuse"],
  ["09:05", "checks", "query cohort_ios_legacy saved"],
  ["09:06", "checks", "nightly snapshot restored to prod-snap-3 · 6m11s"]
];

/* ===========================================================================
 * ROOM A — #users-migration
 * ======================================================================== */

S.rooms["users-migration"] = {
  id: "users-migration",
  name: "users-migration",
  topic: "Move every account onto the new identity service before the 14 Aug change freeze.",
  members: ["priya", "justin", "dana", "mateo", "lars"],
  away: { from: "17:41 yesterday", to: "09:12 today", len: "15h 31m" },
  seenAfter: "m4",          // the seen cursor — per room, moved only by this room
  lastVerified: "09:07",
  objectives: [
    { id: "o1", title: "Cut over to the new identity service", status: "active",  open: true },
    { id: "o2", title: "Retire the legacy identity path",      status: "blocked", open: false },
    { id: "o3", title: "Keep mobile clients on supported auth", status: "active", open: false }
  ],
  objects: [
    {
      id: "K0", kind: "commitment", objectives: ["o1"], text: "Land the shadow-write path behind users.dualwrite",
      claimant: "justin", verification: "verified", verifiedBy: "checks", verifiedAt: "yesterday 16:10",
      facts: ["justin", { read: "verification", post: " by checks" }, "deploy 2f81c3"],
      history: [
        { k: "claim",    who: "justin", tm: "29 Jul 14:02", text: "said the shadow-write path was ready to land" },
        { k: "verified", who: "checks", tm: "yest. 16:10",  text: "deploy 2f81c3 carried the flag into staging — checked by something other than the claimant" }
      ],
      provenance: [
        { who: "justin", tm: "yest. 16:02", msg: "m1", ex: "Shadow-write path is in behind users.dualwrite — off everywhere except staging.", note: "message · seq 8901 · the commitment this settles" }
      ],

    },
    {
      id: "D1", kind: "decision", objectives: ["o1"], text: "Dual-write stays on until parity holds for 7 consecutive days",
      /* what the line under this was READ as. It was amended once, before this
         window opened, and the correction chain below is that amendment. */
