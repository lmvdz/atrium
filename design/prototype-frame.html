/* The absence window freezes the moment you return. `absenceEnd` is pinned here,
   at boot, to the last message that existed while you were away, and nothing
   moves it again — so no message written after you got back can ever be counted
   as something that happened while you were gone. */
Object.values(S.rooms).forEach(r => { r.absenceEnd = r.messages[r.messages.length - 1].id; });

/* The absence window's ORIGIN is pinned here too. The seen cursor moves; this
   does not. It is what lets "mark this group seen" mute the divider instead of
   destroying it — the group keeps its boundaries, its counts and its chips
   after the cursor has passed it, and can be un-marked. */
Object.values(S.rooms).forEach(r => { r.absenceFrom = r.seenAfter; r.markedAt = null; });

/* ---------------------------------------------------------------------------
 * MESSAGE ORIGIN — who authored the words in this row.
 *
 * Round 4's cardinal defect (D3) was that this distinction did not exist. A
 * one-click answer appended a message whose actor was `lars` and whose body was
 * the CARD's sentence; the receipt then quoted that message and the quotation
 * checker resolved the quote against it and passed. The invariant was circular:
 * the page fabricated the evidence it then checked itself against.
 *
 *   'seeded'  — in the loaded record at boot. Real words, real author.
 *   'typed'   — this human typed these characters into this page.
 *   'chosen'  — THE PAGE authored this row on a human's behalf (they clicked an
 *               option). Never that human's words, never quotable, never
 *               rendered in their voice.
 *   'system'  — a transition record the page wrote about itself.
 *
 * Only 'seeded' and 'typed' may satisfy a quotation context. That is enforced
 * in checkQuotationInvariant(), not by convention, so a future change that
 * re-routes a chosen answer through the human path fails on the first paint.
 * design/CONVENTIONS.md § "No synthesized speech" is the written rule.
 * ------------------------------------------------------------------------ */
Object.values(S.rooms).forEach(r => r.messages.forEach(m => { if (!m.origin) m.origin = "seeded"; }));

/* Seeded human input joins the human-speech register, so a quotation seeded in
   the corpus is proved exactly the way a quotation typed live is proved. There
   is no third path into a <q> on this page. */
Object.values(S.rooms).forEach(r => r.objects.forEach(o =>
  (o.corrections || []).forEach(c => { if (c.quote && c.quote.src === "typed") S.typed.push(c.quote.text); })));

/* ===========================================================================
 * DERIVED SELECTORS — every count on this page comes through one of these.
 * ======================================================================== */

function room(id) { return S.rooms[id || S.roomId]; }
function obj(r, id) { return r.objects.find(o => o.id === id) || null; }
function msg(r, id) { return r.messages.find(m => m.id === id) || null; }
function idx(r, id) { return r.messages.findIndex(m => m.id === id); }

/* ---------------------------------------------------------------------------
 * ONE ATTENTION COLLECTION.
 *
 * `attention(r)` is the collection. It holds owed OBJECTS, hardest first, and
 * it is the only thing any count on this page counts: the pin header, the rail
 * pill, the NEEDS YOU badge, the lens summary, the objective sub-counts.
 *
 * `linkedObject(r, m)` is the other half: the object a row is LINKED to. The
 * NEED class — and therefore the highlight — is exactly "this row is linked to
 * an object in the attention collection". A single object can own four rows
 * (its source, your answer, and the two system rows recording the transitions),
 * and an object whose source lives in another room owns none here. Both are
 * correct; neither is a bug; and no string on this page says the counts and the
 * highlights are the same set.
 * ------------------------------------------------------------------------ */
function attention(r) {
  return r.objects.filter(needsYou).sort((a, b) => (b.priority || 0) - (a.priority || 0));
}
/* an object may be carried by a message in ANOTHER room (D2's source lives in
   #identity-service), so resolution follows the message's declared room. */
function linkedObject(r, m) {
  const id = m.boundTo || m.objectId || m.sysFor;
  if (!id) return null;
  const home = m.objectRoom ? S.rooms[m.objectRoom] : r;
  return home ? obj(home, id) : null;
}
/* ROOM SCOPE. `attention(r)` is per-room, so the linkage test must be too:
   a row is an attention row when the object it carries is in THIS room's
   attention collection — not merely when it is owed to you somewhere. Round 3
   tested `needsYou(linkedObject(...))` globally, so a message carrying another
   room's owed object (n0 carries #users-migration's D2) highlighted here and
   was counted in this room's chips, against items this room does not have. In
   the receipt's own repro the two numbers happened to reconcile, which is what
   kept it invisible. */
function isAttentionRow(r, m) {
  const o = linkedObject(r, m);
  return !!o && r.objects.indexOf(o) >= 0 && needsYou(o);
}

/* rows in THIS room linked to an object in the attention collection */
function attentionRows(r) { return r.messages.filter(m => isAttentionRow(r, m)); }
/* attention items whose source message is not in this room — they can never be
   highlighted here, so the pin gives them a jump instead of a phantom row */
function offRoomItems(r) {
  return attention(r).filter(o => !r.messages.some(m => linkedObject(r, m) === o));
}
function sourceRoomOf(o) { return o.sourceRoom && o.sourceRoom !== S.roomId ? o.sourceRoom : null; }

/* a message's glyph is derived from the object it carries — never written down.
   When that object changes (accepted, reopened, verified), this row changes. */
function msgGlyph(r, m) {
  const o = linkedObject(r, m);
  if (!o) return "·";
  /* A TRANSITION ROW WEARS THE TRANSITION'S GLYPH, NOT THE OBJECT'S (round 4 D6).
     A system row that records "accepted → proposed · reopened" is a record of a
     downgrade. Deriving its glyph from the object's PRESENT state made that row
     turn green again the moment the object was re-accepted, so the permanent
     record of a downgrade rendered ✓. The glyph is frozen at the instant the
     transition is written (appendSystem) and never moves again — which is the
     whole point of a record. Content rows still re-derive live: reopen an object
     and the row that carried the claim still downgrades with it (round-1 B2). */
  if (m.tglyph) return m.tglyph;
  /* ANSWER-ROW IDENTITY (round 2 blocker 2): only the message whose id is the
     object's CURRENT answerMsg may wear the settled treatment. Every earlier
     answer to the same object is a superseded answer and renders as one, no
     matter what state the object is in now. */
  if (m.boundTo) {
    if (o.answerMsg !== m.id) return "~";
    return (o.verification === "accepted" || o.verification === "verified") ? "✓" : "~";
  }
  return glyphOf(o);
}
/* the dotted claim treatment, per row: an answer that is no longer the answer
   is a claim about what was once decided. */
function msgIsClaim(r, m) {
  const o = linkedObject(r, m);
  if (!o) return false;
  if (m.tglyph) return !!m.tclaim;          // frozen with the glyph, same reason
  if (m.boundTo && o.answerMsg !== m.id) return true;
  return isClaim(o);
}

/* ---------------------------------------------------------------------------
 * NO OPTIONAL FIELD REACHES A RENDERED RECORD UNGUARDED (round 4 D2).
 *
 * `was due ${o.due}` on a commitment with no `due` printed "was due undefined"
 * into a permanent system row. Every optional field on a record-writing path
 * now goes through this: a missing value is STATED, in words, never printed as
 * the name of a JavaScript value. checkRecordTextInvariant() asserts on every
 * paint that no page-authored string on screen contains undefined/null/NaN, so
 * a future template literal that forgets is caught by what it painted.
 * ------------------------------------------------------------------------ */
function fieldOr(v, fallback) {
  if (v === undefined || v === null) return fallback;
  if (typeof v === "number" && !isFinite(v)) return fallback;
  const s = String(v).trim();
  return s === "" ? fallback : v;
}

/* --- TWO SENTENCES ARE THE SAME SENTENCE (round 6 D1) ---------------------
 * The record compares statements in several places — an answer against the
 * proposal it replaces, a correction's before against its after — and every one
 * of them wants the same question answered the same way. Whitespace is not
 * content, so it is normalised; nothing else is. Case and punctuation are part
 * of what somebody wrote and are never folded away.
 * ---------------------------------------------------------------------- */
/* "a unverified claim" was the one prose complaint an otherwise careful critic
   had about this page (round 11 minor). The article belongs to the word the
   RECORD produced, so it is decided from that word rather than typed in front
   of it — the same reason `enumText` exists. */
function an(word) { return (/^[aeiou]/i.test(String(word)) ? "an " : "a ") + word; }

function normText(v) { return String(voicedText(v) == null ? "" : voicedText(v)).replace(/\s+/g, " ").trim(); }
function sameText(a, b) { return normText(a) === normText(b); }

/* an enum value is snake_case in the data and prose on screen. Round 6 applied
   the prettifier to one side of an arrow only and rendered
   `SELF-REPORTED → SELF_REPORTED`; one function means both sides always agree.
   ROUND 8 D2: the correction-chain header was fixed for exactly that and the
   PERMANENT CONVERSATION ROW was not — `commitment K2 · self_reported →
   self_reported · reopened by lars` went into the feed, which this file's own
   comments call the record. A row is prose, not a heading, so the prettifier
   has both cases: `enumText` is the sentence form and `enumLabel` is the
   heading form OF THE SAME STRING, so neither can drift from the other, and
   checkRenderedRecordInvariant() proves no raw enum value reaches the reader
   through either. */
function enumText(v) { return String(fieldOr(v, "state not recorded")).replace(/_/g, "-"); }
function enumLabel(v) { return enumText(v).toUpperCase(); }

/* WHAT A SETTLED RECORD IS SETTLED BY — read off the verification value that
   was standing, never guessed from the object's kind (round 11 D3). A
   commitment can be settled by a deploy record exactly as a claim can, and
   round 10's reopen told K0 — verified by `checks`, never signed off by anyone
   — that "the prior sign-off preserved on the record". That is a claim about
   HOW it settled, minted from WHETHER it settled. One name per state, so the
   word and the value cannot drift. */
function preservedName(v) {
  return { self_reported: "sign-off", verified: "verification", accepted: "acceptance",
           unverified: "answer", open: "answer", proposed: "proposal" }[v] || enumText(v) + " state";
}

/* ===========================================================================
 * THE STATEMENT OF RECORD (round 7 D1 — and rounds 6 D1 and 4 D7 before it)
 *
 * Three rounds, three paths, one class: THE RECORD ASSERTED SOMETHING THAT DID
 * NOT HAPPEN. Round 4 compared an option's wording to a proposal's and called
 * agreement a contradiction. Round 6 minted an option without `agrees` and put
 * two identical sentences either side of an arrow. Round 7 computed "did it
 * change" against `prior.body` — the SYSTEM ROW'S DISPLAY SENTENCE, "lars
 * chose: Cut over Friday" — so `changed` was always true and the correction
 * chain's `from` was a string the record had never held.
 *
 * Each fix was correct about the relationship it checked. Each was blind to
 * WHERE ITS OPERANDS CAME FROM. So the operands stop being computed at the
 * comparison site and become a thing the object keeps:
 *
 *   1. EVERY RECORDED FIELD HAS A HISTORY. `amend()` writes the field, reads
 *      back what the object now holds, appends it, and returns the two adjacent
 *      recorded values — or null when nothing moved. There is no other way to
 *      change a recorded field, and checkRecordInvariant() proves it by
 *      comparing each field against the last value its own history contains.
 *
 *   2. A CORRECTION'S BEFORE AND AFTER CAN ONLY COME FROM THERE. A `change` is
 *      not something a caller can construct: amend() marks what it mints and
 *      checkCorrectionInvariant() refuses any entry carrying a change without
 *      that mark. `prior.body`, an option's label, a system row's sentence —
 *      every display string on the page — is now STRUCTURALLY unable to reach
 *      a correction chain, rather than merely absent from one by convention.
 *
 *   3. AND THE OPERANDS ARE VALIDATED, NOT JUST COMPARED. An entry whose `from`
 *      is not a value this object ever held is a defect even when `from` and
 *      `to` differ — which is exactly what round 7 shipped, and exactly what
 *      round 7's own check could not see, because it compared two strings and
 *      both of them were real strings.
 * ======================================================================== */

/* the fields this record keeps a history of. `get` reads the object; `set`
   writes it — one operation, so a field cannot move without being recorded and
   cannot be recorded without moving. `set: null` marks a DERIVED field: its
   value is a function of others, so amend() only reads it back.

   AND EACH FIELD DECLARES THE WORDS THE PAGE TALKS ABOUT IT WITH (round 11).
   `words` is not a phrasing list and it is not a denylist of sentences: it is
   the vocabulary of the FIELD, kept beside the field's own get/set so that "the
   surfaces are derived from the object's shape" is a fact about the code rather
   than a claim in a comment. It is what lets a checker notice that "still
   unanswered" is a sentence about `answer` — and refuse it when the transition
   that wrote it never read `answer`. A word missing from a list here costs a
   CATCH; it can never grant a sentence an exemption, because nothing consults
   `words` to decide that a sentence is allowed. */
const RECORDED = {
  statement:    { get: o => o.text,                                        set: (o, v) => { o.text = v; },
                  words: ["statement", "proposal"] },
  answer:       { get: o => (o.answerText == null ? null : o.answerText),  set: (o, v) => { o.answerText = v; },
                  words: ["answer", "answers", "answered", "unanswered"] },
  verification: { get: o => o.verification,                                set: (o, v) => { o.verification = v; },
                  /* AND THE GLYPH IS A WORD FOR A STATE (round 11, raised by the codex
                     reviewer). `~` and `green` are how this page says "self-reported" and
                     "checked by something other than the claimant" in one character, and a
                     vocabulary that omits them omits the shortest sentences on the page. */
                  words: ["verification", "verified", "unverified", "sign-off", "signed off",
                          "self-reported", "accepted", "acceptance", "checked", "open", "proposed",
                          "~", "green"] },
  due:          { get: o => (o.due == null ? null : o.due),                set: (o, v) => { o.due = v; },
                  words: ["due", "due date"] },
  assignee:     { get: o => (o.assignee == null ? null : o.assignee),      set: (o, v) => { o.assignee = v; },
                  words: ["assignee", "assigned", "reassigned"] },
  /* how the line under this object was read — a claim someone thought out loud,
     or a call. D1 was amended from one to the other before this window opened. */
  reading:      { get: o => (o.reading == null ? null : o.reading),        set: (o, v) => { o.reading = v; },
                  words: ["reading"] },
  /* "is this settled right now" — the fact a reopen changes when the
     verification enum does not (round 6's SELF-REPORTED → SELF-REPORTED) */
  settlement:   { get: o => (o.verification === "accepted" || o.verification === "verified" || !!o.resolvedAt) ? "settled" : "pending",
                  set: null,
                  words: ["settled", "settlement", "pending", "resolved"] }
};

/* ===========================================================================
 * A SENTENCE THAT QUANTIFIES OVER A HISTORY IS PRODUCED BY A QUERY ON IT
 * (round 11 — the rule nobody had written, and all four of round 10's
 * high-severity defects were instances of it)
 *
 * Every rule before this one governed THE PAIR THAT MOVED: from/to, validated
 * operands, a header minted by the branch that compared. Nothing governed a
 * claim about a field's HISTORY. "again", "still", "preserved", "nobody has",
 * "nothing other than", "already", "throughout" are quantifiers over an entire
 * field history, and round 10 shipped four of them written from the two values
 * at the ends of it — or from nothing at all:
 *
 *   "the question itself is unchanged and still unanswered"   ← read: assignee
 *   "nothing other than the claimant has checked it"          ← read: nothing
 *   "the prior sign-off preserved on the record"              ← asked: settlement
 *   "it is a unverified claim again"                          ← asked: nothing
 *
 * The record held an answer, a deploy record had checked it, nobody had ever
 * signed it off, and it had never been unverified. Four sentences, four
 * different fields, one missing rule.
 *
 * THE RULE. A sentence quantifying over a field's history is produced by a
 * QUERY on that history — `ever` / `before` / `last` — not by comparing the two
 * values at the ends of it. And it may only quantify over a field the
 * transition actually READ, which is structural rather than aspirational: a
 * query exists only on a view, a view exists only because reads() took one, so
 * a branch cannot ask about a field its transition never opened.
 *
 * THE THREE FAMILIES, and why the distinctions are not cosmetic — each one is
 * calibrated to what would actually answer the question honestly:
 *
 *   WHOLE-HISTORY — `again`, `ever`, `never`. Nothing but a query answers
 *     these: "again" asks whether the record has stood here BEFORE, and the two
 *     values at the ends of a transition cannot know. Round 10 appended it
 *     unconditionally and told a record reading ["verified","unverified"] that
 *     it was unverified *again*.
 *   PAST — `prior`, `preserved`, `earlier`, `before`, `nobody has`,
 *     `nothing … has`, `nothing other than`. These reach behind the current
 *     value, so they are answered by a query OR by a read at a point that is
 *     not the end of the history — reading the past is reading the past. Round
 *     10's D2 and D3 read only the end and asserted about the whole of it.
 *   CONTINUITY — `still`, `already`, `throughout`, `unchanged`, `no longer`,
 *     `stays`. These span this transition, so a read of the field at either end
 *     answers them — but a read of some OTHER field does not, which is the
 *     whole of round 10's D1: "still unanswered" written from two assignee
 *     views, beside a record holding an answer.
 *
 * WHAT THIS IS AND IS NOT. The token lists are a DETECTOR. They decide which
 * sentences must show their working; they never decide that a sentence is
 * allowed. A sentence backed by a query passes whatever words it uses, so the
 * list cannot be routed around by rephrasing, and a token missing from it costs
 * a catch rather than granting an exemption — the opposite polarity from the
 * denylist of phrasings CONVENTIONS rejects. The other half of the pair,
 * `RECORDED[f].words`, is declared on the data's own shape.
 * ======================================================================== */
const WHOLE_QUANT      = ["again", "ever", "never"];
const PAST_QUANT       = ["prior", "preserved", "earlier", "before", "nobody has", "nobody had",
                          "nobody was", "no one has", "nothing other than", "nothing has",
                          "nothing had", "nothing was"];
const CONTINUITY_QUANT = ["still", "already", "throughout", "unchanged", "no longer", "stays",
                          "remains", "remain", "keeps", "kept"];

/* a word, as a word: `"reopened".indexOf("open")` is 2 and that is how round
   10's chip checker cried wolf on every render between answering and
   reassigning a question. Hyphens are part of a token (`self-reported` is one
   word, and `reported` alone is not it). */
function hasToken(text, token) {
  const t = String(token).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
  return new RegExp("(^|[^a-z0-9-])" + t + "([^a-z0-9-]|$)", "i").test(String(text));
}
/* AND A QUANTIFIER BINDS INSIDE ITS OWN CLAUSE. `reported 4.7% of sessions
   still on legacy tokens — unverified` is two statements, and "still" is about
   the sessions, not about the verification that happens to be named after the
   dash. Asking the question of a whole paragraph is how a checker starts crying
   wolf, which is the failure mode round 10's chip clause shipped and this
   file's own doctrine names. */
function clausesOf(text) {
  return String(text).split(/\s*[·—;]\s*|,\s+|\.\s+/).filter(s => s.trim());
}
/* AND THE RECORD'S OWN WORDS ARE NOT THE PAGE'S SENTENCE. X1's option reads
   "Opaque-token issuance stays open until the 14 Aug freeze" — record it and the
   statement of record contains "stays" and "open", so a rule about what the PAGE
   writes would fire on a value the record holds. That is round 5's defect
   exactly: CONVENTIONS already says the page-integrity rules are about the
   page's own text, and this is the same rule needing the same exemption. The
   recorded value is removed; whatever the page wrote AROUND it is still read.
   ONLY MULTI-WORD VALUES ARE REMOVED. A state name is a single token, and
   `unverified` on screen is the PAGE's word for a state, not a sentence the
   record composed — removing it would have handed the rule a hole exactly the
   size of the vocabulary it polices. Content the record holds — a statement, an
   answer, a due date — is what a page can only be quoting. */
function pageWordsOf(o, text) {
  let t = text;
  Object.keys((o && o.recorded) || {}).forEach(f => (o.recorded[f] || []).forEach(e => {
    if (typeof e.value === "string" && /\s/.test(e.value.trim())) t = t.split(e.value).join(" ");
  }));
  return t;
}

/* a minted sentence's own parts, kept apart. `said` is often an array — the
   receipt's state line is five separate strings the render joins with a middot
   — and running them together makes one long word out of two sentences, which
   is how `no due date on recordnothing other than the claimant has checked it`
   would have hidden a quantifier from a test that matches words as words. */
function quantText(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(quantText).filter(s => s).join(" · ");
  if (isStated(v)) return quantText(v.said);
  return String(v.h != null ? v.h : v);
}

/* the mark amend() and stated() put on what they mint.
   WHAT THIS DEFENDS AGAINST, PRECISELY (round 8 minor): not page code. Anything
   running in this page can read `MINTED` by name and can simply call `amend()`,
   and no token stops it — a page cannot keep a secret from itself. What the
   mark does is make the record's before/after values UNREACHABLE FROM A
   LITERAL: a fixture entry, a hand-composed sentence, a value copied out of a
   rendered row cannot acquire it, because it is non-enumerable (so it does not
   survive a clone or a JSON round-trip) and regenerated per load (so it cannot
   be written down in the source). Every instance of this defect class arrived
   as a literal beside the record rather than a value out of it, and that is the
   shape the mark refuses. */
const MINTED = "minted:" + Math.random().toString(36).slice(2) + Date.now().toString(36);

function recordOf(o, field) {

}
/* every object's every recorded field starts with the value it was seeded

   first correction would compare against the value it just wrote.

   amendments that happened before this window opened, so their before and after

   exemption is where this defect class has entered every single time. */

      byField[f].forEach(c => h.push({ value: c.seed.to, tm: c.tm || null, by: c.who || null, how: "amended before this window opened" }));
      if (!sameValue(h[h.length - 1].value, loaded))
        h.push({ value: loaded, tm: null, by: null, how: "on the record when this room loaded" });

        const change = { of: f, from: h[i].value, to: h[i + 1].value };
        Object.defineProperty(change, "minted", { value: MINTED, enumerable: false });

           (round 8 D1). The fixture supplies the NOTE — how the line was being
           read, which is a thing only a person knows — and never the value: the
           value on screen is the one at this entry's own index in the record,
           so a seeded chain cannot paint a before its own history contradicts
           any more than a live one can. */

           never made any more than a live one can. */

       THROUGH THE SAME READER (round 9 D1a/D1c). There is no seeded exemption —
       an exemption is where this defect class has entered every single time. A
       fixture line describes what happened before this window opened, so it
       asserts nothing about a value a recorded field holds NOW and declares no
       claims; what the mint buys is that `.hap`, the chain header and the
       receipt's note can be held to ONE rule with no "unless it is data" branch
       in it, and a live transition that declares no claims stands out against
       the same-tick clause below. */
    /* a seeded fact chip that states a recorded value declares WHICH field, and
       the value is read out of the record here — the fixture supplies only the
       words around it, exactly as its correction header supplies only the verb.
       A chip about something the record does not keep (a name, a confidence,
       "3 sources") stays a string and is held to the clause that refuses an
       unminted chip stating a recorded value. */
    o.facts = (o.facts || []).map(f => seedFact(o, f));

       (round 11). There is no seeded exemption — an exemption is where this
       defect class has entered every single time — so a fixture line ending in
       "nobody has been assigned" or "never checked against a bill" supplies the

       itself, exactly as a seeded correction supplies only its verb and a
       seeded chip supplies only the field name. A fixture line with nothing to
       quantify stays a string. */
    o.history.forEach(h => {
      if (isStated(h.text)) return;

      h.text = stated(o, [], () => h.text);

        ? stated(o, [o.note.asks.of], v => o.note.text + o.note.asks.say(v))
        : stated(o, [], () => o.note);
    (o.corrections || []).forEach(c => { if (!isStated(c.hd)) c.hd = stated(o, [], () => c.hd); });
  });
}

/* a fixture fact chip that names a recorded field, read out of the record */
function seedFact(o, f) {
  if (!f || typeof f !== "object" || Array.isArray(f) || !f.read) return f;
  if (!RECORDED[f.read]) { console.error("[atrium invariant] a seeded fact names a field this record does not keep:", o.id, f.read); return String(f.read); }
  return stated(o, [f.read], v => (f.pre || "") +

/* ===========================================================================

       reviewer). A box used to carry one owner for all of its claims, so a

    ever(x) { return note("ever", x, h.slice(0, i + 1).some(y => sameValue(y.value, x))); },

    last(x) { let r = null; for (let k = i; k >= 0; k--) if (sameValue(h[k].value, x)) { r = h[k]; break; } return note("last", x, r); },

    before(x) { let r = null; for (let k = 0; k < i; k++) if (sameValue(h[k].value, x)) { r = h[k]; break; } return note("before", x, r); },

  Object.defineProperty(v, "owner", { value: o, enumerable: false });
  return v;
}

/* ONE READ, MANY SURFACES (round 9 D1). A transition narrates itself on five

/* DID THE THING THESE TWO SENTENCES ARE ABOUT ACTUALLY MOVE? An entry can carry

   which is how round 8's re-answer came to render `Answer of 09:13: X → now: X`,

/* --- DIGEST SEMANTICS ----------------------------------------------------
 * Three rules, all of which round 2 broke by treating "after the seen cursor"

 *   2. The absence window FREEZES at the moment you return. `absenceEnd` is
 *      pinned at boot and never moves, so nothing that happens while you are
 *      sitting in the room can join the group labelled SINCE YOU LEFT.

 * counts, the four filters, all of it, with no way back. BRIEF concept 1 says
 * the divider FADES TO MUTED; Slack keeps its New line until you leave the
 * channel. So the absence group is anchored to `absenceFrom` … `absenceEnd`,
 * both pinned at boot, and marking it seen moves the cursor and nothing else:
 * the divider stays, muted, still counting, still filterable, still reversible.
 */
function groupStart(r, scope) {
  if (scope === "absence") return idx(r, r.absenceFrom) + 1;
  if (scope === "return")  return idx(r, r.absenceEnd) + 1;
  return 0;                                  // room
}
function groupEnd(r, scope) {
  if (scope === "absence") return idx(r, r.absenceEnd);
  return r.messages.length - 1;              // return | room
}
function groupMessages(r, scope) {
  const a = groupStart(r, scope), b = groupEnd(r, scope);
  if (b < a) return [];
  const slice = r.messages.slice(a, b + 1);
  return scope === "room" ? slice : slice.filter(m => !isMine(m));
}
/* how much of the group is yours — reported, never counted as unseen */
function ownInGroup(r, scope) {
  const a = groupStart(r, scope), b = groupEnd(r, scope);
  if (b < a) return 0;
  return r.messages.slice(a, b + 1).filter(isMine).length;
}
function hasAbsenceGroup(r) { return idx(r, r.absenceFrom) < idx(r, r.absenceEnd); }
/* read, not gone: a group whose last row is behind the cursor is muted, not
   deleted — and it can be un-marked from the line that says so. */
function groupRead(r, scope) {
  const b = groupEnd(r, scope);
  return b >= groupStart(r, scope) && idx(r, r.seenAfter) >= b;
}
function absenceRead(r) { return groupRead(r, "absence"); }
function counts(r, scope) {
  const c = { need: 0, change: 0, discussion: 0, routine: 0 };
  groupMessages(r, scope).forEach(m => { c[msgClass(r, m)]++; });
  c.total = c.need + c.change + c.discussion + c.routine;
  return c;
}
/* one predicate, used by both the render and the count — a row is highlighted
   if and only if it is counted by the chip that was pressed */
function matchesFilter(r, m) {
  const f = S.ui.feedFilter;
  if (!f) return false;
  if (msgClass(r, m) !== f.k) return false;
  return groupMessages(r, f.scope).indexOf(m) >= 0;
}
/* the rail: unseen means unseen by you, so your own messages never count */
function unseenCount(r) {
  const cur = idx(r, r.seenAfter);
  return r.messages.slice(cur + 1).filter(m => !isMine(m)).length;
}

/* the trailer — counted, not typed, INCLUDING its lead clause and its glyph.
   Round 2 hardcoded "everything else is green" over derived numbers, so a room
   with a failure in it would still have announced that everything was green. */
function clearSummary(r) {
  const owed = attention(r).map(o => o.id);
  const objectivesOnTrack = r.objectives.filter(ob =>
    !r.objects.some(o => o.objectives.includes(ob.id) && owed.includes(o.id))).length;
  /* THE SCOPE IS ON SCREEN OR IT IS A LIE (round 5 D3). The trailer describes
     what is NOT in the pin — anything owed is above it, and counting it twice
     would be its own kind of wrong. But the scope lived only in this comment,
     so the trailer read "0 overdue" one line under an item labelled "overdue
     16h" and the reader had no way to know the two numbers were about
     different sets. It now says which set it counted, and reports the overdue
     items in the list above rather than silently dropping them. */
  const commitments = r.objects.filter(o => o.kind === "commitment" && !needsYou(o));
  const overdue = commitments.filter(o => o.overdue).length;
  const owedOverdue = r.objects.filter(o => needsYou(o) && o.overdue).length;
  const failures = r.objects.filter(o => { const h = recordOf(o, "verification"); return h[h.length - 1].value === "failed"; }).length;

  /* THE LEAD CONSULTS VERIFICATION, NOT JUST FAILURE AND LATENESS.
     Round 3 derived the glyph but still said "everything else is green" over
     eight objects nothing had checked — in the same sentence as "0/2 objectives
     clear of you". Green means checked by something other than the claimant, so
     the lead may only say it when that is true of everything outside the pin.
     When it is not, the lead says what is: how much is unverified, how much is
     owed, and what is actually settled. */
  /* AND THE TRAILER COUNTS OFF THE RECORD (round 11, raised by the grok
     reviewer). These were counted off `o.verification`, which is only pinned to
     the record by an invariant one function away; the histories ARE the record,
     and a line that says "6 of 10 still unverified" above ten of them reads
     them. */
  const held = (o, f) => { const h = recordOf(o, f); return h[h.length - 1].value; };
  const rest = r.objects.filter(o => !owed.includes(o.id));
  const unverified = rest.filter(o => UNSETTLED.includes(held(o, "verification"))).length;
  const openQs = rest.filter(o => held(o, "verification") === "open").length;
  const green = rest.filter(o => held(o, "verification") === "verified" || held(o, "verification") === "accepted").length;

  /* AN AGGREGATE IS A SENTENCE ABOUT MANY RECORDS, AND IT IS MINTED FROM ALL OF
     THEM (round 11, raised by the codex reviewer). This line — the one sentence
     on the page that speaks for ten objects at once — was a literal composed
     beside them, outside `paintSaid` and outside the `data-obj` walk, which is
     precisely the escape the doctrine's completeness claim said could not
     exist. It reads every object it counts; each claim carries the record it
     came from, so the checkers re-read ten records rather than one; and the
     counts are computed INSIDE the phrase, so moving any one of those records
     moves the sentence. The glyph comes out of the same read, because a glyph
     is a claim in one character. */
  const restViews = rest.map(x => fieldView(x, "verification"));
  const leadBox = say(restViews, function () {
    const vs = Array.prototype.slice.call(arguments);
    const fail = vs.filter(v => v.value === "failed").length;
    const unver = vs.filter(v => UNSETTLED.includes(v.value)).length;
    const opens = vs.filter(v => v.value === "open").length;
    return fail        ? `${fail} failure${fail === 1 ? "" : "s"} outside your list`
         : overdue     ? `${overdue} thing${overdue === 1 ? " is" : "s are"} late, none failed`
         : unver       ? `${unver} of ${vs.length} unverified`
         : opens       ? `${opens} open question${opens === 1 ? "" : "s"}`
         : owed.length ? "the list above is all of it"
         :               "everything else is verified";
  }, r.objects[0]);
  const glyph = failures ? "✗" : overdue ? "◆" : unverified ? "~" : openQs ? "?" : owed.length ? "◆" : "✓";
  const lead = leadBox;

  /* the scope, in words, derived from the same list the pin drew: "beyond the
     N above" when there is a list, "in this room" when there is not */
  const scope = owed.length
    ? `beyond the ${owed.length} above`
    : "in this room, and nothing is owed";

  /* LAST CHECK IS READ, NOT REMEMBERED (round 11 minor). `r.lastVerified` was a
     seeded string nothing ever wrote, so verifying a claim at 09:25 left the
     trailer reporting "last check 09:07" — a number about the record that the
     record had moved past. The most recent verification the record can DATE is
     the answer; when the record carries no dated one, the trailer says the
     number is the one the room loaded with rather than pretending it is fresh. */
  let lastCheck = null;
  (r.objects || []).forEach(o => ((o.recorded || {}).verification || []).forEach(e => {
    if (!sameValue(e.value, "verified") || !/^\d\d:\d\d$/.test(String(e.tm || ""))) return;
    if (!lastCheck || String(e.tm) > lastCheck) lastCheck = String(e.tm);
  }));

  return { objectivesOnTrack, objectivesTotal: r.objectives.length, lead, glyph, scope,
           commitments: commitments.length, overdue, owedOverdue, failures, unverified, green,
           lastVerified: lastCheck || r.lastVerified, lastCheckOnLoad: !lastCheck };
}

/* --- THE ATTENTION INVARIANT --------------------------------------------
 * No attention item exists without an action path and a rationale. This is
 * checked at render time rather than asserted in a receipt: if a future change
 * mints a dead item, the console says so on the very first paint.
 * ---------------------------------------------------------------------- */
const DEV = true;   /* prototype build — a shipping build would strip this */
function checkAttentionInvariant(r) {
  if (!DEV) return;
  attention(r).forEach(o => {
    if (!pinActions(o)) console.error("[atrium invariant] owed item has no action path — it is a dead end:", o.id, o);
    if (!normText(whyOf(r, o)).trim()) console.error("[atrium invariant] owed item has no rationale under WHY YOU:", o.id, o);
    if (!r.messages.some(m => linkedObject(r, m) === o) && !sourceRoomOf(o))
      console.error("[atrium invariant] owed item is unreachable — no row in this room and no cross-room source declared:", o.id, o);
    /* AND AN ACTION PATH IS ONE THE OBJECT CAN HONESTLY TAKE (round 9 D4). A
       dead end is an item with no action; this is the other failure, an item
       offering an action whose write it cannot survive. Round 9 rendered
       "Answer in your own words →" on a commitment owned by somebody else and
       on every kind it could not serve, and send() then called
       answerDecision() for all of them — recording the typed sentence as the
       object's own statement and accepting it in the sender's name, straight
       past the ownership guard applyEffect() has enforced since round 4. */
    if (/data-bind/.test(pinActions(o)) && !canBind(o))
      console.error("[atrium invariant] an attention item offers the bound composer for something it cannot honestly " +
        "record — what a reader types would be written into this object as its own statement and accepted in their " +
        "name:", o.id, o.kind, "owner:", (o.kind === "commitment" ? commitmentOwner(o) : o.owedTo));
  });
}

/* --- THE ROW-SCOPE INVARIANT ---------------------------------------------
 * Highlighted rows ⊆ rows linked to THIS room's attention items. Checked
 * against the rendered DOM, not against the function that drew it, so a future
 * change that re-globalises the linkage is caught by the thing on screen.
 * ---------------------------------------------------------------------- */
function checkRowScopeInvariant(r) {
  if (!DEV) return;
  const owned = attention(r);
  document.querySelectorAll('#feed .mrow[data-cls="need"], #feed .mrow.hit').forEach(el => {
    const m = msg(r, el.dataset.msg);
    if (!m) return;
    const o = linkedObject(r, m);
    if (el.dataset.cls === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] row classed NEED is not linked to this room's attention collection:", el.dataset.msg, o && o.id);
    if (el.classList.contains("hit") && S.ui.feedFilter && S.ui.feedFilter.k === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] highlighted row is outside this room's attention collection:", el.dataset.msg, o && o.id);
  });
  /* and the other direction: the count and the highlight must be the same
     predicate, so the two numbers can differ only in cardinality, never in set */
  const rows = attentionRows(r);
  if (rows.some(m => attention(r).indexOf(linkedObject(r, m)) < 0))
    console.error("[atrium invariant] attentionRows() returned a row outside attention()");
}

/* --- THE QUOTATION INVARIANT ---------------------------------------------
 * Round 3's cardinal defect, encoded so it cannot come back: anything rendered
 * as a person's words must prove where the words came from. Round 4 found the
 * encoding CIRCULAR and this is the closure of that loophole.
 *
 *   1. Every element in a quotation context (<q>, .ex, .quoted) carries
 *      data-quoted, and it resolves — either "msg:<id>[@room]", in which case
 *      the rendered text must actually appear in that message AND that message
 *      must have been authored by a human (origin 'typed' or 'seeded'), or
 *      "typed", in which case the text must be in the human-speech register.
 *      A message the PAGE authored on a human's behalf (origin 'chosen') can
 *      never satisfy a quotation context, however real its text is: the defect
 *      is the attribution, not the invention. Round 4 checked only that the
 *      cited message existed and contained the text — which a page-fabricated
 *      message trivially does, because the page wrote it to contain the text.
 *   2. No quotation marks are rendered anywhere else — SCOPED TO PAGE-AUTHORED
 *      TEXT. Round 4 walked every text node on the page, so a human typing
 *      “like this” tripped a page-integrity rule on their own words, on every
 *      render. A person's typographic quotes are their business; the rule is
 *      about what the PAGE puts in quotation marks.
 *   3. A row the page authored (origin 'chosen') is never dressed as human
 *      speech: not classed `.me`, no quotation marks in it, no quotation
 *      context inside it.
 * ---------------------------------------------------------------------- */
const QUOTED_SEL = "q, .ex, .quoted";
/* verbatim text from a NON-HUMAN source, rendered as a record rather than as
   speech: same citation proof, no quotation marks, no human-voice exemption */
const CITED_SEL = "[data-cited]";
/* text a HUMAN produced, marked at render. Two rules read it: the quote-mark
   walk skips it (their quotes are theirs) and the record-text check skips it
   (someone may legitimately type the word "undefined"). Everything not marked
   is page-authored and is held to both.
   ROUND 5 D4: this was set on feed message bodies and nowhere else, so a
   human's words tripped the record-text rule everywhere ELSE they are rendered
   — the correction chain's quote, the receipt's provenance excerpt, an object's
   own text after a bound answer, the facts and history a verification note
   lands in. `human()` / `voiced()` (see above) mark those too, per fragment, so
   a page sentence that quotes a person keeps the page's half checked. */
const HUMAN_SEL = '[data-voice="human"]';

/* strip only a MATCHED PAIR of wrapper quotes the page itself added, plus a
   truncation ellipsis. Round 4 stripped every curly quote in the string, so a
   quotation of a message that legitimately contained “…” no longer matched the
   message it cited and the checker reported invented speech about real words. */
function quotedText(el) {
  let s = el.textContent.trim().replace(/…$/, "").trim();
  if (s.length > 1 && /^[“"]/.test(s) && /[”"]$/.test(s)) s = s.slice(1, -1).trim();
  return s;
}

function checkQuotationInvariant() {
  if (!DEV) return;
  document.querySelectorAll(QUOTED_SEL).forEach(el => {
    const ref = el.getAttribute("data-quoted");
    const text = quotedText(el);
    if (!ref) return console.error("[atrium invariant] quoted text with no provenance — nothing proves anyone said this:", text, el);
    if (ref === "typed") {
      if (!S.typed.some(s => s.indexOf(text) === 0 || s === text))
        console.error("[atrium invariant] quoted as typed by a human, but no human typed it:", text, el);
      return;
    }
    const [id, roomId] = ref.replace(/^msg:/, "").split("@");
    const home = roomId ? S.rooms[roomId] : room();
    const m = home && msg(home, id);
    if (!m) return console.error("[atrium invariant] quotation cites a message that does not exist:", ref, el);
    /* THE LOOPHOLE, CLOSED. A quotation may only cite a message a human wrote. */
    if (m.origin !== "typed" && m.origin !== "seeded")
      return console.error("[atrium invariant] quotation cites a message the page authored (origin " +
        m.origin + ") — a page-written sentence can never be a person's words:", ref, text, el);
    if (plain(m.body).indexOf(text) < 0)
      console.error("[atrium invariant] quoted text is not in the message it cites — this is invented speech:", ref, text, el);
  });

  /* A MACHINE'S LINE IS CITED, NOT QUOTED (round 7 D6). Same proof of origin —
     the message exists in the loaded record and actually contains this text —
     minus the one clause that is about people: a parity run is not somebody's
     words, is not rendered as if it were, and is held to the page-authored text
     rules like every other string the page did not get from a human. */
  document.querySelectorAll(CITED_SEL).forEach(el => {
    const ref = el.getAttribute("data-cited");
    const text = quotedText(el);
    const [id, roomId] = ref.replace(/^msg:/, "").split("@");
    const home = roomId ? S.rooms[roomId] : room();
    const m = home && msg(home, id);
    if (!m) return console.error("[atrium invariant] a system record cites a message that does not exist:", ref, el);
    if (plain(m.body).indexOf(text) < 0)
      console.error("[atrium invariant] a system record's text is not in the line it cites:", ref, text, el);
  });

  /* no stray quotation marks in PAGE-AUTHORED text: every “ ” the page renders
     must sit inside a checked quotation context. This is what makes rule 1
     exhaustive rather than a convention someone can forget to follow — and
     skipping human-authored bodies is what stops it crying wolf on input. */
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!/[“”]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
      if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
      return p.closest(QUOTED_SEL) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while ((n = walker.nextNode()))
    console.error("[atrium invariant] quotation marks outside a checked quotation context:", n.nodeValue.trim(), n.parentElement);

  /* rule 3: a page-authored answer row is a system record, and must look like
     one. If a future change routes a chosen answer back through the human path
     — actor S.me, body in quotation marks, or a quotation context inside it —
     this fires before anyone reads the row and believes it. */
  document.querySelectorAll('#feed .mrow[data-origin="chosen"]').forEach(el => {
    if (el.classList.contains("me"))
      console.error("[atrium invariant] a row the page authored is classed as the human's own:", el.dataset.msg, el);
    if (el.querySelector(QUOTED_SEL))
      console.error("[atrium invariant] a row the page authored contains a quotation context:", el.dataset.msg, el);
    if (/[“”]/.test(el.textContent))
      console.error("[atrium invariant] a row the page authored is rendered in quotation marks:", el.dataset.msg, el);
  });
}

/* --- THE RECORD-TEXT INVARIANT (round 4 D2) -------------------------------
 * No page-authored string on screen may contain `undefined`, `null` or `NaN`.
 * Those are the names of JavaScript values, not facts about anything, and a
 * permanent record that contains one is a record that is wrong. Human-authored
 * text is exempt: a person may type the word "undefined" and that is their
 * sentence, not the page's failure — the round-4 D4 lesson, applied here too.
 * Attributes count: a tooltip is rendered text a user reads.
 * ---------------------------------------------------------------------- */
const BAD_VALUE = /\b(undefined|null|NaN)\b/;
function checkRecordTextInvariant() {
  if (!DEV) return;
  [document.querySelector(".app"), $("toast")].forEach(root => {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (!BAD_VALUE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode()))
      console.error("[atrium invariant] a rendered record contains an unguarded optional field:", n.nodeValue.trim(), n.parentElement);

    root.querySelectorAll("[title], [aria-label]").forEach(el => {
      if (el.closest(HUMAN_SEL)) return;
      ["title", "aria-label"].forEach(a => {
        const v = el.getAttribute(a);
        if (v && BAD_VALUE.test(v))
          console.error("[atrium invariant] a rendered " + a + " contains an unguarded optional field:", v, el);
      });
    });
  });
}

/* --- THE AMENDMENT INVARIANTS (round 6 D1) --------------------------------
 *
 * Round 6's blocking defect was a false sentence about the record: the receipt
 * rendered two byte-identical statements either side of an arrow and said the
 * second was "not what was proposed". Nothing on the page could see it. It was
 * not a quotation, so the quotation rule was silent; every field was populated,
 * so the record-text rule was silent; every box had a real height and every
 * control hit-tested to itself, so the geometry rule was silent. It was
 * ROUND 4'S D7 CLASS arriving through the fallback ROUND 4 ITSELF ADDED — a fix
 * opening a path around an earlier fix's guard.
 *
 * That is the reason there are two checks here and not one line of code. The
 * one-line fix (`agrees: true`) is a value; these are the relationships that
 * value has to satisfy, asserted where a future edit cannot route around them:
 *
 *   1. AN OPTION THAT IS THE PROPOSAL AGREES WITH IT. If an option's statement
 *      is the proposal's own sentence, `agrees` must be true. This is checked
 *      against the strings, not against the flag, so minting an option whose
 *      statement is `o.text` and forgetting the flag is caught at the source —
 *      before anyone clicks it, on the render that puts it on screen.
 *
 *   2. A CORRECTION THAT CLAIMS A CHANGE HAS ONE. An entry in a correction
 *      chain either carries `change: {of, from, to}` — in which case `from` and
 *      `to` must actually differ — or it carries none, in which case it may not
 *      be worded as an amendment. "Amended" and "re-affirmed" are different
 *      facts about a record and the chain has to be able to tell them apart.
 *
 *   3. AND ITS BEFORE AND AFTER ARE VALUES THE OBJECT ACTUALLY HELD, IN THAT
 *      ORDER (round 7 D1). Rule 2 asks whether two operands differ. It cannot
 *      ask where they came from, which is why it passed honestly on a `from`
 *      that had been read out of a rendered sentence. Rule 3 asks the record.
 *      See THE STATEMENT OF RECORD above for the machinery it reads.
 *
 * All three walk STATE, not the DOM: a correction chain is wrong the moment it
 * is written, whether or not its receipt happens to be open.
 * ---------------------------------------------------------------------- */
function checkAnswerIdentityInvariant() {
  if (!DEV) return;
  eachObject(o => {
    const proposal = o.proposedText || o.text;
    (o.options || []).forEach(opt => {
      if (!sameText(opt.statement, proposal)) return;
      if (opt.agrees === true) return;
      console.error("[atrium invariant] an option whose statement IS the proposal is not marked as agreeing with it — " +
        "answering with it would record a contradiction between two identical sentences:", o.id, opt.label, opt);
    });
  });
}

/* NOTHING CHANGES A RECORDED FIELD WITHOUT RECORDING IT (round 7 D1). The
   history is only worth checking a correction against if it is complete, so
   this compares every recorded field to the last value its own history holds.
   A future edit that assigns `o.text = …` directly — the shape every one of
   these three defects had in common — is caught on the render after it runs,
   whether or not it ever reaches a correction chain. */
function checkRecordInvariant() {
  if (!DEV) return;
  eachObject((o, r) => {
    /* A SPENT FACT IS NOT A FACT (round 8 D3). `reopenedAt` says this object is
       STANDING reopened. Round 8 set it in reopen() and cleared it nowhere, so
       a re-answered question was settled and standing reopened at the same
       time — and its own current answer row painted the second while the
       receipt header, the lens and the object's state painted the first. Two
       fields of one record cannot disagree about whether it is open. */
    if (o.reopenedAt && RECORDED.settlement.get(o) === "settled")
      console.error("[atrium invariant] this object is settled and standing reopened at the same time — one of the two " +
        "is a fact that stopped being true and nothing cleared it:", o.id, "reopened " + o.reopenedAt);
    /* AND A ROW THAT WAS REPLACED KNOWS WHEN (round 8 D4). A bound answer row
       that is no longer the object's answer has been superseded by definition —
       the row that replaced it is stamped and `answerMsg` points straight at
       it — so printing "replaced · time not recorded" over it is a fallback
       painted across a fact the record is holding. Same family as
       "was due undefined". */
    (r.messages || []).forEach(m => {
      if (m.boundTo === o.id && o.answerMsg && m.id !== o.answerMsg && !m.supersededAt)
        console.error("[atrium invariant] an answer row this object has replaced carries no time of replacement, and the " +
          "record holds one — the row that superseded it is stamped:", o.id, m.id, "superseded by", o.answerMsg);
    });
    Object.keys(RECORDED).forEach(f => {
      const h = (o.recorded || {})[f];
      if (!h || !h.length)
        return console.error("[atrium invariant] a recorded field has no history — nothing can prove what this object held:", o.id, f);
      const now = RECORDED[f].get(o);
      if (!sameValue(h[h.length - 1].value, now))
        console.error("[atrium invariant] a recorded field was changed without being recorded — the object holds a value its own history " +
          "does not contain, so any correction about it would be comparing against fiction:", o.id, f, h[h.length - 1].value, "→", now);
    });
    /* AND THE TWO HALVES OF THE RECEIPT AGREE ABOUT WHETHER ANYTHING HAPPENED
       (round 7 D5). Reschedule moved a due date and reassignment moved an
       assignee; WHAT HAPPENED said so and CORRECTION CHAIN, forty pixels below,
       rendered "no corrections — this object has never been amended". One
       receipt, two contradictory claims about the same click. A field that has
       moved and a chain that is empty cannot both be right. */
    const amended = Object.keys(RECORDED).some(f => ((o.recorded || {})[f] || []).length > 1);
    if (amended && !(o.corrections || []).length)
      console.error("[atrium invariant] this object's record has been amended and its correction chain is empty — the receipt " +
        "reports the amendment in one section and denies it in the next:", o.id,
        Object.keys(RECORDED).filter(f => ((o.recorded || {})[f] || []).length > 1).join(", "));
  });
}

/* --- WHAT THE READER SEES (round 8 D1) -----------------------------------
 * A correction entry has two halves. `change` is the half the record proves;
 * `was` and `after` are the half a reader actually reads, and round 8 checked
 * only the first. So three transitions painted a hardcoded English sentence
 * about the record's prior contents — "nothing was on the record as its
 * answer", "nobody had settled it", "nobody has checked it" — beside a
 * perfectly valid, perfectly minted change about a DIFFERENT FIELD, and the
 * checker passed at zero errors while the receipt contradicted itself two
 * entries apart.
 *
 * Every painted operand is therefore a record read (stated()) and is held to
 * three things, in order: it was minted, so it came out of the record and not
 * out of a literal; every claim it declares still matches the record at the
 * index it was read from; and where it names the same field as the entry's
 * `change`, the two agree about which value was before and which after. The
 * third is what catches a sentence read AFTER the mutation it describes.
 * ---------------------------------------------------------------------- */
function checkStatedOperand(o, c, side, v) {
  if (!isStated(v)) {
    console.error("[atrium invariant] a correction entry paints a " + side + " that was not read out of the record — " +
      "stated() is the only thing that may produce one, so this is a sentence written beside the record " +
      "rather than out of it, and nothing constrains what it claims:", o.id, voicedText(c.hd), voicedText(v));
    return;
  }
  if (v.minted !== MINTED) {
    console.error("[atrium invariant] a correction entry's painted " + side + " carries claims the record did not mint:",
      o.id, voicedText(c.hd), voicedText(v));
    return;
  }
  (v.claims || []).forEach(cl => {
    const h = (o.recorded || {})[cl.of];
    if (!h || !h[cl.at]) {
      console.error("[atrium invariant] a painted " + side + " cites a point in a record that does not exist:",
        o.id, voicedText(c.hd), cl.of, cl.at);
      return;
    }
    if (!sameValue(h[cl.at].value, cl.value)) {
      console.error("[atrium invariant] a painted " + side + " was written from a value this record does not hold at " +
        "that point — the sentence on screen is describing a state the object never had:",
        o.id, voicedText(c.hd), cl.of, "@" + cl.at, cl.value, "vs", h[cl.at].value);
      return;
    }
    /* and when the entry's own change names the same field, the sentence and
       the proof have to be talking about the same before and the same after —
       a `was` read AFTER the amendment lands here.
       A HEADER IS EXEMPT FROM THIS ONE CLAUSE AND ONLY THIS ONE, because a
       header narrates the whole transition and so legitimately reads BOTH ends
       of the same field ("SIGNED OFF · SELF-REPORTED → VERIFIED"). It is held
       to the mint and to the claim/record agreement exactly as the operands
       are; what it is not held to is a rule about having one side. */
    if (side !== "header" && c.change && c.change.of === cl.of) {
      const want = side === "before" ? c.change.from : c.change.to;
      if (!sameValue(want, cl.value))
        console.error("[atrium invariant] a correction entry's painted " + side + " and its recorded change disagree about " +
          "the " + cl.of + " — one of them is describing the wrong side of this amendment:",
          o.id, voicedText(c.hd), cl.value, "vs", want);
    }
  });
}

function checkCorrectionInvariant() {
  if (!DEV) return;
  eachObject(o => {
    (o.corrections || []).forEach(c => {
      checkStatedOperand(o, c, "before", c.was);
      checkStatedOperand(o, c, "after", c.after);
      /* AND THE HEADER IS AN OPERAND (round 9 D1b). `RESCHEDULED · DUE DATE
         AMENDED` was a bare literal, so the entry's loudest claim — the one in
         12px caps at the top of it — was the one thing on the entry nothing
         checked. Every clause the two painted operands answer to, the header
         answers to as well. */
      checkStatedOperand(o, c, "header", c.hd);
      const hdText = voicedText(c.hd);
      /* AND THE AMENDMENT AND THE WHAT-HAPPENED LINE WRITTEN IN THE SAME TICK
         ARE ABOUT THE SAME FIELD (round 9 D1a). This is the clause that would
         have caught round 9 from the state side: reschedule minted a `due`
         change, painted two `due` operands, and pushed a history line that read
         no field at all — so the receipt's first section narrated a move its
         own chain denied. Where an entry's own painted operands are about the
         field it amended, the line WHAT HAPPENED writes at that moment has to
         have read that field too. It is deliberately not "every amended field":
         a change carried as a fallback about a field neither sentence mentions
         (the settlement behind a re-answer) is not what the line is about. */
      if (c.change && claimedFields(c.was).concat(claimedFields(c.after)).indexOf(c.change.of) >= 0) {
        const sameTick = (o.history || []).filter(h => h.tm === c.tm && isStated(h.text));
        if (sameTick.length && !sameTick.some(h => claimedFields(h.text).indexOf(c.change.of) >= 0))
          console.error("[atrium invariant] a transition amended the " + c.change.of + " and wrote a WHAT HAPPENED line " +
            "in the same moment that never read it — the receipt's first section is narrating this amendment from " +
            "values composed beside the record:", o.id, hdText, "@" + c.tm);
      }
      /* an arrow with the same thing on both sides is round 6's defect, and it
         is a defect in a heading exactly as it is in a body */
      if (/→/.test(hdText)) {
        const sides = hdText.split("→");
        if (sameText(sides[0].split("·").pop(), sides[1].split("·")[0]))
          console.error("[atrium invariant] a correction entry's header puts the same state on both sides of an arrow — " +
            "it is asserting a change that did not happen:", o.id, voicedText(c.hd));
      }
      if (c.change) {
        const ch = c.change;
        /* WHERE THE OPERANDS CAME FROM (round 7 D1). Round 7 compared `from`
           against `to`, found them different, and passed honestly — because the
           value it was reading had been fabricated at the source: `prior.body`,
           the system row's display sentence. Inequality was never the whole
           question. The first thing to establish about a before and an after is
           that the record ever held them. */
        if (ch.minted !== MINTED) {
          console.error("[atrium invariant] a correction entry carries a before and after the record did not mint — " +
            "amend() is the only thing that may produce one, so this came from somewhere the object never wrote down " +
            "(a rendered sentence, an option's label, a row's body):", o.id, voicedText(c.hd), ch.of, ch.from, "→", ch.to);
          return;
        }
        if (sameValue(ch.from, ch.to)) {
          console.error("[atrium invariant] a correction entry asserts the " + ch.of +
            " changed, but its before and after are the same text — the record is claiming an amendment it never made:",
            o.id, voicedText(c.hd), normText(ch.from));
          return;
        }
        if (!everHeld(o, ch.of, ch.from)) {
          console.error("[atrium invariant] a correction entry's `before` is not a value this object has ever held — " +
            "the record is contradicting itself about what it used to say:", o.id, voicedText(c.hd), ch.of, ch.from);
          return;
        }
        if (!heldInSequence(o, ch.of, ch.from, ch.to))
          console.error("[atrium invariant] a correction entry claims one value became another, but the record never went " +
            "straight from the first to the second — the arrow is asserting a transition that is not in this object's history:",
            o.id, voicedText(c.hd), ch.of, ch.from, "→", ch.to);
        return;
      }
      /* No `change` means the entry asserts nothing was amended, so it may not
         be PUNCTUATED as though something was. The arrow is the claim — it is
         what the header and the rendered body both use to say "this became
         that" — so an entry with no before/after may not carry one. Syntax, not
         a word list: a keyword sniffer cannot tell "amended" from "nothing was
         amended", and correctionHtml() drops the arrow for these entries too,
         so the check and the render are asserting the same thing. */
      if (/→/.test(hdText))
        console.error("[atrium invariant] a correction entry's header claims a transition but the entry records no " +
          "before and after that differ — the arrow is asserting a change nothing proves:", o.id, hdText);
    });
  });
}

/* --- AND THE PAGE IS PAINTING THAT, AND NOTHING ELSE (round 8 D1 and D2) ---
 * Every check above walks STATE. Round 8's blocking defect was not in the
 * state: the state was minted, provable and true, and the sentence beside it on
 * screen was false. A guarantee that covers the stored representation and not
 * the rendered one protects the data and lies to the reader — so this one reads
 * the DOM and asks what a reader can actually see:
 *
 *   1. A correction entry paints the operands it was minted with. Not a
 *      paraphrase of them, not a literal the render path substituted: the same
 *      characters, in the two spans a reader reads.
 *   2. An arrow appears in the body only where there is a recorded change, and
 *      never with the same thing on both sides.
 *   3. A TRANSITION ROW IN THE CONVERSATION IS HELD TO THE SAME RULE. The feed
 *      is what this file calls the record, and round 8 wrote
 *      `commitment K2 · self_reported → self_reported · reopened by lars` into
 *      it — round 6's defect verbatim, in the permanent row, one screen below
 *      the header round 6 fixed. A row that paints an arrow carries the change
 *      that amend() minted, its two sides differ, the record went straight from
 *      one to the other, and both are painted as the values the record holds.
 *   4. And no raw enum value reaches a reader through any of it. The vocabulary
 *      is collected from the record itself rather than from a list somebody has
 *      to maintain: any value a recorded field has ever held that is spelled in
 *      snake_case may not appear that way in page-authored text.
 *
 * --- EVERY SURFACE THAT NARRATES THE RECORD, NOT THE TWO THAT WERE CHECKED ---
 * (round 9 D1c.) Rounds 4, 6, 7, 8 and 9 are one defect class arriving through
 * five different doors, and round 9's door was that this function inspected
 * `.corr[data-corr-obj]` and `#feed .mrow[data-msg]` — so `.hap`, the first
 * thing in the receipt, was unwatched, and rescheduling twice let it narrate a
 * move the chain forty pixels below correctly denied.
 *
 * A list of selectors is a denylist by another name, so the list below is not a
 * list of places anyone remembered: it is the complete set of CHANNELS the state
 * exposes for talking about an object, taken from the object's own shape. An
 * object is rendered from exactly these properties and nothing else —
 *
 *   o.text / o.question    the object's own statement — a RECORDED FIELD, and
 *                          checkRecordInvariant() already holds every recorded
 *                          field to the last value its own history contains
 *   o.corrections[].hd     → `.corr .hdt`      the chain header       (5a)
 *   o.corrections[].was    → `.corr .was`      the chain body, before (1)
 *   o.corrections[].after  → `.corr .aft`      the chain body, after  (1)
 *   o.corrections[].fact   → `.corr .ftx`      the entry's prose line (5f)
 *   o.corrections[].quote  a person's own typed characters — the attribution
 *                          invariant resolves it to text they really typed
 *   o.history[].text       → `.hap .htx`       WHAT HAPPENED          (5b)
 *   o.facts[]              → `.oitem`, `.acard`, `.acomp`  lens fact chips and
 *                            pin copy — the one line about an object most
 *                            readers ever see                          (5c)
 *   o.note                 → `.rc-foot .note`  the receipt's closing copy (5c)
 *   receiptState(o)        → `.rc-state`       the receipt's state line (5g)
 *   o.provenance[]         quotations and machine records — held by the
 *                          attribution invariant, which resolves every excerpt
 *                          to a message that exists and contains the text
 *   feed rows (m.sysFor)   → `#feed .mrow .mbody`  the permanent record  (3, 5d)
 *   the toast              → `#toastMsg`, checked in toast() itself, because a
 *                          toast is raised AFTER the render it belongs to and
 *                          is gone three seconds later                  (5e)
 *
 * Three object-scoped surfaces are deliberately NOT on that list, and each has
 * a named reason rather than an oversight:
 *
 *   o.text / o.question    the statement itself — a RECORDED FIELD, and
 *                          checkRecordInvariant() holds every recorded field to
 *                          the last value its own history contains, so it
 *                          cannot paint a value the record does not hold
 *   objectTag() `.tag`     a row's status chip. Every state word in it goes
 *   sysTag()               through enumText() on a recorded field, held as
 *                          above; the rest is a person's name, which belongs to
 *                          the attribution invariant, not to this one
 *   whyOf() `.why`         WHY YOU — a rationale about the READER, not a claim
 *                          about a recorded field; checkAttentionInvariant()
 *                          asserts every owed item has one
 *
 * The list was NOT complete when round 10 first wrote it, and that is the
 * point of writing the reasons down: two blind foreign-lineage reviewers both
 * found `.corr .fact` — a prose line inside the correction entry, beneath two
 * operands and a header that were all record reads — narrating a reschedule
 * that moved nothing, and both found `receiptState()` composing the loudest
 * sentence in a receipt off the object rather than out of its history. A list
 * of selectors somebody remembered is a denylist; a list derived from the
 * object's own shape, with the exclusions argued, is the only kind that can be
 * audited by the next reader.
 *
 * The strength differs by channel, deliberately, and here is which and why:
 *
 *   - `.hap`, `.corr .hdt`, `.corr .was`, `.corr .aft`, `.corr .ftx`,
 *     `.rc-foot .note`, `.rc-state` — the receipt's own record surfaces, which
 *     the page writes every character of. A mint is REQUIRED: an element here
 *     with no minted sentence behind it is a literal, and that is the defect.
 *     Seeded entries are minted too (see seedRecord) — there is no "unless it
 *     is fixture data" branch.
 *   - fact chips and feed rows carry a person's own typed characters as well as
 *     the page's (`human(evidence)` lands in both), and holding a human's
 *     sentence to a page-integrity rule is round 5's defect. So a mint is not
 *     required there; instead, where a mint reaches the surface the painted
 *     characters must be the minted ones and its claims must still re-read —
 *     AND an unminted chip may not state a value the record holds, with the
 *     vocabulary derived from the object's own history rather than from a list.
 *     Feed rows additionally answer to (3) and must carry one minted segment.
 * ---------------------------------------------------------------------- */
/* the painted characters of an element against the sentence it was minted with,
   plus a re-read of every record fact that sentence declares. Used by all five
   of the surfaces below, so they cannot drift apart. */
function checkPaintedSentence(where, id, node, box) {
  if (normText(node.textContent) !== normText(voicedText(box)))
    return console.error("[atrium invariant] " + where + " is painting a sentence that is not the one the record " +
      "minted — the words on screen and the words that were checked are two different sentences:",
      id, node.textContent.trim(), "vs", voicedText(box));
  checkStatedBox(where, id, box);
}

/* a minted sentence, re-read against the record it says it came from: its point
   reads, its history queries, and the rule that the words it quantifies with
   are backed by one of the two. Every surface goes through here, so a surface
   cannot be held to a weaker rule than its neighbour. */
function checkStatedBox(where, id, box) {
  if (!box.owner && !(box.claims || []).length && !(box.queries || []).length) return;
  (box.claims || []).forEach(cl => {
    const o = cl.owner || box.owner;
    if (!o) return;
    const h = (o.recorded || {})[cl.of];
    if (!h || !h[cl.at])
      return console.error("[atrium invariant] " + where + " cites a point in a record that does not exist:", o.id, cl.of, cl.at);
    if (!sameValue(h[cl.at].value, cl.value))
      console.error("[atrium invariant] " + where + " was written from a value this record does not hold at that " +
        "point — the sentence on screen is describing a state the object never had:",
        o.id, cl.of, "@" + cl.at, cl.value, "vs", h[cl.at].value);
  });
  checkQueries(where, id, box);
  checkQuantifiers(where, id, box);
}

/* ASK THE HISTORY THE SAME QUESTION AGAIN. A point read is re-read against the
   record on every paint; before round 11 a question about the whole history was
   answered once and thrown away, so `ever("verified")` could have been decided
   against an object, a moment, or a copy, and nothing on the page could tell. */
function checkQueries(where, id, box) {
  (box.queries || []).forEach(q => {
    const o = q.owner || box.owner;
    if (!o) return;
    const h = (o.recorded || {})[q.of];
    if (!h) return console.error("[atrium invariant] " + where + " asked a question about a field this record does not keep:", id, q.of);
    let now;
    const upto = h.slice(0, Math.min(q.at, h.length - 1) + 1);
    if (q.q === "ever") now = upto.some(x => sameValue(x.value, q.arg));
    else if (q.q === "everSet") now = upto.some(x => x.value != null);
    else if (q.q === "last") { now = null; for (let k = Math.min(q.at, h.length - 1); k >= 0; k--) if (sameValue(h[k].value, q.arg)) { now = h[k]; break; } }
    else { now = null; for (let k = 0; k < Math.min(q.at, h.length); k++) if (sameValue(h[k].value, q.arg)) { now = h[k]; break; } }
    const same = (q.q === "ever" || q.q === "everSet") ? now === q.got
      : (now == null) === (q.got == null) && (now == null || (sameValue(now.value, q.got.value) && now.tm === q.got.tm));
    if (!same)
      console.error("[atrium invariant] " + where + " was written from an answer this record no longer gives — the " +
        "sentence quantifies over a history that says something else:", id, q.of, q.q + "(" + q.arg + ")", q.got, "vs", now);
  });
}

/* THE RULE ITSELF. For every recorded field whose own vocabulary appears in the
   sentence, a quantifier over that field's history has to be backed by a query
   on it; a quantifier about continuity has to be backed by at least a read of
   it. A sentence that names no field's words quantifies over nothing and is not
   this rule's business. */
function checkQuantifiers(where, id, box) {
  /* the objects this sentence reads — one for most sentences, several for an
     aggregate. Every one of them is asked, so a sentence that quantifies over a
     field must have read THAT field, of SOME object it declares. */
  const owners = [];
  (box.claims || []).concat(box.queries || []).forEach(c => {
    const o = c.owner || box.owner;
    if (o && owners.indexOf(o) < 0) owners.push(o);
  });
  if (box.owner && owners.indexOf(box.owner) < 0) owners.push(box.owner);
  if (!owners.length) return;
  let text0 = String(quantText(box.said)).replace(/\s+/g, " ").trim();
  owners.forEach(o => { text0 = pageWordsOf(o, text0); });
  clausesOf(text0).forEach(text => {
    const whole = WHOLE_QUANT.filter(q => hasToken(text, q));
    const past = PAST_QUANT.filter(q => hasToken(text, q));
    const cont = CONTINUITY_QUANT.filter(q => hasToken(text, q));
    if (!whole.length && !past.length && !cont.length) return;
    Object.keys(RECORDED).forEach(f => {
      const words = (RECORDED[f].words || []).filter(w => hasToken(text, w));
      if (!words.length) return;
      const queried = (box.queries || []).some(q => q.of === f);
      /* a read at a point that is not the end of the history IS a read of the
         past — the operand a chain entry paints as its `was` is exactly that */
      const readPast = (box.claims || []).some(cl => {
        const co = cl.owner || box.owner;
        return cl.of === f && co && cl.at < ((co.recorded || {})[f] || []).length - 1;
      });
      const read = (box.claims || []).some(cl => cl.of === f);
      const id2 = owners.map(x => x.id).join("/");
      const why = "  — " + JSON.stringify(text) + " (" + f + " words: " + words.join(", ") + ")";
      if (whole.length && !queried)
        console.error("[atrium invariant] " + where + " says " + JSON.stringify(whole[0]) + " about this object's " + f +
          " and never asked the history anything — whether a record has stood somewhere BEFORE cannot be produced by " +
          "comparing the two values at the ends of a transition:", id2, why);
      else if (past.length && !queried && !readPast)
        console.error("[atrium invariant] " + where + " says " + JSON.stringify(past[0]) + " about this object's " + f +
          " and read only where that field stands now — a sentence about what came before is written from what came " +
          "before:", id2, why);
      else if (cont.length && !read)
        console.error("[atrium invariant] " + where + " says " + JSON.stringify(cont[0]) + " about this object's " + f +
          " and never read " + f + " — the sentence is about a field its transition did not open:", id2, why);
    });
  });
}

function checkRenderedRecordInvariant() {
  if (!DEV) return;
  const r = room();

  /* 0 — EVERY PAINTED SENTENCE, FOUND BY THE RENDER THAT PAINTED IT (round 11).
     This is the clause the six hand-written selectors below used to be. It owns
     the whole of the painted-equals-minted rule now — the characters on screen,
     every point read, every history query and the quantifier rule — so a
     surface cannot be held to a weaker rule than its neighbour, and a surface
     nobody remembered cannot be held to none. The clauses that remain below are
     the ones that need the ENTRY, not the sentence: that an operand exists at
     all, that it was minted rather than written down, and what an arrow between
     two of them is allowed to claim. */
  document.querySelectorAll("[data-said]").forEach(el => {
    const box = PAINTED[Number(el.dataset.said)];
    if (!box) return console.error("[atrium invariant] a painted sentence is on screen with no minted sentence behind it:",
      el.textContent.trim());
    if (box.minted !== MINTED)
      return console.error("[atrium invariant] a painted sentence carries claims the record did not mint:", el.textContent.trim());
    checkPaintedSentence("a painted sentence" + (box.owner ? " about " + box.owner.id : ""),
                         (box.owner && box.owner.id) || "?", el, box);
  });

  /* 1 + 2 — the correction chain, as painted */
  document.querySelectorAll(".corr[data-corr-obj]").forEach(el => {
    const o = obj(r, el.dataset.corrObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.corrObj)).filter(Boolean)[0]);
    const c = o && (o.corrections || [])[Number(el.dataset.corr)];
    if (!c) return console.error("[atrium invariant] a correction entry is on screen with no entry behind it:", el.dataset.corrObj, el.dataset.corr);
    /* that the operand is THERE and was minted. What it says, and whether the
