     Round 2 compared nothing: answer → reopen → answer left the FIRST answer
     still dressed as the resolution. */
  if (m.boundTo) {
    const current = o.answerMsg === m.id;
    /* the tag says which kind of answer settled it, because "answer-bound" on a
       row the page wrote reads as a sentence the human composed (round 4 D3) */
    if (current && o.verification === "accepted")
      return `<button class="tag green" ${rc}>resolves ◆ · ${m.origin === "chosen" ? "chosen from the card" : "answer-bound"} · nothing inferred${where}</button>`;
    /* it was NOT superseded — nothing replaced it. The object it settled was
       reopened, so this is still the answer of record and the decision is
       pending again. Round 3 called this "superseded", which is the word for
       the other case entirely (a later answer), and the two now read apart. */
    if (current && o.reopenedAt)
      return `<button class="tag amber" ${rc}>answer reopened ${esc(fieldOr(o.reopenedAt, "· time not recorded"))} · still the answer on the record · ${esc(o.kind)} pending again${where}</button>`;
    /* SETTLED WITHOUT BEING ACCEPTED (round 5 D2). An answered question is not
       accepted and has not been reopened; before the answer was recorded at all
       this case could not arise, and the reopened branch above would have
       claimed a reopen that never happened. It says what it is instead. */
    if (current)
      return `<button class="tag" ${rc}>records the answer · ${esc(o.kind)} ${esc(o.verification)} · no sign-off attached${where}</button>`;
    return `<button class="tag amber" ${rc}>superseded answer · replaced ${esc(fieldOr(m.supersededAt, "· time not recorded"))} · kept on the record${where}</button>`;
  }
  /* A ◆ BADGE MEANS "THIS ROOM OWES YOU THIS" (round 4 minor). When the object
     lives in ANOTHER room, this room's Needs-you filter correctly does not count
     this row — so under that filter the row dimmed to .3 while still wearing an
     amber ◆ badge saying it needed you. The toast was honest and the badge was
     not. A cross-room gate now renders as a neutral pointer that says where the
     need actually is and goes there; amber is reserved for what this room owes. */
  if (needsYou(o) && home)
    return `<button class="tag" data-pin="${esc(o.id)}" data-pinroom="${esc(home)}">${g === "?" ? "? open question" : "◆ gate"} · needs ${esc(S.me)} in #${esc(home)} →</button>`;
  if (needsYou(o)) return `<button class="tag amber" data-pin="${esc(o.id)}">${g === "?" ? "? open question · needs " + esc(S.me) : "◆ needs " + esc(S.me)}</button>`;
  if (o.verification === "verified") return `<button class="tag green" ${rc}>verified · ${esc(fieldOr(o.verifiedBy, "no verifier on record"))}${where}</button>`;
  if (o.verification === "accepted") return `<button class="tag green" ${rc}>accepted · ${esc(fieldOr(o.acceptedBy, "no acceptor on record"))}${where}</button>`;
  if (o.kind === "commitment") return `<button class="tag" ${rc}>commitment · ${esc(fieldOr(o.owner || o.claimant, "no owner on record"))} · ${esc(fieldOr(o.due, "no due date"))} ~${where}</button>`;
  if (o.kind === "claim") return `<button class="tag" ${rc}>claim · unverified${where}</button>`;
  return `<button class="tag" ${rc}>${esc(o.kind)} · ${esc(o.verification)}${where}</button>`;
}

/* Only actions that do something are rendered. Round 1 shipped 32 inert
   buttons; the rule now is wire it or delete it. */
function rowActions(r, m, o) {
  const acts = [];
  if (!m.system) acts.push(`<button data-reply="1">Reply</button>`);
  /* you verify CLAIMS. A decision is answered, not verified, and a commitment is
     signed off — offering Verify on either would be a control that lies. */
  if (o && o.kind === "claim" && isClaim(o) && o.claimant !== S.me && !m.sysFor) {
    acts.push(`<button data-verify="${esc(o.id)}">Verify</button>`);
  }
  if (o && o.kind === "question" && o.verification === "open" && o.answerOption && !m.sysFor) {
    acts.push(`<button data-obj="${esc(o.id)}" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer</button>`);
  }
  return acts.join("");
}

/* the ~ → ✓ pair, exercisable: verifying asks for the evidence, and records it */
function verifyBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  /* an OPEN PROMPT, not a passive record entry: the page opened it, put the
     cursor in it, and is waiting. render() scrolls it clear of any sticky
     overlay and the layout invariant refuses to whitelist anything painting
     over it — both keyed on this attribute (round 5 D1). */
  box.dataset.prompt = "verify";
  box.innerHTML =
    `<div class="hd"><span class="lbl">VERIFY THIS CLAIM</span></div>
     <div class="row">
       <input id="vinput" type="text" aria-label="Evidence note" placeholder="what checked it? e.g. July AWS bill, write-throughput line: $912">
       <button class="btn sm" id="vgo">Attach &amp; verify</button>
       <button class="btn ghost sm" id="vcancel">Cancel</button>
     </div>
     <div class="hint">${esc(o.claimant)} said it, you are checking it — that is what makes it green. Verifying your own claim is not offered.</div>`;
  box.querySelector("#vgo").addEventListener("click", () => doVerify(o.id, box.querySelector("#vinput").value.trim()));
  /* the prompt closes back onto the Verify button that opened it (D3) */
  const closeVerify = () => { S.ui.verifying = null; focusOn(`[data-verify="${o.id}"]`, `[data-lens-obj="${o.id}"]`); render(); };
  box.querySelector("#vcancel").addEventListener("click", closeVerify);
  box.querySelector("#vinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doVerify(o.id, e.target.value.trim()); }
    if (e.key === "Escape") closeVerify();
  });
  return box;
}
/* render() has already scrolled the prompt clear of the sticky band, so focus
   must not scroll again — preventScroll keeps the two from fighting. */
function focusVerify() { const i = $("vinput"); if (i) i.focus({ preventScroll: true }); }
function focusReopen() { const i = $("rinput"); if (i) i.focus({ preventScroll: true }); }

/* --- since you left ------------------------------------------------------ */

/* mode: "absence" — the frozen window you were away for
 *       "return"  — everything that has landed since you got back / marked seen
 *       "seen"    — the caught-up marker at the end of the room
 * A chip counts MESSAGES in its own group; the pin above counts the ITEMS those
 * messages are about. The when-line says so, and a chip that counts nothing is
 * disabled rather than a clickable no-op. */
/* WHAT THE FILTER DOES TO THE ROWS IT DID NOT MATCH, said on screen and counted
   rather than asserted (round 6 D2). CONVENTIONS: "If the affordance's own copy
   claims a dimmed row is still checkable, the measurement has to back it." This
   copy claims the opposite of dimming, and the CSS is what backs it. */
function filterNote(scope) {
  const f = S.ui.feedFilter;
  if (!f || f.scope !== scope) return "";
  const r = room();
  const hits = groupMessages(r, scope).filter(m => msgClass(r, m) === f.k).length;
  const rest = groupMessages(r, scope).length - hits;
  return `<span aria-hidden="true">·</span><span class="fnote">${FILTER_LABEL[f.k].toLowerCase()} filter on · ` +
         `${hits} row${hits === 1 ? "" : "s"} highlighted · the other ${rest} ` +
         `${rest === 1 ? "row is" : "rows are"} neither hidden nor dimmed — they read exactly as they did unfiltered</span>`;
}

function sylDivider(r, mode) {
  const read = mode !== "seen" && groupRead(r, mode === "absence" ? "absence" : "return");
  const el = document.createElement("div");
  el.className = "syl" + (mode === "seen" ? " seen" : mode === "return" ? " ret" : "") + (read ? " muted" : "");
  if (mode === "absence" || (mode === "seen" && !hasAbsenceGroup(r))) el.id = "syl";

  if (mode === "seen") {
    el.innerHTML =
      `<div class="bar"><span class="lbl">SEEN FROM HERE</span><span class="rule"></span></div>
       <div class="when"><span>caught up — ${r.readGroup || 0} message${r.readGroup === 1 ? "" : "s"} read · ${esc(r.away.len)} away · the seen cursor sits at the end of #${esc(r.name)}, and only this room's</span></div>`;
    return el;
  }

  const scope = mode === "absence" ? "absence" : "return";
  const c = counts(r, scope);
  const own = ownInGroup(r, scope);
  const cursorPastAbsence = idx(r, r.seenAfter) > idx(r, r.absenceEnd);
  const label = mode === "absence" ? "SINCE YOU LEFT"
              : cursorPastAbsence ? "SINCE YOU MARKED THIS SEEN" : "SINCE YOU RETURNED";

  const chips = ["need", "change", "discussion", "routine"].map(k => {
    const n = c[k], on = !!S.ui.feedFilter && S.ui.feedFilter.k === k && S.ui.feedFilter.scope === scope;
    const title = n
      ? `${n} message${n === 1 ? "" : "s"} in this group are ${k === "need" ? "linked to something that needs you — the pin counts the items, this counts the rows" : FILTER_LABEL[k].toLowerCase()}`
      : `no ${FILTER_LABEL[k].toLowerCase()} messages in this group — nothing to filter to`;
    return `<button class="cnt${k === "need" && n ? " need" : ""}" data-filter="${k}" data-scope="${scope}"` +
           `${n ? "" : " disabled"} title="${esc(title)}" aria-pressed="${on}">${n} ${FILTER_LABEL[k]}</button>`;
  }).join("");

  /* marking seen mutes this divider; it does not delete it. The window, the
     count and the four chips stay exactly where they were, and the mark is
     reversible from the same line that reports it. */
  const when = mode === "absence"
    ? `<span>${esc(r.away.from)} → ${esc(r.away.to)} · ${esc(r.away.len)} away · ${c.total} messages · frozen at return</span>
       <span aria-hidden="true">·</span>
       <span>chips count rows · NEEDS YOU counts the items behind them</span>` + filterNote(scope) + `
       <span aria-hidden="true">·</span>` +
      (read
        ? `<span class="marked">marked seen ${esc(r.markedAt || "")} · the group stays here, muted</span>
           <span aria-hidden="true">·</span>
           <button class="mark" id="unmarkSeen">unmark</button>`
        : `<button class="mark" id="markSeen">mark this group seen</button>`)
    : `<span>${c.total} ${read ? "message" + (c.total === 1 ? "" : "s") + " here, all read" : "unseen since " + esc(cursorPastAbsence ? "you marked this seen" : r.away.to)}</span>` +
      (own ? `<span aria-hidden="true">·</span><span class="own">${own} row${own === 1 ? " here is yours" : "s here are yours"} — your own activity is never counted back to you as unseen</span>` : "") +
      filterNote(scope) +
      (c.total
        ? read
          ? `<span aria-hidden="true">·</span><span class="marked">marked seen ${esc(r.markedAt || "")}</span>
             <span aria-hidden="true">·</span><button class="mark" id="unmarkSeen">unmark</button>`
          : `<span aria-hidden="true">·</span><button class="mark" id="markSeen">mark this group seen</button>`
        : "");

  el.innerHTML =
    `<div class="bar">
       <span class="lbl">${label}</span>
       <div class="counts">${chips}</div>
       <span class="rule"></span>
     </div>
     <div class="when">${when}</div>`;
  el.querySelectorAll(".cnt").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter, b.dataset.scope)));
  const mk = el.querySelector("#markSeen");
  if (mk) mk.addEventListener("click", markSeen);
  const un = el.querySelector("#unmarkSeen");
  if (un) un.addEventListener("click", unmarkSeen);
  return el;
}

/* --- routine collapse: count, range and actors all derived from the rows --- */

function routineStrip(r, rows) {
  const wrap = document.createElement("div");
  wrap.className = "routine";
  const actors = [...new Set(rows.map(m => m.actor))];
  const routineFilter = !!S.ui.feedFilter && S.ui.feedFilter.k === "routine";
  const open = S.ui.routineOpen || routineFilter;
  const showAll = routineFilter;
  const shown = open ? (showAll ? rows : rows.slice(0, 6)) : [];

  const strip = document.createElement("button");
  strip.className = "strip";
  /* a toggle that survives its own render keeps focus, which needs a key that
     survives the rebuild. Round 7's strip carried neither id nor data attribute,
     so focusKey() had nothing to return and a peek dropped focus to BODY (D3). */
  strip.dataset.strip = "routine";
  strip.setAttribute("aria-expanded", String(open));
  strip.innerHTML =
    `<span aria-hidden="true">·</span><span><b>${rows.length} routine</b></span>
     <span aria-hidden="true">·</span><span>${esc(rows[0].t)}–${esc(rows[rows.length - 1].t)}</span>
     <span aria-hidden="true">·</span><span>${esc(actors.join(", "))}</span>
     <span class="peek">${open ? "click to collapse" : "click to peek"}</span>`;
  strip.addEventListener("click", () => {
    S.ui.routineOpen = !open;
    S.ui.routineOpenedByFilter = false;      // opened or closed by hand from here on
    if (!S.ui.routineOpen && routineFilter) S.ui.feedFilter = null;
    render();
  });
  wrap.appendChild(strip);

  if (open) {
    const body = document.createElement("div");
    body.className = "peekbody scroll rise-s";
    shown.forEach(m => body.appendChild(messageRow(r, m)));
    if (shown.length < rows.length) {
      const more = document.createElement("div");
      more.className = "more";
      more.textContent = `+ ${rows.length - shown.length} more routine events · none owed you attention`;
      body.appendChild(more);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

/* --- cross-room jump trace ----------------------------------------------- */
function renderTrace() {
  const el = $("trace");
  const tr = S.ui.trace;
  if (!tr) { el.hidden = true; el.innerHTML = ""; return; }
  const from = S.rooms[tr.from];
  el.hidden = false;
  el.innerHTML =
    `<span class="g" aria-hidden="true">→</span>
     <span class="tx">you came from <b>#${esc(from ? from.name : tr.from)}</b>${tr.why ? " · following " + esc(tr.why) : ""} · ${esc(tr.at)}</span>
     <button class="back" id="traceBack">← back to #${esc(from ? from.name : tr.from)}</button>
     <button class="x mono" id="traceX" aria-label="Dismiss this trace">✕</button>`;
  $("traceBack").addEventListener("click", () => {
    const back = tr.from;
    switchRoom(back, true);          // clears the trace: you are home, not lost
    render();
    bootScroll();
    toast(`back in #${back} — the row you left is where you left it`, "info");
  });
  $("traceX").addEventListener("click", () => { S.ui.trace = null; render(); });
}

/* ===========================================================================
 * LENS + RECEIPT — both are renders of the same objects the pin and the feed
 * read. There is no separate receipt store any more; a receipt IS an object,
 * drawn with its history, provenance and correction chain.
 * ======================================================================== */

const KIND_LABEL = { decision: "DECISIONS", commitment: "COMMITMENTS", question: "OPEN QUESTIONS", claim: "CLAIMS" };
const KIND_ORDER = ["decision", "commitment", "question", "claim"];

function renderLens() {
  const r = room();
  const body = $("lensBody");

  const accepted = r.objects.filter(o => o.verification === "accepted" || o.verification === "verified").length;
  const owed = attention(r).length;
  const claims = r.objects.filter(isClaim).length;
  const open = r.objects.filter(o => o.verification === "open").length;
  $("lensSummary").textContent =
    `${r.objects.length} objects · ${accepted} settled · ${claims} unverified · ${owed} item${owed === 1 ? "" : "s"} awaiting you · updated ${S.now}`;
  /* SUB-COUNTS THAT DO NOT SUM ARE EXPLAINED WHERE THEY ARE SHOWN. settled +
     unverified + open partition the objects; "awaiting you" cuts across all
     three, so it is not a fourth slice of the same pie. Saying so costs one
     line and removes the only reading in which these numbers look wrong. */
  $("lensSums").textContent =
    `${accepted} + ${claims}${open ? " + " + open + " open" : ""} = ${accepted + claims + open} of ${r.objects.length}` +
    ` · awaiting you overlaps them, it does not add to them`;

  if (S.ui.receiptId && obj(r, S.ui.receiptId)) { renderReceipt(obj(r, S.ui.receiptId)); return; }

  body.innerHTML = "";
  /* one object can sit under two objectives, so the per-objective owed counts
     can sum to more than the pin's item count. Where that is true, the lens
     says it in prose rather than leaving two numbers to contradict each other. */
  const perObjectiveOwed = r.objectives.reduce((n, ob) =>
    n + r.objects.filter(o => o.objectives.includes(ob.id) && needsYou(o)).length, 0);
  if (perObjectiveOwed !== owed) {
    const note = document.createElement("div");
    note.className = "lensnote";
    note.textContent = `the need-you counts below sum to ${perObjectiveOwed}, not ${owed} — an object under two objectives is counted by both, and is still one item in Needs you`;
    body.appendChild(note);
  }
  r.objectives.forEach(ob => {
    const mine = r.objects.filter(o => o.objectives.includes(ob.id));
    const owedHere = mine.filter(needsYou).length;
    const wrap = document.createElement("section");
    wrap.className = "obj";

    const head = document.createElement("button");
    head.className = "obj-head";
    head.dataset.objective = ob.id;          // survives the rebuild it triggers (D3)
    head.setAttribute("aria-expanded", String(!!ob.open));
    head.title = `${mine.length} object${mine.length === 1 ? "" : "s"} sit under this objective` +
      (owedHere ? `, ${owedHere} of which need you. An object can sit under more than one objective, so these counts overlap the other objectives and the pin.`
                : ". Nothing here is waiting on you.");
    head.innerHTML =
      `<span class="tw" aria-hidden="true">${ob.open ? "▾" : "▸"}</span>
       <span><span class="ttl">${esc(ob.title)}</span>
         <span class="ct">${mine.length} objects · ${owedHere ? `<span class="warn">${owedHere} need you</span>` : "all clear"}</span></span>
       <span class="st ${esc(ob.status)}">${esc(ob.status.toUpperCase())}</span>`;
    head.addEventListener("click", () => { ob.open = !ob.open; render(); });
    wrap.appendChild(head);

    if (ob.open) {
      KIND_ORDER.forEach(kind => {
        const items = mine.filter(o => o.kind === kind);
        if (!items.length) return;
        const grp = document.createElement("div");
        grp.className = "grp";
        grp.innerHTML = `<div class="glbl"><span class="lbl">${KIND_LABEL[kind]}</span><span class="n">${items.length}</span><span class="rule"></span></div>`;
        items.forEach(o => grp.appendChild(lensItem(o)));
        wrap.appendChild(grp);
      });
    }
    body.appendChild(wrap);
  });
}

/* an object's own text is the page's until a human's typed answer BECOMES it —
   `textVoice` records which, and every surface that renders the title reads it
   rather than guessing (round 5 D4). */
function titleFrag(o) { return o.textVoice === "human" ? human(o.text) : o.text; }
function pinTitleFrag(o) { return o.question ? o.question : titleFrag(o); }

function lensItem(o) {
  const g = glyphOf(o);
  const b = document.createElement("button");
  b.className = "oitem " + gclass(g) + (o.fresh ? " rise" : "");
  /* the object's own item in the lens, addressable by the object it is about —
     the last resort in the focus chain, and stable across a rebuild */
  b.dataset.lensObj = o.id;
  const facts = (o.facts || []).map(f =>
    `<span class="${/overdue|not accepted|open |blocked|reopened/i.test(voicedText(f)) ? "warn" : ""}">${voiced(f)}</span>`)
    .join('<span aria-hidden="true">·</span>');
  b.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <span><span class="tt ${isClaim(o) ? "claim" : ""}">${voiced(titleFrag(o))}</span><span class="mt">${facts}</span></span>`;
  b.addEventListener("click", () => openReceipt(o.id));
  return b;
}

function receiptState(o) {
  if (o.verification === "accepted") return ["ACCEPTED", o.kind, `by ${fieldOr(o.acceptedBy, "nobody on record")} · ${fieldOr(o.acceptedAt, "time not recorded")}`];
  if (o.verification === "verified") return ["VERIFIED", o.kind, `checked by ${fieldOr(o.verifiedBy, "nobody on record")} · ${fieldOr(o.verifiedAt, "time not recorded")}`];
  if (o.verification === "proposed") return ["PROPOSED", "not accepted", `confidence ${fieldOr(o.confidence, "—")}`, "renders as a claim until a human answers"];
  /* `openFor` is how long it had been open when the record was loaded. Once a
     question has been reopened that number is about the original ask, not about
     the state on screen, so the reopened case reports the reopen instead. */
  if (o.verification === "open") return ["OPEN", "question",
    o.reopenedAt ? `reopened ${o.reopenedAt}` : `open ${fieldOr(o.openFor, "—")}`,
    o.assignee ? `assigned to ${o.assignee}` : "nobody assigned"];
  if (o.verification === "self_reported") return ["SELF-REPORTED", o.kind, `${fieldOr(o.owner || o.claimant, "no owner on record")}`,
    o.due ? `due ${o.due}` : "no due date on record", "nothing other than the claimant has checked it"];
  /* A QUESTION IS ASKED, NOT CLAIMED (round 5 D2). There was no branch for a
     question that had been answered but not signed off, so it fell through to
     the CLAIM line below and the receipt header read
     `CLAIM · unverified · claimant: priya` over a sentence priya had ASKED.
     That is the record asserting a person said something they did not say —
     the same family as fabricated attribution, reached through a missing
     switch branch rather than through a fabricated string. A question gets its
     own states, and none of them uses the word claimant. */
  if (o.kind === "question") {
    const asker = `asked by ${fieldOr(o.askedBy || o.claimant, "nobody on record")}`;
    if (o.answerText) return ["ANSWERED", "question", asker,
      `answered by ${fieldOr(o.answeredBy, "nobody on record")} · ${fieldOr(o.answeredAt, "time not recorded")}`,
      "no sign-off attached, so the answer is unverified"];
    return ["QUESTION", fieldOr(o.verification, "state not recorded"), asker,
      o.assignee ? `assigned to ${o.assignee}` : "nobody assigned"];
  }
  /* round 2 carried a REASSIGNED branch here and never wrote that value: an
     assignment changes who owes the answer, not whether it is verified. The
     assignee is reported by the OPEN branch above, where it actually lives. */
  return ["CLAIM", "unverified", `claimant: ${fieldOr(o.claimant, "nobody on record")}`];
}

/* ---------------------------------------------------------------------------
 * A CORRECTION ENTRY HAS TWO VOICES AND THEY NEVER MIX.
 *
 *   system voice — `was → after`, plus an optional `fact` line: what the page
 *                  knows happened. Mono, muted, no quotation marks, no first
 *                  person, no "X said". It is visibly not speech.
 *   human voice  — `quote`, present only when a person actually typed a reason.
 *                  Rendered in <q>, attributed, and carrying data-quoted so the
 *                  invariant checker can prove the words are theirs.
 *
 * Round 3 had exactly one voice and put a machine-written first-person sentence
 * in it. `text:` is gone from the shape so that failure cannot be re-typed.
 * ------------------------------------------------------------------------ */
function correctionHtml(c) {
  const link = c.msg
    ? ` · <button class="lnk" data-jump="${esc(c.msg)}"${c.room ? ` data-jumproom="${esc(c.room)}"` : ""}>${esc(c.link || "the prior answer is still in the room →")}</button>`
    : "";
  /* the quote is by construction a person's own characters, so it is marked as
     theirs — the page-integrity rules are about what the PAGE writes (D4) */
  const quote = c.quote
    ? `<div class="reason"><q data-quoted="${esc(quoteRef(c.quote))}" data-voice="human">${esc(c.quote.text)}</q>
         <span class="src">— ${esc(c.quote.by)}, typed here${c.quote.seeded ? " on the record" : ""}</span></div>`
    : "";
  const fact = c.fact ? `<div class="fact"><span aria-hidden="true">·</span> ${voiced(c.fact)}</div>` : "";
  /* THE ARROW IS A CLAIM (round 6 D1). Round 6 rendered `was → now: after` for
     every entry unconditionally, so an entry recording that nothing changed
     still asserted a swap — and did it with two byte-identical sentences either
     side of the arrow. An entry that carries no `change` gets no arrow, and
     checkCorrectionInvariant() holds every entry to the same distinction. */
  const body = c.change
    ? `<span class="was">${voiced(c.was)}</span> → now: ${voiced(c.after)}`
    : `<span class="was">${voiced(c.was)}</span> <span class="same">— unchanged ·</span> ${voiced(c.after)}`;
  return `<div class="corr"><div class="hd">${esc(c.hd)} · ${esc(c.who)} · ${esc(c.tm)}</div>
     <div class="bd">${body}${link}</div>
     ${fact}${quote}</div>`;
}
/* a quotation's provenance token: "typed" for text in the human-speech register,
   "msg:<id>" or "msg:<id>@<room>" for a line that is in the loaded record */
function quoteRef(q) { return q.src === "typed" ? "typed" : "msg:" + q.msg + (q.room ? "@" + q.room : ""); }

function renderReceipt(o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "receipt rise";
  const st = receiptState(o);

  const happened = o.history.map(h => {
    const hg = histGlyph(h.k);
    return `<div class="hap ${gclass(hg)}"><span class="g" aria-hidden="true">${hg}</span>
       <span class="tt"><span class="who">${esc(h.who)}</span> ${voiced(h.text)}<span class="tm">${esc(h.tm)}</span></span></div>`;
  }).join("");

  /* every excerpt is a quotation, so every excerpt must be provably a real line:
     either a message in the loaded record, or text this human typed into the
     page. There is no third case, and no way to render one. */
  /* A PROVENANCE ENTRY IS EITHER A QUOTATION OR A SYSTEM RECORD, NEVER BOTH.
     `voice: "system"` marks the entries the page authored on a human's behalf —
     a one-click answer. Those render with no quotation marks, no <q>/.ex, no
     data-quoted, and with their disclosure ALWAYS ON SCREEN. Round 4 rendered a
     chosen answer exactly like a typed one, quoted, with the single word
     "chosen" buried in `.full` behind a hover: the receipt's resting state said
     the human wrote a sentence they had never written. */
  const prov = o.provenance.map(p => {
    /* A MACHINE'S OUTPUT IS NOT SPEECH (round 7 D6). `checks` writes parity runs
       and deploy records; those lines are verbatim and correctly credited, so
       nothing here was ever fabricated — but round 7 rendered them with curly
       quotation marks and `data-voice="human"`, which says "a person said this"
       about a CI job, and exempted a machine's string from the record-text rules
       that exist to catch `undefined` in a record. The feed already renders the
       same strings in mono. So does this, now.
       It KEEPS ITS CITATION: `data-cited` resolves against the loaded record on
       every render exactly as `data-quoted` does, minus the human-authorship
       rule, which is the one part of the quotation contract that does not apply
       to a machine. Dropping the check along with the quotation marks would have
       traded a presentation defect for an attribution hole. */
    if (p.voice === "machine") {
      const cite = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : null;
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to the run${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">recorded here · no message carries it</span>`}</span>
       <span class="sysex"${cite ? ` data-cited="${esc(cite)}"` : ""}>${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    if (p.voice === "system") {
      return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span><span class="jump">jump to the row →</span></span>
       <span class="sysex">${esc(p.ex)}</span>
       <span class="always">${esc(p.note)}</span>
     </button>`;
    }
    /* a quotation context is human speech BY RULE — checkQuotationInvariant()
       refuses any excerpt that does not resolve to a message a person wrote or
       to text this person typed — so it carries data-voice="human" and the
       page-integrity rules leave the words alone (round 5 D4). */
    const ref = p.msg ? "msg:" + p.msg + (p.room ? "@" + p.room : "") : "typed";
    return `<button class="prov"${p.msg ? ` data-jump="${esc(p.msg)}"${p.room ? ` data-jumproom="${esc(p.room)}"` : ""}` : ""}>
       <span class="hd"><span class="who">${esc(p.who)}</span><span>${esc(p.tm)}</span>${p.msg ? `<span class="jump">jump to source${p.room ? " in #" + esc(p.room) : ""} →</span>` : `<span class="jump">typed here · no message carries it</span>`}</span>
       <span class="ex" data-quoted="${esc(ref)}" data-voice="human">“${esc(p.ex)}”</span>
       <span class="full">${esc(p.note)}</span>
     </button>`; }).join("");

  const corr = o.corrections.length
    ? o.corrections.map(c => correctionHtml(c)).join("")
    : `<div class="corr"><div class="bd">no corrections — this object has never been amended</div></div>`;

  const reopenable = canReopen(o);
  const reopening = S.ui.reopening === o.id;

  el.innerHTML =
    `<div class="rc-top">
       <button class="rc-back" id="rcBack">← BACK TO CURRENT STATE</button>
       <div class="rc-ttl ${gclass(g)}"><span class="g" aria-hidden="true">${g}</span><span class="h ${isClaim(o) ? "claim" : ""}">${voiced(titleFrag(o))}</span></div>
       <div class="rc-state">${st.map((s, i) => i === 0
          ? `<span class="st ${stateChip(g)}">${esc(s)}</span>` : `<span>${esc(s)}</span>`).join('<span aria-hidden="true">·</span>')}
          <span aria-hidden="true">·</span><span>in ${o.objectives.length} objective${o.objectives.length > 1 ? "s" : ""}</span></div>
     </div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">WHAT HAPPENED</span><span class="rule"></span></div>${happened}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">PROVENANCE</span><span class="lbl">${o.provenance.length} SOURCE${o.provenance.length === 1 ? "" : "S"} · HOVER OR FOCUS TO EXPAND</span><span class="rule"></span></div>${prov}</div>
     <div class="rc-sec"><div class="glbl"><span class="lbl">CORRECTION CHAIN</span><span class="rule"></span></div>${corr}</div>
     <div class="rc-sec" id="rcReopenBox"></div>
     <div class="rc-foot">
       <span class="note">${esc(o.note || "")}</span>
       ${reopenable ? `<button class="btn sm" id="rcReopen" aria-expanded="${reopening}">Reopen</button>` : ""}
     </div>`;

  const body = $("lensBody");
  body.innerHTML = "";
  body.appendChild(el);
  body.scrollTop = 0;
  /* and back out onto the item you came in from, which the lens re-renders in
     place — the reverse of openReceipt()'s successor, and for the same reason */
  el.querySelector("#rcBack").addEventListener("click", () => {
    S.ui.receiptId = null;
    focusOn(`[data-lens-obj="${o.id}"]`);
    render();
  });
  const rb = el.querySelector("#rcReopen");
  if (rb) rb.addEventListener("click", () => { S.ui.reopening = reopening ? null : o.id; render(); focusReopen(); });
  if (reopening) el.querySelector("#rcReopenBox").appendChild(reopenBox(o));
  el.querySelectorAll("[data-jump]").forEach(p => p.addEventListener("click", () => jumpTo(p.dataset.jump, p.dataset.jumproom, p.dataset.why || "a link in this receipt")));
}

/* a receipt can be opened from a row in another room; the lens follows the
   object home rather than rendering an empty pane. */
function openReceipt(id, roomId) {
  if (roomId && roomId !== S.roomId && S.rooms[roomId] && obj(S.rooms[roomId], id)) {
    const from = S.roomId;
    switchRoom(roomId, true);
    S.ui.trace = { from, msgId: null, why: "the receipt for " + id + ", which lives in this room", at: S.now };
    toast("#" + roomId + " — that object lives in this room's Current state", "info");
  }
  S.ui.receiptId = id;
  /* the receipt REPLACES the lens item that opened it, so there is no key to
     restore — the successor is the receipt's own way back out (D3) */
  focusOn("#rcBack", "#rcReopen");
  render();
}

/* ===========================================================================
 * TRANSITIONS
 *
 * Every one of these does the same three things: mutate the object, append a
 * system row to the conversation (the conversation is the record), re-render.
 * Nothing writes to the DOM directly and nothing sets a glyph.
 * ======================================================================== */

let clock = 9 * 60 + 13;
function tick() {
  const t = clock++;
  S.now = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  return S.now;
}
function nextId(p) { return p + (++S.seq); }

function appendMessage(r, m) { r.messages.push(m); return m; }
/* a transition row is your activity — you caused it, watching. `byMe` keeps it
   out of every unseen count, and `sysFor` links it to the object it reports on
   instead of flattening to the routine dot.
   THE GLYPH IS FROZEN HERE (round 4 D6). `o` is passed AFTER the mutation, so
   glyphOf(o) is the state this transition landed in — and that is what the row
   records forever. It is not re-derived on later renders, because the object
   moves on and the record must not: a row that says "accepted → proposed ·
   reopened" turned green again the moment the object was re-accepted, which is
   a permanent record of a downgrade rendering as a verified fact. */
/* `text` is a page-authored string, or an array of parts when the sentence has
   to quote a human's characters back — `human(s)` marks those, so the record
   rules keep checking the page's half of the line (round 5 D4). */
function appendSystem(r, text, o) {
  const g = glyphOf(o);
  return appendMessage(r, { id: nextId("s"), t: S.now, actor: "atrium", system: true, fresh: true, byMe: true,
                            origin: "system", body: Array.isArray(text) ? text : [text], objectId: null, sysFor: o.id,
                            tglyph: g, tclaim: isClaim(o) });
}
function clearFresh() {
  Object.values(S.rooms).forEach(r => { r.messages.forEach(m => delete m.fresh); r.objects.forEach(o => delete o.fresh); });
}

/* --- B1: the answer IS the decision -------------------------------------
 * `answer` is what the human produced:
 *   { origin: "typed",  statement }               — they wrote this sentence
 *   { origin: "chosen", statement, label, agrees } — they clicked this option
 * The statement is recorded verbatim as the decision either way. What differs
 * is WHO AUTHORED THE WORDS, and round 4's D3 is that the page did not track
 * that at all: a chosen answer was appended as a message actored to the human,
 * containing the card's sentence, and the receipt then quoted it under their
 * name. The human clicked a button; the page wrote the sentence and signed it
 * for them. design/CONVENTIONS.md now names this as the same defect class as
 * inventing the sentence outright, because it is.
 *
 * A chosen answer is therefore recorded as a SYSTEM ROW in system voice —
 * "lars chose: Cut over Friday" — with the statement it recorded stated beside
 * it, unquoted, and the receipt's source entry rendered the same way with its
 * disclosure on screen at rest. No quotation marks anywhere near it.
 * ----------------------------------------------------------------------- */
function answerDecision(objectId, answer, provenanceNote) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();
  const typed = answer.origin === "typed";
  const statement = answer.statement;

  /* Only typed text enters the human-speech register. A statement the page
     offered is not a thing the human said, so it is not quotable. */
  let m;
  if (typed) {
    S.typed.push(statement);
    m = appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, origin: "typed",
      body: [statement], boundTo: o.id });
  } else {
    /* system voice, third person, no quotation marks, no first person, and the
       actor column says `atrium` because atrium is who wrote these characters. */
    m = appendMessage(r, { id: nextId("m"), t, actor: "atrium", system: true, byMe: true, fresh: true,
      origin: "chosen", chosenBy: S.me, chosenLabel: answer.label,
      body: [`${S.me} chose: ${answer.label}`], boundTo: o.id,
      note: `statement recorded: ${statement} · chosen from the card's options, not typed — these are not ${S.me}'s words` });
  }

  /* the answer that WAS the answer stops being it, on the message itself. That
     is what makes the resolves/answer-bound tag identity-checked rather than
     state-checked: answer → reopen → answer leaves exactly one settled row. */
  const prior = o.answerMsg ? msg(r, o.answerMsg) : null;
  if (prior) { prior.supersededAt = t; prior.supersededBy = m.id; }

  /* DEPARTURE IS OPTION IDENTITY, NOT STRING EQUALITY (round 4 D7). Choosing
     the option that IS the proposal is agreement even when its wording differs
     — P1's proposal reads "Cut over Friday 1 Aug and drop legacy tokens" and
     its agreeing option reads "Cut over Friday 1 Aug; legacy tokens are
     dropped…". Round 4 compared the two strings, found them different, and
     recorded "not what was proposed" against an answer that agreed exactly.
     A typed answer has no option identity to compare, so there the text
     comparison is the only question there is — and it is the right one. */
  const proposal = o.proposedText || o.text;
  const contradicts = typed ? !sameText(statement, proposal) : !answer.agrees;
  /* AND SEPARATELY: DID THE SENTENCE ON THE RECORD ACTUALLY CHANGE? (round 6 D1)
     "Departs from the proposal" is a fact about which option was chosen.
     "The record now says something else" is a fact about the STATEMENT OF
     RECORD before this write and after it. Round 6 had only the first and
     rendered the second from it; round 7 had the second but read its "before"
     out of `prior.body` — the row that DISPLAYS a chosen answer reads "lars
     chose: Cut over Friday", which is not, and never was, the statement. So
     `changed` is not computed here at all any more: amend() answers it, from
     the object's own statement history, and hands back the before and after
     that the correction chain is allowed to assert. */
  const priorStatement = RECORDED.statement.get(o);
  const priorVoice = o.textVoice;

  o.proposedText = proposal;
  /* the decision statement is the answer, verbatim — written through the
     record, which is what makes the two values below provable */
  const change = amend(o, "statement", statement, { tm: t, by: S.me, how: typed ? "typed answer" : "chosen from the card" });
  const changed = !!change;
  /* and who authored those characters travels with them: a typed answer makes
     the object's own text a human's sentence, on every surface that renders it
     (round 5 D4). A chosen one is the card's wording, which is the page's. */
  o.textVoice = typed ? "human" : "page";
  amend(o, "verification", "accepted", { tm: t, by: S.me, how: "answered" });
  o.acceptedBy = S.me;
  o.acceptedAt = t + " today";
  amend(o, "settlement", null, { tm: t, by: S.me, how: "answered" });
  o.owedTo = null;
  o.answerMsg = m.id;
  /* "answer-bound" means the human's own wording became the record. A chosen
     answer is bound to an option, not to a sentence they wrote, and the fact
     chip in the lens has to say which — it is the one line about this object a
     reader sees without opening anything. */
  o.facts = ["accepted by " + S.me, t + " today", typed ? "answer-bound" : "chosen from the card"];
  o.fresh = true;
  o.history.push({ k: "accepted", who: S.me, tm: t,
    text: typed
      ? "answered it directly — the resolution was recorded from the typed answer, not interpreted from it"
      : `chose the option ${answer.label} from the card — the statement it carries was recorded verbatim, and none of it is worded by ${S.me}` });
  /* the source entry for a chosen answer is a system record of a click, not a
     quotation of a sentence. `voice: "system"` is what renderReceipt() reads to
     drop the quotation marks and put the disclosure on screen at rest. */
  o.provenance.unshift(typed
    ? { who: S.me, tm: t, msg: m.id, ex: statement, note: provenanceNote }
    : { who: "atrium", tm: t, msg: m.id, voice: "system",
        ex: `${S.me} chose: ${answer.label} — statement recorded: ${statement}`,
        note: provenanceNote });

  /* AN ANSWER IS ALWAYS A CHAIN EVENT (round 7 D1, second half). Round 7 wrote
     an entry when there was a prior answer, when the option contradicted the
     proposal, or when nothing changed — which left exactly one case unrecorded:
     THE AGREEING OPTION WHOSE WORDING IS NOT THE PROPOSAL'S. P1's agreeing
     option reads "Cut over Friday 1 Aug; legacy tokens are dropped and the 4.7%
     tail is force-re-authed" against a proposal of "Cut over Friday 1 Aug and
     drop legacy tokens": clicking it genuinely replaces the statement of record
     and the chain said the object had never been amended. The mirror image of
     the same defect, in the same function — one asserting a change that did not
     happen, one silent about a change that did. Whether the statement moved is
     now the only question, and amend() has already answered it. */
  {
    const priorFrag = priorVoice === "human" ? human(priorStatement) : priorStatement;
    const c = {
      hd: changed
        ? (prior ? "RE-ANSWERED · PRIOR ANSWER SUPERSEDED" : "ANSWERED · PROPOSAL → DECISION")
        : (prior ? "RE-ANSWERED · THE SAME SENTENCE, RECORDED AGAIN" : "RE-AFFIRMED · THE PRIOR CALL, UNCHANGED"),
      who: S.me, tm: t,
      /* THE BEFORE IS THE STATEMENT, NOT A REFERENCE TO THE ROW THAT DISPLAYED
         IT. Round 7 rendered "Answer of 09:13" here and put `prior.body` in the
         change — so the words on screen and the values being compared were two
         different things, and only one of them was the record. Both are the
         statement now, and the human's sentence is marked as theirs only when
         it IS theirs (a prior answer they typed). */
      was: [prior ? "Answer of " + prior.t + ": " : "Proposal: ", priorFrag],
      after: changed
        ? [typed ? human(statement) : statement,
           contradicts && !prior ? " — not what was proposed; your answer is the decision" : ""]
        : "recorded again, verbatim — nothing about the statement changed",
      /* THE ENTRY CARRIES WHAT IT CLAIMS DIFFERS, and carries it only when it
         claims something differs — and it carries what amend() minted, which is
         the only before/after pair on this page that the record can vouch for.
         checkCorrectionInvariant() holds every entry to all three of those. */
      change: change,
      fact: (prior ? (changed ? `re-answered by ${S.me} at ${t}` : `re-recorded by ${S.me} at ${t}`)
                   : (changed ? `answered by ${S.me} at ${t}` : `re-affirmed by ${S.me} at ${t}`)) +
            (typed ? " · typed" : ` · chosen: ${answer.label} — the page wrote the sentence, ${S.me} chose it`) +
            (changed ? "" : " · the statement on the record is unchanged, so nothing was amended") +
            (changed && !contradicts && !prior
              ? " · the option agrees with the proposal, and its wording — the card's, not yours — is what is now on the record"
              : ""),
      msg: prior ? prior.id : (o.sourceMsg || null),
      room: prior ? null : sourceRoomOf(o),
      link: prior ? "the superseded answer is still in the room →" : "the proposal it replaced is still in the room →"
    };
    /* only a prior answer the human TYPED may be quoted back at them. A prior
       CHOSEN answer is a page-authored row; quoting it would re-open exactly
       the loophole D3 closes, one step removed. */
    if (prior && prior.origin === "typed") c.quote = { text: plain(prior.body), by: S.me, src: "typed" };
    else if (prior) c.fact += ` · the superseded answer was chosen from the card, so there is nothing of ${S.me}'s to quote`;
    o.corrections.push(c);
  }

  o.note = (typed
      ? "Answer-binding skips the proposal machinery entirely: the statement above is your words, recorded verbatim. "
      : "You chose one of the statements the card offered. It is recorded verbatim as the decision, and the row that records it is in the system's voice — the page wrote that sentence, so it is not attributed to you as something you said. ") +
           (changed && contradicts ? "It is not the same as what was proposed — that is allowed, and the correction chain records the swap. " : "") +
           (changed ? "" : "It is word for word the sentence already on the record, so nothing was amended — the chain records that it was affirmed again, not that it changed. ") +
           (prior ? "It replaces your earlier answer, which is still on the record and still in the room." : "");

  appendSystem(r, `${o.kind} ${o.id} · ${prior ? "re-answered" : "proposed → accepted"} · ` +
                  (typed ? `recorded verbatim from ${S.me}'s typed answer` : `${S.me} chose: ${answer.label} · statement recorded verbatim, not worded by ${S.me}`) +
                  ` · nothing inferred`, o);
  S.ui.bound = null; S.ui.replyTo = null; S.ui.pinOpen = null;
  $("cinput").value = "";
  /* the record of this write, most specific first: the correction entry it just
     added to an open receipt, then the row it appended, then the object's item
     in the lens. FOCUS FOLLOWS THE RECORD. */
  focusAfter(S.ui.receiptId === o.id ? ".rc-sec .corr:last-of-type .lnk" : null,
             `[data-msg="${m.id}"] .tag`, `[data-msg="${m.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  scrollFeedToEnd();
  /* the toast says which kind of answer it was. Round 3 told you your wording
     was recorded verbatim even when the wording was the card's, not yours. */
  toast(!changed
    ? "re-affirmed · the same sentence is on the record, recorded again — nothing was amended"
    : prior
      ? "re-answered · the earlier answer is now marked superseded, not deleted"
      : typed ? "recorded as a decision · answer-bound, your wording verbatim"
              : "recorded as a decision · the option you chose, recorded verbatim — the row is in the system's voice, not yours");
}

/* --- B2: reopen re-renders EVERYTHING, including the historical row ------
 *
 * ROUND 3'S CARDINAL DEFECT LIVED HERE. This function used to write a canned
 * first-person sentence — "Reopening — the evidence under this was never
 * checked…" — into the correction chain, where the receipt rendered it in <q>
 * under the actor's name and time. Nobody said it. It was also false in
 * context: it asserted an evidence concern after an answer about cutover
 * timing.
 *
 * What replaces it: the correction states what the page actually knows, in
 * system voice (`was → after` plus a `fact` line), and the human is *offered*
 * the chance to say why. If they type a reason it is quoted as theirs, tagged
 * with its provenance, and provable. If they do not — and empty is fine — the
 * entry simply carries no quotation. The page never speaks for anyone.
 * ----------------------------------------------------------------------- */

/* which objects can be reopened. BRIEF §5: an item you settled carries the
   affordance, and "settled" includes a question you answered and a commitment
   you signed off — round 3 only offered it on accepted/verified. */
function canReopen(o) {
  if (needsYou(o)) return false;
  return o.verification === "accepted" || o.verification === "verified" || !!o.resolvedAt;
}

/* the reopen states, per kind — all of them land somewhere with an action path */
const REOPEN_TO = { decision: "proposed", question: "open", commitment: "self_reported", claim: "unverified" };

/* --- WHO OWES IT AGAIN (round 4 D5) --------------------------------------
 * Reopening undoes a state. It does not transfer ownership, and round 4 made it
 * do exactly that: `o.owedTo = S.me` unconditionally, so reopening justin's
 * commitment K0 moved it onto YOUR list, offered you "Mark signed off", and —
 * if you took it — rewrote its facts to your name and asserted "You signed your
 * own sign-off" in a receipt that still named justin as the claimant.
 *
 * A commitment goes back to whoever owed it. A decision or question goes back
 * to whoever settled it. When that is not you it does not join your list at
 * all, and the toast says whose it is instead of pretending it is yours.
 * ---------------------------------------------------------------------- */
function reopenOwner(o) {
  if (o.kind === "claim") return null;                 // a reopened claim owes nobody an answer
  if (o.kind === "commitment") return o.owner || o.claimant || null;
  return o.resolvedBy || o.acceptedBy || o.assignee || o.owedTo || o.claimant || null;
}

function reopen(objectId, reason) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  const t = tick();
  const from = o.verification;
  const wasResolved = !!o.resolvedAt;
  /* WHEN THE STATE BEING PRESERVED WAS ACTUALLY REACHED (round 6 minor).
     Captured BEFORE the mutation, because `o.reopenedAt` is about to be set and
     `o.resolvedAt` is about to be cleared. Round 6's note fell through to
     `o.reopenedAt` and so read "the state at 09:14 is still in the
     conversation" under a correction header dated 09:14 for the reopen itself —
     the record timestamping a preserved state with the moment it was undone. */
  const settledAt = o.acceptedAt || o.verifiedAt || o.answeredAt || o.resolvedAt || null;
  const vChange = amend(o, "verification", REOPEN_TO[o.kind] || "unverified", { tm: t, by: S.me, how: "reopened" });
  o.reopenedAt = t;
  o.resolvedAt = null;
  /* the fact a reopen always changes, even when the verification enum does not:
     it stopped being settled. Derived, so amend() reads it back rather than
     being told — see RECORDED.settlement. */
  const sChange = amend(o, "settlement", null, { tm: t, by: S.me, how: "reopened" });
  o.fresh = true;

  /* a reopened decision, question or commitment owes SOMEONE an answer again —
     whoever owned it, which is not automatically you. A reopened claim owes
     nobody one; it is simply unverified. */
  const back = reopenOwner(o);
  const owed = !!back;
  o.owedTo = back;
  if (owed) o.priority = o.priority || (o.kind === "decision" ? 20 : 12);
  if (o.kind === "decision" && (!o.options || !o.options.length)) {
    /* NO DEAD ATTENTION ITEMS. Options that existed survive the reopen. A
       decision that never carried options gets the one option that is not
       invented — re-affirming the statement already on the record — plus the
       bound composer, which pinActions() offers on every pending decision.

       `agrees: true` IS NOT A DETAIL (round 6 D1). A re-affirmation is the
       proposal, by construction: its statement is `o.text`, verbatim. Round 6
       left the flag off, `answerDecision`'s `!answer.agrees` read `!undefined`
       as a departure, and the correction chain then asserted that two
       byte-identical sentences differed. That is round 4's D7 arriving back
       through the fallback round 4 itself added — which is why the relationship
       is now ASSERTED by checkAnswerIdentityInvariant() instead of trusted to
       a literal, and why answerDecision derives "did it change" from the two
       strings rather than from this flag alone. */
    o.options = [{ label: "Re-affirm the prior call", statement: o.text, synthesized: true, agrees: true }];
  }
  if (o.kind === "commitment" && o.priorOverdue) o.overdue = o.priorOverdue;

  /* the label names the object's OWN kind. Round 4's table hard-coded
     "Verified claim" for every verified object, so reopening a verified
     COMMITMENT (K0) recorded that a claim had been reopened. */
  const wasLabel = { accepted: "Accepted " + o.kind,
                     verified: "Verified " + o.kind,
                     unverified: o.kind === "question" ? "Answered question" : "Unverified " + o.kind,
                     self_reported: o.kind === "commitment" ? "Signed off, self-reported" : "Self-reported " + o.kind,
                     proposed: "Proposed " + o.kind,
                     open: "Open " + o.kind }[from]
                   || String(from);
  const nowLabel = ({ decision: "Proposal — pending again, prior answer preserved on the record",
                      question: "Open question — the prior answer preserved on the record",
                      commitment: "Awaiting sign-off — the prior state preserved on the record",
                      claim: "Claim — prior verification preserved on the record" }[o.kind]) +
                   (owed && back !== S.me ? ` · back to ${back}, not to ${S.me}` : "");

  const kept = { decision: "prior answer kept", question: "prior answer kept",
                 commitment: "prior sign-off kept", claim: "prior verification kept" };
  o.facts = ["reopened by " + S.me + " " + t,
             wasResolved || o.answerMsg ? kept[o.kind] : "prior state kept",
             !owed ? "unverified again" : back === S.me ? "pending again" : "pending again · " + back + "'s"]
    .concat(sourceRoomOf(o) ? ["source in #" + o.sourceRoom] : []);
  /* system voice: what happened, not what anyone said about it */
  o.history.push({ k: "gate", who: S.me, tm: t,
    text: "reopened it · the prior state is kept on the record and stays reachable from here" });

  /* A TRANSITION HEADER NAMES WHAT MOVED (round 6 minor). Reopening a
     signed-off commitment puts back `self_reported` — the verification it
     already had — so round 6's header read `SELF-REPORTED → SELF_REPORTED`:
     a prettifier applied to one side, and an arrow claiming a verification
     change that did not happen. What changed there is that it stopped being
     settled, and that is what the header now says. */
  const vChanged = !!vChange;
  const c = {
    hd: "REOPENED · " + (vChanged
      ? enumLabel(from) + " → " + enumLabel(o.verification)
      : enumLabel(o.verification) + " THROUGHOUT · NO LONGER SETTLED"),
    who: S.me, tm: t,
    was: wasLabel,
    after: nowLabel,
    /* WHAT THE ENTRY ASSERTS IS THE RECORDED MOVE; `wasLabel` and `nowLabel` are
       the sentences that describe it. Round 7 put the two LABELS in the change —
       page-composed prose, derived from the enum and the kind, that the object
       never held as a value. They differed, so the check passed; they were still
       not the record. The change is the enum the object actually moved through,
       or — when the enum did not move — the settlement it lost. */
    change: vChange || sChange,
    fact: `reopened by ${S.me} at ${t}` + (reason ? "" : " · no reason given, and none was invented"),
    msg: o.answerMsg || o.sourceMsg || (o.provenance[0] && o.provenance[0].msg) || null,
    room: o.answerMsg ? null : sourceRoomOf(o),
    link: o.answerMsg ? "the prior answer is still in the room →" : "the source is still in the room →"
  };
  /* the ONLY quotation this transition can produce: words the human typed into
     the reason field a moment ago, registered in the human-speech register. */
  if (reason) { S.typed.push(reason); c.quote = { text: reason, by: S.me, src: "typed" }; }
  o.corrections.push(c);

  o.note = "Reopening is append-only. The state " +
           (settledAt ? "reached at " + settledAt : "it was settled in — no time was ever recorded for it —") +
           " is still in the conversation, still in this history, and the row that carried it re-renders to say so. " +
           (owed && back !== S.me
             ? `It went back to ${back}, who owed it — reopening undoes a state, it does not move ownership onto you. `
             : "") +
           (reason ? "The reason above is your own sentence, recorded verbatim."
                   : "No reason was given, and the page does not write one for you.");

  const sys = appendSystem(r, `${o.kind} ${o.id} · ${from} → ${o.verification} · reopened by ${S.me}` +
                  (owed && back !== S.me ? ` · back to ${back}, whose it is` : "") +
                  (reason ? " · reason recorded" : " · no reason given") + " · prior state kept", o);
  S.ui.reopening = null;
  /* the reopen is normally driven from the receipt, and the receipt stays open —
     so the record of this write is the correction entry that was just appended
     to the chain the reader is already looking at. */
  focusAfter(S.ui.receiptId === o.id ? ".rc-sec .corr:last-of-type .lnk" : null,
             S.ui.receiptId === o.id ? "#rcBack" : null,
             `[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  /* the toast reports what actually happened to THIS object, not a fixed line —
     including, since round 4's D5, whose list it landed on when it is not yours */
  toast(needsYou(o)
    ? `reopened · back in Needs you as a pending ${o.kind}, the prior state on record`
    : owed
      ? `reopened · back to ${back} as a pending ${o.kind} — it is not yours, so it did not join your list`
      : `reopened · it is a ~ ${o.kind} again and owes nobody an answer — nothing was added to your list`, "warn");
}

/* the optional reason prompt. Empty is fine and says so: a reason you did not
   give is not a reason the page may supply. */
function reopenBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  box.dataset.prompt = "reopen";            // see verifyBox: round 5 D1
  box.innerHTML =
    `<div class="hd"><span class="lbl">REOPEN THIS ${esc(o.kind.toUpperCase())}</span></div>
     <div class="row">
       <input id="rinput" type="text" aria-label="Reason for reopening (optional)" placeholder="why are you reopening it? (optional — recorded as your words, verbatim)">
       <button class="btn sm" id="rgo">Reopen</button>
       <button class="btn ghost sm" id="rcancel">Cancel</button>
     </div>
     <div class="hint">Leave it empty if you like. The correction chain records the state change either way, in the system's voice — nothing is ever written in yours.</div>`;
  box.querySelector("#rgo").addEventListener("click", () => reopen(o.id, box.querySelector("#rinput").value.trim()));
  /* and this one back onto Reopen, which is where it came from (D3) */
  const closeReopen = () => { S.ui.reopening = null; focusOn("#rcReopen", "#rcBack"); render(); };
  box.querySelector("#rcancel").addEventListener("click", closeReopen);
  box.querySelector("#rinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); reopen(o.id, e.target.value.trim()); }
    if (e.key === "Escape") closeReopen();
  });
  return box;
}

/* --- the ~ → ✓ pair ----------------------------------------------------- */
function doVerify(objectId, evidence) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;
  if (!evidence) { toast("verification needs a note — green means something checked it, and this records what", "bad"); focusVerify(); return; }
  if (o.claimant === S.me) { toast("you cannot verify your own claim — that is what ~ is for", "bad"); return; }
  const t = tick();
  const from = o.verification;
  const wasLabel = "Claim — " + enumLabel(from).toLowerCase() + ", nobody has checked it";
  const vChange = amend(o, "verification", "verified", { tm: t, by: S.me, how: "verified" });
  o.verifiedBy = S.me;
  o.verifiedAt = t + " today";
  const sChange = amend(o, "settlement", null, { tm: t, by: S.me, how: "verified" });
  o.evidence = evidence;
  o.fresh = true;
  /* the evidence note is the verifier's own sentence, and it travels marked as
     theirs into every place it is rendered (round 5 D4) */
  o.facts = [o.claimant, "verified by " + S.me + " " + t, human(evidence)];
  o.history.push({ k: "verified", who: S.me, tm: t, text: ["attached evidence: ", human(evidence)] });
  S.typed.push(evidence);      // your evidence note is your words, so it is quotable
  o.provenance.unshift({ who: S.me, tm: t, msg: null, ex: evidence,
    note: `verification note · attached by ${S.me} · the claimant did not check their own claim` });
  /* A VERIFICATION AMENDS A RECORDED FIELD, SO IT IS IN THE CHAIN (round 7 D5,
     same class). WHAT HAPPENED said the claim had been checked; the chain, forty
     pixels below, said the object had never been amended. */
  o.corrections.push({
    hd: "VERIFIED · " + enumLabel(from) + " → " + enumLabel(o.verification),
    who: S.me, tm: t,
    was: wasLabel,
    after: `Verified by ${S.me}, who is not the claimant`,
    change: vChange || sChange,
    fact: `verified by ${S.me} at ${t} · the evidence is ${S.me}'s own sentence and is quoted below`,
    quote: { text: evidence, by: S.me, src: "typed" },
    msg: o.sourceMsg || (o.provenance[1] && o.provenance[1].msg) || null,
    link: "the claim is still in the room →"
  });
  o.note = "Verified by someone other than the claimant, which is the only thing that makes a line green. " +
           "Reopening it puts the ~ back and keeps this note on the record.";
  const sys = appendSystem(r, [`claim ${o.id} · unverified → verified by ${S.me} · evidence: `, human(evidence)], o);
  S.ui.verifying = null;
  focusAfter(`[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  toast("verified · " + o.claimant + " said it, you checked it");
}

/* --- pin effects -------------------------------------------------------- */
/* whose commitment it is. `owner` when the seed names one, otherwise the person
   who made the commitment. Only that person can sign it off. */
function commitmentOwner(o) { return o.owner || o.claimant || null; }

function applyEffect(objectId, fx) {
  const r = room();
  const o = obj(r, objectId);
  if (!o) return;

  /* SIGN-OFF IS GUARDED ON OWNERSHIP (round 4 D5). Round 4 let you sign off a
     commitment that was not yours — it rewrote the facts to your name and the
     receipt asserted "You signed your own sign-off" while still naming justin
     as the claimant, which is two false statements about one object. You may
     record that you settled your own commitment; you may not record that you
     settled somebody else's. */
  if ((fx === "signed" || fx === "resched") && commitmentOwner(o) !== S.me) {
    toast(`${fieldOr(commitmentOwner(o), "someone else")} owns this commitment, not you — signing it off would record their word as yours`, "bad");
    return;
  }

  const t = tick();
  let line = "", msgText = "", kind = "ok";
  /* EVERY BRANCH BELOW AMENDS A RECORDED FIELD, SO EVERY BRANCH BELOW WRITES A
     CORRECTION ENTRY (round 7 D5). Round 7 wrote none of them: reschedule moved
     the due date and reassignment moved the assignee, WHAT HAPPENED said so at
     the top of the receipt, and CORRECTION CHAIN forty pixels below said "this
     object has never been amended". One receipt, two contradictory claims about
     the same click. `corr` is filled in by the branch and appended once, so a
     branch cannot amend and stay quiet. */
  let corr = null;

  /* everything a transition writes about itself is derived: the actor is S.me,
     the objectives are the object's own, the assignee is the object's own.
     Round 2 typed "lars", "justin" and "o2" into these strings. */
  const blocked = o.objectives.length;
  const blocks = `${blocked} objective${blocked === 1 ? "" : "s"}`;

  if (fx === "signed") {
    /* GUARDED (round 4 D2). K0 is a commitment with no `due` field at all, and
       round 4 wrote `was due ${o.due}` straight into the permanent system row:
       "was due undefined". A missing due date is a fact worth stating; the name
       of a JavaScript value is not. */
    const dueClause = o.due ? `was due ${o.due}` : "no due date was ever set";
    const wasV = o.verification;
    /* BRIEF §5: an item you settled keeps its reopen affordance, so signing off
       records that you settled it and what state to put back. */
    o.resolvedAt = t; o.resolvedBy = S.me; o.priorOverdue = o.overdue;
    const vc = amend(o, "verification", "self_reported", { tm: t, by: S.me, how: "signed off" });
    o.owedTo = null; o.overdue = null;
    const sc = amend(o, "settlement", null, { tm: t, by: S.me, how: "signed off" });
    corr = {
      hd: "SIGNED OFF · " + (vc ? enumLabel(wasV) + " → " + enumLabel(o.verification)
                                : enumLabel(o.verification) + " THROUGHOUT · NOW SETTLED"),
      who: S.me, tm: t,
      was: `Open commitment — ${dueClause}, nobody had settled it`,
      after: `Signed off by ${S.me} at ${t} — self-reported, nothing has checked it`,
      change: vc || sc,
      fact: `signed off by ${S.me} at ${t} · self-reported: the owner's own word, which is why it stays ~`,
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: "the commitment is still in the room →"
    };
    o.facts = [S.me, "marked done " + t, "self-reported"];
    o.history.push({ k: "claim", who: S.me, tm: t, text: "marked it signed off — your own word, nothing has checked it" });
    o.note = "You signed your own sign-off. Nobody verifies their own commitment, so this stays ~.";
    line = `commitment ${o.id} · marked signed off by ${S.me} · ${dueClause} · self-reported, not verified`;
    msgText = "signed off · recorded as self-reported, not verified — nobody verifies their own commitment";
    kind = "info";
  } else if (fx === "resched") {
    const fromClause = o.due ? `from ${o.due}` : "from no due date at all";
    const priorDue = RECORDED.due.get(o);
    amend(o, "verification", "self_reported", { tm: t, by: S.me, how: "rescheduled" });
    o.owedTo = null; o.overdue = null;
    /* the amendment this action IS: the due date. Written through the record, so
       the entry below asserts the two dates the object actually held. */
    const dc = amend(o, "due", "today 17:00", { tm: t, by: S.me, how: "rescheduled" });
    corr = {
      hd: "RESCHEDULED · DUE DATE AMENDED",
      who: S.me, tm: t,
      was: "Due " + recordedLabel(priorDue, "— no due date was ever set"),
      after: "Due today 17:00",
      change: dc,
      fact: `rescheduled by ${S.me} at ${t} · the original date is not erased — it is above, and it is in this chain`,
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: "the commitment is still in the room →"
    };
    o.facts = [S.me, "due today 17:00", "rescheduled " + t];
    o.history.push({ k: "claim", who: S.me, tm: t, text: `moved the due date ${fromClause} to today 17:00 — the original date stays above` });
    o.note = "Rescheduling never erases the original date; both are in the history.";
    line = `commitment ${o.id} · due ${fromClause} → today 17:00 · rescheduled by ${S.me}`;
    msgText = "rescheduled · the original due date stays on the record";
    kind = "info";
  } else if (fx === "answered") {
    /* THE ANSWER IS THE RECORD (round 5 D2). This branch used to record that the
       question had been answered and drop the answer itself: the string on the
       button — "retention is 90 days" — appeared nowhere in the object, the
       facts, the history, the feed, the receipt or the lens. A record of an
       answer that does not contain the answer is not a record of anything.
       The decision path already does this correctly and a card answer is the
       same shape, so it is recorded the same way: the statement verbatim, in
       the SYSTEM's voice, actored to atrium, because the page wrote those
       characters and the human chose them. */
    const ans = o.answerOption;
    if (!ans) { toast("this question carries no answer on its card, and the page will not word one — answer it yourself", "bad"); return; }
    const m = appendMessage(r, { id: nextId("m"), t, actor: "atrium", system: true, byMe: true, fresh: true,
      origin: "chosen", chosenBy: S.me, chosenLabel: ans.label,
      body: [`${S.me} answered: ${ans.label}`], boundTo: o.id,
      note: `statement recorded: ${ans.statement} · chosen from the card's options, not typed — these are not ${S.me}'s words` });
    const wasV = o.verification;
    const ac = amend(o, "answer", ans.statement, { tm: t, by: S.me, how: "chosen from the card" });
    o.answerLabel = ans.label; o.answerMsg = m.id;
    o.answeredBy = S.me; o.answeredAt = t + " today";
    o.resolvedAt = t; o.resolvedBy = S.me;
    amend(o, "verification", "unverified", { tm: t, by: S.me, how: "answered" });
    o.owedTo = null;
    const sc2 = amend(o, "settlement", null, { tm: t, by: S.me, how: "answered" });
    corr = {
      hd: "ANSWERED · " + enumLabel(wasV) + " → " + enumLabel(o.verification),
      who: S.me, tm: t,
      was: "Open question — nothing was on the record as its answer",
      after: ans.statement,
      change: ac || sc2,
      fact: `answered by ${S.me} at ${t} · chosen: ${ans.label} — the page wrote the sentence, ${S.me} chose it · ` +
            `no sign-off is attached, so the answer is on the record and unverified`,
      msg: o.sourceMsg || m.id, room: sourceRoomOf(o),
      link: "the question is still in the room →"
    };
    o.facts = ["answered by " + S.me + " " + t, "recorded: " + ans.statement, "no sign-off attached", "still blocks " + blocks];
    o.history.push({ k: "question", who: S.me, tm: t,
      text: `chose the answer ${ans.label} from the card — the statement it carries was recorded verbatim and none of it is worded by ${S.me}: ${ans.statement}` });
    o.provenance.unshift({ who: "atrium", tm: t, msg: m.id, voice: "system",
      ex: `${S.me} answered: ${ans.label} — statement recorded: ${ans.statement}`,
      note: `one-click answer · the card's statement recorded verbatim · ${S.me} chose it, the page worded it · no model in the path · no sign-off attached, so it stays unverified` });
    o.note = "The answer above is the statement the card carried, recorded verbatim, and the row that records it is in the system's voice — the page wrote that sentence, so it is not attributed to you as something you said. " +
             "Answering a question is not the same as verifying the answer. It stays ~ until a sign-off is attached, which is why the objectives it blocks are still blocked.";
    line = `question ${o.id} · open → answered by ${S.me} · ${S.me} chose: ${ans.label} · statement recorded verbatim, not worded by ${S.me} · unverified (no sign-off attached) · still blocking ${blocks}`;
    msgText = `answered · the card's statement recorded verbatim in the system's voice · stays ~ with no sign-off, and still blocks ${blocks}`;
    kind = "warn";
  } else if (fx === "reassign") {
    /* the page never invents a name. pinActions() only offers this when the
       object names who to hand it to; round 4 fell back to a hard-coded
       "justin" if it did not, which is a person's name written by a page. */
    const to = o.reassignTo;
    if (!to) { toast("nobody is named on this question to hand it to, and the page will not pick one", "bad"); return; }
    const priorAssignee = RECORDED.assignee.get(o);
    o.owedTo = null;
    const nc = amend(o, "assignee", to, { tm: t, by: S.me, how: "reassigned" });
    corr = {
      hd: "REASSIGNED · ASSIGNEE AMENDED",
      who: S.me, tm: t,
      was: recordedLabel(priorAssignee, "Nobody was assigned to it"),
      after: to + " — it is still open, and still blocking " + blocks,
      change: nc,
      fact: `reassigned by ${S.me} at ${t} · nothing about the question itself changed, and nothing was answered`,
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: "the question is still in the room →"
    };
    o.facts = ["asked by " + fieldOr(o.askedBy, "nobody on the record"), "now " + to + "'s", "still open"];
    o.history.push({ k: "question", who: S.me, tm: t, text: `reassigned it to ${to} — out of your list, unchanged in the record` });
    o.note = "Reassigning moves it off your surface. It is still open and still blocking the objectives it blocked.";
    line = `question ${o.id} · reassigned to ${to} by ${S.me} · still open · still blocking ${blocks}`;
    msgText = `reassigned to ${to} · out of your list, still open, still blocking ${blocks}`;
    kind = "warn";
  }
  /* an amendment that produced no recorded change would be a branch claiming to
     have moved something it did not; the entry carries what amend() minted, and
     checkCorrectionInvariant() refuses anything else. */
  if (corr) o.corrections.push(corr);
  o.fresh = true;
  const sys = appendSystem(r, line, o);
  S.ui.pinOpen = null;
  focusAfter(`[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  toast(msgText, kind);
}

/* ===========================================================================
 * COMPOSER
 * ======================================================================== */

function renderComposer() {
  const r = room();
  const bar = $("ctxbar"), input = $("cinput"), comp = $("composer");
  comp.classList.toggle("bound", !!S.ui.bound);
  comp.classList.toggle("replying", !!S.ui.replyTo);

  if (S.ui.bound) {
    const o = obj(r, S.ui.bound);
    bar.hidden = false; bar.className = "ctxbar rise-s";
    $("ctxGlyph").textContent = "◆";
    $("ctxLabel").textContent = "ANSWER-BINDING";
    $("ctxText").textContent = "what you type is recorded as the decision, verbatim";
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    /* "in: " is the page's; the statement may be the human's own answer */
    $("ctxIn").innerHTML = "in: " + (o ? voiced(titleFrag(o)) : "");
    input.placeholder = "Answer in your own words — this text becomes the decision";
    $("cstate").textContent = "bound to ◆ " + (o ? o.id : "") + " · your wording is the record · interpretation is skipped";
  } else if (S.ui.replyTo) {
    const m = msg(r, S.ui.replyTo);
    bar.hidden = false; bar.className = "ctxbar reply rise-s";
    $("ctxGlyph").textContent = "↩";
    $("ctxLabel").textContent = "REPLYING";
    $("ctxText").textContent = m ? m.actor + " · " + m.t : "";
    /* the quoted context above the composer is a quotation of a real row, and
       says which one — the checker resolves it back to that message. */
    $("ctxIn").className = "in quoted";
    $("ctxIn").dataset.voice = "human";      // a quotation of a row a person wrote
    if (m) $("ctxIn").dataset.quoted = "msg:" + m.id; else $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").textContent = m ? "“" + plain(m.body).slice(0, 70) + "”" : "";
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = "reply · interpretation runs on send · anything derived lands in Current state as ~";
  } else {
    bar.hidden = true;
    /* A HIDDEN QUOTATION IS STILL A QUOTATION. Hiding the bar left its last
       reply context in the DOM — text, `data-quoted` and all — so replying in
       one room, cancelling, and switching to the other left an element on the
       page citing a message that does not exist there, and the quotation
       checker said so, twice, on every render. Found while re-verifying round
       5's "console completely silent"; the sequence is three ordinary clicks.
       An empty context asserts nothing, so it is emptied. */
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    $("ctxIn").textContent = "";
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = "interpretation runs on send · proposals land in Current state as ~ until accepted";
  }
}

function bindComposer(objectId) {
  S.ui.bound = objectId; S.ui.replyTo = null;
  render();
  $("cinput").focus();
}
function startReply(msgId) {
  const r = room();
  const m = msg(r, msgId);
  S.ui.replyTo = msgId; S.ui.bound = null;
  const input = $("cinput");
  if (m && m.actor !== S.me && !m.system) input.value = "@" + m.actor + " ";
  render();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
/* cancelling puts the context bar away, so the control you pressed goes with it —
   focus belongs on the composer you are still standing in front of (D3) */
function cancelContext() { S.ui.bound = null; S.ui.replyTo = null; focusOn("#cinput"); render(); }

function send() {
  const r = room();
  const input = $("cinput");
  const v = input.value.trim();
  if (S.ui.bound) {
    if (!v) { toast("type your answer — the composer records what you write, not what the card suggested", "bad"); input.focus(); return; }
    answerDecision(S.ui.bound, { origin: "typed", statement: v },
      `answer-bound reply · typed by ${S.me} and recorded verbatim · no model in the path`);
    return;
  }
  if (!v) return;
  S.typed.push(v);
  const t = tick();
  appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, origin: "typed", body: [v], replyTo: S.ui.replyTo || null });
  input.value = "";
  S.ui.replyTo = null;
  /* the composer is not rebuilt, so it keeps the cursor on its own — declared
     anyway, because "where focus goes after a write" is a spec and not an
     accident of which nodes happened to survive innerHTML. */
  focusAfter("#cinput");
  render();
  scrollFeedToEnd();
  toast("sent · your own message, so it is never counted back to you as unseen", "info");
}

/* ===========================================================================
 * NAVIGATION / FILTERS / MISC WIRING
 * ======================================================================== */

function setFilter(k, scope) {
  const f = S.ui.feedFilter;
  const off = f && f.k === k && f.scope === scope;
  S.ui.feedFilter = off ? null : { k, scope };
  /* the routine chip opens the collapse; turning it off closes it again unless
     you had already opened it by hand. Round 2 left the peek hanging open. */
  if (!off && k === "routine" && !S.ui.routineOpen) { S.ui.routineOpen = true; S.ui.routineOpenedByFilter = true; }
  if ((off || k !== "routine") && S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  const syl = $("syl");
  if (syl) scrollIntoView(syl, "start");
}

/* a filter whose group no longer contains anything of that class cannot stay on
   — otherwise a cleared pin leaves a filter highlighting nothing. */
function normalizeFilter() {
  const f = S.ui.feedFilter;
  if (!f) return;
  const n = groupMessages(room(), f.scope).filter(m => msgClass(room(), m) === f.k).length;
  if (!n) S.ui.feedFilter = null;
}

/* marking seen moves ONE thing: the cursor. Nothing is destroyed, so nothing
   needs a confirmation dialog — the undo is on the divider it just muted. */
function markSeen() {
  const r = room();
  const scope = absenceRead(r) ? "return" : "absence";
  r.readGroup = counts(r, scope).total;          // what the cursor just swallowed
  r.markFrom = r.seenAfter;                      // where to put it back
  r.markedAt = S.now;
  r.seenAfter = r.messages[r.messages.length - 1].id;
  /* the control that replaced the one you pressed — same place on the divider,
     and the way back out of what you just did (D3) */
  focusOn("#unmarkSeen", "#markSeen");
  render();
