              ` · ${nv.ever("verified") ? "the earlier check is still on the record" : "not verified"}`)];
    trans = vc || sc;
    msgText = say([nowV], v => `signed off · recorded as ${enumText(v.value)}, not verified — nobody verifies their own commitment`);
    kind = "info";
  } else if (fx === "resched") {
    const dAt = recordOf(o, "due").length - 1;
    const vc2 = amend(o, "verification", "self_reported", { tm: t, by: S.me, how: "rescheduled" });
    /* RESCHEDULING DOES NOT DISCHARGE THE COMMITMENT (round 8 minor). Round 8
       cleared `owedTo` here without setting `resolvedAt`: the item left Needs
       you, so it offered no sign-off and no reschedule, and canReopen() is
       false for something that was never settled — an unsigned commitment with
       no action path anywhere on the page. Moving a date moves a date. It is
       still owed, by whoever owed it, on the new one. */
    o.owedTo = commitmentOwner(o); o.overdue = null;
    /* the amendment this action IS: the due date. Written through the record, so
       the entry below asserts the two dates the object actually held. */
    /* the date the control's own label names, so the value the reader was shown
       before the click and the value written by it cannot drift (round 12 D6,
       tier 3 — the label is the whole of what makes this action answerable) */
    const dc = amend(o, "due", RESCHED_TO, { tm: t, by: S.me, how: "rescheduled" });
    /* ONE READ, AND EVERY SURFACE THIS TRANSITION NARRATES IS WRITTEN FROM IT
       (round 9 D1). The two dates are read once, here; the header, the chain
       body, WHAT HAPPENED, the permanent row, the toast, the fact chips and the
       receipt's note are all minted from these same two views. Round 9 read the
       record for the chain body and composed the other five beside it, so
       rescheduling to the date already on the record printed "moved the due date
       from today 17:00 to today 17:00" in WHAT HAPPENED, "RESCHEDULED · DUE DATE
       AMENDED" in the header and "rescheduled" in the toast, above a body
       correctly reporting that nothing had changed. */
    /* AND THE TRANSITION READS THE FIELD ITS OWN SENTENCES ARE ABOUT (round 12
       D1). Round 11's walk found four live classes on this branch in three
       clicks, on the artifact round 11 shipped:

         6249  `" · still open"`      a bare literal appended to the PERMANENT
               feed row, inside `data-obj="K2"` and outside `paintSaid` — the
               exact defect the walk was built to find, shipped in the same
               round that built it, and false as well as unread: K2's
               verification history is ["self_reported"] and has never once
               held "open".
         6244  `o.note`               "the commitment is still open, still
               yours, and still on your list" — a continuity claim about the
               verification, minted from two views of `due`. This is round 10's
               D1 verbatim, in code round 11 touched.
         6240  "recorded the due date AGAIN"   a whole-history quantifier
               produced by comparing the two ends of the transition.
         6230  "…nothing was amended and nothing was ERASED"   a past
               quantifier written from a read at the end of the history.

       So the reschedule reads what it talks about: the two dates, AND the
       settlement, which is the field that answers "is this still owed" — the
       question `still open` was badly asking. The `again` and the `nothing was
       erased` are gone rather than re-backed: two point reads cannot answer a
       question about the whole history, and what these sentences actually have
       to say is a continuity claim, which two point reads DO answer.

       A SENTENCE STILL DECLARES ONLY THE READS IT USES, so the settlement is a
       SEPARATE view rather than a third element of `rd`: the header and the two
       operands are about the date and say nothing about settlement, and adding
       a claim they do not use is a claim every checker on this page would
       re-read on their behalf for nothing. */
    const rd = reads(o, [{ of: "due", at: dAt }, "due"]);
    const rst = fieldView(o, "settlement");
    const moved = (was, now) => !sameValue(was.value, now.value);
    corr = {
      /* the word "AMENDED" is produced by the branch that read the two values,
         so it cannot be stated about a date that did not move — which is why
         this needs no keyword sniffer to police it (D1b) */
      hd: say(rd, (was, now) => "RESCHEDULED · " +
        (moved(was, now) ? "DUE DATE AMENDED" : "THE DUE DATE IT ALREADY HAD")),
      who: S.me, tm: t,
      /* same "ever", same fix: the operand asks the history whether anything was
         ever recorded here rather than inferring it from a null (round 12) */
      was: say([rd[0]], d => "Due " + (d.everSet() ? recordedLabel(d.value) : "— no due date was ever set")),
      after: say([rd[1]], d => "Due " + recordedLabel(d.value)),
      change: dc,
      /* THE FACT LINE IS A SURFACE TOO (round 10 self-review). It was written
         unconditionally, so rescheduling to the date already on the record
         printed "rescheduled by lars · the original date is not erased"
         underneath a header and a body that both correctly reported that
         nothing had moved — the fifth layer's defect, through a sixth door,
         inside the very entry the other five were fixed in. */
      /* "nothing was erased" was a PAST quantifier written from a read at the
         end of the history — and on the second reschedule `dAt` IS the end,
         because amend() records nothing when a value does not move, so there
         was no read of the past behind it at all. What these two reads support
         is a continuity claim about the date, and that is what is left. */
      fact: say(rd, (was, now) => moved(was, now)
        ? `rescheduled by ${S.me} at ${t} · the date it was moved from is above, and it is in this chain`
        : `re-recorded by ${S.me} at ${t} · the date it was moved to is the date it already had, so the due date is unchanged`),
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: say([rd[1]], () => "the commitment " + routeHome(sourceRoomOf(o)))
    };
    o.facts = [S.me,
               say([rd[1]], d => "due " + recordedLabel(d.value, "not set")),
               say(rd, (was, now) => (moved(was, now) ? "rescheduled " : "date unchanged ") + t)];
    /* "again" is a question about the WHOLE due history and it was produced by
       comparing the two ends of this transition, which cannot answer it. The
       sentence's actual content is that the date did not move, and that is a
       continuity claim two point reads do answer. */
    o.history.push({ k: "claim", who: S.me, tm: t,
      text: say(rd, (was, now) => moved(was, now)
        ? `moved the due date from ${recordedLabel(was.value, "no due date at all")} to ${recordedLabel(now.value, "no date at all")} — the date it moved from stays above, and it is still owed`
        : `recorded the due date unchanged at ${recordedLabel(now.value, "no date at all")} — the due date did not move, and it is still owed`) });
    /* THE CLOSING NOTE READS THE FIELD IT IS ABOUT. "the commitment is still
       open, still yours, and still on your list" was three continuity claims —
       about the verification, the assignee and your list — minted from two
       reads of the due date, and the first of them named a state K2's record
       has never held. What a reschedule can honestly say about standing is what
       the settlement says, so the settlement is what it reads. */
    o.note = say(rd.concat([rst]), (was, now, st) => (moved(was, now)
      ? `Rescheduling moves the date and nothing else: ${recordedLabel(was.value, "no due date at all")} is still on the record above ${recordedLabel(now.value)}. `
      : `The date it was moved to is ${recordedLabel(now.value, "no date at all")}, the date it already had, so the due date is unchanged and the record has nothing new to hold. `) +
      `It is still ${enumText(st.value)}, and still owed.`);
    /* both sides of the arrow are the values the record moved between (D2) */
    /* AND THE LAST TWO WORDS ARE READ (round 12 D1). `" · still open"` was a
       bare string appended to the body of a PERMANENT row — the surface that
       never goes away — asserting a continuity about a verification the branch
       never opened, in a word that verification has never held. It is the
       settlement that says whether a commitment still stands, and it is read. */
    line = [`commitment ${o.id} · due `,
            say(rd, (was, now) => moved(was, now)
              ? `${recordedLabel(was.value, "not set at all")} → ${recordedLabel(now.value)} · rescheduled by ${S.me}`
              : `unchanged at ${recordedLabel(now.value, "no date at all")} · re-recorded by ${S.me}, which moved nothing`),
            " · ",
            say([rst], st => "still " + enumText(st.value))];
    trans = dc || vc2;
    msgText = say(rd, (was, now) => moved(was, now)
      ? "rescheduled · the original due date stays on the record, and it is still owed"
      : "the due date was not amended · the date it already had is the date it now has, and it is still owed");
    kind = "info";
  } else if (fx === "answered") {
    /* THE ANSWER IS THE RECORD (round 5 D2), AND THERE IS ONE PATH TO IT
       (round 9 D4). The card's one-click answer and the composer's typed answer
       differ in exactly one thing — who authored the characters — so they are
       the same write, and answerQuestion() is it. Two copies of a write path is
       how "the decision path already does this correctly" became a defect in
       the branch beside it, twice. */
    const ans = o.answerOption;
    if (!ans) { toast("this question carries no answer on its card, and the page will not word one — answer it yourself", "bad"); return; }
    answerQuestion(o.id, ans.statement,
      /* the note describes the ACTION, so it says what the action does rather
         than what the record now holds — "so it stays unverified" was a claim
         about the verification history written into a provenance string (round
         11). What the record holds is on the receipt's own state line, read. */
      /* "wording", not "statement": a question's answer of record is `answer`,
         and `statement` is a different field with a different history (round 13,
         D9 — swept to the branch beside the one the splitter caught) */
      `one-click answer · the card's wording recorded verbatim · ${S.me} chose it, the page worded it · no model in the path · no sign-off is attached by this action`,
      ans.label);
    return;
  } else if (fx === "reassign") {
    /* the page never invents a name. pinActions() only offers this when the
       object names who to hand it to; round 4 fell back to a hard-coded
       "justin" if it did not, which is a person's name written by a page. */
    const to = o.reassignTo;
    if (!to) { toast("nobody is named on this question to hand it to, and the page will not pick one", "bad"); return; }
    const nAt = recordOf(o, "assignee").length - 1;
    o.owedTo = null;
    const nc = amend(o, "assignee", to, { tm: t, by: S.me, how: "reassigned" });
    /* THE LATENT TWIN OF THE RESCHEDULE HEADER (round 9 D1b). `ASSIGNEE AMENDED`
       was unconditional too, so handing a question to the person it was already
       assigned to would have stated an amendment in a word no syntax check
       looks at. Same shape, same fix: one read, and every surface written from
       it. */
    /* AND A REASSIGN NARRATES THE ANSWER IT NEVER READ (round 11 D1). Round 10
       took two assignee views and wrote "the question itself is unchanged and
       still unanswered" from them, and "nothing was answered" beside it — while
       the record held an answer that the same receipt painted as the ANSWERED
       entry's `after` forty pixels above, the REOPENED entry called preserved,
       and the feed row called "still the answer on the record". Four surfaces
       agreeing with the record and two denying it, at zero errors, because a
       claim about `answer` was minted from a read of `assignee`. CONVENTIONS
       line 230 was written for `answerQuestion` in round 9 and never swept to
       the branch beside it. So this transition reads the two fields it talks
       about — who it is assigned to, and whether it is answered — and the
       sentences are minted from both. */
    const aAt2 = recordOf(o, "answer").length - 1;
    const rn = reads(o, [{ of: "assignee", at: nAt }, "assignee", "answer", "verification"]);
    const moved = (was, now) => !sameValue(was.value, now.value);
    /* whether the record holds an answer is a question for the answer history,
       and it is the whole of what round 10 got wrong here */
    const answered = a => a.everSet();
    corr = {
      hd: say(rn, (was, now) => "REASSIGNED · " +
        (moved(was, now) ? "ASSIGNEE AMENDED" : "THE ASSIGNEE IT ALREADY HAD")),
      who: S.me, tm: t,
      was: say([rn[0]], n => recordedLabel(n.value, "Nobody was assigned to it")),
      after: say([rn[1], rn[3]], (n, v) => recordedLabel(n.value) + " — it is still " + enumText(v.value) +
        ", and still blocking " + blocks, o, ["objectivesUnder"]),
      change: nc,
      fact: say(rn, (was, now, a) => (moved(was, now)
        ? `reassigned by ${S.me} at ${t}`
        : `re-recorded by ${S.me} at ${t} · it was already theirs, so the assignee was not amended`) +
        " · nothing about the question itself changed" +
        (answered(a) ? ", and the answer already on the record is untouched" : ", and it is still unanswered")),
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: say([rn[2]], a => (a.value == null ? "the question " : "the answer ") + routeHome(sourceRoomOf(o)))
    };
    /* "still open" is a claim about the verification, which is a recorded field —
       so it is read, not written down beside it (round 10 self-review) */
    o.facts = ["asked by " + fieldOr(o.askedBy, "nobody on the record"),
               /* "now justin's" — a possessive with nothing possessed after it,
                  found by round 14's prose rule on round 14's own build */
               say([rn[1]], n => n.value == null ? "assigned to nobody" : "assigned to " + recordedLabel(n.value)),
               say([rn[3]], v => "still " + enumText(v.value))];
    o.history.push({ k: "question", who: S.me, tm: t,
      /* "unchanged in the record" was inherited from round 9 and is false about
         the one field this action amends: the assignee moved, which is what the
         header beside it says. What is unchanged is the QUESTION — its text and
         its answer — and that is what the sentence claims now, out of a read of
         the answer rather than out of two reads of the assignee (round 11 D1). */
      text: say(rn, (was, now, a) => (moved(was, now)
        ? `reassigned it from ${recordedLabel(was.value, "nobody")} to ${recordedLabel(now.value)} — out of your list`
        : `recorded ${recordedLabel(now.value)} as the assignee it already had — the assignee did not move`) +
        (answered(a) ? "; the question itself is unchanged, and the answer on the record stays on it"
                     : "; the question itself is unchanged and still unanswered")) });
    o.note = say(rn, (was, now, a, v) => (moved(was, now)
      ? "Reassigning moves it off your surface. "
      : "It was already assigned to that person, so the assignee was not amended. ") +
      "It is still " + enumText(v.value) + " and still blocking the objectives it blocked. " +
      (answered(a) ? "The answer on the record is not touched by handing the question on."
                   : "Nothing has been recorded as its answer."));
    line = [`question ${o.id} · `,
            say(rn, (was, now) => moved(was, now)
              ? `reassigned to ${recordedLabel(now.value)} by ${S.me}`
              : `assignee unchanged at ${recordedLabel(now.value)} · re-recorded by ${S.me}, which moved nothing`),
            " · ",
            say([rn[3]], v => "still " + enumText(v.value)),
            ` · still blocking ${blocks}`];
    trans = nc;
    msgText = say(rn, (was, now, a, v) => (moved(was, now)
      ? `reassigned to ${recordedLabel(now.value)} · out of your list`
      : `the assignee was not amended · it was already ${recordedLabel(now.value)}'s`) +
      ` · still ${enumText(v.value)} · still blocking ${blocks}`, o, ["objectivesUnder"]);
    kind = "warn";
  } else if (fx === "takeback") {
    /* THE CONTROL THAT MAKES HANDING A QUESTION ON REVERSIBLE IN FACT (round 12
       D6). Before this existed, `Ask justin instead` was one unconfirmed click
       into a state with no way out from your seat: `owedTo` cleared, `assignee`
       set, `canAnswer` false, `canReopen` false, and no control anywhere that
       took it back. The friction rule keyed on a glyph nothing could produce,
       so the most consequential action on the page sat in the safest tier.
       Taking it back is an AMENDMENT like every other: it goes through the
       record, it writes a chain entry, and it never erases the hand-off — both
       assignments are in the history, which is the whole argument for why this
       is the right fix rather than a confirm dialog. */
    const x = handedOnBy(o);
    if (!x) { toast("this question was not handed on by you, so there is nothing here to take back", "bad"); return; }
    const bAt = recordOf(o, "assignee").length - 1;
    o.owedTo = S.me;
    const bc = amend(o, "assignee", x.from, { tm: t, by: S.me, how: "taken back" });
    const rb = reads(o, [{ of: "assignee", at: bAt }, "assignee", "answer"]);
    const backTo = who => recordedLabel(who, "nobody on the record");
    corr = {
      hd: say(rb, (was, now) => "TAKEN BACK · " +
        (!sameValue(was.value, now.value) ? "ASSIGNEE AMENDED" : "THE ASSIGNEE IT ALREADY HAD")),
      who: S.me, tm: t,
      was: say([rb[0]], n => backTo(n.value)),
      after: say([rb[1]], n => backTo(n.value)),
      change: bc,
      fact: say(rb, (was, now, a) => `taken back by ${S.me} at ${t} · the hand-off to ${backTo(was.value)} is above, and it is in this chain` +
        (a.everSet() ? " · the answer on the record is untouched" : " · nothing is recorded as its answer")),
      msg: o.sourceMsg || null, room: sourceRoomOf(o),
      link: say([rb[2]], a => (a.value == null ? "the question " : "the answer ") + routeHome(sourceRoomOf(o)))
    };
    o.facts = ["asked by " + fieldOr(o.askedBy, "nobody on the record"),
               say([rb[1]], n => "back with " + (n.value == null ? S.me : recordedLabel(n.value))),
               say([fieldView(o, "verification")], v => "still " + enumText(v.value))];
    o.history.push({ k: "question", who: S.me, tm: t,
      text: say(rb, (was, now, a) => `took it back from ${backTo(was.value)} — it is on your list again` +
        (a.everSet() ? "; the answer on the record stays on it" : "; nothing is recorded as its answer")) });
    o.note = say(rb, (was, now, a) => `Taking it back does not erase the hand-off to ${backTo(was.value)} — it is in the chain above. ` +
      (a.everSet() ? "The answer on the record is not touched by moving the question." : "Nothing is recorded as its answer."));
    line = [`question ${o.id} · `,
            say(rb, (was, now) => `taken back from ${backTo(was.value)} by ${S.me}`),
            " · ",
            say([fieldView(o, "verification")], v => "still " + enumText(v.value))];
    trans = bc;
    msgText = say(rb, was => `taken back from ${backTo(was.value)} · it is on your list again`);
    kind = "warn";
  }
  /* an amendment that produced no recorded change would be a branch claiming to
     have moved something it did not; the entry carries what amend() minted, and
     checkCorrectionInvariant() refuses anything else. */
  if (corr) o.corrections.push(corr);
  o.fresh = true;
  const sys = appendSystem(r, line, o, trans);
  S.ui.pinOpen = null;
  focusAfter(`[data-msg="${sys.id}"] .tag`, `[data-msg="${sys.id}"] button`,
             `[data-lens-obj="${o.id}"]`);
  render();
  toast(msgText, kind);
}

/* ===========================================================================
 * COMPOSER
 * ======================================================================== */

/* ===========================================================================
 * THE COMPOSER MAY NOT NAME A BEHAVIOUR THIS FILE DOES NOT HAVE (round 15, D2)
 *
 * `#cstate` sat under the composer on every screen in both rooms and read
 * `interpretation runs on send · proposals land in Current state as ~ until
 * accepted`. It does not. `send()` appends the message with `origin: "typed"`
 * and does nothing else, and NOTHING IN THIS FILE EVER APPENDS TO `r.objects` —
 * every reference is filter/find/map/forEach/length/indexOf. Not a missing
 * case: an absent mechanism, stated in the present tense on the most-read strip
 * of text on the page. Three typed messages that are structural twins of
 * fixture rows which ARE objects all landed as plain routine rows.
 *
 * This is a prototype and no engine is expected here. The defect is that the
 * page said otherwise, so the fix is the copy and not an engine: the design is
 * described as a design, and what this frame actually does is stated beside it.
 *
 * AND THE BOUND VARIANT COMPOUNDED IT. `your wording is the record ·
 * interpretation is skipped` teaches a reader that interpretation otherwise
 * RUNS — a claim about the unbound composer, made from the bound one. What is
 * true of the bound composer is that it records your characters verbatim, which
 * is what it now says, and it says nothing about what the other one does.
 * ======================================================================== */
const COMPOSER_STATE = "by design, send interprets · this frame does not, and nothing lands in Current state";
const REPLY_STATE = "reply · " + COMPOSER_STATE;

function renderComposer() {
  const r = room();
  const bar = $("ctxbar"), input = $("cinput"), comp = $("composer");
  comp.classList.toggle("bound", !!S.ui.bound);
  comp.classList.toggle("replying", !!S.ui.replyTo);

  if (S.ui.bound) {
    const o = obj(r, S.ui.bound);
    /* AND THE BANNER SAYS WHICH RECORD IT IS BINDING (round 9 D4). "recorded as
       the decision" was written above every kind, including the ones whose
       record has no decision in it — a question's answer, or a commitment
       somebody else owns, which this composer may not touch at all. */
    const bk = boundKind(o);
    bar.hidden = false; bar.className = "ctxbar rise-s";
    $("ctxGlyph").textContent = "◆";
    $("ctxLabel").textContent = "ANSWER-BINDING";
    $("ctxText").textContent = bk === "question"
      ? "what you type is recorded as the answer to this question, verbatim"
      : "what you type is recorded as the decision, verbatim";
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    /* "in: " is the page's; the statement may be the human's own answer */
    $("ctxIn").innerHTML = "in: " + (o ? voiced(titleFrag(o)) : "");
    input.placeholder = bk === "question"
      ? "Answer in your own words — this text becomes the answer on the record"
      : "Answer in your own words — this text becomes the decision";
    $("cstate").textContent = "bound to ◆ " + (o ? o.id : "") +
      (bk === "question" ? " · your wording is the answer of record · no sign-off is attached"
                         : " · your wording is the record, verbatim · nothing is inferred from it");
  } else if (S.ui.about) {
    /* THE HONEST ALTERNATIVE TO A BOUND COMPOSER (round 9 D4). It says, in the
       banner and in the state line, that nothing here reaches the record. */
    const o = obj(r, S.ui.about);
    bar.hidden = false; bar.className = "ctxbar reply rise-s";
    $("ctxGlyph").textContent = "↩";
    $("ctxLabel").textContent = "ABOUT";
    $("ctxText").textContent = o ? o.kind + " " + o.id : "";
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    $("ctxIn").innerHTML = "about: " + (o ? voiced(titleFrag(o)) : "");
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = "a message in the room · nothing you type here is recorded as " +
      (o ? "the " + o.kind + "'s" : "the") + " own words, and no field is amended";
  } else if (S.ui.replyTo) {
    const m = msg(r, S.ui.replyTo);
    bar.hidden = false; bar.className = "ctxbar reply quoting rise-s";
    $("ctxGlyph").textContent = "↩";
    $("ctxLabel").textContent = "REPLYING";
    $("ctxText").textContent = m ? m.actor + " · " + m.t : "";
    /* the quoted context above the composer is a quotation of a real row, and
       says which one — the checker resolves it back to that message. */
    /* AND IT IS NOT SHORTENED BEFORE IT IS PAINTED (round 15, D1). This carried
       `plain(m.body).slice(0, 70)` inside quotation marks and then handed the
       remainder to a `text-overflow: ellipsis` — the same sentence cut twice and
       presented as whole. The quotation is complete; the clamp is CSS, expands
       on hover and on focus, and the control is the route back to the row. */
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    $("ctxIn").innerHTML = m
      ? `<button class="ctxq" data-jump="${esc(m.id)}">` +
          `<span class="quoted" data-quoted="msg:${esc(m.id)}" data-voice="human"` +
          ` data-clamp="expands on hover and on focus; this control jumps to the row it quotes">` +
          `“${esc(plain(m.body))}”</span></button>`
      : "";
    const ctxq = $("ctxIn").querySelector("[data-jump]");
    if (ctxq) ctxq.addEventListener("click", () => jumpTo(ctxq.dataset.jump));
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = REPLY_STATE;
  } else {
    bar.hidden = true;
    /* A HIDDEN QUOTATION IS STILL A QUOTATION. Hiding the bar left its last
       reply context in the DOM — text, `data-quoted` and all — so replying in
       one room, cancelling, and switching to the other left an element on the
       page citing a message that does not exist there, and the quotation
       checker said so, twice, on every render. Found while re-verifying round
       5's "console completely silent"; the sequence is three ordinary clicks.
       An empty context asserts nothing, so it is emptied. */
    $("ctxIn").className = "in";
    $("ctxIn").removeAttribute("data-quoted");
    $("ctxIn").removeAttribute("data-voice");
    $("ctxIn").textContent = "";
    input.placeholder = "Message #" + r.name;
    $("cstate").textContent = COMPOSER_STATE;
  }
}

/* WHAT THE PAGE PUT IN THE COMPOSER, THE PAGE TAKES BACK OUT (round 8 minor).
   `startReply` prefills "@priya " — the page's characters, a convenience for a
   chat line. Binding the composer to a decision turns that same box into the
   statement of record, and round 8 carried the prefill across: pressing Send
   recorded `@priya ` as the decision. Truthful about what was in the box and
   wrong about whose words they were, which is the D3 class one step removed.
   Only the page's own prefix is removed — anything typed after it is the
   human's and stays, because deleting somebody's draft to be safe is its own
   kind of dishonesty. */
function dropPrefill() {
  const input = $("cinput");
  const p = S.ui.prefill;
  S.ui.prefill = null;
  if (!p || !input) return;
  if (input.value === p) input.value = "";
  else if (input.value.indexOf(p) === 0) input.value = input.value.slice(p.length);
}
/* THE GUARD IS ON THE PATH, NOT ONLY ON THE BUTTON (round 9 D4). pinActions()
   decides which control to offer; this decides what the composer may bind to,
   the way applyEffect() guards the sign-off it is offered for. A control that is
   not rendered is not a guarantee — the previous round's defect was reachable
   through a branch pinActions() renders deliberately. */
function bindComposer(objectId) {
  const o = obj(room(), objectId);
  if (!canBind(o)) { toast(refusalFor(o), "bad"); return; }
  dropPrefill();
  S.ui.bound = objectId; S.ui.replyTo = null; S.ui.about = null;
  render();
  $("cinput").focus();
}
/* saying something about an object touches no record at all: it appends the
   message a person wrote, in their voice, and cites what it is about. */
function startAbout(objectId) {
  dropPrefill();
  S.ui.about = objectId; S.ui.bound = null; S.ui.replyTo = null;
  render();
  $("cinput").focus();
}
function startReply(msgId) {
  const r = room();
  const m = msg(r, msgId);
  dropPrefill();
  S.ui.replyTo = msgId; S.ui.bound = null;
  const input = $("cinput");
  if (m && m.actor !== S.me && !m.system && !input.value) {
    S.ui.prefill = "@" + m.actor + " ";
    input.value = S.ui.prefill;
  }
  render();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
/* cancelling puts the context bar away, so the control you pressed goes with it —
   focus belongs on the composer you are still standing in front of (D3) */
function cancelContext() { dropPrefill(); S.ui.bound = null; S.ui.replyTo = null; S.ui.about = null; focusOn("#cinput"); render(); }

function send() {
  const r = room();
  const input = $("cinput");
  const v = input.value.trim();
  if (S.ui.bound) {
    const o = obj(r, S.ui.bound);
    /* AND THE WRITE PATH CHECKS AGAIN (round 9 D4). Round 9 called
       answerDecision() for whatever happened to be bound, so the kind of object
       and the question of whose call it was never entered the write at all. */
    if (!canBind(o)) { const id = S.ui.bound; S.ui.bound = null; render(); bindComposer(id); return; }
    if (!v) { toast("type your answer — the composer records what you write, not what the card suggested", "bad"); input.focus(); return; }
    beginAction("typed", o);
    /* a decision's record IS its statement; a question's record is its ANSWER.
       Writing a typed answer into a question's statement rewrote the question. */
    if (boundKind(o) === "question")
      answerQuestion(o.id, v, `answer-bound reply · typed by ${S.me} and recorded verbatim · no model in the path`);
    else
      answerDecision(o.id, { origin: "typed", statement: v },
        `answer-bound reply · typed by ${S.me} and recorded verbatim · no model in the path`);
    return;
  }
  if (!v) return;
  S.typed.push(v);
  const t = tick();
  appendMessage(r, { id: nextId("m"), t, actor: S.me, fresh: true, origin: "typed", body: [v],
                     replyTo: S.ui.replyTo || null, aboutObject: S.ui.about || null });
  input.value = "";
  S.ui.replyTo = null; S.ui.prefill = null; S.ui.about = null;
  /* the composer is not rebuilt, so it keeps the cursor on its own — declared
     anyway, because "where focus goes after a write" is a spec and not an
     accident of which nodes happened to survive innerHTML. */
  focusAfter("#cinput");
  render();
  scrollFeedToEnd();
  toast("sent · your own message, so it is never counted back to you as unseen", "info");
}

/* ===========================================================================
 * NAVIGATION / FILTERS / MISC WIRING
 * ======================================================================== */

function setFilter(k, scope) {
  const f = S.ui.feedFilter;
  const off = f && f.k === k && f.scope === scope;
  S.ui.feedFilter = off ? null : { k, scope };
  /* the routine chip opens the collapse; turning it off closes it again unless
     you had already opened it by hand. Round 2 left the peek hanging open. */
  if (!off && k === "routine" && !S.ui.routineOpen) { S.ui.routineOpen = true; S.ui.routineOpenedByFilter = true; }
  if ((off || k !== "routine") && S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  const syl = $("syl");
  if (syl) scrollIntoView(syl, "start");
}

/* a filter whose group no longer contains anything of that class cannot stay on
   — otherwise a cleared pin leaves a filter highlighting nothing. */
function normalizeFilter() {
  const f = S.ui.feedFilter;
  if (!f) return;
  const n = groupMessages(room(), f.scope).filter(m => msgClass(room(), m) === f.k).length;
  if (!n) S.ui.feedFilter = null;
}

/* marking seen moves ONE thing: the cursor. Nothing is destroyed, so nothing
   needs a confirmation dialog — the undo is on the divider it just muted. */
function markSeen() {
  const r = room();
  const scope = absenceRead(r) ? "return" : "absence";
  r.readGroup = counts(r, scope).total;          // what the cursor just swallowed
  r.markFrom = r.seenAfter;                      // where to put it back
  r.markedAt = S.now;
  r.seenAfter = r.messages[r.messages.length - 1].id;
  /* the control that replaced the one you pressed — same place on the divider,
     and the way back out of what you just did (D3) */
  focusOn("#unmarkSeen", "#markSeen");
  render();
  toast(`seen cursor moved for #${r.name} only · the group stays on the divider, muted — unmark to put it back`, "info");
}
function unmarkSeen() {
  const r = room();
  if (r.markFrom == null) return;
  r.seenAfter = r.markFrom;
  r.markFrom = null; r.markedAt = null; r.readGroup = 0;
  focusOn("#markSeen", "#unmarkSeen");
  render();
  toast("unmarked · the cursor is back where it was and the group is unread again", "info");
}

function switchRoom(id, quiet) {
  if (id === S.roomId) return;
  S.roomId = id;
  S.ui.feedFilter = null; S.ui.receiptId = null; S.ui.bound = null;
  S.ui.replyTo = null; S.ui.verifying = null; S.ui.pinOpen = null;
  S.ui.reopening = null; S.ui.trace = null; S.ui.about = null;
  S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; S.ui.routineAll = false;
  S.ui.prefill = null;
  $("cinput").value = "";
  if (quiet) return;                              // caller renders and reports
  render();
  bootScroll();
  const r = room();
  toast("#" + r.name + " · " + unseenCount(r) + " unseen here · this room keeps its own cursor", "info");
}

let tgtTimer = null;
function jumpTo(msgId, roomId, why) {
  if (!msgId) { toast("that source is in another room and this prototype does not seed it", "warn"); return; }
  if (roomId && roomId !== S.roomId) {
    const target = S.rooms[roomId];
    if (!target || !msg(target, msgId)) { toast("that source is outside the loaded window", "warn"); return; }
    /* A CROSS-ROOM JUMP LEAVES A TRACE. The target highlight fades after two
       seconds and the toast after three; without a trace you are standing in a
       room you did not choose with nothing on screen saying why, or how to get
       back. The trace persists until you dismiss it or navigate again. */
    const from = S.roomId;
    switchRoom(roomId, true);
    S.ui.trace = { from, msgId, why: why || null, at: S.now };
    toast("#" + roomId + " — the source of that item lives here, not in the room you came from", "info");
  }
  const r = room();
  const m = msg(r, msgId);
  if (!m) { toast("that message is outside the loaded window", "warn"); return; }
  if (m.routine) S.ui.routineOpen = true;
  S.ui.jumpTo = msgId;
  render();
  const el = $("feed").querySelector(`[data-msg="${msgId}"]`);
  scrollIntoView(el, "center");
  clearTimeout(tgtTimer);
  tgtTimer = setTimeout(() => { S.ui.jumpTo = null; render(); }, 2200);
}

/* the toast reports the OUTCOME, glyph included — round 2 stamped ✓ on every
   one of them, including the ones announcing that something was reopened. */
const TOAST_GLYPH = { ok: "✓", warn: "◆", bad: "✗", info: "·" };
let toastTimer = null;
/* THE TOAST IS A SURFACE THAT NARRATES THE RECORD (round 9 D1c). Rescheduling
   to the date already on the record raised "rescheduled · the original due date
   stays on the record" — a literal, three surfaces away from a chain body
   correctly reporting that nothing had moved. A transition's toast is a minted
   record read now; the checker runs HERE rather than in render(), because a
   toast is raised after the render it belongs to and is gone three seconds
   later — a check that only ran on render would never see one. */
function toast(m, kind) {
  const k = kind || "ok";
  const t = $("toast");
  $("toastMsg").textContent = voicedText(m);
  $("toastGlyph").textContent = TOAST_GLYPH[k] || "·";
  t.className = "toast show" + (k === "ok" ? "" : " " + k);
  checkToastInvariant(m);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function scrollFeedToEnd() {
  const feed = $("feed");
  if (reduceMotion()) { feed.scrollTop = feed.scrollHeight; return; }
  feed.scrollTo({ top: feed.scrollHeight, behavior: "smooth" });
}

/* ===========================================================================
 * WHERE FOCUS GOES AFTER AN INTERACTION (round 6 minor; widened, round 7 D3)
 *
 * render() rebuilds every surface from state, so the element that had focus is
 * detached and the browser drops focus to BODY. That is not cosmetic: a
 * keyboard reader who signs off a commitment is returned to the top of the
 * document and has to walk the whole page back to where they were, once per
 * action. Round 6 had no spec for this at all, which is the actual finding —
 * the page had simply never decided.
 *
 * ROUND 7 WROTE THE SPEC FOR HALF THE PAGE. It covered writes, and it only ever
 * LOOKED at writes: `checkFocusInvariant()` returned early unless `S.ui.wrote`,
 * so the eight interactions that re-render without writing anything — routine
 * peek, mark seen, unmark, expanding an objective, opening a receipt from the
 * lens, the receipt's back button, switching rooms, expanding a pin card, which
 * between them are the core IA moves of this page — all landed on BODY and
 * nothing on the page could see it. Same-key restore was supposed to cover them
 * and structurally could not: it fails exactly when the trigger is REPLACED BY
 * WHAT IT OPENED, which is what every one of those eight does.
 *
 * THE SPEC, one sentence: FOCUS FOLLOWS THE RECORD. Every interaction that
 * re-renders leaves focus somewhere a keyboard reader can act from — the first
 * control inside the page's own record of a write, or the control that replaced
 * the one they used — and never on BODY.
 *
 * Three mechanisms, tried in order:
 *
 *   1. A DECLARED SUCCESSOR. A write calls focusAfter(), and an interaction that
 *      replaces its own trigger calls focusOn(), with the selectors for what it
 *      just put there, most specific first. Deliberate: the handler knows what
 *      it did.
 *   2. SAME-KEY RESTORE. Otherwise focus returns to whatever had it, matched by
 *      a key that survives the rebuild (an id, or the element's own data
 *      attributes scoped to its row). This is why the routine strip, each
 *      objective head and each rail row now carry a data key: a toggle that
 *      survives its own render should simply keep focus, and before this round
 *      three of them had nothing to be found by.
 *   3. THE SURFACE THAT OWNS WHAT CHANGED, never BODY.
 *
 * And a floor under all three: `checkFocusInvariant()` asserts, after ANY
 * interaction-driven render, that focus is somewhere a reader can act from.
 * IT LEARNS ABOUT THE INTERACTION FROM THE BROWSER, not from the handler —
 * a capture-phase listener on the document, ahead of every handler on the page,
 * which is what makes the check impossible for a new interaction to opt out of.
 * Round 7's check could only see writes because writes were the only thing that
 * announced themselves to it.
 * ======================================================================== */

/* an interaction is a fact about the browser. The flag is set before any
   handler runs and cleared on the next task, so exactly the renders that happen
   SYNCHRONOUSLY inside an interaction are the ones held to the rule — a timer
   firing 2.2s later is not an interaction and is not judged as one. */
let actTimer = null;
function noteInteraction() {
  S.ui.acted = true;
  clearTimeout(actTimer);
  actTimer = setTimeout(() => { S.ui.acted = false; }, 0);
}
document.addEventListener("click", noteInteraction, true);
document.addEventListener("keydown", noteInteraction, true);

/* the element's own attributes, as a selector — stable across a rebuild
   because they are derived from the record, not from DOM position */
function attrSel(el) {
  const ds = el.dataset || {};
  const keys = Object.keys(ds).filter(k => k !== "fresh").sort();
  if (!keys.length) return null;
  return el.tagName.toLowerCase() + keys.map(k =>
    `[data-${k.replace(/[A-Z]/g, ch => "-" + ch.toLowerCase())}="${CSS.escape(ds[k])}"]`).join("");
}
function focusKey(el) {
  if (!el || el.nodeType !== 1 || el === document.body) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  const own = attrSel(el);
  if (!own) return null;
  /* scope to the row that owns it, so restoring a Reply button does not land on
     some other message's Reply button that happens to carry the same attribute */
  const row = el.closest("[data-msg]");
  return (row && row !== el ? `[data-msg="${CSS.escape(row.dataset.msg)}"] ` : "") + own;
}
function focusAfter() {
  S.ui.focusNext = Array.prototype.slice.call(arguments).filter(Boolean);
  S.ui.wrote = true;
}
/* the same declaration for an interaction that CHANGES NOTHING ON THE RECORD
   but replaces the control you used — opening a receipt over the lens item that
   opened it, closing it back onto that item, expanding a compact pin row into a
   card. Same-key restore cannot serve these: the key it would restore is the
   element the interaction removed. Round 7 had no way to say this at all, so
   all of them fell through to BODY (D3). */
function focusOn() {
  S.ui.focusNext = Array.prototype.slice.call(arguments).filter(Boolean);
}
function tryFocus(sel) {
  if (!sel) return false;
  let el = null;
  try { el = document.querySelector(sel); } catch (e) { return false; }
  if (!el || !shown(el)) return false;
  el.focus({ preventScroll: true });
  return document.activeElement === el;
}
function restoreFocus(prev) {
  const a = document.activeElement;
  /* HELD MEANS HELD BY SOMETHING STILL ON SCREEN. A control that survived the
     rebuild but was just hidden — the composer's context bar after Cancel — is
     holding focus nowhere a reader can see or use, which is the BODY problem
     wearing a tag name. Found by widening the check to non-write renders. */
  const held = a && a !== document.body && a !== document.documentElement && shown(a);
  const wrote = !!S.ui.wrote;
  const acted = !!S.ui.acted;
  const want = S.ui.focusNext;
  S.ui.focusNext = null;
  /* nothing was lost — a prompt that focused its own input, or a reader who
     tabbed somewhere during an async render, keeps it */
  if (held) return;
  /* NOTHING HAD FOCUS, NOTHING WAS WRITTEN AND NOBODY TOUCHED THE PAGE, so
     there is nothing to restore and nothing to announce. A page nobody has
     interacted with does not get focus put into it: taking focus is a thing you
     do in response to an action, and boot is not one. (Caught by this file's
     own focus check on the first draft, which forced focus into the lens on the
     boot render.) */
  if (!prev && !wrote && !acted) return;
  if (want && want.some(tryFocus)) return;
  if (tryFocus(prev)) return;
  /* last resort, after a write OR any other interaction that rebuilt the page:
     the surface that owns what changed, never BODY. These carry tabindex="-1"
     so they can hold focus without ever entering the tab order, and a reader's
     next Tab continues from inside the surface rather than from the masthead. */
  if (wrote || acted) ["#lens", "#pin", "#feed"].some(tryFocus);
}
/* somewhere a keyboard reader can ACT from: a control, or a surface container
   that holds one — from which the next Tab lands on something usable. BODY is
   neither, and neither is a container with nothing in it. */
function canActFrom(el) {
  if (!el || el === document.body || el === document.documentElement) return false;
  if (el.matches(CONTROL_SEL)) return true;
  return !!Array.from(el.querySelectorAll(CONTROL_SEL)).find(shown);
}
function checkFocusInvariant() {
  /* ANY INTERACTION THAT RE-RENDERED, not only a write (round 7 D3). The flag is
     set by a capture-phase listener on the document, so an interaction cannot
     avoid being seen by forgetting to announce itself — which is precisely how
     eight of them stayed invisible to round 7's version of this check. */
  const judged = !!S.ui.wrote || !!S.ui.acted;
  S.ui.wrote = false;
  if (!DEV || !judged) return;
  const a = document.activeElement;
  if (!canActFrom(a))
    console.error("[atrium invariant] an interaction rebuilt the page and left focus on " +
      (a ? (a.id ? "#" + a.id : a.tagName) : "nothing") +
      " — a keyboard reader has to walk back from the top of the document after every action");
}

/* ===========================================================================
 * RENDER — one call, every surface
 * ======================================================================== */

function render() {
  /* captured before anything is torn down — see restoreFocus() */
  const hadFocus = focusKey(document.activeElement);
  dropFieldUniverse();
  normalizeFilter();
  renderRail();
  renderHead();
  renderPin();
  renderFeed();
  renderTrace();
  renderComposer();
  renderLens();
  /* a prompt this render put on the page — or a control it moved focus to —
     has to be reachable in this frame, so both are revealed BEFORE the geometry
     check reads any boxes (round 5 D1, extended in round 7). */
  /* focus is re-established BEFORE the reveal, because the reveal's job includes
     scrolling whatever now holds focus clear of a sticky band — and before the
     checks, so checkFocusInvariant() reads the frame a reader actually gets
     rather than the instant between teardown and repair */
  restoreFocus(hadFocus);
  revealOpenPrompts();
  /* the DOM-level invariants run against what was actually painted, not against
     the functions that drew it. Geometry last, because it needs layout: the
     browser has already flushed style by the time these read boxes, and every
     one of them is synchronous with the paint that produced them. */
  checkFocusInvariant();
  checkRowScopeInvariant(room());
  checkQuotationInvariant();
  checkRecordTextInvariant();
  checkRecordInvariant();
  checkAnswerIdentityInvariant();
  checkCorrectionInvariant();
  checkRenderedRecordInvariant();
  checkReversibilityInvariant();
  checkActionEffectInvariant();
  checkLayoutInvariant();
  checkLegibilityInvariant();
  checkProseInvariant();
  checkViewportFitInvariant();
  setTimeout(clearFresh, 400);
}

/* geometry is a function of the viewport as well as of the state, and resizing
   does not re-render. Round 4's D1 was width-independent, but the class of
   defect it belongs to is not — a track that survives 1440 and collapses at
   1124 is the same failure with a narrower repro. */
let layoutTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(layoutTimer);
  /* a resize can move a prompt back under the sticky band — the dead band round
     5's D1 lived in was a range of viewport HEIGHTS — so the reveal is part of
     the resize response too, not only of render(). */
  layoutTimer = setTimeout(() => { revealOpenPrompts(); checkLayoutInvariant(); }, 120);
});

/* --- static wiring ------------------------------------------------------- */
$("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("atr-dark");
  $("themeBtn").title = dark ? "Switch to light" : "Switch to dark";
  toast(dark ? "dark theme" : "light theme", "info");
});
$("pinFold").addEventListener("click", () => { S.ui.pinFolded = !S.ui.pinFolded; render(); });
$("ctxCancel").addEventListener("click", cancelContext);
$("sendBtn").addEventListener("click", send);
$("cinput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === "Escape" && (S.ui.bound || S.ui.replyTo || S.ui.about)) cancelContext();
});
$("cinput").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
$("surfConv").addEventListener("click", () => {
  S.ui.feedFilter = null;
  if (S.ui.routineOpenedByFilter) { S.ui.routineOpen = false; S.ui.routineOpenedByFilter = false; }
  render();
  scrollIntoView($("syl"), "start");
  toast("conversation · unfiltered. All three surfaces stay on screen — these focus them, they do not navigate", "info");
});
$("surfNeeds").addEventListener("click", () => {
  const r = room();
  const f = S.ui.feedFilter;
  S.ui.feedFilter = (f && f.k === "need" && f.scope === "room") ? null : { k: "need", scope: "room" };
  render();
  scrollIntoView($("pin"), "nearest");
  if (!S.ui.feedFilter) { toast("filter cleared", "info"); return; }
  /* the exact relationship between the two numbers, out loud. Round 2 said
     "same set the pin counts", which is the claim that made the miscount
     invisible: one item can own four rows, and an item sourced in another room
     owns none here. */
  const items = attention(r).length;
  const rows = attentionRows(r).length;
  const off = offRoomItems(r);
  toast(`needs you · ${items} item${items === 1 ? "" : "s"} owe you here · ${rows} row${rows === 1 ? " in this room is" : "s in this room are"} linked to them` +
        (off.length ? ` · ${off.length} ${off.length === 1 ? "has its source" : "have their sources"} in another room — jump from the pin` : "") +
        " · matches are highlighted, and nothing else is dimmed", "warn");
});
$("surfState").addEventListener("click", () => {
  S.ui.lensFocus = !S.ui.lensFocus;
  S.ui.receiptId = null;
  if (S.ui.lensFocus) room().objectives.forEach(o => o.open = true);
  render();
  $("lensBody").scrollTop = 0;
  toast(S.ui.lensFocus
    ? "current state focused — every objective expanded in the right-hand pane, which never left the screen"
    : "lens focus released", "info");
});

/* --- boot ---------------------------------------------------------------- */
function bootScroll() {
  requestAnimationFrame(() => {
    const syl = $("syl");
    $("feed").scrollTop = syl ? Math.max(0, syl.offsetTop - 60) : 0;
  });
}
/* the record's own starting point, captured before anything can amend it —
   a field history that begins at the first amendment has no "before" to offer */
seedRecord();
render();
bootScroll();
</script>
</body>
</html>
