       the fields the two sides SHARE, so a sign-off→reopen chain — where `was`
       reads the verification and `after` reads the verification and the
       settlement — printed "— unchanged ·" between two visibly different
       sentences, because the settlement moved and the verification did not.
       Asked from the record rather than from the predicate the render used: if
       the entry carries a minted change about a field one of its own sentences
       is about, the reader is owed the arrow. */
    if (!arrow && c.change && claimedFields(c.was).concat(claimedFields(c.after)).indexOf(c.change.of) >= 0)
      console.error("[atrium invariant] a correction entry paints no arrow between two sentences about a field the " +
        "record did move — it is reporting an amendment as though nothing happened:",
        o.id, voicedText(c.hd), c.change.of, c.change.from, "→", c.change.to);
  });

  /* 5b — WHAT HAPPENED. The section round 9 shipped a false sentence into, and
     the first thing a reader of a receipt reads. Every line is minted, its
     claims still hold, and the characters on screen are the minted ones. */
  document.querySelectorAll(".hap[data-hap-obj]").forEach(el => {
    const o = obj(r, el.dataset.hapObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.hapObj)).filter(Boolean)[0]);
    const h = o && (o.history || [])[Number(el.dataset.hap)];
    const node = el.querySelector(".htx");
    if (!h || !node)
      return console.error("[atrium invariant] a WHAT HAPPENED line is on screen with no entry behind it:",
        el.dataset.hapObj, el.dataset.hap);
    if (!isStated(h.text))
      return console.error("[atrium invariant] a WHAT HAPPENED line was not read out of the record — it is a sentence " +
        "composed beside the object it narrates, and nothing constrains what it claims:", o.id, node.textContent.trim());
    if (h.text.minted !== MINTED)
      console.error("[atrium invariant] a WHAT HAPPENED line carries claims the record did not mint:",
        o.id, node.textContent.trim());
  });

  /* 5g — the receipt's state line, which is the loudest sentence in a receipt */
  document.querySelectorAll("[data-rstate-obj]").forEach(el => {
    const o = obj(r, el.dataset.rstateObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.rstateObj)).filter(Boolean)[0]);
    if (!o) return console.error("[atrium invariant] a receipt state line is on screen with no object behind it:", el.dataset.rstateObj);
    const box = receiptState(o);
    el.querySelectorAll("[data-rstate]").forEach(part => {
      const want = box.said[Number(part.dataset.rstate)];
      if (want == null || normText(part.textContent) !== normText(String(want)))
        console.error("[atrium invariant] a receipt's state line is painting something other than what the record " +
          "produced for it:", o.id, part.textContent.trim(), "vs", String(want));
    });
    /* the state line is painted part by part rather than through voiced(), so
       it is handed to the same reader clause 0 uses — point reads, history
       queries and the quantifier rule. This is the surface round 10's D2 sat
       on: `nothing other than the claimant has checked it`, a hardcoded literal
       inside a say() branch, using none of the four views it was handed. */
    checkStatedBox("a receipt's state line", o.id, box);
  });

  /* 5c — the fact chips and the receipt's note. The chip is the one line about
     an object most readers ever see, and the note is the last thing a receipt
     says. Both also carry a person's own typed characters, so the rule is
     painted-equals-minted wherever a mint reached the surface. */
  document.querySelectorAll("[data-fact-obj]").forEach(el => {
    const o = obj(r, el.dataset.factObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.factObj)).filter(Boolean)[0]);
    const f = o && (o.facts || [])[Number(el.dataset.fact)];
    if (!isStated(f))
      return console.error("[atrium invariant] a fact chip is on screen with no minted sentence behind it:",
        el.dataset.factObj, el.textContent.trim());
    if (f.minted !== MINTED)
      console.error("[atrium invariant] a fact chip carries claims the record did not mint:", o.id, el.textContent.trim());
  });
  /* AND A CHIP THAT WAS NOT MINTED MAY NOT STATE A VALUE THE RECORD HOLDS
     (round 10 self-review). A fact chip may honestly be page copy about
     something the record does not keep — a person's name, a confidence, "3
     sources". What it may not be is a recorded VALUE written down beside the
     record, because that is the defect class with a shorter sentence. The
     vocabulary is derived from the object's own history, exactly as the raw-enum
     clause below derives its own, so there is no list to maintain and no
     phrasing to enumerate. */
  /* AND IT IS A TOKEN TEST, OVER THE WHOLE HISTORY (round 11 D5). Round 10
     asked `text.indexOf(normText(enumText(v))) >= 0` against each field's LAST
     value, and got both directions of the same design choice wrong: it fired on
     every render between answering and reassigning a question, because
     `"reopened".indexOf("open")` is 2 — and it was blind to a surface stating an
     EARLIER recorded value, which is the half of this class the page had
     actually shipped. A word is matched as a word, and the record is the whole
     record. Console noise is not a cosmetic problem: it is what masks a real
     firing, and this file's own doctrine names that failure mode. */
  document.querySelectorAll(".oitem .mt span, .acard .mt span, .acomp .fx span").forEach(el => {
    if (el.dataset.factObj) return;                 // minted, and checked above
    /* a minted sentence, or a fragment of one — clause 0 owns it */
    if (el.closest("[data-said]") || el.querySelector("[data-said]")) return;
    if (el.closest(HUMAN_SEL)) return;              // a person's own characters
    const id = (el.closest("[data-lens-obj]") || {}).dataset;
    const o = id && (obj(r, id.lensObj) || Object.keys(S.rooms).map(k => obj(S.rooms[k], id.lensObj)).filter(Boolean)[0]);
    if (!o) return;
    const text = normText(el.textContent);
    Object.keys(o.recorded || {}).forEach(fld => {
      (o.recorded[fld] || []).forEach(e => {
        const v = e.value;
        if (typeof v !== "string" || !v) return;
        if (hasToken(text, normText(v)) || hasToken(text, normText(enumText(v))))
          console.error("[atrium invariant] a fact chip states a value this object's record holds for its " + fld +
            ", and was not read out of it — the shortest surface on the page is still a surface:",
            o.id, el.textContent.trim(), "vs", v);
      });
    });
  });
  /* the note is the receipt's closing sentence and it is about the record —
     round 9's said "Rescheduling never erases the original date … it moves the
     date and nothing else" under a reschedule that moved nothing — so a note on
     screen with no mint behind it is the defect, not an exemption */
  document.querySelectorAll(".rc-foot .note").forEach(el => {
    if (!el.textContent.trim()) return;
    const id = el.dataset.noteObj;
    const o = id && (obj(r, id) || Object.keys(S.rooms).map(k => obj(S.rooms[k], id)).filter(Boolean)[0]);
    if (!o || !isStated(o.note) || o.note.minted !== MINTED)
      console.error("[atrium invariant] a receipt's closing note was not read out of the record — it is a " +
        "sentence about this object composed beside it:", id || "(unmarked)", el.textContent.trim());
  });

  /* 3 + 5d — the permanent rows */
  document.querySelectorAll("#feed .mrow[data-msg]").forEach(el => {
    const m = msg(r, el.dataset.msg);
    if (!m || !m.sysFor) return;                    // only rows the page wrote ABOUT an object
    const body = el.querySelector(".mbody");
    const text = body ? body.textContent : "";
    /* 5d — where a segment of this row was minted, the row paints THAT and its
       claims still hold. A permanent row narrating a move the record did not
       make is the same defect as a chain entry doing it, and it is worse,
       because the row never goes away. */
    /* a row the page wrote ABOUT an object narrates that object, permanently,
       so at least one of its segments is a record read. Round 9's reschedule
       row said "rescheduled by lars" about a date that had not moved. */
    if (!(m.body || []).some(isStated))
      console.error("[atrium invariant] a transition row in the conversation was composed entirely beside the record — " +
        "this row is permanent and no part of it was read out of the object it narrates:", m.id, text.trim());
    (m.body || []).forEach(seg => {
      if (!isStated(seg)) return;
      if (seg.minted !== MINTED)
        return console.error("[atrium invariant] a transition row carries claims the record did not mint:", m.id, text.trim());
      if (normText(text).indexOf(normText(voicedText(seg))) < 0)
        console.error("[atrium invariant] a transition row is not painting the sentence the record minted for it:",
          m.id, text.trim(), "expected to contain", voicedText(seg));
    });
    if (!/→/.test(text)) return;
    const o = obj(r, m.sysFor) || (m.objectRoom && obj(S.rooms[m.objectRoom], m.sysFor));
    /* the cheapest clause first, and the one that needs nothing but the painted
       characters: an arrow with the same thing on both sides is a change that
       did not happen, whatever is or is not attached behind it */
    const halves = text.split("→");
    if (halves.length === 2 && sameText(halves[0].split("·").pop(), halves[1].split("·")[0]))
      console.error("[atrium invariant] a transition row in the conversation puts the same state on both sides of an " +
        "arrow — the row is permanent and it is asserting a change that did not happen:", m.id, text.trim());
    const ch = m.transition;
    if (!ch || ch.minted !== MINTED)
      return console.error("[atrium invariant] a transition row in the conversation states a change the record did not mint — " +
        "this row is permanent, and nothing proves what it says happened:", m.id, text.trim());
    if (sameValue(ch.from, ch.to))
      return console.error("[atrium invariant] a transition row puts the same value on both sides of an arrow — " +
        "it is asserting a change that did not happen:", m.id, text.trim(), ch.of, ch.from);
    if (o && !heldInSequence(o, ch.of, ch.from, ch.to))
      console.error("[atrium invariant] a transition row claims a move this object's record never made:",
        m.id, ch.of, ch.from, "→", ch.to);
    const from = ch.from == null ? null : enumText(ch.from), to = ch.to == null ? null : enumText(ch.to);
    const want = from != null && to != null ? from + " → " + to : from != null ? from + " → " : " → " + to;
    if (text.indexOf(want) < 0)
      console.error("[atrium invariant] a transition row's arrow is not painting the values the record moved between:",
        m.id, text.trim(), "expected", want);
  });

  /* 6 — AND THE COVERAGE ARGUMENT ITSELF IS CHECKED (round 11, CONVENTIONS 229).
     Clause 0 holds every minted sentence to the rule. What proves that the
     sentences on this page ARE minted is not a list of surfaces — that is the
     claim round 10 made and could not support — but a walk over every text node
     inside anything that DECLARES WHOSE RECORD IT IS RENDERING. Any clause that
     pairs a quantifier with a recorded field's own vocabulary, and is neither
     inside a minted sentence nor a person's own characters, is a sentence about
     a history nothing asked. That is how `still the answer on the record` on a
     feed row tag and `pending again` in a WHY YOU line became findable rather
     than remembered — both of which are inside `[data-obj]` hosts, which is
     why they are the examples given. Round 11's comment here also named `last
     check 09:07` in the pin trailer, and that one was FALSE WHEN IT WAS
     WRITTEN: `#pinTrailer` had no `data-obj` ancestor and this walk could not
     see it. An example is a claim about reach, and it answers to the evidence
     rule like any other.

     TWO KINDS OF DECLARATION, because there are two kinds of surface (round 12,
     D3). `data-obj` says "this renders ONE object". `data-agg` says "this
     speaks for MANY" — the lens summary over thirteen records, the pin trailer
     over ten, an objective header over eleven. Round 11 had only the first, so
     six surface families declared nothing and were covered by nothing, and the
     comment claiming this walk found `last check 09:07` in the pin trailer was
     false when it was written: `#pinTrailer` had no `data-obj` ancestor and the
     walk provably could not see it. An aggregate declares its subject now, and
     the walk reads it.

     AND AN AGGREGATE ANSWERS TO A STRICTER RULE THAN AN OBJECT SURFACE. On a
     fact chip or a feed row the page's characters sit beside a person's, so the
     rule there is about quantifiers. An aggregate has no human in it — every
     character is the page's — so inside one, a recorded field's OWN VOCABULARY
     is enough on its own: `4 settled` needs no quantifier to be a claim about
     `settlement`, and round 11 computed it from `verification` and painted
     `settlement`'s word on it, five surfaces disagreeing in one screenshot.
     Under this clause that is an error whether or not anybody says "still". */
  const aggObjects = host => {
    const v = host.dataset.agg;
    if (v === "room") return r.objects.slice();
    return String(v || "").split(",").map(s => s.trim()).filter(Boolean)
      .map(id => obj(r, id) || Object.keys(S.rooms).map(k => obj(S.rooms[k], id)).filter(Boolean)[0])
      .filter(Boolean);
  };
  document.querySelectorAll("[data-obj], [data-agg]").forEach(host => {
    const agg = host.hasAttribute("data-agg");
    const objs = agg ? aggObjects(host)
      : [obj(r, host.dataset.obj) ||
         (Object.keys(S.rooms).map(k => obj(S.rooms[k], host.dataset.obj)).filter(Boolean)[0])].filter(Boolean);
    /* AN EMPTY SUBJECT IS NOT AN EXEMPTION (round 12 self-review). `data-obj`
       naming an object that is not here is nothing to check against; but an
       aggregate that resolves to no records is still walked, because the strict
       vocabulary rule is about the FIELD's words and needs no object to fire —
       otherwise `data-agg=""` would be a way to declare a subject and be
       skipped, which is an exemption shaped exactly like every other one this
       file has had to close. */
    if (!agg && !objs.length) return;
    if (agg && host.dataset.agg && host.dataset.agg !== "room" && !objs.length)
      console.error("[atrium invariant] an aggregate declares a subject this room does not have:", host.dataset.agg, host);
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest("[data-said], [data-said-parts]")) return NodeFilter.FILTER_REJECT;   // minted; clause 0 / 0b own it
        if (p.closest(RECITED_SEL)) return NodeFilter.FILTER_REJECT;    // words the page is quoting, not asserting
        /* a nested subject's own container is that subject's business */
        if (p.closest("[data-obj], [data-agg]") !== host) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    /* the record's own words are not the page's sentence — see pageWordsOf().
       R1's recorded statement ends "…replays inside the window still succeed". */
    let n;
    while ((n = walker.nextNode())) {
      let raw = String(n.nodeValue).replace(/\s+/g, " ").trim();
      if (!raw) continue;
      objs.forEach(o => { raw = pageWordsOf(o, raw); });
      const ids = objs.map(x => x.id).join(",").slice(0, 60);
      /* AND A VALUE THE RECORD HOLDS MAY NOT BE STATED WHERE NOTHING READ IT
         (round 12, raised by the grok reviewer). This was round 10's fact-chip
         rule, scoped by a three-selector list to `.oitem .mt span, .acard .mt
         span, .acomp .fx span` inside `[data-lens-obj]` — so a feed row's state
         tag painting `verified · checks`, `accepted · lars` or `claim ·
         unverified` straight off `o.verification` was outside it, permanently,
         on the surface that never goes away. The rule belongs to the walk, not
         to a selector list: the list is the render, and this is the same
         sentence the doctrine has had to write three times.
         It is DERIVED FROM THE DATA — the object's own history, every field,
         every point — so there is nothing to maintain and nothing to enumerate,
         and it does not fire on a control's label, because an action name
         ("Mark signed off", "Answer in your own words") is never a value the
         record holds. */
      /* AND A CONTROL MAY NAME THE VALUE IT IS ABOUT TO WRITE, IF IT PROVES IT
         (round 13, D1). See declaredWrites(): the control declares the recorded
         field, and the value is projected through the same ACTION_EFFECT entry
         the reversibility audit uses. Nothing here is excused by being a button;
         it is excused by carrying a proof, and checkWriteLabelInvariant() holds
         the proof to the projection on every render. */
      const proven = (() => {
        const host = n.parentElement && n.parentElement.closest("[data-writes]");
        return host ? provenWriteValues(host) : [];
      })();
      objs.forEach(o => Object.keys(o.recorded || {}).forEach(fld =>
        (o.recorded[fld] || []).forEach(e => {
          const v = e.value;
          if (typeof v !== "string" || !v) return;
          if (proven.some(w => sameValue(w, v))) return;
          /* ONE EXCEPTION, AND IT IS NAMED HERE RATHER THAN IN A FIELD LIST.
             `reading` records how a line was READ — D1's history is
             ["Claim","Decision"] — and "decision" is also the page's structural
             word for that object's KIND, printed as a row prefix and a heading.
             Those are the same characters and not the same claim: amend the
             reading and `o.kind` does not move, so minting the prefix from the
             reading would make a sentence move when the field it is not about
             moves. A value that IS the object's own kind is the page naming the
             object, not the page quoting the record. Nothing else is excused —
             this is not a field allowlist, it is one string, derived from the
             object. */
          if (normText(v).toLowerCase() === normText(o.kind || "").toLowerCase()) return;
          if (hasToken(raw, normText(v)) || hasToken(raw, normText(enumText(v))))
            console.error("[atrium invariant] a surface states a value this object's record holds for its " + fld +
              ", and was not read out of it — the shortest surface on the page is still a surface:",
              o.id, JSON.stringify(raw.slice(0, 70)), "vs", v, n.parentElement);
        })));
      clausesOf(raw).forEach(text => {
        const q = WHOLE_QUANT.concat(PAST_QUANT, CONTINUITY_QUANT).filter(w => hasToken(text, w));
        Object.keys(RECORDED).forEach(f => {
          const words = (RECORDED[f].words || []).filter(w => hasToken(text, w));
          if (!words.length) return;
          if (q.length)
            return console.error("[atrium invariant] a surface is quantifying over this " + f + " history in words " +
              "nothing read it for — the sentence was composed beside the record rather than out of it:",
              ids, JSON.stringify(text), q[0], "/", words.join(", "), n.parentElement);
          if (agg || window.__strictObj)
            console.error("[atrium invariant] an aggregate surface states this " + f + " in that field's own words and " +
              "was not minted from a read of it — a count is a claim, and the page writes every character of this one:",
              ids, JSON.stringify(text), words.join(", "), n.parentElement);
        });
      });
    }
  });

  /* 6b — AND A DECLARED SUBJECT IS CHECKED AGAINST WHAT WAS ACTUALLY READ
     (round 13, D6). `data-agg` was checked for one thing only: does this room
     hold these ids. Nothing compared the declaration against the records the
     sentences inside it were minted from — so a host could declare thirteen and
     paint a sentence read from ten, and the walk would hold the host's unminted
     text to a subject its own sentences do not speak for. The declaration and
     the mints have to be about the same records: every mint whose nearest
     declared subject is this host reads inside the declared set, and the
     declared set is covered by them. */
  document.querySelectorAll("[data-agg]").forEach(host => {
    const declared = aggObjects(host);
    if (!declared.length) return;
    const read = [];
    host.querySelectorAll("[data-said], [data-said-parts]").forEach(el => {
      if (el.closest("[data-obj], [data-agg]") !== host) return;      // a nested subject's own business
      if (el.parentElement && el.parentElement.closest("[data-said], [data-said-parts]")) return;
      const box = PAINTED[Number(el.dataset.said != null ? el.dataset.said : el.dataset.saidParts)];
      if (!box) return;
      (box.claims || []).concat(box.queries || []).forEach(c => {
        const o = c.owner || box.owner;
        if (o && read.indexOf(o) < 0) read.push(o);
      });
    });
    if (!read.length) return;                    // a host of unminted text only; clause 6 owns it
    const outside = read.filter(o => declared.indexOf(o) < 0);
    if (outside.length)
      console.error("[atrium invariant] an aggregate declares one subject and its own sentences were minted from " +
        "another — the walk holds every unminted character in here to the declared set, so a sentence about a record " +
        "outside it is checked against the wrong records:", host.dataset.agg, outside.map(o => o.id).join(","), host);
    const unread = declared.filter(o => read.indexOf(o) < 0);
    if (unread.length)
      console.error("[atrium invariant] an aggregate declares records none of its sentences read — the declaration is " +
        "wider than the claim, so it says this surface speaks for records it is silent about:",
        host.dataset.agg, unread.map(o => o.id).join(","), host);
  });

  /* 4 — the vocabulary of the record never reaches the reader raw */
  /* an enum value is a single snake_case token the RECORD holds — not any
     string with an underscore in it, because a person may well write about a
     table called users_legacy and that is their sentence, not the record's
     spelling of a state */
  const raw = [];
  eachObject(o => Object.keys(o.recorded || {}).forEach(f =>
    o.recorded[f].forEach(e => {
      if (typeof e.value === "string" && /^[a-z]+(_[a-z]+)+$/.test(e.value) && raw.indexOf(e.value) < 0) raw.push(e.value);
    })));
  if (raw.length) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (!raw.some(v => n.nodeValue.indexOf(v) >= 0)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode()))
      console.error("[atrium invariant] a raw enum value is on screen — enumText() exists so a reader never reads the " +
        "record's spelling of a state:", n.nodeValue.trim(), n.parentElement);
  }
}

/* 5e — THE TOAST. The loudest surface on the page and the shortest-lived, which
   is exactly why it went unchecked: it is raised after the render it belongs to
   and is gone three seconds later, so nothing that only runs on render will ever
   see one. Rescheduling twice raised "rescheduled · the original due date stays
   on the record" over a record that had not moved. A toast raised while a write
   path has just touched a record is a sentence about that write. */
function checkToastInvariant(m) {
  if (!DEV) return;
  const pending = AMENDED_PENDING;
  AMENDED_PENDING = null;
  const node = $("toastMsg");
  if (!isStated(m)) {
    if (pending)
      console.error("[atrium invariant] a transition raised a toast that was not read out of the record — the loudest " +
        "sentence this page writes about an amendment, composed beside the object it describes:",
        pending.id, node ? node.textContent.trim() : String(m));
    /* AND PAGE COPY MAY NOT QUANTIFY EITHER (round 11 self-review, raised by
       the grok reviewer). A toast raised with no write pending is copy about an
       ACTION — "sent", "nobody is named on this question to hand it to" — and
       asserts nothing about a record, so it needs no mint. What it may not do
       is quantify over a field history anyway: that would be the one surface on
       the page where a literal about the record is reachable, and it is the
       loudest one. There is no object in scope to check it against, so the
       obligation is simply that it does not make the claim. */
    clausesOf(String(voicedText(m)).replace(/\s+/g, " ").trim()).forEach(text => {
      const q = WHOLE_QUANT.concat(PAST_QUANT, CONTINUITY_QUANT).filter(w => hasToken(text, w));
      if (!q.length) return;
      Object.keys(RECORDED).forEach(f => {
        if (!(RECORDED[f].words || []).some(w => hasToken(text, w))) return;
        console.error("[atrium invariant] a toast raised with no write behind it is quantifying over a " + f +
          " history — page copy about an action may not make a claim about a record:", JSON.stringify(text), q[0]);
      });
    });
    return;
  }
  if (m.minted !== MINTED)
    return console.error("[atrium invariant] a toast carries claims the record did not mint:", node && node.textContent.trim());
  if (node) checkPaintedSentence("a toast", (m.owner && m.owner.id) || "?", node, m);
}

/* every object in every loaded room — the invariants above are about the record,
   and the record is not only the room you are looking at */
function eachObject(fn) {
  Object.keys(S.rooms).forEach(k => (S.rooms[k].objects || []).forEach(o => fn(o, S.rooms[k])));
}

/* --- THE LAYOUT INVARIANT (round 4 D1) ------------------------------------
 * Round 4's blocking defect was invisible to every other check on this page:
 * the state was right, the strings were right, the DOM was right, and the
 * cross-room trace was 0px tall with the feed painting over it and both of its
 * controls unclickable. Nothing in a state-shaped invariant can see that. So
 * this one asserts against geometry, on the thing that was actually painted:
 *
 *   1. Every visible child of `.center` occupies a track with real height.
 *   2. No two of those children overlap — a collapsed track shows up as a
 *      sibling painting through, which is exactly what round 4 measured.
 *   3. Every interactive control's centre point hit-tests to itself. A control
 *      you cannot click is not an affordance, whatever it looks like.
 *
 * Controls scrolled out of their container are skipped — legitimately not on
 * screen — by intersecting each element with every clipping ancestor first.
 * ---------------------------------------------------------------------- */
const CONTROL_SEL = "button, input, textarea, select, a[href], [role='button'], [tabindex]:not([tabindex='-1'])";

/* an element is on screen only if NO ancestor hides it. getComputedStyle reports
   an element's OWN display, so a button inside a `hidden` panel still reads
   `display: flex` while having no box at all — the walk up is what tells the
   difference between "unclickable" and "not currently on the page". */
function shown(el) {
  for (let p = el; p && p.nodeType === 1; p = p.parentElement) {
    if (p.hidden) return false;
    const cs = getComputedStyle(p);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
  }
  return true;
}
/* what a reader can actually SEE of this element — opacity multiplies down the
   tree, so an ancestor at 0 makes a child at 1 invisible (round 14).
   `null` means "not settled": a control fading in is transparent for 120ms and
   is not a control nobody can see, and a rule that could not tell the two apart
   would be an instrument that invents defects — which this file's own doctrine
   forbids in as many words. */
function effOpacity(el) {
  let o = 1;
  for (let p = el; p && p.nodeType === 1; p = p.parentElement) {
    if (typeof p.getAnimations === "function" && p.getAnimations().some(a => a.playState === "running")) return null;
    o *= Number(getComputedStyle(p).opacity);
  }
  return o;
}
/* the element's box intersected with every scroll/clip ancestor and the
   viewport — i.e. the part of it a pointer could actually reach */
function visibleBox(el) {
  let box = el.getBoundingClientRect();
  box = { left: box.left, top: box.top, right: box.right, bottom: box.bottom };
  for (let p = el.parentElement; p; p = p.parentElement) {
    const cs = getComputedStyle(p);
    if (cs.overflow === "visible" && cs.overflowX === "visible" && cs.overflowY === "visible") continue;
    const r = p.getBoundingClientRect();
    box.left = Math.max(box.left, r.left); box.top = Math.max(box.top, r.top);
    box.right = Math.min(box.right, r.right); box.bottom = Math.min(box.bottom, r.bottom);
  }
  box.left = Math.max(box.left, 0); box.top = Math.max(box.top, 0);
  box.right = Math.min(box.right, window.innerWidth);
  box.bottom = Math.min(box.bottom, window.innerHeight);
  return box;
}

/* how wide a control has to be before it can be AIMED AT — which since round 12
   is all this number is for. It used to be the legibility rule: six characters
   at the control's own type size, "enough for a truncated title to name what it
   is about". It is not enough, and a truncated title is now a defect rather
   than a width to be met — checkLegibilityInvariant() owns that, and it owns it
   for minted sentences as well as for control labels, which is the half this
   floor never covered. What is left here is the geometry floor: a control has
   to be big enough to hit. */
const AIM_MIN = 6;
function legibleWidth(el) {
  if (!(el.textContent || "").trim()) return AIM_MIN;
  if (el.scrollWidth <= el.clientWidth + 1) return AIM_MIN;
  const fs = parseFloat(getComputedStyle(el).fontSize) || 12;
  return Math.max(24, Math.round(fs * 6));
}

/* THE NARROWEST SUPPORTED WIDTH IS MEASURED, NOT REMEMBERED (round 14, D2).
   Once the harnesses stopped fixing the viewport at 1440, "the narrowest
   supported width" — a phrase this file's own CSS comment uses — turned out to
   be a number nobody had ever taken. It is 1120: the three-column grid bottoms
   out at 1120px and everything below that pushes the lens off the right edge,
   on r13 and r12 as well. So the floor is a fact the page asserts about itself
   on every paint, and a change that raises it says so on the first render
   instead of in a reviewer's screenshot three rounds later. */
function checkViewportFitInvariant() {
  if (!DEV) return;
  const doc = document.documentElement;
  if (doc.scrollWidth > window.innerWidth + 1)
    console.error("[atrium invariant] the page is wider than the window it was given — a column is pushed off the " +
      "right edge and nothing on this page scrolls sideways to bring it back:",
      doc.scrollWidth + "px of layout in " + window.innerWidth + "px of viewport");
}

function checkLayoutInvariant() {
  if (!DEV) return;
  const center = document.querySelector(".center");
  if (!center) return console.error("[atrium invariant] the conversation column is missing");

  const cbox = center.getBoundingClientRect();
  const kids = Array.from(center.children).filter(shown);
  const boxes = kids.map(el => el.getBoundingClientRect());
  kids.forEach((el, i) => {
    if (boxes[i].height < 1)
      console.error("[atrium invariant] a .center child owns a zero-height track — it is on the page and cannot be seen or clicked:",
        el.id || el.className, el);
    /* THE COLUMN IS AUTHORITATIVE AND DOES NOT SCROLL, so a child outside it is
       not "scrolled out of view", it is gone. Found while verifying the fix
       above: hiding the trace slid the composer to top: 900 on a 900px
       viewport, entirely below the fold — non-zero height, no overlap with the
       feed, and invisible to both of the other two rules. Its controls were
       skipped by the hit-test as legitimately off-screen. This is the rule that
       sees it. */
    if (boxes[i].bottom > cbox.bottom + 0.5 || boxes[i].top < cbox.top - 0.5)
      console.error("[atrium invariant] a .center child is outside the column that owns it — the track layout pushed it off:",
        el.id || el.className, boxes[i].top, boxes[i].bottom, "column:", cbox.top, cbox.bottom);
  });
  /* a track can collapse without the child reporting zero height (a min-height,
     an absolute child), and the symptom is always the same: siblings sharing
     pixels. Round 4 measured trace.top === feed.top at 306.14 on both. */
  for (let i = 0; i < kids.length - 1; i++) {
    if (boxes[i].bottom > boxes[i + 1].top + 0.5)
      console.error("[atrium invariant] two .center children overlap — a track collapsed and a sibling is painting through it:",
        (kids[i].id || kids[i].className), "over", (kids[i + 1].id || kids[i + 1].className),
        boxes[i].bottom, boxes[i + 1].top);
  }

  /* every control hit-tests to itself */
  document.querySelectorAll(CONTROL_SEL).forEach(el => {
    if (!shown(el)) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1)
      return console.error("[atrium invariant] an interactive control has no clickable area:", controlName(el), el);
    /* AND A CONTROL YOU CANNOT READ IS NOT A CONTROL (round 7 D2). The rule
       above catches 0px and was silent at 5.36px — an owed item's title,
       truncated past the first character, on a row that still counted it,
       glyphed it and offered its action. One pixel above the wire is the same
       defect, so the wire is a LEGIBILITY floor rather than a non-zero one:
       a control whose own words are being cut off has to keep enough of them to
       be identified, measured in its own type size rather than in a constant
       that would drift the moment the scale changed. A control showing all of
       its text is legible at whatever width its text needs, by definition. */
    const floor = legibleWidth(el);
    if (r.width < floor)
      return console.error("[atrium invariant] an interactive control is too narrow to read — its label is cut off past the point " +
        "where it identifies anything:", controlName(el), Math.round(r.width * 100) / 100 + "px", "needs", floor + "px", el);
    const v = visibleBox(el);
    if (v.right - v.left < 1 || v.bottom - v.top < 1) return;   // scrolled out of view — legitimately unreachable
    let cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (cx < v.left || cx > v.right || cy < v.top || cy > v.bottom) {
      cx = (v.left + v.right) / 2; cy = (v.top + v.bottom) / 2;  // partially scrolled: test the reachable part
    }
    /* AND AN INVISIBLE CONTROL IS ASKED THE OPPOSITE QUESTION (round 14).
       `.mrow .acts` was `position: absolute; z-index: 3` and hit-testable at
       `opacity: 0` — an element nobody can see, sitting in front of the ones
       they can, clearing `#unmarkSeen` by 1.4px at 1440. A blind reviewer drove
       18 randomised sessions of 40 real mouse clicks at three widths and a
       12-width probe of all nine hit-test points and could not reproduce a
       stolen click, and measured the mechanism anyway. So the pair is stated as
       a pair: a control you can see must be reachable, and a control you cannot
       see must not be touchable. The rule above cannot ask the first question of
       a transparent control — it is not painted — and this asks the second one
       instead.

       WHAT ROUND 14 PREDICTED, AND WHAT ACTUALLY HAPPENED (round 16). The
       sentence that stood here said the observation was environmental and that
       "a ROW-SPACING CHANGE is all it would take" to make it a repro. The
       mechanism was named correctly and the trigger was guessed wrong. No row
       spacing ever changed. Round 15 added a NEW CONTROL — `go to it →` — into
       the band of pixels this strip was painted across, and 42px of that
       control's own 60px label went under the `Reply` chip; the same overlay had been
       painting across the row's first text line the whole time, on 5 of 17 rows
       at 1440 and 10 of 17 at 1120. So the lesson is not about spacing: AN
       OVERLAY'S BLAST RADIUS CHANGES WHEN WHAT IS UNDERNEATH IT CHANGES, and
       neither half of the pair above can see it, because the occluder is itself
       visible and itself reachable. The third question — a control or a
       sentence you can see must not be painted over by another element you can
       also see — is enforced by the harness rather than here, because the strip
       is only painted while a row is hovered and a render-time checker has no
       hover to look at. See prototype-drive.mjs, pass 4, and CONVENTIONS.md
       "Hover affordances". `.mrow .acts` is a grid track now, not an overlay,
       which is why this comment can be about the rule instead of about it. */
    const settledOpacity = effOpacity(el);
    /* A CONTROL THAT DOES NOT TAKE THE POINTER CANNOT HIT-TEST TO ITSELF, so the
       rule below would fire on every one of them. The question that is worth
       asking of it is the other one: `pointer-events: none` is honest while the
       control is invisible and a defect the moment it is not. */
    if (getComputedStyle(el).pointerEvents === "none") {
      if (settledOpacity !== null && settledOpacity >= 0.01)
        console.error("[atrium invariant] a control a reader can see refuses the pointer — it is painted, it is in the " +
          "tab order, and a click passes straight through it:", controlName(el), el);
      return;
    }
    if (settledOpacity !== null && settledOpacity < 0.01) {
      const h0 = document.elementFromPoint(cx, cy);
      if (h0 === el || (h0 && el.contains(h0)))
        console.error("[atrium invariant] a control painted at zero opacity still takes the pointer — something " +
          "nobody can see is in front of the controls they can, and it swallows the click the moment a row moves " +
          "under it:", controlName(el), el);
      return;
    }
    let hit = document.elementFromPoint(cx, cy);
    if (hit === el || (hit && el.contains(hit))) return;
    /* THE CENTRE IS NOT THE WHOLE CONTROL. A sticky header or footer legitimately
       covers a band of a scrolling pane — the control under it is one scroll away,
       which is what sticky is for, and failing it would be exactly the cry-wolf
       mistake D4 is about. What is NOT legitimate is a control with no reachable
       point at all: round 4's trace controls were covered edge to edge by a feed
       that had swallowed their track, and no scroll position recovered them. So
       the rule is "at least one point of this control hit-tests to it". */
    const probes = [[.15, .5], [.85, .5], [.5, .15], [.5, .85], [.15, .15], [.85, .85], [.15, .85], [.85, .15]];
    const reachable = probes.some(([fx, fy]) => {
      const px = v.left + (v.right - v.left) * fx, py = v.top + (v.bottom - v.top) * fy;
      const h = document.elementFromPoint(px, py);
      return h === el || (h && el.contains(h));
    });
    if (reachable) return;
    /* ...and a sticky or fixed overlay is one scroll away, not a dead end. The
       receipt's sticky footer deliberately covers a band of a scrolling pane so
       that Reopen never falls below the fold; a source entry under it is reached
       by scrolling, which is the contract sticky signs. Round 4's trace controls
       were covered by a sibling in NORMAL FLOW inside a column that does not
       scroll at all, and that stays a failure. */
    if (scrollEscapable(el, hit)) return;
    console.error(el.closest("[data-prompt]")
      ? "[atrium invariant] a prompt this render opened is painted over — the page asked for input and then covered the control:"
      : "[atrium invariant] an interactive control has no point that hit-tests to itself — something is painting over all of it:",
      controlName(el), "→", hit && (hit.className || hit.tagName), el);
  });
}

/* ===========================================================================
 * A SENTENCE PAINTED INTO AN ELLIPSIS IS NOT THE SENTENCE (round 12 D4)
 *
 * Every rule on this page about painted text compares `node.textContent` — and
 * `text-overflow: ellipsis` does not change `textContent`. So the whole
 * apparatus that proves a chip says what the record minted passed on a chip
 * that read `reopened by lars 09:15 · answer ke…` and said nothing, and on a
 * cross-room title that truncated mid-alternative — `…or hol…` — above a single
 * button offering one of two options the reader could not see.
 *
 * The legibility rule that existed covered "a CONTROL whose label is truncated"
 * and required six characters of it. A fact chip is not a control, so the
 * doctrine exempted exactly the case it exists for; and six characters is a
 * floor for aiming at a button, not for reading a claim.
 *
 * THE RULE: a minted sentence is painted whole or it is not painted. Not "wide
 * enough to guess at" — whole. A control's own label answers to the same rule,
 * because a label you cannot read is not a label. This is measured, not
 * declared: `scrollWidth > clientWidth` and `scrollHeight > clientHeight` are
 * what the browser knows about characters it did not draw.
 *
 * THE DELIBERATE CLIP DECLARES ITSELF AND IS CHECKED, rather than being a
 * selector written into this checker. `data-clamp` says "these characters are
 * collapsed on purpose, and here is the affordance" — the provenance excerpt and
 * its note, both inside a focusable `.prov` button that expands them on hover
 * AND focus, under a section header that says so on screen. Two things make that
 * a tier rather than an exemption: the affordance has to be REACHABLE BY A
 * KEYBOARD, which is checked (the declaring element must sit inside a focusable
 * control), and every declaration is countable, so the next round can see how
 * many there are — `document.querySelectorAll("[data-clamp]").length`. An
 * earlier draft of this comment said "two, both on the same control"; a blind
 * reviewer counted four on a receipt with two sources. A number in a comment is
 * a claim, so the claim this comment makes is a FORM and not a number: every
 * deliberate clip declares itself here, and every declaration sits inside
 * something a keyboard can focus. Both halves are checked below.
 *
 * ROUND 15 MADE IT A FORM IN PRACTICE AS WELL AS IN PRINCIPLE. The provenance
 * excerpt was the only clip that wore it, and beside it the feed's reply
 * preview was cutting a person's sentence at 60 characters IN JAVASCRIPT — so
 * this rule saw nothing, the provenance rule saw nothing, and 9 of 14 replyable
 * rows painted somebody's words stopped mid-word. What `.prov .ex` does was
 * always the general answer: keep the whole string in the DOM so `textContent`
 * stays the record, let the BROWSER paint the ellipsis, declare it here, and
 * expand it on hover and on focus. The reply preview and the composer's reply
 * context wear it now, and each is also the route to the row it quotes.
 *
 * AND WHAT THIS DOES NOT COVER, so it is not discovered later: (a) the check
 * proves a focusable ancestor EXISTS, not that focusing it reveals every
 * character — `.prov .full` expands to a 44px cap; (b) a button containing a
 * clamped descendant is exempted from the button-level measurement, though each
 * of its own leaves is still measured; (c) this list said `.roomhead .topic`
 * ellipsises at narrow widths and is reached by no clause here — true when it
 * was written, and round 14 made the topic wrap, so the entry outlived the
 * defect by a round. It is corrected rather than deleted: a caveat is a claim
 * and goes stale the same way a count does.
 *
 * AND (d), WHICH ROUND 15 FOUND THE HARD WAY: A PLACEHOLDER IS NOT MEASURED BY
 * ANYTHING HERE. `scrollWidth` and `clientWidth` are about characters the
 * DOCUMENT painted, and a placeholder is painted by the control, so an input
 * holding 422px of question in a 129px box reports scrollWidth === clientWidth
 * and is invisible to every clause above. That is not a hole this checker can
 * close — the browser does not expose the metric — so it is closed where it can
 * be: the prompts are measured against the NARROWEST supported width by the
 * harness (`R15-D3-a-prompt-is-readable-and-agrees-with-itself`, canvas-
 * measured), and no disclosure is written into a placeholder, because a
 * placeholder disappears at the moment it becomes load-bearing.
 * ======================================================================== */
function clipped(el) {
  const cs = getComputedStyle(el);
  const hidesX = cs.overflowX === "hidden" || cs.overflowX === "clip" || cs.textOverflow === "ellipsis";
  const hidesY = cs.overflowY === "hidden" || cs.overflowY === "clip" || cs.webkitLineClamp !== "none";
  return (hidesX && el.scrollWidth > el.clientWidth + 1) ||
         (hidesY && el.scrollHeight > el.clientHeight + 1);
}
/* ===========================================================================
 * SOMETHING HERE READS THE ENGLISH (round 14, D8)
 *
 * A permanent divider on the first screen ended mid-sentence — "…the seen cursor
 * sits at the end of #users-migration, and only this room's" — a dangling
 * possessive introduced in ROUND 2 and painted, unchanged, through twelve review
 * rounds, six of them with a reviewer driving the page. Every instrument on this
 * page reads where a string CAME FROM: minted, read, queried, re-derived,
 * measured for width. Not one of them reads what it says. A sentence can be
 * minted from thirteen honest reads and still not be a sentence.
 *
 * WHY THIS IS NOT AN UNBOUNDED DENYLIST, which this file's own doctrine forbids.
 * It does not enumerate ways to write badly. English function words are a CLOSED
 * class — articles, conjunctions, prepositions, auxiliaries, the possessive
 * clitic — and the compliant form is stated positively: a rendered run ends on a
 * word that carries content. A run ending on a function word has an argument
 * missing, and the missing argument is what a reader trips over. The class is
 * closed, so the list terminates; it is the same reason a union tag can be
 * validated and a key list cannot.
 *
 * WHAT IT DOES NOT COVER, said plainly rather than discovered next round.
 *   - It reads the LAST word of a run and nothing else, so a sentence that is
 *     ungrammatical in the middle, or grammatical and false, is invisible to it.
 *   - PREPOSITIONS AND AUXILIARIES ARE DELIBERATELY OUT. English strands
 *     prepositions in relative clauses — "not the clean week the proposal asked
 *     for" is correct — and ellipsis strands auxiliaries. The first draft of
 *     this rule included both and cried wolf on a receipt line on its first run,
 *     which is the "wrong instrument invents defects" failure this file names two
 *     sections down, arriving inside the fix for something else. What is left is
 *     the part of the closed class that CANNOT end a clause in any register:
 *     determiners, coordinators, subordinators, and a possessive clitic with
 *     nothing possessed after it — which is the shape that actually shipped.
 *   - Human-authored text is exempt: holding a person's typed sentence to a
 *     page-integrity rule is round 5's defect and this is a page-integrity rule.
 * ======================================================================== */
const DANGLING_TAIL = [
  /* determiners — none of these can be the last word of a clause */
  "a", "an", "the", "these", "those", "its", "their", "your", "our", "every", "each", "another",
  /* coordinators */ "and", "or", "but", "nor",
  /* subordinators */ "because", "although", "though", "whereas", "unless", "than", "whether"
];
function proseFindings() {
  const out = [];
  const seen = {};
  document.querySelectorAll("body *").forEach(el => {
    if (el.children.length) return;                      // leaves only — a run is what one element paints
    if (el.closest("script, style, template")) return;
    if (el.closest(HUMAN_SEL)) return;                   // a person's own words are not this rule's business
    if (el.getAttribute("aria-hidden") === "true") return;
    if (!shown(el)) return;
    const raw = (el.textContent || "").replace(/\s+/g, " ").trim();
    if (!raw) return;
    /* trailing punctuation, glyphs and arrows are not the last WORD */
    const body = raw.replace(/[\s·—–\-→←↑↓:;,.!?'"“”‘’()\[\]…]+$/u, "");
    if (!body) return;
    /* A ONE-WORD RUN IS A LABEL, NOT A SENTENCE. `AT` is an avatar's initials
       and `A` is a keyboard hint; neither has an argument to be missing. The
       rule is about a run that stops mid-clause, and a clause needs two words. */
    if (!/\s/.test(body)) return;
    const last = (body.match(/[\w'’-]+$/u) || [""])[0];
    if (!last) return;
    /* a possessive with nothing possessed after it — the exact shape that shipped */
    const possessive = /['’]s$/i.test(last) && /['’]s$/i.test(raw.replace(/[\s.]+$/, ""));
    const dangling = DANGLING_TAIL.indexOf(last.toLowerCase()) >= 0;
    if (!possessive && !dangling) return;
    const key = raw.slice(-60);
    if (seen[key]) return;
    seen[key] = 1;
    out.push({ why: possessive ? "a possessive with nothing possessed after it"
                               : "a function word with its argument missing",
               text: raw.length > 110 ? "…" + raw.slice(-105) : raw, el: el });
  });
  return out;
}
window.__proseFindings = () => proseFindings().map(f => f.why + "  " + JSON.stringify(f.text));
function checkProseInvariant() {
  if (!DEV) return;
  proseFindings().forEach(f =>
    console.error("[atrium invariant] a rendered line ends on " + f.why +
      " — the page is painting an unfinished sentence, and every rule here about where words came from passes on it:",
      JSON.stringify(f.text), f.el));
}

const CLIP_ALLOWED = "[data-clamp]";
function checkLegibilityInvariant() {
  if (!DEV) return;
  const seen = [];
  const report = (kind, el) => {
    if (seen.some(x => x.contains(el))) return;
    seen.push(el);
    console.error("[atrium invariant] " + kind + " is painted into an ellipsis — the characters on screen are not the " +
      "characters that were checked, and the checkers compare textContent, which truncation does not change:",
      el.textContent.replace(/\s+/g, " ").trim().slice(0, 90), el);
  };
  /* the declared clips answer for their own affordance first */
  document.querySelectorAll("[data-clamp]").forEach(el => {
    if (!shown(el)) return;
    const host = el.closest("button, a[href], [tabindex]");
    if (!host)
      console.error("[atrium invariant] a surface declares that its characters are collapsed on purpose and sits " +
        "inside nothing a keyboard can focus — the affordance it names is reachable by a pointer only:",
        el.dataset.clamp, el.textContent.replace(/\s+/g, " ").trim().slice(0, 60));
  });
  document.querySelectorAll("[data-said], [data-said-parts] [data-part]").forEach(el => {
    if (!shown(el) || el.closest(CLIP_ALLOWED)) return;
    if (clipped(el)) return report("a minted sentence", el);
    /* the clip may be on an ancestor between the sentence and its track */
    for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
      if (p.closest(CLIP_ALLOWED)) return;
      if (clipped(p) && p.contains(el)) return report("a minted sentence", p);
    }
  });
  document.querySelectorAll("button").forEach(b => {
    if (!shown(b)) return;
    /* a button's own label — the text that says what it does. A row that is
       itself a button (the compact pin row) answers for every word in it. */
    if (clipped(b) && !b.querySelector(CLIP_ALLOWED)) return report("a control's label", b);
    b.querySelectorAll("*").forEach(el => {
      if (el.children.length || !(el.textContent || "").trim() || el.closest(CLIP_ALLOWED)) return;
      if (clipped(el)) report("a control's label", el);
    });
  });
}

/* ===========================================================================
 * AND WHAT THE WALK DOES NOT COVER, ENUMERATED RATHER THAN REMEMBERED
 * (round 12, D3 — the second half of the requirement)
 *
 * Round 10 claimed a surface list "taken from the object's own shape" and it
 * was written from memory. Round 11 replaced it with a walk and then wrote a
 * comment claiming the walk found a freshness timestamp in the pin trailer — which
 * `#pinTrailer` had no `data-obj` ancestor to be found by. Twice, the mechanism
 * was real and the claim about its reach was not.
 *
 * So the reach is a FUNCTION, not a sentence. `data-obj` and `data-agg` declare
 * a subject; clause 6 walks everything inside them; clauses 0 and 0b hold every
 * minted sentence. This returns everything left: page-authored text that uses a
 * recorded field's own vocabulary and sits inside no declared subject and no
 * mint. It is not an error list — most of it is legitimate and always will be —
 * it is the honest answer to "what is uncovered", computed on the live DOM
 * instead of recalled.
 *
 * WHAT IS IN IT: design/prototype-uncovered.txt, which is this function's own
 * output, unioned over every state the sequence enumerator reaches, sorted and
 * committed beside this file. Regenerate it with
 *
 *   node design/prototype-drive.mjs --uncovered design/prototype-uncovered.txt
 *
 * and the driver fails if the committed file and the live walk disagree.
 *
 * THIS COMMENT NAMES NO EXAMPLES, AND THAT IS THE FIX (round 13, D5). Round 10
 * claimed a derived list and shipped a hand-written one. Round 11 built the
 * derivation and cited an example the walk provably could not see. Round 12 —
 * the round that wrote the rule that a comment is a claim and answers to the
 * evidence rule — described five families of text as being in this list, and
 * not one of them can ever appear: the first is a control label inside a
 * declared subject, which this walker's own guard rejects two lines below, and
 * the rest are bare integers with no recorded vocabulary to match. Three rounds
 * running, the mechanism was real and the sentence about its reach was written
 * from memory, and each round's apology was followed by the same mistake.
 *
 * An apology is not a mechanism. A claim about what a mechanism produces is
 * GENERATED BY THE MECHANISM or it is not made — so the sentence that used to
 * be here is a file, and the driver checks a backticked example in this block
 * against the live walk on every run, which means this paragraph cannot quietly
 * grow one back.
 * ======================================================================== */
function uncoveredRecordWords() {
  const out = [];
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
      if (p.closest("[data-said], [data-said-parts]")) return NodeFilter.FILTER_REJECT;
      if (p.closest("[data-obj], [data-agg]")) return NodeFilter.FILTER_REJECT;
      if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
      return String(n.nodeValue).trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  let n;
  while ((n = walker.nextNode())) {
    const text = String(n.nodeValue).replace(/\s+/g, " ").trim();
    Object.keys(RECORDED).forEach(f => {
      const words = (RECORDED[f].words || []).filter(w => hasToken(text, w));
      if (!words.length) return;
      out.push({ field: f, words: words, text: text.slice(0, 90),
                 where: (n.parentElement.closest("[id]") || {}).id || n.parentElement.className || "?",
                 control: !!n.parentElement.closest("button, [data-ctl]") });
    });
  }
  return out;
}
window.__uncoveredRecordWords = uncoveredRecordWords;

/* ===========================================================================
 * THE FRICTION RULE, CHECKED (round 12 D6)
 *
 * The old rule partitioned by a glyph — `■` meant destructive, destructive
 * meant press-and-hold — and `glyphOf()` has no branch that can return `■`, so
 * the partition had one side. This asks the question the glyph was standing in
 * for, of the action set the page actually offers:
 *
 * EVERY ACTION ANSWERS FOR ITS OWN IRREVERSIBILITY, in one of exactly three
 * ways, strongest first:
 *
 *   1. A CONTROL PUTS IT BACK. After the action, the page offers you the
 *      control that restores it — `reassign` ↔ `takeback`, `signed` /
 *      `answered` / `opt` / `verify` ↔ `reopen`. This is reversibility in fact
 *      and it is the only one of the three that is actually an undo.
 *   2. IT ASKED FIRST. The control opens a prompt with a cancel instead of
 *      writing — `reopen` wants the reason, `verify` wants the evidence — so
 *      the click that commits is the second one. Checked in the DOM, not
 *      declared: the control has to be a disclosure (`aria-expanded`), because
 *      a table saying "this one asks" is the kind of claim this page has
 *      shipped false four times.
 *   3. IT NAMED WHAT IT WRITES. The label carries the value — "Reschedule to
 *      today 17:00" — and the value it replaces stays on the record and in the
 *      chain. This is the weakest tier and it is only honest for an action that
 *      erases nothing; it is stated as a tier rather than as an exemption
 *      precisely so the next round can see which actions are leaning on it.
 *
 * An action with none of the three is the defect. `Ask justin instead` had none
 * of the three for eleven rounds.
 *
 * `offeredActions()` is the same function the renders build their buttons from,
 * so this cannot be an audit of a control set the page does not have.
 * ======================================================================== */
/* tier 2 — an action whose control discloses a prompt rather than writing. The
   selector is where that control is rendered; the audit reads the DOM for the
   disclosure rather than believing this table. */
const ACTION_ASKS_FIRST = { reopen: "#rcReopen", verify: "[data-verify]" };

/* WHICH OBJECT A CONTROL ACTS ON. Factored out of checkActionSetInvariant,
   because three separate rules now need the same answer and a second copy of
   this resolution is a second thing to keep in step. */
function controlObject(b) {
  const find = x => obj(room(), x) || Object.keys(S.rooms).map(k => obj(S.rooms[k], x)).filter(Boolean)[0] || null;
  /* the three prompts and the composer are not inside their object's container —
     they are page furniture that has been POINTED at an object, and the state
     says which one. Named explicitly rather than falling through to whatever
     receipt happens to be open, which is how one open receipt came to certify a
     friction tier for every object in the file (round 13, D7). */
  if (b.id === "cinput" || b.id === "sendBtn") return S.ui.bound ? find(S.ui.bound) : null;
  if (b.id === "vinput" || b.id === "vgo") return S.ui.verifying ? find(S.ui.verifying) : null;
  if (b.id === "rinput" || b.id === "rgo") return S.ui.reopening ? find(S.ui.reopening) : null;
  const host = b.closest("[data-obj], [data-lens-obj], [data-corr-obj], .rc-foot, .acard, .acomp, .mrow");
  const id = b.dataset.obj || b.dataset.verify ||
             (host && (host.dataset.obj || host.dataset.lensObj || host.dataset.corrObj));
  return id ? find(id) : (S.ui.receiptId ? find(S.ui.receiptId) : null);
}
/* WHICH ACTION A CONTROL REACHES — the same map WRITE_CONTROLS declares below,
   asked of one element. */
function controlAction(b) {
  if (b.dataset.fx) return b.dataset.fx;
  if (b.hasAttribute("data-opt")) return "opt";
  if (b.hasAttribute("data-verify")) return "verify";
  if (b.hasAttribute("data-bind")) return "typed";
  if (b.id === "rcReopen") return "reopen";
  if (b.id === "sendBtn" || b.id === "cinput") return "typed";
  if (b.id === "vgo" || b.id === "vinput") return "verify";
  if (b.id === "rgo" || b.id === "rinput") return "reopen";
  return null;
}

/* ===========================================================================
 * A CONTROL MAY SAY A VALUE THE RECORD HOLDS — WHEN IT IS THE VALUE IT WRITES,
 * AND IT PROVES IT (round 13, D1)
 *
 * `Ask justin instead` sits inside `data-obj="Q1"` and says `justin`. Hand a
 * question to justin and take it back, and Q1's assignee history reads
 * [null, "justin", null] — so the walk's value rule fires on the button, live,
 * at depth 5. The comment beside that rule said it "does not fire on a control's
 * label, because an action name is never a value the record holds"; a label that
 * names a PERSON is exactly that, and the claim was written from memory.
 *
 * The wrong answer is an exemption for control labels: that hands every future
 * literal a place to live, and a denylist of evasions is unbounded. The right
 * answer is an allowlist of the compliant form. A control that names a value
 * DECLARES which recorded field the value belongs to (`data-writes`), and the
 * page proves the declaration by projecting the control's own action through
 * ACTION_EFFECT: if clicking it really would write `assignee = justin`, then the
 * label is not a claim about what the record holds, it is a statement of what
 * this click does — and the proof comes out of the same table the reversibility
 * audit projects, so a label and an audit cannot disagree.
 *
 * A declaration that does not resolve, names a field the action does not write,
 * or names a value the label does not contain is an error. The escape has to
 * carry its own proof or it is not an escape.
 * ======================================================================== */
function declaredWrites(b) {
  const decl = String((b.dataset && b.dataset.writes) || "").split(",").map(s => s.trim()).filter(Boolean);
  if (!decl.length) return null;
  const o = controlObject(b), fx = controlAction(b);
  const eff = (o && fx && ACTION_EFFECT[fx]) ? ACTION_EFFECT[fx](o) : null;
  return { o: o, fx: fx, eff: eff,
           fields: decl.map(f => ({ field: f, named: !!eff && (f in eff), value: eff ? eff[f] : undefined })) };
}
/* the values a control has PROVED it is about to write, for the walk */
function provenWriteValues(b) {
  const d = declaredWrites(b);

  return d.fields.filter(w => w.named).map(w => w.value);
}
function checkWriteLabelInvariant() {
  if (!DEV) return;
  document.querySelectorAll("[data-writes]").forEach(b => {
    if (!shown(b)) return;
    const d = declaredWrites(b);
    if (!d.o || !d.fx || !d.eff)
      return console.error("[atrium invariant] a control declares the value it writes and nothing on this page can say " +
        "what it writes — the declaration names no action or no object, so it is an exemption rather than a proof:",
        b.dataset.writes, b.textContent.trim());
    d.fields.forEach(w => {
      if (!w.named)
        return console.error("[atrium invariant] a control declares that it writes a field its action's own effect table " +
          "does not name — the label is claiming an effect nothing projects:", d.o.id, d.fx, w.field, b.textContent.trim());
      const want = w.value == null ? "" : normText(String(w.value));
      if (!want || normText(b.textContent).toLowerCase().indexOf(want.toLowerCase()) < 0)
        console.error("[atrium invariant] a control declares that its label names the " + w.field + " it writes and the " +
          "label does not contain that value — the declaration is the only thing letting this label say a value the " +
          "record holds:", d.o.id, d.fx, w.field, JSON.stringify(want), b.textContent.trim());
    });
  });
}

/* which tier declarations this session has actually READ off a control, and
   how many frames credited one without seeing it — KEYED BY OBJECT AND ACTION
   (round 13, D7). It was keyed by action alone, and the tier-2 lookup was a
   bare `document.querySelector("#rcReopen")`: one open receipt anywhere

    return ["CURRENT STATE", String(Array.prototype.slice.call(arguments).length)];
  }, r.objects[0]);
  $("surfNeeds").innerHTML =
    `<span class="lbl" data-part="0">${esc(needsBox.said[0])}</span> <span class="n" id="surfNeedsN" data-part="1">${esc(needsBox.said[1])}</span>`;
  markParts($("surfNeeds"), needsBox);
  $("surfState").innerHTML =
    `<span class="lbl" data-part="0">${esc(stateBox.said[0])}</span> <span class="n" id="surfStateN" data-part="1">${esc(stateBox.said[1])}</span>`;
  markParts($("surfState"), stateBox);
  /* the badge counts ITEMS; the filter it turns on highlights ROWS. The
     accessible name says which is which rather than implying one number. */
  $("surfNeeds").title = owed
    ? `${owed} item${owed === 1 ? "" : "s"} need you in this room. Filtering highlights the ${rows} row${rows === 1 ? "" : "s"} linked to them.`
    : "Nothing needs you in this room, so there is nothing to filter to.";
  $("surfNeeds").disabled = owed === 0;
  const f = S.ui.feedFilter;
  $("surfConv").setAttribute("aria-pressed", String(f === null));
  $("surfNeeds").setAttribute("aria-pressed", String(!!f && f.k === "need" && f.scope === "room"));
  $("surfState").setAttribute("aria-pressed", String(S.ui.lensFocus));
  $("lens").classList.toggle("focused", S.ui.lensFocus);
  $("lensRoom").textContent = "#" + r.name.toUpperCase();
}

/* ===========================================================================
 * PIN — corpus turn 17 under a 1340×820 budget:
 *   owed floats up and the hardest one opens; the rest compress to one-line
 *   rows that keep their glyph and their primary action; clean state
 *   compresses to the counted trailer. The pin folds, it never scrolls.
 * ======================================================================== */

function renderPin() {
  const r = room();
  const items = attention(r);
  const list = $("pinList"), trailer = $("pinTrailer");
  checkAttentionInvariant(r);

  /* the pin counts ITEMS. When a need filter is on, it also says how many rows
     those items produced, because that is the other number on the screen. */
  const f = S.ui.feedFilter;
  const rows = f && f.k === "need" ? groupMessages(r, f.scope).filter(m => msgClass(r, m) === "need").length : 0;
  /* AND THE PIN'S OWN COUNT IS A SENTENCE ABOUT RECORDS (round 14, D6). `3 items
     · hardest first` is `attention(r).length` — `owedTo` AND a verification,
     over every object in the room — painted on the most prominent surface on the
     page with no mint, no `data-obj` and no `data-agg`. Round 13 covered the
     rail badge and the surface tabs and left this one, and the doctrine went on
     listing it among the counters that "count messages and rows rather than
     speaking for a record", which it never did. It is minted from the records it
     counts and it declares which predicate the number is.
     The ROW count beside it stays outside the mint on purpose: it counts feed
     rows, not records, and a sentence about records may not carry a number about
     something else inside its claims. */
  const itemBox = r.objects.length
    ? say(r.objects.map(o => fieldView(o, "verification")), function () {
        const vs = Array.prototype.slice.call(arguments);
        const n = vs.filter(v => needsYouAt(v.owner, v.value)).length;
        return `${n} item${n === 1 ? "" : "s"}`;
      }, r.objects[0], ["needsYou"])
    : null;
  $("pinCount").innerHTML = !items.length
    ? esc("nothing owed — this is the whole list")
    : voiced(itemBox) + esc((f && f.k === "need")
      /* "highlighted" is now literally what happens — round 6 said this while
         dropping every other row to 1.5:1, so the word was doing the work of
         hiding a legibility failure. It says what the other rows get, too. */
      ? ` · ${rows} linked row${rows === 1 ? "" : "s"} highlighted below · nothing else dimmed`
      : " · hardest first");
  $("pinFold").setAttribute("aria-pressed", String(S.ui.pinFolded));
  $("pinFold").textContent = S.ui.pinFolded ? "UNFOLD" : "FOLD";
  list.hidden = S.ui.pinFolded;
  trailer.hidden = S.ui.pinFolded;

  list.innerHTML = "";
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty rise";
    e.textContent = "NOTHING NEEDS YOU IN THIS ROOM — THAT IS A RESULT, NOT AN ABSENCE";
    list.appendChild(e);
  }

  const openId = items.some(o => o.id === S.ui.pinOpen) ? S.ui.pinOpen : (items[0] && items[0].id);
  items.forEach(o => {
    list.appendChild(o.id === openId ? pinCard(r, o) : pinCompact(r, o));
  });

  /* ===========================================================================
   * THE TRAILER SAYS TWO THINGS (round 12 — the pruning)
   *
   * It said eight, in one 30-word run-on with no visual grouping: the lead, the
   * objectives, the scope, the commitment count, the overdue count, the owed-
   * overdue count, the failure count, the last check and a parenthetical about
   * where the last check came from. Six unrelated statistics carried by a
   * sentence a reader has to parse to find the one that matters.
   *
   *   REMOVED  `beyond the N above: N commitments, N overdue`  — the scope
   *            clause is round 6 (0e4935e, for round 5's D3); the two counts go
   *            back to r2 (f425f5b). The lead is a strict priority cascade —
   *            failures, then lateness, then unverified — so when anything is
   *            late the lead already says so, in words, and when it does not,
   *            the number it replaced was zero.
   *   REMOVED  `, N more overdue in the list`  (r6, 0e4935e) — it counts items
   *            that are ON SCREEN, in the pin, immediately above this line.
   *   REMOVED  `N failures`  (r2, f425f5b) — the lead's first branch IS the
   *            failure count, so this printed it twice or printed a zero.
   *   REMOVED  `last check HH:MM`  (r2, f425f5b; made a record read in r11,
   *            616bb07) and its `, as this room loaded` caveat — the lead one
   *            group to the left already reports how much of this room nothing
   *            has checked, and the lens header carries `updated HH:MM`.
   *
   * KEPT, and separated so the eye can find them: the minted lead, and the
   * objectives clear of you. Two facts, two groups — which is what the code
   * below paints. (An earlier draft of this comment said THREE and listed the
   * last check among them, after the code had stopped painting it. A blind
   * reviewer caught it. That is this round's own defect class, in this round's
   * own comment, and it is left on the record here rather than quietly
   * corrected: a comment is a claim, and it answers to the evidence rule.)
   * ======================================================================== */
  const c = clearSummary(r);
  trailer.innerHTML =
    `<span class="grp" ${paintParts(c.lead)}>` +
      `<span class="g ${TRAILER_GLYPH_CLASS[c.glyph] || ""}" data-part="0" aria-hidden="true">${esc(c.lead.said[0])}</span>` +
      `<span class="lead" data-part="1">${esc(c.lead.said[1])}</span>` +
    `</span>` +
    `<span class="sep" aria-hidden="true"></span>` +
    `<span class="stat">${voiced(c.objectives)}</span>`;
}

/* the trailer's glyph is the lead's glyph — the tone follows the sentence */
/* `?` went with the open-questions branch (round 13, D3): the lead cannot
   produce that glyph any more, and a style for a glyph nothing emits is the same
   dead work as the branch it dressed. */
const TRAILER_GLYPH_CLASS = { "✗": "bad", "◆": "warn", "~": "claim", "✓": "" };

/* an owed item whose source message is not in this room says where it is and
   goes there. Round 2 counted it and highlighted nothing. */
function sourceChip(r, o, compact) {
  const xr = sourceRoomOf(o);
  /* the compact row says the same thing in fewer characters, because on that row
     the characters are competing with the item's own title (round 7 D2) */
  if (xr) return `<span aria-hidden="true">·</span><button class="xroom" data-jump="${esc(o.sourceMsg || "")}" data-jumproom="${esc(xr)}"` +
                 ` title="The source of this item is in #${esc(xr)}" data-why="the source of ${esc(glyphOf(o))} ${esc(o.id)}, which #${esc(r.name)} owes you">` +
                 `${compact ? "" : "source in "}#${esc(xr)} →</button>`;
  if (!o.sourceMsg) return "";
  /* the time already appears in the facts beside this, so the link is the link */
  return `<span aria-hidden="true">·</span><button class="lnk" data-jump="${esc(o.sourceMsg)}">${compact ? "source →" : "jump to source →"}</button>`;
}

/* A FACT CHIP IS THE SHORTEST SURFACE THAT NARRATES THE RECORD, and it is the
   one line about an object most readers see (round 9 D1c). Where a transition
   minted the chip out of a record read, the chip is addressable, so
   checkRenderedRecordInvariant() can hold the characters on the pin and in the
   lens to the sentence the record produced — exactly as it does the chain. */
function factHtml(o, f, i, cls) {
  return `<span class="${cls || ""}"${isStated(f) ? ` data-fact-obj="${esc(o.id)}" data-fact="${i}"` : ""}>${voiced(f)}</span>`;
}

function pinCard(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("article");
  el.className = "acard" + (g === "◆" ? " gate" : "") + (o.fresh ? " rise" : "");
  el.dataset.obj = o.id;              // this element renders THIS object — see checkNarrationInvariant
  const facts = (o.facts || []).map((f, i) => factHtml(o, f, i)).join(" · ");
  el.innerHTML =
    `<div class="g" aria-hidden="true">${g}</div>
     <div>
       <div class="ttl"><span class="${isClaim(o) ? "claim" : ""}">${voiced(pinTitleFrag(o))}</span></div>
       <div class="why">${voiced(whyOf(r, o))}</div>
       <div class="foot">
         <div class="mt">${facts}${sourceChip(r, o)}</div>
         <div class="acts">${pinActions(o)}</div>
       </div>
     </div>`;
  wireActions(el, o);
  return el;
}

/* turn-17 compression: still visible, still glyphed, still one click to act */
function pinCompact(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "acomp";
  el.dataset.obj = o.id;
  const primary = pinActions(o, true);
  const xr = sourceRoomOf(o);
  /* NOTHING ON THIS ROW GIVES WAY ANY MORE (round 12 D4). Round 7 gave the
     facts the shrinking track and the title and controls fixed ones, so the
     facts ended in an ellipsis at every viewport — `reopened by lars 09:15 ·
     answer ke…`, a minted sentence painted into three characters and a dot,
     which every painted-equals-minted rule on this page passed because
     `text-overflow` does not change `textContent`. The row WRAPS instead: the
     title takes the width it needs, the facts get their own line, and the
     cross-room chip still sits with the action because it is a control. */
  const facts = (o.facts || []).slice(0, xr ? 1 : 2).map((f, i) => factHtml(o, f, i)).join(" · ");
  el.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <button class="ct" data-open="${esc(o.id)}" title="Expand this item">${voiced(pinTitleFrag(o))}</button>
     <span class="mt">${facts ? `<span class="fx">${facts}</span>` : ""}</span>
     <span class="ac">${xr ? sourceChip(r, o, true) : ""}${primary}</span>`;
  /* the compact row is REPLACED by the expanded card, so its own key is gone;
     the successor is the card's first action, which is what the reader opened
     the row to reach, then the item's line in the lens (D3) */
  el.querySelector("[data-open]").addEventListener("click", () => {
    S.ui.pinOpen = o.id;
    focusOn(`#pin .acard .acts button`, `#pin .acard .mt button`, `[data-lens-obj="${o.id}"]`);
    render();
  });
  wireActions(el, o);
  return el;
}

/* NO DEAD ATTENTION ITEMS. Every pending decision offers the bound composer,
   whether or not it ever carried one-click options; reopening one that had
   options keeps them, and reopening one that never had any mints the single
   honest option there is — re-affirming the statement already on the record.
   checkAttentionInvariant() shouts if this ever returns nothing. */
/* --- WHAT THE BOUND COMPOSER CAN HONESTLY RECORD (round 9 D4) --------------
 * `send()` called `answerDecision()` for whatever was bound, and this function
 * offered the bound path on four kinds. `answerDecision()` amends the object's
 * STATEMENT and records the sender as having ACCEPTED it — which is the truth
 * for exactly one kind of object, and for a commitment somebody else owns it
 * walked straight around the ownership guard applyEffect() has enforced since
 * round 4: driven on dana's commitment it wrote lars's sentence into the record
 * as the commitment's own text and stamped `ACCEPTED · commitment · by lars`.
 *
 * So the bound path is kind-aware, and the kinds are decided by what the record
 * would hold afterwards, not by what is convenient:
 *
 *   decision   KEPT. A decision's statement of record IS the answer, and
 *              accepting it is what answering means. Guarded on ownership all
 *              the same: only the person it is owed to may record the call.
 *   question   KEPT, and routed to the question's own field. A question's
 *              record is its `answer`, not its `statement` — typing into the
 *              old path rewrote the QUESTION. It lands exactly where the
 *              one-click answer lands: `answer` amended, unverified, no
 *              sign-off attached. Ownership-guarded the same way.
 *   commitment REMOVED. You cannot decide somebody else's commitment and you
 *              cannot sign it off — that is the guard this was bypassing. When
 *              a commitment you do not own is owed to you, what you can
 *              honestly do is say something about it in the room.
 *   claim      REMOVED. A claim moves by being checked, with evidence, by
 *   (and any   somebody other than the claimant. Typing a sentence at it is not
 *    other)    a verification, and recording it as one is the defect the ~/✓
 *              pair exists to prevent.
 *
 * The two removals keep an action, because NO DEAD ATTENTION ITEMS still holds:
 * they get the reply composer, which appends a message and touches no record.
 * ------------------------------------------------------------------------ */
function boundKind(o) {
  if (!o) return null;
  if (o.kind === "decision") return "decision";
  if (o.kind === "question") return "question";
  return null;
}
/* WHO IS BEING ASKED. `owedTo` is the answer while something is owed — but
   handing a question on CLEARS it while setting the assignee, so reading
   `owedTo` alone says "nobody owes this, therefore anybody may answer it" about
   an item that was explicitly handed to a named person (round 10 self-review).
   The assignee is the fallback, and only when neither names anyone is the item
   genuinely unclaimed. */
function askedOf(o) {
  if (!o) return null;
  if (o.owedTo != null) return o.owedTo;
  return o.assignee != null ? o.assignee : null;
}
/* whose call it is. Only the person being asked may put an answer on the
   record — the same rule commitmentOwner() states for a sign-off. */
function canAnswer(o) {
