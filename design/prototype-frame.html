};

/* The absence window freezes the moment you return. `absenceEnd` is pinned here,
   at boot, to the last message that existed while you were away, and nothing
   moves it again — so no message written after you got back can ever be counted
   as something that happened while you were gone. */
Object.values(S.rooms).forEach(r => { r.absenceEnd = r.messages[r.messages.length - 1].id; });

/* The absence window's ORIGIN is pinned here too. The seen cursor moves; this
   does not. It is what lets "mark this group seen" mute the divider instead of
   destroying it — the group keeps its boundaries, its counts and its chips
   after the cursor has passed it, and can be un-marked. */
Object.values(S.rooms).forEach(r => { r.absenceFrom = r.seenAfter; r.markedAt = null; });

/* ---------------------------------------------------------------------------
 * MESSAGE ORIGIN — who authored the words in this row.
 *
 * Round 4's cardinal defect (D3) was that this distinction did not exist. A
 * one-click answer appended a message whose actor was `lars` and whose body was
 * the CARD's sentence; the receipt then quoted that message and the quotation
 * checker resolved the quote against it and passed. The invariant was circular:
 * the page fabricated the evidence it then checked itself against.
 *
 *   'seeded'  — in the loaded record at boot. Real words, real author.
 *   'typed'   — this human typed these characters into this page.
 *   'chosen'  — THE PAGE authored this row on a human's behalf (they clicked an
 *               option). Never that human's words, never quotable, never
 *               rendered in their voice.
 *   'system'  — a transition record the page wrote about itself.
 *
 * Only 'seeded' and 'typed' may satisfy a quotation context. That is enforced
 * in checkQuotationInvariant(), not by convention, so a future change that
 * re-routes a chosen answer through the human path fails on the first paint.
 * design/CONVENTIONS.md § "No synthesized speech" is the written rule.
 * ------------------------------------------------------------------------ */
Object.values(S.rooms).forEach(r => r.messages.forEach(m => { if (!m.origin) m.origin = "seeded"; }));

/* Seeded human input joins the human-speech register, so a quotation seeded in
   the corpus is proved exactly the way a quotation typed live is proved. There
   is no third path into a <q> on this page. */
Object.values(S.rooms).forEach(r => r.objects.forEach(o =>
  (o.corrections || []).forEach(c => { if (c.quote && c.quote.src === "typed") S.typed.push(c.quote.text); })));

/* ===========================================================================
 * DERIVED SELECTORS — every count on this page comes through one of these.
 * ======================================================================== */

function room(id) { return S.rooms[id || S.roomId]; }
function obj(r, id) { return r.objects.find(o => o.id === id) || null; }
function msg(r, id) { return r.messages.find(m => m.id === id) || null; }
function idx(r, id) { return r.messages.findIndex(m => m.id === id); }

/* ---------------------------------------------------------------------------
 * ONE ATTENTION COLLECTION.
 *
 * `attention(r)` is the collection. It holds owed OBJECTS, hardest first, and
 * it is the only thing any count on this page counts: the pin header, the rail
 * pill, the NEEDS YOU badge, the lens summary, the objective sub-counts.
 *
 * `linkedObject(r, m)` is the other half: the object a row is LINKED to. The
 * NEED class — and therefore the highlight — is exactly "this row is linked to
 * an object in the attention collection". A single object can own four rows
 * (its source, your answer, and the two system rows recording the transitions),
 * and an object whose source lives in another room owns none here. Both are
 * correct; neither is a bug; and no string on this page says the counts and the
 * highlights are the same set.
 * ------------------------------------------------------------------------ */
function attention(r) {
  return r.objects.filter(needsYou).sort((a, b) => (b.priority || 0) - (a.priority || 0));
}
/* an object may be carried by a message in ANOTHER room (D2's source lives in
   #identity-service), so resolution follows the message's declared room. */
function linkedObject(r, m) {
  const id = m.boundTo || m.objectId || m.sysFor;
  if (!id) return null;
  const home = m.objectRoom ? S.rooms[m.objectRoom] : r;
  return home ? obj(home, id) : null;
}
/* ROOM SCOPE. `attention(r)` is per-room, so the linkage test must be too:
   a row is an attention row when the object it carries is in THIS room's
   attention collection — not merely when it is owed to you somewhere. Round 3
   tested `needsYou(linkedObject(...))` globally, so a message carrying another
   room's owed object (n0 carries #users-migration's D2) highlighted here and
   was counted in this room's chips, against items this room does not have. In
   the receipt's own repro the two numbers happened to reconcile, which is what
   kept it invisible. */
function isAttentionRow(r, m) {
  const o = linkedObject(r, m);
  return !!o && r.objects.indexOf(o) >= 0 && needsYou(o);
}

/* rows in THIS room linked to an object in the attention collection */
function attentionRows(r) { return r.messages.filter(m => isAttentionRow(r, m)); }
/* attention items whose source message is not in this room — they can never be
   highlighted here, so the pin gives them a jump instead of a phantom row */
function offRoomItems(r) {
  return attention(r).filter(o => !r.messages.some(m => linkedObject(r, m) === o));
}
function sourceRoomOf(o) { return o.sourceRoom && o.sourceRoom !== S.roomId ? o.sourceRoom : null; }

/* a message's glyph is derived from the object it carries — never written down.
   When that object changes (accepted, reopened, verified), this row changes. */
function msgGlyph(r, m) {
  const o = linkedObject(r, m);
  if (!o) return "·";
  /* A TRANSITION ROW WEARS THE TRANSITION'S GLYPH, NOT THE OBJECT'S (round 4 D6).
     A system row that records "accepted → proposed · reopened" is a record of a
     downgrade. Deriving its glyph from the object's PRESENT state made that row
     turn green again the moment the object was re-accepted, so the permanent
     record of a downgrade rendered ✓. The glyph is frozen at the instant the
     transition is written (appendSystem) and never moves again — which is the
     whole point of a record. Content rows still re-derive live: reopen an object
     and the row that carried the claim still downgrades with it (round-1 B2). */
  if (m.tglyph) return m.tglyph;
  /* ANSWER-ROW IDENTITY (round 2 blocker 2): only the message whose id is the
     object's CURRENT answerMsg may wear the settled treatment. Every earlier
     answer to the same object is a superseded answer and renders as one, no
     matter what state the object is in now. */
  if (m.boundTo) {
    if (o.answerMsg !== m.id) return "~";
    return (o.verification === "accepted" || o.verification === "verified") ? "✓" : "~";
  }
  return glyphOf(o);
}
/* the dotted claim treatment, per row: an answer that is no longer the answer
   is a claim about what was once decided. */
function msgIsClaim(r, m) {
  const o = linkedObject(r, m);
  if (!o) return false;
  if (m.tglyph) return !!m.tclaim;          // frozen with the glyph, same reason
  if (m.boundTo && o.answerMsg !== m.id) return true;
  return isClaim(o);
}

/* ---------------------------------------------------------------------------
 * NO OPTIONAL FIELD REACHES A RENDERED RECORD UNGUARDED (round 4 D2).
 *
 * `was due ${o.due}` on a commitment with no `due` printed "was due undefined"
 * into a permanent system row. Every optional field on a record-writing path
 * now goes through this: a missing value is STATED, in words, never printed as
 * the name of a JavaScript value. checkRecordTextInvariant() asserts on every
 * paint that no page-authored string on screen contains undefined/null/NaN, so
 * a future template literal that forgets is caught by what it painted.
 * ------------------------------------------------------------------------ */
function fieldOr(v, fallback) {
  if (v === undefined || v === null) return fallback;
  if (typeof v === "number" && !isFinite(v)) return fallback;
  const s = String(v).trim();
  return s === "" ? fallback : v;
}

/* --- TWO SENTENCES ARE THE SAME SENTENCE (round 6 D1) ---------------------
 * The record compares statements in several places — an answer against the
 * proposal it replaces, a correction's before against its after — and every one
 * of them wants the same question answered the same way. Whitespace is not
 * content, so it is normalised; nothing else is. Case and punctuation are part
 * of what somebody wrote and are never folded away.
 * ---------------------------------------------------------------------- */
function normText(v) { return String(voicedText(v) == null ? "" : voicedText(v)).replace(/\s+/g, " ").trim(); }
function sameText(a, b) { return normText(a) === normText(b); }

/* an enum value is snake_case in the data and prose on screen. Round 6 applied
   the prettifier to one side of an arrow only and rendered
   `SELF-REPORTED → SELF_REPORTED`; one function means both sides always agree. */
function enumLabel(v) { return String(fieldOr(v, "state not recorded")).toUpperCase().replace(/_/g, "-"); }

/* ===========================================================================
 * THE STATEMENT OF RECORD (round 7 D1 — and rounds 6 D1 and 4 D7 before it)
 *
 * Three rounds, three paths, one class: THE RECORD ASSERTED SOMETHING THAT DID
 * NOT HAPPEN. Round 4 compared an option's wording to a proposal's and called
 * agreement a contradiction. Round 6 minted an option without `agrees` and put
 * two identical sentences either side of an arrow. Round 7 computed "did it
 * change" against `prior.body` — the SYSTEM ROW'S DISPLAY SENTENCE, "lars
 * chose: Cut over Friday" — so `changed` was always true and the correction
 * chain's `from` was a string the record had never held.
 *
 * Each fix was correct about the relationship it checked. Each was blind to
 * WHERE ITS OPERANDS CAME FROM. So the operands stop being computed at the
 * comparison site and become a thing the object keeps:
 *
 *   1. EVERY RECORDED FIELD HAS A HISTORY. `amend()` writes the field, reads
 *      back what the object now holds, appends it, and returns the two adjacent
 *      recorded values — or null when nothing moved. There is no other way to
 *      change a recorded field, and checkRecordInvariant() proves it by
 *      comparing each field against the last value its own history contains.
 *
 *   2. A CORRECTION'S BEFORE AND AFTER CAN ONLY COME FROM THERE. A `change` is
 *      not something a caller can construct: amend() marks what it mints and
 *      checkCorrectionInvariant() refuses any entry carrying a change without
 *      that mark. `prior.body`, an option's label, a system row's sentence —
 *      every display string on the page — is now STRUCTURALLY unable to reach
 *      a correction chain, rather than merely absent from one by convention.
 *
 *   3. AND THE OPERANDS ARE VALIDATED, NOT JUST COMPARED. An entry whose `from`
 *      is not a value this object ever held is a defect even when `from` and
 *      `to` differ — which is exactly what round 7 shipped, and exactly what
 *      round 7's own check could not see, because it compared two strings and
 *      both of them were real strings.
 * ======================================================================== */

/* the fields this record keeps a history of. `get` reads the object; `set`
   writes it — one operation, so a field cannot move without being recorded and
   cannot be recorded without moving. `set: null` marks a DERIVED field: its
   value is a function of others, so amend() only reads it back. */
const RECORDED = {
  statement:    { get: o => o.text,                                        set: (o, v) => { o.text = v; } },
  answer:       { get: o => (o.answerText == null ? null : o.answerText),  set: (o, v) => { o.answerText = v; } },
  verification: { get: o => o.verification,                                set: (o, v) => { o.verification = v; } },
  due:          { get: o => (o.due == null ? null : o.due),                set: (o, v) => { o.due = v; } },
  assignee:     { get: o => (o.assignee == null ? null : o.assignee),      set: (o, v) => { o.assignee = v; } },
  /* how the line under this object was read — a claim someone thought out loud,
     or a call. D1 was amended from one to the other before this window opened. */
  reading:      { get: o => (o.reading == null ? null : o.reading),        set: (o, v) => { o.reading = v; } },
  /* "is this settled right now" — the fact a reopen changes when the
     verification enum does not (round 6's SELF-REPORTED → SELF-REPORTED) */
  settlement:   { get: o => (o.verification === "accepted" || o.verification === "verified" || !!o.resolvedAt) ? "settled" : "pending",
                  set: null }
};

/* the mark amend() puts on what it mints. A literal cannot carry it: it is not
   enumerable, it is not a string anyone can guess from the source, and it is
   regenerated on every load. */
const MINTED = "minted:" + Math.random().toString(36).slice(2) + Date.now().toString(36);

/* strings compare as text (whitespace normalised, nothing else folded); every
   other value compares as itself, so `null` and `"null"` are not the same fact */
function sameValue(a, b) {
  if (a == null || b == null) return a == null && b == null;
  if (typeof a === "string" && typeof b === "string") return sameText(a, b);
  if (typeof a === "string" || typeof b === "string") return false;
  return a === b;
}

function recordOf(o, field) {
  const all = o.recorded || (o.recorded = {});
  if (!all[field]) all[field] = [{ value: RECORDED[field].get(o), tm: null, by: null, how: "on the record when this room loaded" }];
  return all[field];
}
/* every object's every recorded field starts with the value it was seeded
   holding. This runs BEFORE the first render and before any transition, because
   a history that starts at the first amendment has no "before" to offer and the
   first correction would compare against the value it just wrote.
   A SEEDED CORRECTION IS STILL A CORRECTION: the fixture's chains describe
   amendments that happened before this window opened, so their before and after
   are REPLAYED into the field's history, earliest first, and their `change` is
   minted from it exactly like a live one. There is no seeded exemption — an
   exemption is where this defect class has entered every single time. */
function seedRecord() {
  eachObject(o => {
    Object.keys(RECORDED).forEach(f => recordOf(o, f));
    const seeds = (o.corrections || []).filter(c => c.seed);
    const byField = {};
    seeds.forEach(c => (byField[c.seed.of] || (byField[c.seed.of] = [])).push(c));
    Object.keys(byField).forEach(f => {
      if (!RECORDED[f]) return console.error("[atrium invariant] a seeded correction names a field this record does not keep:", o.id, f);
      const h = recordOf(o, f);
      const loaded = h[h.length - 1].value;
      h.length = 0;
      h.push({ value: byField[f][0].seed.from, tm: null, by: null, how: "on the record before this window opened" });
      byField[f].forEach(c => h.push({ value: c.seed.to, tm: c.tm || null, by: c.who || null, how: "amended before this window opened" }));
      if (!sameValue(h[h.length - 1].value, loaded))
        h.push({ value: loaded, tm: null, by: null, how: "on the record when this room loaded" });
      byField[f].forEach((c, i) => {
        const change = { of: f, from: h[i].value, to: h[i + 1].value };
        Object.defineProperty(change, "minted", { value: MINTED, enumerable: false });
        c.change = change;
      });
    });
  });
}

/* THE ONLY WAY A RECORDED FIELD CHANGES, AND THE ONLY SOURCE OF A `change`. */
function amend(o, field, value, meta) {
  const spec = RECORDED[field];
  if (!spec) { console.error("[atrium invariant] amend() called for a field this record does not keep:", field, o && o.id); return null; }
  const h = recordOf(o, field);
  const from = h[h.length - 1].value;
  if (spec.set) spec.set(o, value);
  /* read BACK, never trust the argument: what the record says happened is what
     the object now holds, which for a derived field the caller cannot even name */
  const to = spec.get(o);
  if (sameValue(from, to)) return null;
  h.push({ value: to, tm: (meta && meta.tm) || S.now, by: (meta && meta.by) || null, how: (meta && meta.how) || null });
  const change = { of: field, from: from, to: to };
  Object.defineProperty(change, "minted", { value: MINTED, enumerable: false });
  return change;
}

function everHeld(o, field, v) {
  const h = (o.recorded || {})[field];
  return !!h && h.some(e => sameValue(e.value, v));
}
/* did this object go from `from` straight to `to`, with nothing recorded
   between them? That is what an arrow in a correction chain claims. */
function heldInSequence(o, field, from, to) {
  const h = (o.recorded || {})[field];
  return !!h && h.some((e, i) => i + 1 < h.length && sameValue(e.value, from) && sameValue(h[i + 1].value, to));
}
/* what a recorded value reads as in a sentence. Presentation only — it never
   travels into a `change`, which is the whole point of this section. */
function recordedLabel(v, none) { return v == null ? (none || "nothing on the record") : String(v); }

/* the four classes partition the group: they add up to the total, by construction */
function msgClass(r, m) {
  if (m.routine) return "routine";
  const o = linkedObject(r, m);
  /* NEED means "linked to something in THIS room's attention collection" — the
     same predicate the highlight uses, so the chip and the pin can never
     disagree about which room's items they are talking about. */
  if (o) return isAttentionRow(r, m) ? "need" : "change";
  if (m.system) return "change";          // a recorded transition IS a change
  return "discussion";
}

/* --- DIGEST SEMANTICS ----------------------------------------------------
 * Three rules, all of which round 2 broke by treating "after the seen cursor"
 * as "since you left":
 *   1. Your own activity is never unseen. You wrote it; you were here.
 *   2. The absence window FREEZES at the moment you return. `absenceEnd` is
 *      pinned at boot and never moves, so nothing that happens while you are
 *      sitting in the room can join the group labelled SINCE YOU LEFT.
 *   3. Everything after that accrues to a separate, differently-labelled group
 *      — SINCE YOU RETURNED, or SINCE YOU MARKED THIS SEEN once the cursor has
 *      moved past the absence window.
 * ------------------------------------------------------------------------ */
function isMine(m) { return m.actor === S.me || m.byMe === true; }

/* A GROUP'S BOUNDARIES DO NOT MOVE WHEN YOU READ IT.
 *
 * Round 3 derived the absence group from the seen cursor, so one unconfirmed
 * click on "mark this group seen" deleted the whole digest — the window, the
 * counts, the four filters, all of it, with no way back. BRIEF concept 1 says
 * the divider FADES TO MUTED; Slack keeps its New line until you leave the
 * channel. So the absence group is anchored to `absenceFrom` … `absenceEnd`,
 * both pinned at boot, and marking it seen moves the cursor and nothing else:
 * the divider stays, muted, still counting, still filterable, still reversible.
 */
function groupStart(r, scope) {
  if (scope === "absence") return idx(r, r.absenceFrom) + 1;
  if (scope === "return")  return idx(r, r.absenceEnd) + 1;
  return 0;                                  // room
}
function groupEnd(r, scope) {
  if (scope === "absence") return idx(r, r.absenceEnd);
  return r.messages.length - 1;              // return | room
}
function groupMessages(r, scope) {
  const a = groupStart(r, scope), b = groupEnd(r, scope);
  if (b < a) return [];
  const slice = r.messages.slice(a, b + 1);
  return scope === "room" ? slice : slice.filter(m => !isMine(m));
}
/* how much of the group is yours — reported, never counted as unseen */
function ownInGroup(r, scope) {
  const a = groupStart(r, scope), b = groupEnd(r, scope);
  if (b < a) return 0;
  return r.messages.slice(a, b + 1).filter(isMine).length;
}
function hasAbsenceGroup(r) { return idx(r, r.absenceFrom) < idx(r, r.absenceEnd); }
/* read, not gone: a group whose last row is behind the cursor is muted, not
   deleted — and it can be un-marked from the line that says so. */
function groupRead(r, scope) {
  const b = groupEnd(r, scope);
  return b >= groupStart(r, scope) && idx(r, r.seenAfter) >= b;
}
function absenceRead(r) { return groupRead(r, "absence"); }
function counts(r, scope) {
  const c = { need: 0, change: 0, discussion: 0, routine: 0 };
  groupMessages(r, scope).forEach(m => { c[msgClass(r, m)]++; });
  c.total = c.need + c.change + c.discussion + c.routine;
  return c;
}
/* one predicate, used by both the render and the count — a row is highlighted
   if and only if it is counted by the chip that was pressed */
function matchesFilter(r, m) {
  const f = S.ui.feedFilter;
  if (!f) return false;
  if (msgClass(r, m) !== f.k) return false;
  return groupMessages(r, f.scope).indexOf(m) >= 0;
}
/* the rail: unseen means unseen by you, so your own messages never count */
function unseenCount(r) {
  const cur = idx(r, r.seenAfter);
  return r.messages.slice(cur + 1).filter(m => !isMine(m)).length;
}

/* the trailer — counted, not typed, INCLUDING its lead clause and its glyph.
   Round 2 hardcoded "everything else is green" over derived numbers, so a room
   with a failure in it would still have announced that everything was green. */
function clearSummary(r) {
  const owed = attention(r).map(o => o.id);
  const objectivesOnTrack = r.objectives.filter(ob =>
    !r.objects.some(o => o.objectives.includes(ob.id) && owed.includes(o.id))).length;
  /* THE SCOPE IS ON SCREEN OR IT IS A LIE (round 5 D3). The trailer describes
     what is NOT in the pin — anything owed is above it, and counting it twice
     would be its own kind of wrong. But the scope lived only in this comment,
     so the trailer read "0 overdue" one line under an item labelled "overdue
     16h" and the reader had no way to know the two numbers were about
     different sets. It now says which set it counted, and reports the overdue
     items in the list above rather than silently dropping them. */
  const commitments = r.objects.filter(o => o.kind === "commitment" && !needsYou(o));
  const overdue = commitments.filter(o => o.overdue).length;
  const owedOverdue = r.objects.filter(o => needsYou(o) && o.overdue).length;
  const failures = r.objects.filter(o => o.verification === "failed").length;

  /* THE LEAD CONSULTS VERIFICATION, NOT JUST FAILURE AND LATENESS.
     Round 3 derived the glyph but still said "everything else is green" over
     eight objects nothing had checked — in the same sentence as "0/2 objectives
     clear of you". Green means checked by something other than the claimant, so
     the lead may only say it when that is true of everything outside the pin.
     When it is not, the lead says what is: how much is unverified, how much is
     owed, and what is actually settled. */
  const rest = r.objects.filter(o => !owed.includes(o.id));
  const unverified = rest.filter(isClaim).length;
  const openQs = rest.filter(o => o.verification === "open").length;
  const green = rest.filter(o => o.verification === "verified" || o.verification === "accepted").length;

  /* the lead stays short because the counts it would repeat are already in the
     clauses beside it — which is also what keeps the whole trailer on one line
     at 1340 and readable, not clipped, at 1124. */
  let lead, glyph;
  if (failures)        { glyph = "✗"; lead = `${failures} failure${failures === 1 ? "" : "s"} outside your list`; }
  else if (overdue)    { glyph = "◆"; lead = `${overdue} thing${overdue === 1 ? " is" : "s are"} late, none failed`; }
  else if (unverified) { glyph = "~"; lead = `${unverified} of ${rest.length} still unverified`; }
  else if (openQs)     { glyph = "?"; lead = `${openQs} question${openQs === 1 ? "" : "s"} still open`; }
  else if (owed.length){ glyph = "◆"; lead = `the list above is all of it`; }
  else                 { glyph = "✓"; lead = "everything else is verified"; }

  /* the scope, in words, derived from the same list the pin drew: "beyond the
     N above" when there is a list, "in this room" when there is not */
  const scope = owed.length
    ? `beyond the ${owed.length} above`
    : "in this room, and nothing is owed";

  return { objectivesOnTrack, objectivesTotal: r.objectives.length, lead, glyph, scope,
           commitments: commitments.length, overdue, owedOverdue, failures, unverified, green,
           lastVerified: r.lastVerified };
}

/* --- THE ATTENTION INVARIANT --------------------------------------------
 * No attention item exists without an action path and a rationale. This is
 * checked at render time rather than asserted in a receipt: if a future change
 * mints a dead item, the console says so on the very first paint.
 * ---------------------------------------------------------------------- */
const DEV = true;   /* prototype build — a shipping build would strip this */
function checkAttentionInvariant(r) {
  if (!DEV) return;
  attention(r).forEach(o => {
    if (!pinActions(o)) console.error("[atrium invariant] owed item has no action path — it is a dead end:", o.id, o);
    if (!whyOf(r, o).trim()) console.error("[atrium invariant] owed item has no rationale under WHY YOU:", o.id, o);
    if (!r.messages.some(m => linkedObject(r, m) === o) && !sourceRoomOf(o))
      console.error("[atrium invariant] owed item is unreachable — no row in this room and no cross-room source declared:", o.id, o);
  });
}

/* --- THE ROW-SCOPE INVARIANT ---------------------------------------------
 * Highlighted rows ⊆ rows linked to THIS room's attention items. Checked
 * against the rendered DOM, not against the function that drew it, so a future
 * change that re-globalises the linkage is caught by the thing on screen.
 * ---------------------------------------------------------------------- */
function checkRowScopeInvariant(r) {
  if (!DEV) return;
  const owned = attention(r);
  document.querySelectorAll('#feed .mrow[data-cls="need"], #feed .mrow.hit').forEach(el => {
    const m = msg(r, el.dataset.msg);
    if (!m) return;
    const o = linkedObject(r, m);
    if (el.dataset.cls === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] row classed NEED is not linked to this room's attention collection:", el.dataset.msg, o && o.id);
    if (el.classList.contains("hit") && S.ui.feedFilter && S.ui.feedFilter.k === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] highlighted row is outside this room's attention collection:", el.dataset.msg, o && o.id);
  });
  /* and the other direction: the count and the highlight must be the same
     predicate, so the two numbers can differ only in cardinality, never in set */
  const rows = attentionRows(r);
  if (rows.some(m => attention(r).indexOf(linkedObject(r, m)) < 0))
    console.error("[atrium invariant] attentionRows() returned a row outside attention()");
}

/* --- THE QUOTATION INVARIANT ---------------------------------------------
 * Round 3's cardinal defect, encoded so it cannot come back: anything rendered
 * as a person's words must prove where the words came from. Round 4 found the
 * encoding CIRCULAR and this is the closure of that loophole.
 *
 *   1. Every element in a quotation context (<q>, .ex, .quoted) carries
 *      data-quoted, and it resolves — either "msg:<id>[@room]", in which case
 *      the rendered text must actually appear in that message AND that message
 *      must have been authored by a human (origin 'typed' or 'seeded'), or
 *      "typed", in which case the text must be in the human-speech register.
 *      A message the PAGE authored on a human's behalf (origin 'chosen') can
 *      never satisfy a quotation context, however real its text is: the defect
 *      is the attribution, not the invention. Round 4 checked only that the
 *      cited message existed and contained the text — which a page-fabricated
 *      message trivially does, because the page wrote it to contain the text.
 *   2. No quotation marks are rendered anywhere else — SCOPED TO PAGE-AUTHORED
 *      TEXT. Round 4 walked every text node on the page, so a human typing
 *      “like this” tripped a page-integrity rule on their own words, on every
 *      render. A person's typographic quotes are their business; the rule is
 *      about what the PAGE puts in quotation marks.
 *   3. A row the page authored (origin 'chosen') is never dressed as human
 *      speech: not classed `.me`, no quotation marks in it, no quotation
 *      context inside it.
 * ---------------------------------------------------------------------- */
const QUOTED_SEL = "q, .ex, .quoted";
/* verbatim text from a NON-HUMAN source, rendered as a record rather than as
   speech: same citation proof, no quotation marks, no human-voice exemption */
const CITED_SEL = "[data-cited]";
/* text a HUMAN produced, marked at render. Two rules read it: the quote-mark
   walk skips it (their quotes are theirs) and the record-text check skips it
   (someone may legitimately type the word "undefined"). Everything not marked
   is page-authored and is held to both.
   ROUND 5 D4: this was set on feed message bodies and nowhere else, so a
   human's words tripped the record-text rule everywhere ELSE they are rendered
   — the correction chain's quote, the receipt's provenance excerpt, an object's
   own text after a bound answer, the facts and history a verification note
   lands in. `human()` / `voiced()` (see above) mark those too, per fragment, so
   a page sentence that quotes a person keeps the page's half checked. */
const HUMAN_SEL = '[data-voice="human"]';

/* strip only a MATCHED PAIR of wrapper quotes the page itself added, plus a
   truncation ellipsis. Round 4 stripped every curly quote in the string, so a
   quotation of a message that legitimately contained “…” no longer matched the
   message it cited and the checker reported invented speech about real words. */
function quotedText(el) {
  let s = el.textContent.trim().replace(/…$/, "").trim();
  if (s.length > 1 && /^[“"]/.test(s) && /[”"]$/.test(s)) s = s.slice(1, -1).trim();
  return s;
}

function checkQuotationInvariant() {
  if (!DEV) return;
  document.querySelectorAll(QUOTED_SEL).forEach(el => {
    const ref = el.getAttribute("data-quoted");
    const text = quotedText(el);
    if (!ref) return console.error("[atrium invariant] quoted text with no provenance — nothing proves anyone said this:", text, el);
    if (ref === "typed") {
      if (!S.typed.some(s => s.indexOf(text) === 0 || s === text))
        console.error("[atrium invariant] quoted as typed by a human, but no human typed it:", text, el);
      return;
    }
    const [id, roomId] = ref.replace(/^msg:/, "").split("@");
    const home = roomId ? S.rooms[roomId] : room();
    const m = home && msg(home, id);
    if (!m) return console.error("[atrium invariant] quotation cites a message that does not exist:", ref, el);
    /* THE LOOPHOLE, CLOSED. A quotation may only cite a message a human wrote. */
    if (m.origin !== "typed" && m.origin !== "seeded")
      return console.error("[atrium invariant] quotation cites a message the page authored (origin " +
        m.origin + ") — a page-written sentence can never be a person's words:", ref, text, el);
    if (plain(m.body).indexOf(text) < 0)
      console.error("[atrium invariant] quoted text is not in the message it cites — this is invented speech:", ref, text, el);
  });

  /* A MACHINE'S LINE IS CITED, NOT QUOTED (round 7 D6). Same proof of origin —
     the message exists in the loaded record and actually contains this text —
     minus the one clause that is about people: a parity run is not somebody's
     words, is not rendered as if it were, and is held to the page-authored text
     rules like every other string the page did not get from a human. */
  document.querySelectorAll(CITED_SEL).forEach(el => {
    const ref = el.getAttribute("data-cited");
    const text = quotedText(el);
    const [id, roomId] = ref.replace(/^msg:/, "").split("@");
    const home = roomId ? S.rooms[roomId] : room();
    const m = home && msg(home, id);
    if (!m) return console.error("[atrium invariant] a system record cites a message that does not exist:", ref, el);
    if (plain(m.body).indexOf(text) < 0)
      console.error("[atrium invariant] a system record's text is not in the line it cites:", ref, text, el);
  });

  /* no stray quotation marks in PAGE-AUTHORED text: every “ ” the page renders
     must sit inside a checked quotation context. This is what makes rule 1
     exhaustive rather than a convention someone can forget to follow — and
     skipping human-authored bodies is what stops it crying wolf on input. */
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!/[“”]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
      if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
      return p.closest(QUOTED_SEL) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while ((n = walker.nextNode()))
    console.error("[atrium invariant] quotation marks outside a checked quotation context:", n.nodeValue.trim(), n.parentElement);

  /* rule 3: a page-authored answer row is a system record, and must look like
     one. If a future change routes a chosen answer back through the human path
     — actor S.me, body in quotation marks, or a quotation context inside it —
     this fires before anyone reads the row and believes it. */
  document.querySelectorAll('#feed .mrow[data-origin="chosen"]').forEach(el => {
    if (el.classList.contains("me"))
      console.error("[atrium invariant] a row the page authored is classed as the human's own:", el.dataset.msg, el);
    if (el.querySelector(QUOTED_SEL))
      console.error("[atrium invariant] a row the page authored contains a quotation context:", el.dataset.msg, el);
    if (/[“”]/.test(el.textContent))
      console.error("[atrium invariant] a row the page authored is rendered in quotation marks:", el.dataset.msg, el);
  });
}

/* --- THE RECORD-TEXT INVARIANT (round 4 D2) -------------------------------
 * No page-authored string on screen may contain `undefined`, `null` or `NaN`.
 * Those are the names of JavaScript values, not facts about anything, and a
 * permanent record that contains one is a record that is wrong. Human-authored
 * text is exempt: a person may type the word "undefined" and that is their
 * sentence, not the page's failure — the round-4 D4 lesson, applied here too.
 * Attributes count: a tooltip is rendered text a user reads.
 * ---------------------------------------------------------------------- */
const BAD_VALUE = /\b(undefined|null|NaN)\b/;
function checkRecordTextInvariant() {
  if (!DEV) return;
  [document.querySelector(".app"), $("toast")].forEach(root => {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (!BAD_VALUE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode()))
      console.error("[atrium invariant] a rendered record contains an unguarded optional field:", n.nodeValue.trim(), n.parentElement);

    root.querySelectorAll("[title], [aria-label]").forEach(el => {
      if (el.closest(HUMAN_SEL)) return;
      ["title", "aria-label"].forEach(a => {
        const v = el.getAttribute(a);
        if (v && BAD_VALUE.test(v))
          console.error("[atrium invariant] a rendered " + a + " contains an unguarded optional field:", v, el);
      });
    });
  });
}

/* --- THE AMENDMENT INVARIANTS (round 6 D1) --------------------------------
 *
 * Round 6's blocking defect was a false sentence about the record: the receipt
 * rendered two byte-identical statements either side of an arrow and said the
 * second was "not what was proposed". Nothing on the page could see it. It was
 * not a quotation, so the quotation rule was silent; every field was populated,
 * so the record-text rule was silent; every box had a real height and every
 * control hit-tested to itself, so the geometry rule was silent. It was
 * ROUND 4'S D7 CLASS arriving through the fallback ROUND 4 ITSELF ADDED — a fix
 * opening a path around an earlier fix's guard.
 *
 * That is the reason there are two checks here and not one line of code. The
 * one-line fix (`agrees: true`) is a value; these are the relationships that
 * value has to satisfy, asserted where a future edit cannot route around them:
 *
 *   1. AN OPTION THAT IS THE PROPOSAL AGREES WITH IT. If an option's statement
 *      is the proposal's own sentence, `agrees` must be true. This is checked
 *      against the strings, not against the flag, so minting an option whose
 *      statement is `o.text` and forgetting the flag is caught at the source —
 *      before anyone clicks it, on the render that puts it on screen.
 *
 *   2. A CORRECTION THAT CLAIMS A CHANGE HAS ONE. An entry in a correction
 *      chain either carries `change: {of, from, to}` — in which case `from` and
 *      `to` must actually differ — or it carries none, in which case it may not
 *      be worded as an amendment. "Amended" and "re-affirmed" are different
 *      facts about a record and the chain has to be able to tell them apart.
 *
 *   3. AND ITS BEFORE AND AFTER ARE VALUES THE OBJECT ACTUALLY HELD, IN THAT
 *      ORDER (round 7 D1). Rule 2 asks whether two operands differ. It cannot
 *      ask where they came from, which is why it passed honestly on a `from`
 *      that had been read out of a rendered sentence. Rule 3 asks the record.
 *      See THE STATEMENT OF RECORD above for the machinery it reads.
 *
 * All three walk STATE, not the DOM: a correction chain is wrong the moment it
 * is written, whether or not its receipt happens to be open.
 * ---------------------------------------------------------------------- */
function checkAnswerIdentityInvariant() {
  if (!DEV) return;
  eachObject(o => {
    const proposal = o.proposedText || o.text;
    (o.options || []).forEach(opt => {
      if (!sameText(opt.statement, proposal)) return;
      if (opt.agrees === true) return;
      console.error("[atrium invariant] an option whose statement IS the proposal is not marked as agreeing with it — " +
        "answering with it would record a contradiction between two identical sentences:", o.id, opt.label, opt);
    });
  });
}

/* NOTHING CHANGES A RECORDED FIELD WITHOUT RECORDING IT (round 7 D1). The
   history is only worth checking a correction against if it is complete, so
   this compares every recorded field to the last value its own history holds.
   A future edit that assigns `o.text = …` directly — the shape every one of
   these three defects had in common — is caught on the render after it runs,
   whether or not it ever reaches a correction chain. */
function checkRecordInvariant() {
  if (!DEV) return;
  eachObject(o => {
    Object.keys(RECORDED).forEach(f => {
      const h = (o.recorded || {})[f];
      if (!h || !h.length)
        return console.error("[atrium invariant] a recorded field has no history — nothing can prove what this object held:", o.id, f);
      const now = RECORDED[f].get(o);
      if (!sameValue(h[h.length - 1].value, now))
        console.error("[atrium invariant] a recorded field was changed without being recorded — the object holds a value its own history " +
          "does not contain, so any correction about it would be comparing against fiction:", o.id, f, h[h.length - 1].value, "→", now);
    });
    /* AND THE TWO HALVES OF THE RECEIPT AGREE ABOUT WHETHER ANYTHING HAPPENED
       (round 7 D5). Reschedule moved a due date and reassignment moved an
       assignee; WHAT HAPPENED said so and CORRECTION CHAIN, forty pixels below,
       rendered "no corrections — this object has never been amended". One
       receipt, two contradictory claims about the same click. A field that has
       moved and a chain that is empty cannot both be right. */
    const amended = Object.keys(RECORDED).some(f => ((o.recorded || {})[f] || []).length > 1);
    if (amended && !(o.corrections || []).length)
      console.error("[atrium invariant] this object's record has been amended and its correction chain is empty — the receipt " +
        "reports the amendment in one section and denies it in the next:", o.id,
        Object.keys(RECORDED).filter(f => ((o.recorded || {})[f] || []).length > 1).join(", "));
  });
}

function checkCorrectionInvariant() {
  if (!DEV) return;
  eachObject(o => {
    (o.corrections || []).forEach(c => {
      if (c.change) {
        const ch = c.change;
        /* WHERE THE OPERANDS CAME FROM (round 7 D1). Round 7 compared `from`
           against `to`, found them different, and passed honestly — because the
           value it was reading had been fabricated at the source: `prior.body`,
           the system row's display sentence. Inequality was never the whole
           question. The first thing to establish about a before and an after is
           that the record ever held them. */
        if (ch.minted !== MINTED) {
          console.error("[atrium invariant] a correction entry carries a before and after the record did not mint — " +
            "amend() is the only thing that may produce one, so this came from somewhere the object never wrote down " +
            "(a rendered sentence, an option's label, a row's body):", o.id, c.hd, ch.of, ch.from, "→", ch.to);
          return;
        }
        if (sameValue(ch.from, ch.to)) {
          console.error("[atrium invariant] a correction entry asserts the " + ch.of +
            " changed, but its before and after are the same text — the record is claiming an amendment it never made:",
            o.id, c.hd, normText(ch.from));
          return;
        }
        if (!everHeld(o, ch.of, ch.from)) {
          console.error("[atrium invariant] a correction entry's `before` is not a value this object has ever held — " +
            "the record is contradicting itself about what it used to say:", o.id, c.hd, ch.of, ch.from);
          return;
        }
        if (!heldInSequence(o, ch.of, ch.from, ch.to))
          console.error("[atrium invariant] a correction entry claims one value became another, but the record never went " +
            "straight from the first to the second — the arrow is asserting a transition that is not in this object's history:",
            o.id, c.hd, ch.of, ch.from, "→", ch.to);
        return;
      }
      /* No `change` means the entry asserts nothing was amended, so it may not
         be PUNCTUATED as though something was. The arrow is the claim — it is
         what the header and the rendered body both use to say "this became
         that" — so an entry with no before/after may not carry one. Syntax, not
         a word list: a keyword sniffer cannot tell "amended" from "nothing was
         amended", and correctionHtml() drops the arrow for these entries too,
         so the check and the render are asserting the same thing. */
      if (/→/.test(c.hd))
        console.error("[atrium invariant] a correction entry's header claims a transition but the entry records no " +
          "before and after that differ — the arrow is asserting a change nothing proves:", o.id, c.hd);
    });
  });
}

/* every object in every loaded room — the invariants above are about the record,
   and the record is not only the room you are looking at */
function eachObject(fn) {
  Object.keys(S.rooms).forEach(k => (S.rooms[k].objects || []).forEach(o => fn(o, S.rooms[k])));
}

/* --- THE LAYOUT INVARIANT (round 4 D1) ------------------------------------
 * Round 4's blocking defect was invisible to every other check on this page:
 * the state was right, the strings were right, the DOM was right, and the
 * cross-room trace was 0px tall with the feed painting over it and both of its
 * controls unclickable. Nothing in a state-shaped invariant can see that. So
 * this one asserts against geometry, on the thing that was actually painted:
 *
 *   1. Every visible child of `.center` occupies a track with real height.
 *   2. No two of those children overlap — a collapsed track shows up as a
 *      sibling painting through, which is exactly what round 4 measured.
 *   3. Every interactive control's centre point hit-tests to itself. A control
 *      you cannot click is not an affordance, whatever it looks like.
 *
 * Controls scrolled out of their container are skipped — legitimately not on
 * screen — by intersecting each element with every clipping ancestor first.
 * ---------------------------------------------------------------------- */
const CONTROL_SEL = "button, input, textarea, select, a[href], [role='button'], [tabindex]:not([tabindex='-1'])";

/* an element is on screen only if NO ancestor hides it. getComputedStyle reports
   an element's OWN display, so a button inside a `hidden` panel still reads
   `display: flex` while having no box at all — the walk up is what tells the
   difference between "unclickable" and "not currently on the page". */
function shown(el) {
  for (let p = el; p && p.nodeType === 1; p = p.parentElement) {
    if (p.hidden) return false;
    const cs = getComputedStyle(p);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
  }
  return true;
}
/* the element's box intersected with every scroll/clip ancestor and the
   viewport — i.e. the part of it a pointer could actually reach */
function visibleBox(el) {
  let box = el.getBoundingClientRect();
  box = { left: box.left, top: box.top, right: box.right, bottom: box.bottom };
  for (let p = el.parentElement; p; p = p.parentElement) {
    const cs = getComputedStyle(p);
    if (cs.overflow === "visible" && cs.overflowX === "visible" && cs.overflowY === "visible") continue;
    const r = p.getBoundingClientRect();
    box.left = Math.max(box.left, r.left); box.top = Math.max(box.top, r.top);
    box.right = Math.min(box.right, r.right); box.bottom = Math.min(box.bottom, r.bottom);
  }
  box.left = Math.max(box.left, 0); box.top = Math.max(box.top, 0);
  box.right = Math.min(box.right, window.innerWidth);
  box.bottom = Math.min(box.bottom, window.innerHeight);
  return box;
}

/* how wide a control has to be before the words in it mean anything. Six
   characters at its own type size is the floor: enough for a truncated title to
   name what it is about ("Stop is…"), and derived from the page's own scale so
   a type change moves the wire with it. A control that is not truncated at all
   is legible at whatever width it has — the rule is about lost words, not small
   ones — and a control with no words only needs to be aimable. */
const AIM_MIN = 6;
function legibleWidth(el) {
  if (!(el.textContent || "").trim()) return AIM_MIN;
  if (el.scrollWidth <= el.clientWidth + 1) return AIM_MIN;
  const fs = parseFloat(getComputedStyle(el).fontSize) || 12;
  return Math.max(24, Math.round(fs * 6));
}

function checkLayoutInvariant() {
  if (!DEV) return;
  const center = document.querySelector(".center");
  if (!center) return console.error("[atrium invariant] the conversation column is missing");

  const cbox = center.getBoundingClientRect();
  const kids = Array.from(center.children).filter(shown);
  const boxes = kids.map(el => el.getBoundingClientRect());
  kids.forEach((el, i) => {
    if (boxes[i].height < 1)
      console.error("[atrium invariant] a .center child owns a zero-height track — it is on the page and cannot be seen or clicked:",
        el.id || el.className, el);
    /* THE COLUMN IS AUTHORITATIVE AND DOES NOT SCROLL, so a child outside it is
       not "scrolled out of view", it is gone. Found while verifying the fix
       above: hiding the trace slid the composer to top: 900 on a 900px
       viewport, entirely below the fold — non-zero height, no overlap with the
       feed, and invisible to both of the other two rules. Its controls were
       skipped by the hit-test as legitimately off-screen. This is the rule that
       sees it. */
    if (boxes[i].bottom > cbox.bottom + 0.5 || boxes[i].top < cbox.top - 0.5)
      console.error("[atrium invariant] a .center child is outside the column that owns it — the track layout pushed it off:",
        el.id || el.className, boxes[i].top, boxes[i].bottom, "column:", cbox.top, cbox.bottom);
  });
  /* a track can collapse without the child reporting zero height (a min-height,
     an absolute child), and the symptom is always the same: siblings sharing
     pixels. Round 4 measured trace.top === feed.top at 306.14 on both. */
  for (let i = 0; i < kids.length - 1; i++) {
    if (boxes[i].bottom > boxes[i + 1].top + 0.5)
      console.error("[atrium invariant] two .center children overlap — a track collapsed and a sibling is painting through it:",
        (kids[i].id || kids[i].className), "over", (kids[i + 1].id || kids[i + 1].className),
        boxes[i].bottom, boxes[i + 1].top);
  }

  /* every control hit-tests to itself */
  document.querySelectorAll(CONTROL_SEL).forEach(el => {
    if (!shown(el)) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1)
      return console.error("[atrium invariant] an interactive control has no clickable area:", controlName(el), el);
    /* AND A CONTROL YOU CANNOT READ IS NOT A CONTROL (round 7 D2). The rule
       above catches 0px and was silent at 5.36px — an owed item's title,
       truncated past the first character, on a row that still counted it,
       glyphed it and offered its action. One pixel above the wire is the same
       defect, so the wire is a LEGIBILITY floor rather than a non-zero one:
       a control whose own words are being cut off has to keep enough of them to
       be identified, measured in its own type size rather than in a constant
       that would drift the moment the scale changed. A control showing all of
       its text is legible at whatever width its text needs, by definition. */
    const floor = legibleWidth(el);
    if (r.width < floor)
      return console.error("[atrium invariant] an interactive control is too narrow to read — its label is cut off past the point " +
        "where it identifies anything:", controlName(el), Math.round(r.width * 100) / 100 + "px", "needs", floor + "px", el);
    const v = visibleBox(el);
    if (v.right - v.left < 1 || v.bottom - v.top < 1) return;   // scrolled out of view — legitimately unreachable
    let cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (cx < v.left || cx > v.right || cy < v.top || cy > v.bottom) {
      cx = (v.left + v.right) / 2; cy = (v.top + v.bottom) / 2;  // partially scrolled: test the reachable part
    }
    let hit = document.elementFromPoint(cx, cy);
    if (hit === el || (hit && el.contains(hit))) return;
    /* THE CENTRE IS NOT THE WHOLE CONTROL. A sticky header or footer legitimately
       covers a band of a scrolling pane — the control under it is one scroll away,
       which is what sticky is for, and failing it would be exactly the cry-wolf
       mistake D4 is about. What is NOT legitimate is a control with no reachable
       point at all: round 4's trace controls were covered edge to edge by a feed
       that had swallowed their track, and no scroll position recovered them. So
       the rule is "at least one point of this control hit-tests to it". */
    const probes = [[.15, .5], [.85, .5], [.5, .15], [.5, .85], [.15, .15], [.85, .85], [.15, .85], [.85, .15]];
    const reachable = probes.some(([fx, fy]) => {
      const px = v.left + (v.right - v.left) * fx, py = v.top + (v.bottom - v.top) * fy;
      const h = document.elementFromPoint(px, py);
      return h === el || (h && el.contains(h));
    });
    if (reachable) return;
    /* ...and a sticky or fixed overlay is one scroll away, not a dead end. The
       receipt's sticky footer deliberately covers a band of a scrolling pane so
       that Reopen never falls below the fold; a source entry under it is reached
       by scrolling, which is the contract sticky signs. Round 4's trace controls
       were covered by a sibling in NORMAL FLOW inside a column that does not
       scroll at all, and that stays a failure. */
    if (scrollEscapable(el, hit)) return;
    console.error(el.closest("[data-prompt]")
      ? "[atrium invariant] a prompt this render opened is painted over — the page asked for input and then covered the control:"
      : "[atrium invariant] an interactive control has no point that hit-tests to itself — something is painting over all of it:",
      controlName(el), "→", hit && (hit.className || hit.tagName), el);
  });
}

/* --- REVEALING WHAT THE PAGE JUST OPENED (round 5 D1) ---------------------
 * focus() scrolls an element into view only when it is OUTSIDE the scrollport.
 * The reopen prompt is inside it — under the receipt's sticky footer — so
 * focusing it moved nothing, and at 1440×900 the reader was asked to type into
 * a box that was 100% painted over.
 *
 * "In the scrollport" is not the same as "on screen": a sticky footer covers a
 * band of the pane at every scroll position, so the band a reader can actually
 * see is the pane's box minus whatever is pinned to its edges. This scrolls an
 * open prompt clear of that, and it runs INSIDE render(), before the geometry
 * invariant reads boxes — the prompt has to be reachable in the same frame it
 * appears, and a smooth scroll would still be in flight when the checker looks.
 * ---------------------------------------------------------------------- */
function scrollPane(el) {
  for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
    const cs = getComputedStyle(p);
    if (/(auto|scroll)/.test(cs.overflowY) && p.scrollHeight > p.clientHeight + 1) return p;
  }
  return null;
}
function freeBand(pane, el) {
  const p = pane.getBoundingClientRect();
  let top = p.top, bottom = p.bottom;
  pane.querySelectorAll("*").forEach(s => {
    if (s === el || s.contains(el)) return;
    const pos = getComputedStyle(s).position;
    if (pos !== "sticky" && pos !== "fixed") return;
    const r = s.getBoundingClientRect();
    if (r.height < 1) return;
    /* pinned nearer the pane's top raises the floor; nearer its bottom lowers
       the ceiling — which edge it is pinned to is a measurement, not a guess */
    if (r.top - p.top <= p.bottom - r.bottom) top = Math.max(top, r.bottom);
    else bottom = Math.min(bottom, r.top);
  });
  return { top, bottom };
}
function revealInPane(el, pad) {
  const pane = scrollPane(el);
  if (!pane) return;
  const band = freeBand(pane, el);
  const m = pad == null ? 8 : pad;
  const r = el.getBoundingClientRect();
  let delta = 0;
  if (r.height + m * 2 > band.bottom - band.top || r.top - m < band.top) delta = r.top - m - band.top;
  else if (r.bottom + m > band.bottom) delta = r.bottom + m - band.bottom;
  if (Math.abs(delta) < 1) return;
  pane.scrollTop += delta;      // instant, not smooth: see above
}
/* every prompt currently on the page. There is at most one per pane, and each
   one is recreated by the render that keeps it open, so this is idempotent —
   once it is clear of the sticky band, `delta` is 0 and nothing moves. */
/* Anything the page has just put in front of someone has to be on screen, and
   there are exactly two ways it can do that: open a prompt, or move focus.
   scrollEscapable() already refuses to whitelist either — so both have to be
   revealed, or the guard fires on a thing the page did to itself. Round 6 had
   only the first half, because focus after a write had no spec and so nothing
   was ever deliberately focused. */
function revealOpenPrompts() {
  document.querySelectorAll("[data-prompt]").forEach(el => { revealInPane(el); });
  const a = document.activeElement;
  if (a && a !== document.body && a.nodeType === 1 && !a.closest("[data-prompt]")) revealInPane(a);
}
/* is the thing covering `el` an overlay a scroll would move it out from under?
   True only when the blocker is sticky/fixed AND is not an ancestor of the
   control AND the control sits in a pane with somewhere left to scroll.
 *
 * NARROWED (round 5 D1). The exemption as written whitelisted the exact defect
 * it was written beside: the receipt's sticky footer painted over the reopen
 * prompt renderReceipt() had just appended and focused, `#rgo` was 100% covered,
 * a real click landed on SPAN.note, and this function said "one scroll away".
 *
 * Sticky's contract holds for a PASSIVE entry — a source row under the footer is
 * reached by scrolling, and that is what sticky is for. It does not hold for a
 * prompt the page opened in response to a click and put the cursor in: the page
 * has just told the reader to type, and the thing to type into is behind an
 * overlay, at a scroll position nobody invited them to find. So the exemption is
 * void for anything inside an open prompt (`[data-prompt]`, set by the reopen
 * and verify boxes at construction), and for whatever currently holds focus.
 * Those are the two ways the page can be said to have just put an element in
 * front of someone. */
function scrollEscapable(el, hit) {
  if (!hit) return false;
  if (el.closest("[data-prompt]")) return false;
  const active = document.activeElement;
  if (active && active !== document.body && (active === el || el.contains(active))) return false;
  let sticky = null;
  for (let p = hit; p && p !== document.body; p = p.parentElement) {
    const pos = getComputedStyle(p).position;
    if ((pos === "sticky" || pos === "fixed") && !p.contains(el)) { sticky = p; break; }
  }
  if (!sticky) return false;
  for (let p = el.parentElement; p && p !== document.body; p = p.parentElement) {
    if (p.scrollHeight > p.clientHeight + 1 || p.scrollWidth > p.clientWidth + 1) return true;
  }
  return false;
}
function controlName(el) {
  return (el.id ? "#" + el.id + " " : "") + (el.className || el.tagName) +
         " · " + (el.textContent || el.getAttribute("aria-label") || "").trim().slice(0, 40);
}

/* WHY YOU is never empty. When the seed carries a rationale, that is the
   rationale; when it does not — a reopened decision, say — one is synthesized
   from the object's own history, which is the only honest source for it. */
function whyOf(r, o) {
  if (o.why) return o.why;
  const bits = [];
  /* a synthesized rationale still may not assert something the record
     contradicts. Round 4's version said "only you can settle it" about every
     reopened object, including a commitment that had gone back to its owner —
     the facts line one row below said "pending again · justin's". */
  const owner = o.kind === "commitment" ? (o.owner || o.claimant) : null;
  const mine = !owner || owner === S.me;
  if (o.reopenedAt)
    bits.push(mine
      ? `you reopened this at ${o.reopenedAt}, so it is pending again and only you can settle it`
      : `you reopened this at ${o.reopenedAt}, so it is pending again — it is ${owner}'s to sign off, and it is on your list because you are waiting on it`);
  else if (o.kind === "decision") bits.push("it is a decision routed to you — decisions never auto-accept");
  else if (o.kind === "commitment") bits.push(`it is ${mine ? "yours" : owner + "'s"} and it is waiting on you`);
  else bits.push("it was routed to you and nobody else has picked it up");
  /* one supporting clause, drawn from the object's own record — the prior call
     if there is one, otherwise the objective it sits under. Two clauses keep it
     readable inside the pin's line budget; a rationale that gets clipped is not
     a rationale. */
  const prior = [...o.history].reverse().find(h => h.k === "accepted" || h.k === "verified");
  if (prior) bits.push(`the prior call was ${prior.who}'s at ${prior.tm}, still on the record below`);
  else {
    const titles = o.objectives.map(id => (r.objectives.find(ob => ob.id === id) || {}).title).filter(Boolean);
    if (titles.length) bits.push(`it sits under the objective ${titles[0]}`);
  }
  return bits.join(" · ") + ".";
}
/* ===========================================================================
 * RENDER HELPERS — all interpolation goes through esc(). Nothing typed by a
 * human is ever concatenated into innerHTML unescaped. (Round-1 defect B1.)
 * ======================================================================== */

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]); }
function bodyHtml(body) {
  return body.map(seg => {
    if (typeof seg === "string") return esc(seg);
    if (seg.code) return `<code>${esc(seg.code)}</code>`;
    if (seg.at) return `<span class="at">@${esc(seg.at)}</span>`;
    if (seg.h != null) return humanSpan(seg.h);
    return esc(seg.text || "");
  }).join("");
}

/* --- WHO TYPED THESE CHARACTERS (round 5 D4) ------------------------------
 * Two page-integrity rules police what the PAGE writes: no stray quotation
 * marks outside a checked quotation context, and no `undefined`/`null`/`NaN` in
 * a rendered record. Both are wrong when applied to a human's own sentence — a
 * person may type a curly quote, and a person may type the word "undefined",
 * and neither is the page's failure. Round 4 scoped the quote-mark rule
 * correctly and round 5 marked its `data-voice="human"` on FEED MESSAGE BODIES
 * ONLY, so the record-text rule cried wolf on every other surface a human's
 * words reach: a typed reopen reason quoted in the correction chain, a
 * verification note in the facts and the history, a bound answer that became
 * the object's own text.
 *
 * `human(s)` marks a fragment as characters a person typed. `voiced(v)` renders
 * a string (page-authored), a marked fragment, or an array mixing the two — so
 * a page sentence that embeds a human's words keeps the page's half checked and
 * exempts only the half the person wrote. `voicedText(v)` is the same value as
 * plain text, for the places that need one.
 * ---------------------------------------------------------------------- */
function human(s) { return { h: s }; }
function humanSpan(s) { return `<span data-voice="human">${esc(s)}</span>`; }
function voiced(v) {
  if (v == null) return "";
  if (typeof v === "string") return esc(v);
  if (Array.isArray(v)) return v.map(voiced).join("");
  if (v.h != null) return humanSpan(v.h);
  return esc(String(v));
}
function voicedText(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(voicedText).join("");
  return String(v.h != null ? v.h : v);
}
function initials(name) { return name.slice(0, 2).toUpperCase(); }
function reduceMotion() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function scrollBehavior() { return reduceMotion() ? "auto" : "smooth"; }
function scrollIntoView(el, block) {
  if (!el) return;
  el.scrollIntoView({ behavior: scrollBehavior(), block: block || "center" });
}

  const ids = Object.keys(S.rooms);

    hs.appendChild(d);
  });
}

function renderHead() {

/* ===========================================================================
 * PIN — corpus turn 17 under a 1340×820 budget:
 *   owed floats up and the hardest one opens; the rest compress to one-line
 *   rows that keep their glyph and their primary action; clean state
 *   compresses to the counted trailer. The pin folds, it never scrolls.
 * ======================================================================== */

function renderPin() {
  const r = room();
  const items = attention(r);
  const list = $("pinList"), trailer = $("pinTrailer");
  checkAttentionInvariant(r);

  /* the pin counts ITEMS. When a need filter is on, it also says how many rows
     those items produced, because that is the other number on the screen. */
  const f = S.ui.feedFilter;
  const rows = f && f.k === "need" ? groupMessages(r, f.scope).filter(m => msgClass(r, m) === "need").length : 0;
  $("pinCount").textContent = !items.length
    ? "nothing owed — this is the whole list"
    : (f && f.k === "need")
      /* "highlighted" is now literally what happens — round 6 said this while
         dropping every other row to 1.5:1, so the word was doing the work of
         hiding a legibility failure. It says what the other rows get, too. */
      ? `${items.length} item${items.length > 1 ? "s" : ""} · ${rows} linked row${rows === 1 ? "" : "s"} highlighted below · nothing else dimmed`
      : `${items.length} item${items.length > 1 ? "s" : ""} · hardest first`;
  $("pinFold").setAttribute("aria-pressed", String(S.ui.pinFolded));
  $("pinFold").textContent = S.ui.pinFolded ? "UNFOLD" : "FOLD";
  list.hidden = S.ui.pinFolded;
  trailer.hidden = S.ui.pinFolded;

  list.innerHTML = "";
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty rise";
    e.textContent = "NOTHING NEEDS YOU IN THIS ROOM — THAT IS A RESULT, NOT AN ABSENCE";
    list.appendChild(e);
  }

  const openId = items.some(o => o.id === S.ui.pinOpen) ? S.ui.pinOpen : (items[0] && items[0].id);
  items.forEach(o => {
    list.appendChild(o.id === openId ? pinCard(r, o) : pinCompact(r, o));
  });

  const c = clearSummary(r);
  trailer.innerHTML =
    `<span class="g ${TRAILER_GLYPH_CLASS[c.glyph] || ""}" aria-hidden="true">${c.glyph}</span>` +
    `<span>${esc(c.lead)} — <b>${c.objectivesOnTrack}/${c.objectivesTotal} objectives</b> clear of you · ` +
    `${esc(c.scope)}: <b>${c.commitments} commitment${c.commitments === 1 ? "" : "s"}</b>, ${c.overdue} overdue` +
    (c.owedOverdue ? `, ${c.owedOverdue} more overdue in the list` : "") + ` · ` +
    `<b>${c.failures} failure${c.failures === 1 ? "" : "s"}</b> · last check ${esc(c.lastVerified)}</span>`;
}

/* the trailer's glyph is the lead's glyph — the tone follows the sentence */
const TRAILER_GLYPH_CLASS = { "✗": "bad", "◆": "warn", "?": "warn", "~": "claim", "✓": "" };

/* an owed item whose source message is not in this room says where it is and
   goes there. Round 2 counted it and highlighted nothing. */
function sourceChip(r, o, compact) {
  const xr = sourceRoomOf(o);
  /* the compact row says the same thing in fewer characters, because on that row
     the characters are competing with the item's own title (round 7 D2) */
  if (xr) return `<span aria-hidden="true">·</span><button class="xroom" data-jump="${esc(o.sourceMsg || "")}" data-jumproom="${esc(xr)}"` +
                 ` title="The source of this item is in #${esc(xr)}" data-why="the source of ${esc(glyphOf(o))} ${esc(o.id)}, which #${esc(r.name)} owes you">` +
                 `${compact ? "" : "source in "}#${esc(xr)} →</button>`;
  if (!o.sourceMsg) return "";
  /* the time already appears in the facts beside this, so the link is the link */
  return `<span aria-hidden="true">·</span><button class="lnk" data-jump="${esc(o.sourceMsg)}">${compact ? "source →" : "jump to source →"}</button>`;
}

function pinCard(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("article");
  el.className = "acard" + (g === "◆" ? " gate" : "") + (o.fresh ? " rise" : "");
  const facts = (o.facts || []).map(voiced).join(" · ");
  el.innerHTML =
    `<div class="g" aria-hidden="true">${g}</div>
     <div>
       <div class="ttl"><span class="${isClaim(o) ? "claim" : ""}">${voiced(pinTitleFrag(o))}</span></div>
       <div class="why">${esc(whyOf(r, o))}</div>
       <div class="foot">
         <div class="mt">${facts}${sourceChip(r, o)}</div>
         <div class="acts">${pinActions(o)}</div>
       </div>
     </div>`;
  wireActions(el, o);
  return el;
}

/* turn-17 compression: still visible, still glyphed, still one click to act */
function pinCompact(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "acomp";
  const primary = pinActions(o, true);
  const xr = sourceRoomOf(o);
  /* three flexible things, three tracks (D2). The facts are the only part of
     this row that is also somewhere else, so they are the only part that gives
     way: the title and every CONTROL on the row — the cross-room chip included,
     which is why it sits with the action and not with the prose — keep tracks
     that cannot be shrunk into illegibility. */
  const facts = (o.facts || []).slice(0, xr ? 1 : 2).map(voiced).join(" · ");
  el.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <button class="ct" data-open="${esc(o.id)}" title="Expand this item">${voiced(pinTitleFrag(o))}</button>
     <span class="mt">${facts ? `<span class="fx">${facts}</span>` : ""}</span>
     <span class="ac">${xr ? sourceChip(r, o, true) : ""}${primary}</span>`;
  /* the compact row is REPLACED by the expanded card, so its own key is gone;
     the successor is the card's first action, which is what the reader opened
     the row to reach, then the item's line in the lens (D3) */
  el.querySelector("[data-open]").addEventListener("click", () => {
    S.ui.pinOpen = o.id;
    focusOn(`#pin .acard .acts button`, `#pin .acard .mt button`, `[data-lens-obj="${o.id}"]`);
    render();
  });
  wireActions(el, o);
  return el;
}

/* NO DEAD ATTENTION ITEMS. Every pending decision offers the bound composer,
   whether or not it ever carried one-click options; reopening one that had
   options keeps them, and reopening one that never had any mints the single
   honest option there is — re-affirming the statement already on the record.
   checkAttentionInvariant() shouts if this ever returns nothing. */
function pinActions(o, primaryOnly) {
  let acts = [];
  if (o.kind === "decision") {
    acts = (o.options || []).map((opt, i) =>
      `<button class="btn ${i === 0 ? "amber" : ""}" data-opt="${i}" title="${esc(opt.statement)}">${esc(opt.label)}</button>`);
    acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
  } else if (o.kind === "commitment") {
    /* only the person who owes it can sign it off (round 4 D5). When a
       commitment that is not yours ends up owed to you, the honest actions are
       the ones you can actually take: say why in your own words, or leave it. */
    acts = commitmentOwner(o) === S.me
      ? [`<button class="btn sm" data-fx="signed">Mark signed off</button>`,
         `<button class="btn ghost sm" data-fx="resched">Reschedule</button>`]
      : [`<button class="btn sm" data-bind="1">Answer in your own words →</button>`];
  } else if (o.kind === "question") {
    /* the control is only offered when the card actually carries an answer to
       record — same rule as reassignment, for the same reason: the page does
       not word an answer on a human's behalf (round 5 D2). */
    acts = o.answerOption
      ? [`<button class="btn sm" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer — ${esc(o.answerOption.label)}</button>`]
      : [`<button class="btn sm" data-bind="1">Answer in your own words →</button>`];
    /* the page does not invent a name to hand a question to */
    if (o.reassignTo) acts.push(`<button class="btn ghost sm" data-fx="reassign">Ask ${esc(o.reassignTo)} instead</button>`);
    else if (o.answerOption) acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
  } else {
    /* anything else that ends up owed still gets a way out */
    acts = [`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`];
  }
  return primaryOnly ? (acts[0] || "") : acts.join("");
}

function wireActions(el, o) {
  el.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    const opt = o.options[Number(b.dataset.opt)];
    answerDecision(o.id, { origin: "chosen", statement: opt.statement, label: opt.label, agrees: !!opt.agrees },
      opt.synthesized
        ? `one-click re-affirmation · the statement already on the record, recorded again verbatim · ${S.me} chose it, the page worded it · no model in the path`
        : `one-click answer · reversible gate · the card's statement recorded verbatim · ${S.me} chose it, the page worded it · no model in the path`);
  }));
  const bind = el.querySelector("[data-bind]");
  if (bind) bind.addEventListener("click", () => bindComposer(o.id));
  el.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(o.id, b.dataset.fx)));
  el.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jump, b.dataset.jumproom, b.dataset.why)));
}

const FILTER_LABEL = { need: "NEED YOU", change: "CHANGES", discussion: "DISCUSSION", routine: "ROUTINE" };

function renderFeed() {
  const r = room();
  const feed = $("feed");
  const keepTop = feed.scrollTop;
  feed.innerHTML = "";
  feed.classList.toggle("filtered", !!S.ui.feedFilter);

  /* two dividers, never one: the absence window (frozen at return) and whatever
     has landed since. They are different groups with different labels and
     separately-scoped chips, which is what stops your own post-return typing
     from being reported back to you as something you missed. */
  const cursorI = idx(r, r.seenAfter);
  const absStartI = idx(r, r.absenceFrom);      // pinned: marking seen never moves it
  const returnI = idx(r, r.absenceEnd);
  const absence = hasAbsenceGroup(r);
  let routineBuffer = [];

  const flushRoutine = () => {
    if (!routineBuffer.length) return;
    feed.appendChild(routineStrip(r, routineBuffer));
    routineBuffer = [];
  };

  r.messages.forEach((m, i) => {
    if (absence && i === absStartI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "absence")); }
    if (i === returnI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "return")); }
    if (m.routine) { routineBuffer.push(m); return; }
    flushRoutine();
    feed.appendChild(messageRow(r, m));
  });
  flushRoutine();
  if (cursorI === r.messages.length - 1) feed.appendChild(sylDivider(r, "seen"));
  feed.scrollTop = keepTop;
}

function messageRow(r, m) {
  const g = msgGlyph(r, m);
  const o = linkedObject(r, m);
  const cls = msgClass(r, m);
  const seen = idx(r, m.id) <= idx(r, r.seenAfter);
  const row = document.createElement("div");
  row.className = ["mrow", gclass(g), m.system ? "sys" : "", m.actor === S.me ? "me" : "",
                   seen ? "dim" : "", matchesFilter(r, m) ? "hit" : "",
                   S.ui.jumpTo === m.id ? "tgt" : "", m.fresh ? "rise" : ""].filter(Boolean).join(" ");
  row.dataset.msg = m.id;
  row.dataset.cls = cls;
  row.dataset.origin = m.origin || "seeded";

  let inner = "";
  if (m.replyTo) {
    const t = msg(r, m.replyTo);
    if (t) inner += `<span class="mreply">↩ ${esc(t.actor)} ${esc(t.t)} · <span class="quoted" data-quoted="msg:${esc(t.id)}" data-voice="human">${esc(plain(t.body).slice(0, 60))}</span></span>`;
  }
  /* the dotted treatment is derived from the object's epistemic state, not from
     the glyph — so a proposal that is ALSO a gate renders ◆ and dotted.
     `data-voice` says who authored the characters inside: a human's own words
     are exempt from the page-integrity rules that police what the PAGE writes
     (stray quotation marks, `undefined` in a record). A row the page authored
     on a human's behalf is 'system', not 'human' — that is the whole of D3. */
  const voice = (!m.system && (m.origin === "typed" || m.origin === "seeded")) ? "human" : "system";
  const claimWrap = msgIsClaim(r, m);
  inner += `<span class="${claimWrap ? "claim" : ""}" data-voice="${voice}">${bodyHtml(m.body)}</span>`;
  if (m.note) inner += `<span class="mnote">${esc(m.note)}</span>`;
  if (o && !m.sysFor) inner += objectTag(r, m, o);
  /* A TRANSITION ROW GETS A WAY INTO WHAT IT REPORTS ON (round 7 D7). Round 7
     declared `[data-msg="…"] .tag` and `[data-msg="…"] button` as the focus
     successors of every write, and a transition row rendered neither — no tag,
     because objectTag() is skipped for `sysFor` rows, and no Reply, because
     system rows do not get one. So two thirds of the declared chain could never
     apply and focus always fell through to the lens. The honest fix is not to
     delete the declaration: it is that a row saying "commitment K2 · rescheduled
     by lars" had no route to K2's receipt, which is the one thing a reader wants
     from it. The tag is DELIBERATELY STATELESS — this row's glyph is frozen at
     the state the transition landed in (round 4 D6), so a tag re-deriving the
     object's current state would contradict the row it sits on. */
  else if (m.sysFor && o) inner += sysTag(r, m, o);

  row.innerHTML =
    `<div class="t">${esc(m.t)}</div><div class="g" aria-hidden="true">${g}</div><div class="a">${esc(m.actor)}</div>
     <div class="m">${inner}<div class="acts">${rowActions(r, m, o)}</div></div>`;

  row.querySelectorAll("[data-receipt]").forEach(b => b.addEventListener("click", () => openReceipt(b.dataset.receipt, b.dataset.rcroom)));
  row.querySelectorAll("[data-reply]").forEach(b => b.addEventListener("click", () => startReply(m.id)));
  row.querySelectorAll("[data-verify]").forEach(b => b.addEventListener("click", () => { S.ui.verifying = b.dataset.verify; render(); focusVerify(); }));
  row.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(b.dataset.obj, b.dataset.fx)));
  row.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.pinroom) switchRoom(b.dataset.pinroom, true);
    S.ui.pinOpen = b.dataset.pin; render(); scrollIntoView($("pin"), "nearest");
  }));

  if (o && S.ui.verifying === o.id) row.appendChild(verifyBox(o));
  return row;
}

function plain(body) { return body.map(s => typeof s === "string" ? s : (s.code || s.at || s.h || s.text || "")).join(""); }

/* the tag on a row is a render of the object's *current* state. Reopen an
   object and the historical row that settled it re-renders here — glyph,
   tag text and tone all downgrade together. (Round-1 defect B2.) */
/* the transition row's route into the object it reports on. It states no state:
   the row's own glyph already records the state this transition landed in, and
   the receipt is where the current one lives. */
function sysTag(r, m, o) {
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  return `<button class="tag" data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}>` +
         `the receipt for ${esc(o.id)}${home ? " · in #" + esc(home) : ""} →</button>`;
}

function objectTag(r, m, o) {
  const g = glyphOf(o);
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  const rc = `data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}`;
  const where = home ? ` · in #${esc(home)} →` : "";

  /* ANSWER-ROW IDENTITY. Exactly one message — the one whose id is o.answerMsg
     — may carry the resolves/answer-bound tag, and only while the object is
     actually settled. Every other answer-bound row to the same object is a
     historical answer and says so, with the time it stopped being the answer.
