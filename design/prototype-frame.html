 * own `room` is handed, so the words and the destination cannot disagree.
 * ------------------------------------------------------------------------ */
function routeHome(room) { return room ? `is in #${room} →` : "is still in the room →"; }

/* a message's glyph is derived from the object it carries — never written down.
   When that object changes (accepted, reopened, verified), this row changes. */
function msgGlyph(r, m) {
  const o = linkedObject(r, m);
  if (!o) return "·";
  /* A TRANSITION ROW WEARS THE TRANSITION'S GLYPH, NOT THE OBJECT'S (round 4 D6).
     A system row that records "accepted → proposed · reopened" is a record of a
     downgrade. Deriving its glyph from the object's PRESENT state made that row
     turn green again the moment the object was re-accepted, so the permanent
     record of a downgrade rendered ✓. The glyph is frozen at the instant the
     transition is written (appendSystem) and never moves again — which is the
     whole point of a record. Content rows still re-derive live: reopen an object
     and the row that carried the claim still downgrades with it (round-1 B2). */
  if (m.tglyph) return m.tglyph;
  /* ANSWER-ROW IDENTITY (round 2 blocker 2): only the message whose id is the
     object's CURRENT answerMsg may wear the settled treatment. Every earlier
     answer to the same object is a superseded answer and renders as one, no
     matter what state the object is in now. */
  if (m.boundTo) {
    if (o.answerMsg !== m.id) return "~";
    return (o.verification === "accepted" || o.verification === "verified") ? "✓" : "~";
  }
  return glyphOf(o);
}
/* the dotted claim treatment, per row: an answer that is no longer the answer
   is a claim about what was once decided. */
function msgIsClaim(r, m) {
  const o = linkedObject(r, m);
  if (!o) return false;
  if (m.tglyph) return !!m.tclaim;          // frozen with the glyph, same reason
  if (m.boundTo && o.answerMsg !== m.id) return true;
  return isClaim(o);
}

/* ---------------------------------------------------------------------------
 * NO OPTIONAL FIELD REACHES A RENDERED RECORD UNGUARDED (round 4 D2).
 *
 * `was due ${o.due}` on a commitment with no `due` printed "was due undefined"
 * into a permanent system row. Every optional field on a record-writing path
 * now goes through this: a missing value is STATED, in words, never printed as
 * the name of a JavaScript value. checkRecordTextInvariant() asserts on every
 * paint that no page-authored string on screen contains undefined/null/NaN, so
 * a future template literal that forgets is caught by what it painted.
 * ------------------------------------------------------------------------ */
function fieldOr(v, fallback) {
  if (v === undefined || v === null) return fallback;
  if (typeof v === "number" && !isFinite(v)) return fallback;
  const s = String(v).trim();
  return s === "" ? fallback : v;
}

/* ===========================================================================
 * A DURATION IS A RELATION BETWEEN TWO TIMESTAMPS, NEVER A FIELD (round 17 D1)
 *
 * `Q1.openFor: "3h"` was a seeded string. The record said the question was
 * raised at 09:11, its one history entry said 09:11, its one provenance entry
 * said 09:11, its source message said 09:11 and `S.now` said 09:12 — and five
 * surfaces said `open 3h`, which is a moment inside the absence window where
 * this room has no events at all. The record did not merely fail to support the
 * number, it excluded it.
 *
 * WHY EVERY INSTRUMENT ON THIS PAGE WAS SILENT. The chip was
 * `{ read: "verification", post: " 3h" }` — a LITERAL PASTED ONTO A GENUINE
 * RECORD READ. say()'s point-read mutation flips the verification, the sentence
 * moves, and the read is therefore provably load-bearing; the suffix riding
 * along beside it never budges and nothing asks where it came from. The number
 * rule then filed `open #h` as `form:duration`, "a declared non-count shape", so
 * the coverage artifact checked that a duration LOOKED like a duration and
 * nothing compared it to the timestamp it is a duration FROM.
 *
 * So a duration stops being a shape and becomes a derivation. `elapsed()` is the
 * only thing on this page that produces one, and IT IS HANDED THE NAME OF THE
 * FIELD IT MEASURES FROM RATHER THAN THE VALUE — `elapsed(o, "askedAt")`, not
 * `elapsed("09:11", "09:12")`. That distinction is the whole check. A
 * measurement that copied the two strings could only ever prove that the
 * subtraction was done correctly ONCE, against operands the mint chose; a
 * measurement that names its operands sends the checker back to the record for
 * them on every paint, which is what "compared against the timestamp it claims
 * to measure" has to mean. It is also what makes a duration minted at boot and
 * painted ten minutes later a REPORTED defect rather than an invisible one.
 *
 * While a sentence is minting, `elapsed()` writes what it was asked into that
 * sentence's own measurement log — exactly the way a history query writes into
 * `SAYING`. readNumbers() then re-reads both fields and re-derives, on every
 * paint; a duration with no measurement behind it, and a measurement whose
 * answer has moved out from under the words, are both reported.
 *
 * `b < a` is not an error the page may paper over: a duration cannot run
 * backwards, so `elapsed()` returns null and the caller has to say what the
 * record supports instead of printing a number. Same for an endpoint this page
 * cannot subtract — `22 Jul`, `yest. 16:10`, `Thu 31 Jul`. The page does not
 * guess at a calendar it does not model; it says when, not how long ago.
 * ======================================================================== */
function clockMinutes(v) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(v == null ? "" : v).trim());
  if (!m) return null;
  const h = Number(m[1]), mi = Number(m[2]);
  return (h > 23 || mi > 59) ? null : h * 60 + mi;
}
/* the measurement log of the say() currently minting, or null outside one */
let MEASURING = null;
/* the two ENDPOINTS of a measurement, read out of the record by name. `to` is
   null for "now", which is `S.now` and is a value the page moves — reading it
   here rather than copying it is what makes a stale duration visible. */
function elapsedEnds(o, fromField, toField) {
  return [o ? o[fromField] : null, toField ? (o ? o[toField] : null) : S.now];
}
function elapsedOf(a, b) {
  const x = clockMinutes(a), y = clockMinutes(b);
  if (x == null || y == null || y < x) return null;
  const d = y - x, h = Math.floor(d / 60), m = d % 60;
  return d < 60 ? d + "m" : h + "h" + (m ? " " + m + "m" : "");
}
function elapsed(o, fromField, toField) {
  const ends = elapsedEnds(o, fromField, toField);
  const text = elapsedOf(ends[0], ends[1]);
  if (MEASURING) MEASURING.push({ owner: o, from: fromField, to: toField || null, text: text });
  return text;
}
/* the same question, asked again from outside the mint, against the record as it
   stands now. This is the comparison the round exists for. */
function elapsedAgain(mm) {
  const ends = elapsedEnds(mm.owner, mm.from, mm.to);
  return { text: elapsedOf(ends[0], ends[1]), a: ends[0], b: ends[1] };
}
/* how long an unanswered question has been open, said in the receipt's state
   line and nowhere else. A record with no subtractable ask time says when it
   was asked; it does not guess how long ago that was. */
function openClause(o) {
  const d = elapsed(o, "askedAt");
  return d == null ? `open since ${fieldOr(o.askedAt, "a time the record does not keep")}` : "open " + d;
}
/* every duration-shaped run of characters, including the compound `1h 5m` form
   `elapsed()` produces. Used to find the ones no measurement accounts for. */
const DURATION_RE = /\b\d+\s*(?:d|h|m|s|ms|day|days|hour|hours|min|mins|minute|minutes|week|weeks|month|months)\b(?:\s+\d+\s*(?:d|h|m|s|ms|day|days|hour|hours|min|mins|minute|minutes|week|weeks|month|months)\b)*/gi;

/* --- TWO SENTENCES ARE THE SAME SENTENCE (round 6 D1) ---------------------
 * The record compares statements in several places — an answer against the
 * proposal it replaces, a correction's before against its after — and every one
 * of them wants the same question answered the same way. Whitespace is not
 * content, so it is normalised; nothing else is. Case and punctuation are part
 * of what somebody wrote and are never folded away.
 * ---------------------------------------------------------------------- */
/* "a unverified claim" was the one prose complaint an otherwise careful critic
   had about this page (round 11 minor). The article belongs to the word the
   RECORD produced, so it is decided from that word rather than typed in front
   of it — the same reason `enumText` exists. */
function an(word) { return (/^[aeiou]/i.test(String(word)) ? "an " : "a ") + word; }

function normText(v) { return String(voicedText(v) == null ? "" : voicedText(v)).replace(/\s+/g, " ").trim(); }
function sameText(a, b) { return normText(a) === normText(b); }

/* an enum value is snake_case in the data and prose on screen. Round 6 applied
   the prettifier to one side of an arrow only and rendered
   `SELF-REPORTED → SELF_REPORTED`; one function means both sides always agree.
   ROUND 8 D2: the correction-chain header was fixed for exactly that and the
   PERMANENT CONVERSATION ROW was not — `commitment K2 · self_reported →
   self_reported · reopened by lars` went into the feed, which this file's own
   comments call the record. A row is prose, not a heading, so the prettifier
   has both cases: `enumText` is the sentence form and `enumLabel` is the
   heading form OF THE SAME STRING, so neither can drift from the other, and
   checkRenderedRecordInvariant() proves no raw enum value reaches the reader
   through either. */
function enumText(v) { return String(fieldOr(v, "state not recorded")).replace(/_/g, "-"); }
function enumLabel(v) { return enumText(v).toUpperCase(); }

/* WHAT A SETTLED RECORD IS SETTLED BY — read off the verification value that
   was standing, never guessed from the object's kind (round 11 D3). A
   commitment can be settled by a deploy record exactly as a claim can, and
   round 10's reopen told K0 — verified by `checks`, never signed off by anyone
   — that "the prior sign-off preserved on the record". That is a claim about
   HOW it settled, minted from WHETHER it settled. One name per state, so the
   word and the value cannot drift. */
function preservedName(v) {
  return { self_reported: "sign-off", verified: "verification", accepted: "acceptance",
           unverified: "answer", open: "answer", proposed: "proposal" }[v] || enumText(v) + " state";
}

/* ===========================================================================
 * THE STATEMENT OF RECORD (round 7 D1 — and rounds 6 D1 and 4 D7 before it)
 *
 * Three rounds, three paths, one class: THE RECORD ASSERTED SOMETHING THAT DID
 * NOT HAPPEN. Round 4 compared an option's wording to a proposal's and called
 * agreement a contradiction. Round 6 minted an option without `agrees` and put
 * two identical sentences either side of an arrow. Round 7 computed "did it
 * change" against `prior.body` — the SYSTEM ROW'S DISPLAY SENTENCE, "lars
 * chose: Cut over Friday" — so `changed` was always true and the correction
 * chain's `from` was a string the record had never held.
 *
 * Each fix was correct about the relationship it checked. Each was blind to
 * WHERE ITS OPERANDS CAME FROM. So the operands stop being computed at the
 * comparison site and become a thing the object keeps:
 *
 *   1. EVERY RECORDED FIELD HAS A HISTORY. `amend()` writes the field, reads
 *      back what the object now holds, appends it, and returns the two adjacent
 *      recorded values — or null when nothing moved. There is no other way to
 *      change a recorded field, and checkRecordInvariant() proves it by
 *      comparing each field against the last value its own history contains.
 *
 *   2. A CORRECTION'S BEFORE AND AFTER CAN ONLY COME FROM THERE. A `change` is
 *      not something a caller can construct: amend() marks what it mints and
 *      checkCorrectionInvariant() refuses any entry carrying a change without
 *      that mark. `prior.body`, an option's label, a system row's sentence —
 *      every display string on the page — is now STRUCTURALLY unable to reach
 *      a correction chain, rather than merely absent from one by convention.
 *
 *   3. AND THE OPERANDS ARE VALIDATED, NOT JUST COMPARED. An entry whose `from`
 *      is not a value this object ever held is a defect even when `from` and
 *      `to` differ — which is exactly what round 7 shipped, and exactly what
 *      round 7's own check could not see, because it compared two strings and
 *      both of them were real strings.
 * ======================================================================== */

/* the fields this record keeps a history of. `get` reads the object; `set`
   writes it — one operation, so a field cannot move without being recorded and
   cannot be recorded without moving. `set: null` marks a DERIVED field: its
   value is a function of others, so amend() only reads it back.

   AND EACH FIELD DECLARES THE WORDS THE PAGE TALKS ABOUT IT WITH (round 11).
   `words` is not a phrasing list and it is not a denylist of sentences: it is
   the vocabulary of the FIELD, kept beside the field's own get/set so that "the
   surfaces are derived from the object's shape" is a fact about the code rather
   than a claim in a comment. It is what lets a checker notice that "still
   unanswered" is a sentence about `answer` — and refuse it when the transition
   that wrote it never read `answer`. A word missing from a list here costs a
   CATCH; it can never grant a sentence an exemption, because nothing consults
   `words` to decide that a sentence is allowed. */
const RECORDED = {
  statement:    { get: o => o.text,                                        set: (o, v) => { o.text = v; },
                  words: ["statement", "proposal"] },
  answer:       { get: o => (o.answerText == null ? null : o.answerText),  set: (o, v) => { o.answerText = v; },
                  words: ["answer", "answers", "answered", "unanswered"] },
  verification: { get: o => o.verification,                                set: (o, v) => { o.verification = v; },
                  /* AND THE GLYPH IS A WORD FOR A STATE (round 11, raised by the codex
                     reviewer). `~` and `green` are how this page says "self-reported" and
                     "checked by something other than the claimant" in one character, and a
                     vocabulary that omits them omits the shortest sentences on the page. */
                  words: ["verification", "verified", "unverified", "sign-off", "signed off",
                          "self-reported", "accepted", "acceptance", "checked", "open", "proposed",
                          "~", "green"] },
  due:          { get: o => (o.due == null ? null : o.due),                set: (o, v) => { o.due = v; },
                  words: ["due", "due date"] },
  assignee:     { get: o => (o.assignee == null ? null : o.assignee),      set: (o, v) => { o.assignee = v; },
                  words: ["assignee", "assigned", "reassigned"] },
  /* how the line under this object was read — a claim someone thought out loud,
     or a call. D1 was amended from one to the other before this window opened. */
  reading:      { get: o => (o.reading == null ? null : o.reading),        set: (o, v) => { o.reading = v; },
                  words: ["reading"] },
  /* "is this settled right now" — the fact a reopen changes when the
     verification enum does not (round 6's SELF-REPORTED → SELF-REPORTED) */
  settlement:   { get: o => (o.verification === "accepted" || o.verification === "verified" || !!o.resolvedAt) ? "settled" : "pending",
                  set: null,
                  words: ["settled", "settlement", "pending", "resolved"] }
};

/* ===========================================================================
 * A SENTENCE THAT QUANTIFIES OVER A HISTORY IS PRODUCED BY A QUERY ON IT
 * (round 11 — the rule nobody had written, and all four of round 10's
 * high-severity defects were instances of it)
 *
 * Every rule before this one governed THE PAIR THAT MOVED: from/to, validated
 * operands, a header minted by the branch that compared. Nothing governed a
 * claim about a field's HISTORY. "again", "still", "preserved", "nobody has",
 * "nothing other than", "already", "throughout" are quantifiers over an entire
 * field history, and round 10 shipped four of them written from the two values
 * at the ends of it — or from nothing at all:
 *
 *   "the question itself is unchanged and still unanswered"   ← read: assignee
 *   "nothing other than the claimant has checked it"          ← read: nothing
 *   "the prior sign-off preserved on the record"              ← asked: settlement
 *   "it is a unverified claim again"                          ← asked: nothing
 *
 * The record held an answer, a deploy record had checked it, nobody had ever
 * signed it off, and it had never been unverified. Four sentences, four
 * different fields, one missing rule.
 *
 * THE RULE. A sentence quantifying over a field's history is produced by a
 * QUERY on that history — `ever` / `before` / `last` — not by comparing the two
 * values at the ends of it. And it may only quantify over a field the
 * transition actually READ, which is structural rather than aspirational: a
 * query exists only on a view, a view exists only because reads() took one, so
 * a branch cannot ask about a field its transition never opened.
 *
 * THE THREE FAMILIES, and why the distinctions are not cosmetic — each one is
 * calibrated to what would actually answer the question honestly:
 *
 *   WHOLE-HISTORY — `again`, `ever`, `never`. Nothing but a query answers
 *     these: "again" asks whether the record has stood here BEFORE, and the two
 *     values at the ends of a transition cannot know. Round 10 appended it
 *     unconditionally and told a record reading ["verified","unverified"] that
 *     it was unverified *again*.
 *   PAST — `prior`, `preserved`, `earlier`, `before`, `nobody has`,
 *     `nothing … has`, `nothing other than`. These reach behind the current
 *     value, so they are answered by a query OR by a read at a point that is
 *     not the end of the history — reading the past is reading the past. Round
 *     10's D2 and D3 read only the end and asserted about the whole of it.
 *   CONTINUITY — `still`, `already`, `throughout`, `unchanged`, `no longer`,
 *     `stays`. These span this transition, so a read of the field at either end
 *     answers them — but a read of some OTHER field does not, which is the
 *     whole of round 10's D1: "still unanswered" written from two assignee
 *     views, beside a record holding an answer.
 *
 * WHAT THIS IS AND IS NOT. The token lists are a DETECTOR. They decide which
 * sentences must show their working; they never decide that a sentence is
 * allowed. A sentence backed by a query passes whatever words it uses, so the
 * list cannot be routed around by rephrasing, and a token missing from it costs
 * a catch rather than granting an exemption — the opposite polarity from the
 * denylist of phrasings CONVENTIONS rejects. The other half of the pair,
 * `RECORDED[f].words`, is declared on the data's own shape.
 * ======================================================================== */
const WHOLE_QUANT      = ["again", "ever", "never"];
const PAST_QUANT       = ["prior", "preserved", "earlier", "before", "nobody has", "nobody had",
                          "nobody was", "no one has", "nothing other than", "nothing has",
                          "nothing had", "nothing was"];
const CONTINUITY_QUANT = ["still", "already", "throughout", "unchanged", "no longer", "stays",
                          "remains", "remain", "keeps", "kept"];

/* a word, as a word: `"reopened".indexOf("open")` is 2 and that is how round
   10's chip checker cried wolf on every render between answering and
   reassigning a question. Hyphens are part of a token (`self-reported` is one
   word, and `reported` alone is not it). */
function hasToken(text, token) {
  const t = String(token).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
  return new RegExp("(^|[^a-z0-9-])" + t + "([^a-z0-9-]|$)", "i").test(String(text));
}
/* AND A QUANTIFIER BINDS INSIDE ITS OWN CLAUSE. `reported 4.7% of sessions
   still on legacy tokens — unverified` is two statements, and "still" is about
   the sessions, not about the verification that happens to be named after the
   dash. Asking the question of a whole paragraph is how a checker starts crying
   wolf, which is the failure mode round 10's chip clause shipped and this
   file's own doctrine names. */
/* AND `·` IS THE PAGE'S HOUSE STYLE, NOT A FULL STOP (round 13, D9). The
   splitter treated `·` as a clause boundary, and `·` is this page's separator
   INSIDE one statement: `superseded answer · replaced 09:17 · kept on the
   record` is one sentence about one field, and splitting it put `answer` and
   `kept` in different clauses so the pairing rule could not see them together.
   Any sentence written in the page's own style was exempt from the rule by
   construction — which is a hole the exact size of the page's prose.

   So `·` is a SOFT boundary: each middot-separated fragment is offered to the
   rule on its own, and the whole run is offered as well — BUT ONLY WHEN A
   FRAGMENT CARRIES A QUANTIFIER AND NAMES NO FIELD OF ITS OWN. That condition
   is the whole of it, and it is the difference between an instrument and a wolf.
   A quantifier binds to the nearest field it can see. `superseded answer ·
   replaced 09:17 · kept on the record` has "kept" in a fragment that names
   nothing, so "kept" is about the fragment beside it and the run has to answer
   as one. The receipt's state line — `no due date on record · something other
   than the claimant checked it before` — has "before" sitting beside
   `verification`'s own word in its own fragment, so it binds there, and joining
   the run would pair a quantifier about the verification with the vocabulary of
   `due`: exactly the cross-talk this split was written to prevent. Measured, not
   argued: the first version of this fix widened every run unconditionally and
   the sequence enumerator went from one violation class to nine, five of them
   sentences that were telling the truth.

   The hard boundaries — an em dash, a semicolon, a comma, a full stop — still
   split unconditionally, which is what keeps round 10's wolf away: `reported
   4.7% of sessions still on legacy tokens — unverified` is two statements and
   stays two. */
const ALL_QUANT = WHOLE_QUANT.concat(PAST_QUANT, CONTINUITY_QUANT);
function hasQuant(t) { return ALL_QUANT.some(q => hasToken(t, q)); }
function namesAField(t) { return Object.keys(RECORDED).some(f => (RECORDED[f].words || []).some(w => hasToken(t, w))); }
function clausesOf(text) {
  const out = [];
  String(text).split(/\s*[—;]\s*|,\s+|\.\s+/).filter(s => s.trim()).forEach(hard => {
    const parts = hard.split(/\s*·\s*/).filter(s => s.trim());
    parts.forEach(p => out.push(p));
    if (parts.length > 1 && parts.some(p => hasQuant(p) && !namesAField(p))) out.push(hard);
  });
  return out;
}
/* AND THE RECORD'S OWN WORDS ARE NOT THE PAGE'S SENTENCE. X1's option reads
   "Opaque-token issuance stays open until the 14 Aug freeze" — record it and the
   statement of record contains "stays" and "open", so a rule about what the PAGE
   writes would fire on a value the record holds. That is round 5's defect
   exactly: CONVENTIONS already says the page-integrity rules are about the
   page's own text, and this is the same rule needing the same exemption. The
   recorded value is removed; whatever the page wrote AROUND it is still read.
   ONLY MULTI-WORD VALUES ARE REMOVED. A state name is a single token, and
   `unverified` on screen is the PAGE's word for a state, not a sentence the
   record composed — removing it would have handed the rule a hole exactly the
   size of the vocabulary it polices. Content the record holds — a statement, an
   answer, a due date — is what a page can only be quoting. */
function pageWordsOf(o, text) {
  let t = text;
  Object.keys((o && o.recorded) || {}).forEach(f => (o.recorded[f] || []).forEach(e => {
    if (typeof e.value === "string" && /\s/.test(e.value.trim())) t = t.split(e.value).join(" ");
  }));
  return t;
}

/* a minted sentence's own parts, kept apart. `said` is often an array — the
   receipt's state line is five separate strings the render joins with a middot
   — and running them together makes one long word out of two sentences, which
   is how `no due date on recordnothing other than the claimant has checked it`
   would have hidden a quantifier from a test that matches words as words. */
function quantText(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(quantText).filter(s => s).join(" · ");
  if (isStated(v)) return quantText(v.said);
  return String(v.h != null ? v.h : v);
}

/* the mark amend() and stated() put on what they mint.
   WHAT THIS DEFENDS AGAINST, PRECISELY (round 8 minor): not page code. Anything
   running in this page can read `MINTED` by name and can simply call `amend()`,
   and no token stops it — a page cannot keep a secret from itself. What the
   mark does is make the record's before/after values UNREACHABLE FROM A
   LITERAL: a fixture entry, a hand-composed sentence, a value copied out of a
   rendered row cannot acquire it, because it is non-enumerable (so it does not
   survive a clone or a JSON round-trip) and regenerated per load (so it cannot
   be written down in the source). Every instance of this defect class arrived
   as a literal beside the record rather than a value out of it, and that is the
   shape the mark refuses. */
const MINTED = "minted:" + Math.random().toString(36).slice(2) + Date.now().toString(36);

/* strings compare as text (whitespace normalised, nothing else folded); every
   other value compares as itself, so `null` and `"null"` are not the same fact */
function sameValue(a, b) {
  if (a == null || b == null) return a == null && b == null;
  if (typeof a === "string" && typeof b === "string") return sameText(a, b);
  if (typeof a === "string" || typeof b === "string") return false;
  return a === b;
}

function recordOf(o, field) {
  const all = o.recorded || (o.recorded = {});
  if (!all[field]) all[field] = [{ value: RECORDED[field].get(o), tm: null, by: null, how: "on the record when this room loaded" }];
  return all[field];
}
/* every object's every recorded field starts with the value it was seeded
   holding. This runs BEFORE the first render and before any transition, because
   a history that starts at the first amendment has no "before" to offer and the
   first correction would compare against the value it just wrote.
   A SEEDED CORRECTION IS STILL A CORRECTION: the fixture's chains describe
   amendments that happened before this window opened, so their before and after
   are REPLAYED into the field's history, earliest first, and their `change` is
   minted from it exactly like a live one. There is no seeded exemption — an
   exemption is where this defect class has entered every single time. */
function seedRecord() {
  eachObject(o => {
    Object.keys(RECORDED).forEach(f => recordOf(o, f));
    const seeds = (o.corrections || []).filter(c => c.seed);
    const byField = {};
    seeds.forEach(c => (byField[c.seed.of] || (byField[c.seed.of] = [])).push(c));
    Object.keys(byField).forEach(f => {
      if (!RECORDED[f]) return console.error("[atrium invariant] a seeded correction names a field this record does not keep:", o.id, f);
      const h = recordOf(o, f);
      const loaded = h[h.length - 1].value;
      h.length = 0;
      h.push({ value: byField[f][0].seed.from, tm: null, by: null, how: "on the record before this window opened" });
      byField[f].forEach(c => h.push({ value: c.seed.to, tm: c.tm || null, by: c.who || null, how: "amended before this window opened" }));
      if (!sameValue(h[h.length - 1].value, loaded))
        h.push({ value: loaded, tm: null, by: null, how: "on the record when this room loaded" });
      byField[f].forEach((c, i) => {
        const change = { of: f, from: h[i].value, to: h[i + 1].value };
        Object.defineProperty(change, "minted", { value: MINTED, enumerable: false });
        c.change = change;
        /* AND ITS PAINTED BEFORE AND AFTER ARE READ OUT OF THAT HISTORY TOO
           (round 8 D1). The fixture supplies the NOTE — how the line was being
           read, which is a thing only a person knows — and never the value: the
           value on screen is the one at this entry's own index in the record,
           so a seeded chain cannot paint a before its own history contradicts
           any more than a live one can. */
        c.was = stated(o, [{ of: f, at: i }], v => recordedLabel(v.value) + (c.wasNote ? ` (${c.wasNote})` : ""));
        c.after = stated(o, [{ of: f, at: i + 1 }], v => recordedLabel(v.value) + (c.afterNote ? ` (${c.afterNote})` : ""));
        /* AND ITS HEADER TOO (round 9 D1b). The fixture supplies the VERB —
           "RETYPED", a thing only a person knows about their own edit — and the
           two states in it are read out of the same replayed history the body
           reads, so a seeded header cannot name a transition its own object
           never made any more than a live one can. */
        c.hd = stated(o, [{ of: f, at: i }, { of: f, at: i + 1 }], (a, b) =>
          c.hdVerb + " · " + String(recordedLabel(a.value)).toUpperCase() + " → " + String(recordedLabel(b.value)).toUpperCase());
      });
    });
    /* AND EVERY OTHER SENTENCE THE FIXTURE NARRATES THIS OBJECT WITH GOES
       THROUGH THE SAME READER (round 9 D1a/D1c). There is no seeded exemption —
       an exemption is where this defect class has entered every single time. A
       fixture line describes what happened before this window opened, so it
       asserts nothing about a value a recorded field holds NOW and declares no
       claims; what the mint buys is that `.hap`, the chain header and the
       receipt's note can be held to ONE rule with no "unless it is data" branch
       in it, and a live transition that declares no claims stands out against
       the same-tick clause below. */
    /* a seeded fact chip that states a recorded value declares WHICH field, and
       the value is read out of the record here — the fixture supplies only the
       words around it, exactly as its correction header supplies only the verb.
       A chip about something the record does not keep (a name, a confidence,
       "3 sources") stays a string and is held to the clause that refuses an
       unminted chip stating a recorded value. */
    o.facts = (o.facts || []).map(f => seedFact(o, f));
    /* AND A SEEDED SENTENCE THAT QUANTIFIES OVER A HISTORY ASKS THAT HISTORY
       (round 11). There is no seeded exemption — an exemption is where this
       defect class has entered every single time — so a fixture line ending in
       "nobody has been assigned" or "never checked against a bill" supplies the
       WORDS around the quantifier and the record supplies the quantifier
       itself, exactly as a seeded correction supplies only its verb and a
       seeded chip supplies only the field name. A fixture line with nothing to
       quantify stays a string. */
    o.history.forEach(h => {
      if (isStated(h.text)) return;
      if (h.asks) { h.text = stated(o, [h.asks.of], v => h.text + h.asks.say(v)); return; }
      h.text = stated(o, [], () => h.text);
    });
    if (o.note != null && !isStated(o.note))
      o.note = o.note.asks
        ? stated(o, [o.note.asks.of], v => o.note.text + o.note.asks.say(v))
        : stated(o, [], () => o.note);
    (o.corrections || []).forEach(c => { if (!isStated(c.hd)) c.hd = stated(o, [], () => c.hd); });
  });
}

/* ---------------------------------------------------------------------------
 * A FIXTURE FACT CHIP NAMES A RECORDED FIELD, AND EVERYTHING ELSE IN IT COMES
 * OUT OF THE RECORD TOO (round 17, D1, second half)
 *
 * The shape used to be `{ read, pre, none, post }`, and `pre`/`post` were free
 * strings glued either side of a genuine read. That is not a formatting
 * convenience, it is a hole in the instrument: `{ read: "verification",
 * post: " 3h" }` renders `open 3h`, flipping the verification moves the
 * sentence so say()'s point-read mutation is satisfied, and the three
 * characters that make the claim are attached to nothing. It hid for sixteen
 * rounds.
 *
 * So the shape is an ALLOWLIST of derivations, and there is no key that takes
 * arbitrary prose. Every one of these is a function of the record:
 *
 *   { read: F }                     the value of F, in words
 *   { read: F, none: N }            the words for a value the record does not hold
 *   { read: F, label: L }           L PREFIXES the value and may only use F's own
 *                                   vocabulary (RECORDED[F].words), so a label can
 *                                   name the field and cannot carry a fact
 *   { read: F, also: G, join: J }   the value of another field of THIS record,
 *                                   appended through a connective. `join` may
 *                                   hold no digits and no letters beyond a
 *                                   lower-case connective, so a fact cannot ride
 *                                   in on it; `also` must be a field the object
 *                                   actually has, and an absent one says so
 *   { read: F, when: { v: S } }     a gloss the VALUE selects. The value read is
 *                                   the key, so the clause cannot outlive the
 *                                   state it describes — and its words answer to
 *                                   checkVocabulary and checkQuantifiers like
 *                                   every other minted clause
 *
 * A key outside that list is refused and reported, so the next round cannot
 * re-open this by inventing another way to append characters. What this does
 * NOT do is judge the words inside `when` or `none` for truth — those are
 * seeded prose, minted, and held to the same sentence rules as any other
 * fixture line. What it forbids is prose with no record behind it AT ALL.
 * ------------------------------------------------------------------------ */
const FACT_KEYS = ["read", "none", "label", "also", "join", "when"];
function seedFact(o, f) {
  if (!f || typeof f !== "object" || Array.isArray(f) || !f.read) return f;
  if (!RECORDED[f.read]) { console.error("[atrium invariant] a seeded fact names a field this record does not keep:", o.id, f.read); return String(f.read); }
  Object.keys(f).forEach(k => {
    if (FACT_KEYS.indexOf(k) < 0)
      console.error("[atrium invariant] a seeded fact carries a key this page cannot derive from the record, so " +
        "whatever it holds is a literal riding along on a real read:", o.id, k, JSON.stringify(f[k]));
  });
  const words = RECORDED[f.read].words || [];
  if (f.label != null) String(f.label).split(/[^a-z-]+/i).filter(Boolean).forEach(w => {
    if (!words.some(x => x.toLowerCase() === w.toLowerCase()))
      console.error("[atrium invariant] a seeded fact's label says something that is not this field's own name — a " +
        "label may name the field it prefixes and nothing else:", o.id, f.read, JSON.stringify(f.label), w);
  });
  if (f.also != null) {
    if (f.join == null || !/^[ ·a-z]*$/.test(String(f.join)))
      console.error("[atrium invariant] a seeded fact joins two record reads with something that is not a " +
        "connective — a join carries no digits and no facts:", o.id, JSON.stringify(f.join));
    if (!(f.also in o))
      console.error("[atrium invariant] a seeded fact appends a field this record does not have:", o.id, f.also);
  }
  return stated(o, [f.read], v => (f.label || "") +
    (v.value == null ? (f.none || "nothing on the record") : enumText(v.value)) +
    (f.when && v.value != null && f.when[v.value] != null ? f.when[v.value] : "") +
    (f.also ? (f.join || " ") + fieldOr(o[f.also], "nothing on the record") : ""));
}

/* THE ONLY WAY A RECORDED FIELD CHANGES, AND THE ONLY SOURCE OF A `change`. */
/* the last object whose record a write path touched, and not yet reported to the
   reader. A toast raised while this is set is a sentence ABOUT that write, so
   checkToastInvariant() holds it to the record; a toast raised with nothing
   pending — "sent", "nothing is named on this question to hand it to" — is page
   copy about an action and asserts nothing about a recorded field. */
let AMENDED_PENDING = null;
function amend(o, field, value, meta) {
  const spec = RECORDED[field];
  dropFieldUniverse();          // a value the record did not hold a moment ago may hold it now
  AMENDED_PENDING = o;
  if (!spec) { console.error("[atrium invariant] amend() called for a field this record does not keep:", field, o && o.id); return null; }
  const h = recordOf(o, field);
  const from = h[h.length - 1].value;
  if (spec.set) spec.set(o, value);
  /* read BACK, never trust the argument: what the record says happened is what
     the object now holds, which for a derived field the caller cannot even name */
  const to = spec.get(o);
  if (sameValue(from, to)) return null;
  h.push({ value: to, tm: (meta && meta.tm) || S.now, by: (meta && meta.by) || null, how: (meta && meta.how) || null });
  const change = { of: field, from: from, to: to };
  Object.defineProperty(change, "minted", { value: MINTED, enumerable: false });
  return change;
}

function everHeld(o, field, v) {
  const h = (o.recorded || {})[field];
  return !!h && h.some(e => sameValue(e.value, v));
}
/* did this object go from `from` straight to `to`, with nothing recorded
   between them? That is what an arrow in a correction chain claims. */
function heldInSequence(o, field, from, to) {
  const h = (o.recorded || {})[field];
  return !!h && h.some((e, i) => i + 1 < h.length && sameValue(e.value, from) && sameValue(h[i + 1].value, to));
}
/* what a recorded value reads as in a sentence. Presentation only — it never
   travels into a `change`, which is the whole point of this section. */
function recordedLabel(v, none) { return v == null ? (none || "nothing on the record") : String(v); }

/* ===========================================================================
 * AND THE SENTENCE THE READER SEES IS AN ASSERTION TOO (round 8 D1)
 *
 * Four rounds, four layers of the same class. Round 4 fixed a VALUE. Round 6
 * fixed the GUARD that compared two values. Round 7 fixed where the guard's
 * OPERANDS came from. Round 8 shipped a chain entry whose stored `change` was
 * minted, provable and about `settlement` — beside a `was` that was a hardcoded
 * English sentence about `answer`:
 *
 *   painted   "Open question — nothing was on the record as its answer"  09:15
 *   record    answer: "…retention is 90 days…" held continuously from 09:13
 *   checked   change: settlement pending → settled            ← the other field
 *   errors    0
 *
 * The checker was right about everything it looked at and was looking at the
 * half of the entry nobody reads. A guarantee that covers the stored
 * representation and not the rendered one protects the data and lies to the
 * reader. So the painted operands become record reads as well:
 *
 *   stated(o, fields, phrase)  READS each named field out of this object's own
 *   history and hands the values to the phrase-writer. The sentence is a
 *   FUNCTION of what was read, so "nothing was on the record" cannot be written
 *   beside a record that holds something — the branch that says it is only
 *   reachable when the value read is absent.
 *
 * And it mints what it produces, exactly as amend() does, so a bare literal
 * cannot be painted as a before or an after at all. checkCorrectionInvariant()
 * refuses an entry whose operands carry no mint, re-reads every claim they
 * declare against the record, and cross-checks them against the entry's own
 * `change`; checkRenderedRecordInvariant() then proves the DOM is painting
 * those operands and not something else.
 * ======================================================================== */

/* one recorded field, as the record holds it at a named point in its history.
   `at` defaults to now — a caller reads BEFORE it amends, exactly as `priorDue`
   and `priorStatement` already do — and a seeded correction names its own
   index, because its before is a value from before this window opened. */
function fieldView(o, field, at) {
  const h = recordOf(o, field);
  const i = at == null ? h.length - 1 : at;
  const e = h[i] || h[h.length - 1];
  /* A QUERY IS A CLAIM, AND IT IS WRITTEN DOWN (round 11). A point read is
     recorded on the box as `{of, at, value}` and re-read by the checkers; a
     question about the whole history was answered and then thrown away, so
     nothing could re-ask it. Every query below is logged onto the say() that is
     minting, with the answer it gave, and checkQueries() asks the record the
     same question again on every render. */
  /* AND A QUERY THAT COULD NOT HAVE CHANGED THE SENTENCE DID NOT PRODUCE IT
     (round 11 self-review — the eighth door, as a class). "A query was run" is
     not "the sentence came from the query": `v.ever("verified"); return
     "nothing has checked it";` runs the query, logs it, satisfies every clause
     round 11 added, and prints the exact literal round 11's D2 was. Every layer
     of this class since r4 has been a guarantee about WHERE the operands came
     from, and each one was escaped by a branch that took the operands and
     ignored them. So say() re-runs its own phrase with each query's answer
     FLIPPED: if the sentence does not move, the query is decoration and the
     words beside it are a literal. This is the property both foreign lineages
     named as the residual at the end of round 10 — `say()` mints, it does not
     prove the phrase used what it was handed — and it is provable after all,
     by mutation rather than by reading English. */
  const note = (q, arg, got) => {
    if (!SAYING) return got;
    if (QSTUB) return QSTUB.n++ === QSTUB.k ? QSTUB.flip(got, arg) : got;
    const rec = { of: field, at: i, q: q, arg: arg, got: got };
    /* WHICH RECORD THIS QUESTION WAS ASKED OF (round 11, raised by the codex
       reviewer). A box used to carry one owner for all of its claims, so a
       sentence that reads across objects — an aggregate over a room — could
       only be re-read against one of them, and a sentence about another
       object's state was re-read against the wrong record in silence. */
    Object.defineProperty(rec, "owner", { value: o, enumerable: false });
    SAYING.push(rec);
    return got;
  };
  const v = {
    of: field, at: i, value: e.value, tm: e.tm, by: e.by,
    /* has this field EVER held this value? "nobody had settled it" and "nobody
       has checked it" are questions about the whole history, not about the
       value standing at the end of it — which is exactly why they came out
       false two entries below a row saying somebody had. */
    /* AND A VIEW ANSWERS ABOUT THE HISTORY UP TO WHERE IT STANDS (round 11).
       A `was` view is the record as of a point, so "has it ever been X" asked
       of it is asked of the record as of that point — otherwise a fixture line
       reading "nobody has been assigned", true when priya wrote it, quietly
       becomes false the moment someone assigns it, and the sentence on screen
       is a claim about a moment answered from a later one. */
    ever(x) { return note("ever", x, h.slice(0, i + 1).some(y => sameValue(y.value, x))); },
    /* the most recent point at which it held it, for "signed off at 09:13" */
    last(x) { let r = null; for (let k = i; k >= 0; k--) if (sameValue(h[k].value, x)) { r = h[k]; break; } return note("last", x, r); },
    /* HAS IT BEEN HERE BEFORE? (round 11 D4). "again" is the shortest sentence
       on this page and it is a claim about the whole history: `unverified
       again` was appended unconditionally to a record that read
       ["verified","unverified"] and had never been unverified in its life, and
       `settled again` to a first settlement. The word is produced by this
       query now, so the branch that writes it is the branch that looked. */
    before(x) { let r = null; for (let k = 0; k < i; k++) if (sameValue(h[k].value, x)) { r = h[k]; break; } return note("before", x, r); },
    /* HAS ANYTHING EVER BEEN RECORDED HERE? "nothing was answered" and "nobody
       has been assigned" are this question and no other, and round 10 answered
       the first of them from two reads of a different field entirely. */
    everSet() { return note("everSet", null, h.slice(0, i + 1).some(x => x.value != null)); }
  };
  /* which object this was read out of, so a sentence carried to a surface far
     from the object it is about — a toast, a fact chip, a pin line — can still
     be read back against the record that produced it. Non-enumerable, for the
     same reason the mint is: it must not survive a clone. */
  Object.defineProperty(v, "owner", { value: o, enumerable: false });
  return v;
}

/* ONE READ, MANY SURFACES (round 9 D1). A transition narrates itself on five
   surfaces — the chain header, the chain body, WHAT HAPPENED, the permanent feed
   row and the toast — and round 9 read the record for two of them and composed
   the other three from values lying around beside it. `reads()` takes the read
   ONCE; every sentence the transition writes is minted from those same views, so
   the surfaces cannot disagree with each other or with the record. */
function reads(o, fields) {
  return fields.map(f => (typeof f === "string" ? fieldView(o, f) : fieldView(o, f.of, f.at)));
}
/* EVERY VALUE THIS FIELD IS KNOWN TO TAKE, taken from the records rather than
   from a list. The mutation below stubs a view with each of them, so a sentence
   that partitions on the field — a count of the unchecked ones — is measured
   against a value on the OTHER side of its own partition. There is nothing to
   maintain: a state that reaches the record reaches this on the same tick. */
/* memoised, and the memo is dropped by amend() and by render(): the records
   cannot move inside a render tick, and building this per checked view of every
   sentence on every paint was the whole of a 6x render cost. */
let FIELD_UNIVERSE = null;
function dropFieldUniverse() { FIELD_UNIVERSE = null; }
function fieldValueUniverse(field) {
  if (FIELD_UNIVERSE && FIELD_UNIVERSE[field]) return FIELD_UNIVERSE[field];
  const out = [];
  eachObject(o => ((o.recorded || {})[field] || []).forEach(e => {
    if (!out.some(x => sameValue(x, e.value))) out.push(e.value);
  }));
  (FIELD_UNIVERSE || (FIELD_UNIVERSE = {}))[field] = out;
  return out;
}
/* the query log of the say() currently minting. A phrase that asks the history
   a question does it through a view, and the view writes the question here. */
let SAYING = null;
/* the replay in progress, when say() is re-running its own phrase to find out
   whether a query it recorded could have changed the sentence */
let QSTUB = null;
/* the flip of an answer: a yes/no becomes its opposite, and a point in the
   history becomes its absence or a plausible presence */
function flipAnswer(got, arg) {
  if (typeof got === "boolean") return !got;
  return got == null ? { value: arg, tm: "00:00", by: "somebody", how: "flipped for the mutation" } : null;
}
/* a sentence about the record, and the record facts it asserts. The ONLY way to
   produce one — a string written beside a correction entry is refused. */
/* `counted` (round 14, D1) — the predicates this sentence's own numerals are, in
   the order the numerals appear, for the ones no phrasing pattern can read. See
   COUNT_PREDICATES: a declaration is not an exemption, it is the other half of
   the allowlist, and every declared number is re-derived from the records the
   sentence declares it read on every paint, exactly as a pattern-read one is. */
function say(views, phrase, owner, counted) {
  const outer = SAYING, log = (SAYING = []);
  /* WHAT THIS SENTENCE MEASURED, and from which two timestamps (round 17, D1).
     Collected the same way the history queries above are, and for the same
     reason: the only place the phrase is in hand is here, so the only place a
     derivation can be recorded beside the words it produced is here. */
  const outerM = MEASURING, mlog = (MEASURING = []);
  let said;
  try { said = phrase.apply(null, views); } finally { SAYING = outer; MEASURING = outerM; }
  /* THE MUTATION, at the moment of minting rather than in a checker, because
     the phrase is only in hand here. Skipped inside a replay (a nested say
     would re-enter). */
  if (DEV && !QSTUB) {
    const base = normText(quantText(said));
    const replay = (stubViews) => {
      const keep = SAYING; SAYING = [];
      const keepM = MEASURING; MEASURING = null;
      try { return normText(quantText(phrase.apply(null, stubViews))); }
      catch (e) { return null; }
      finally { SAYING = keep; MEASURING = keepM; }
    };
    log.forEach((q, k) => {
      QSTUB = { n: 0, k: k, flip: flipAnswer };
      const alt = replay(views);
      QSTUB = null;
      if (alt !== null && alt === base)
        console.error("[atrium invariant] a sentence asked this record's " + q.of + " history a question and would " +
          "have said exactly the same thing either way — the query is decoration and the words beside it are a " +
          "literal:", (owner || (views.length && views[0].owner) || {}).id, q.q + "(" + q.arg + ")", base);
    });
    /* AND A SENTENCE DECLARES ONLY THE READS IT USED (round 11 self-review,
       second pass). Two of the seven forgeries walked straight through the
       clauses above: `"the prior sign-off preserved on the record"` re-typed
       into a branch of a sentence that ALSO reads the verification elsewhere,
       and `"still unanswered"` re-typed into a sentence that still reads the
       answer in a branch it no longer takes. The quantifier rule asks whether
       the field was read; a literal sitting beside an unrelated read of the
       same field satisfies it. What it cannot satisfy is this: move the value
       the sentence says it read, and the sentence has to move. A read that
       cannot change what is on screen is not what produced it — and `claims` is
       what every checker on this page re-reads, so a claim the sentence did not
       use is a claim the checkers are verifying on its behalf for nothing. */
    views.forEach((v, j) => {
      /* a view whose HISTORY this sentence questioned is already load-bearing —
         the query mutation above is the test for it, and moving the value at
         one point would not move a sentence about the whole of it */
      if (log.some(q => q.of === v.of && q.at === v.at)) return;
      /* AND THE QUESTION IS ASKED WHERE IT MEANS SOMETHING: only of a field
         whose own words are IN the sentence. A sentence branches, and a
         `receiptState` that reads four fields to serve six branches genuinely
         uses one of them per branch — firing on the other three would be an
         audit firing on cases its rule does not cover, which this file's own
         doctrine now forbids in as many words. What the rule is actually about
         is a sentence that TALKS about a field and does not listen to it. */
      /* AND THIS GATE IS THIS MUTATION'S OWN BLIND SPOT, NAMED (round 14, D1).
         The rule above needs a field WORD in the sentence. A sentence with no
         words at all — the rail's owed badge, whose entire text was `3` — skips
         every read-mutation it has, and skipped thirteen of them for a round.
         The gate is right (a branching sentence genuinely uses one field per
         branch, and firing on the others is the cry-wolf failure this file
         forbids); what was missing is anything that notices a sentence the gate
         can never reach. checkCountedClaims owns that now: every numeral in a
         minted sentence must be read by an enumerated form, so a wordless
         sentence answers to the number rules even though it answers to none of
         the word rules. What is STILL not covered here: a wordless sentence
         with no numeral in it either — those exist (a glyph), and the aggregate
         and painted-equals-minted rules are what govern them. */
      if (!(RECORDED[v.of].words || []).some(w => hasToken(base, w))) return;
      /* THE STUBS HAVE TO INCLUDE THE ONE THAT MATTERS. Half the sentences on
         this page are a COMPARISON of two views of one field — "now settled"
         against "already settled" — and moving one end to a value nothing holds
         leaves the two ends unequal, so the branch does not move and an honest
         read looks like decoration. The third stub is the other end's own
         value: it is the only mutation that makes a comparison flip. */
      /* AND THE STUBS HAVE TO BE ABLE TO FLIP A PREDICATE (round 13, found by
         this round's own sequence enumerator, live on round 12 as committed and
         308 times over at depth 2). `4 objects · 4 unverified · 2 awaiting you`
         reads four verifications and counts the ones nothing has checked. Every
         stub above — a value nothing holds, `null`, another view's value — is
         ALSO a value nothing has checked, so the count came out the same however
         the record was moved, and an honest aggregate looked like decoration. A

   which is how round 8's re-answer came to render `Answer of 09:13: X → now: X`,
   an arrow between two identical statements, backed by a settlement change that
   was genuinely there. The arrow belongs to the OPERANDS, so it is decided by
   them: where the two sides declare the same field, that field has to differ. */
/* AND A FIELD ONLY ONE SIDE NAMES IS STILL SOMETHING THESE SENTENCES ARE ABOUT
   (round 9 minor). Round 9 compared only the fields the two sides SHARE, so
   reopening a signed-off commitment — where `was` reads the verification and
   `after` reads the verification and the settlement — decided the arrow on the

   after); the settlement did, which is the whole of what a reopen is. The chain
   printed "Signed off, self-reported — unchanged · Awaiting sign-off" between

  return false;
}

/* the four classes partition the group: they add up to the total, by construction */
function msgClass(r, m) {
  if (m.routine) return "routine";
  const o = linkedObject(r, m);
  /* NEED means "linked to something in THIS room's attention collection" — the
     same predicate the highlight uses, so the chip and the pin can never
     disagree about which room's items they are talking about. */
  if (o) return isAttentionRow(r, m) ? "need" : "change";
  if (m.system) return "change";          // a recorded transition IS a change
  return "discussion";

/* --- DIGEST SEMANTICS ----------------------------------------------------
 * Three rules, all of which round 2 broke by treating "after the seen cursor"
 * as "since you left":
 *   1. Your own activity is never unseen. You wrote it; you were here.
 *   2. The absence window FREEZES at the moment you return. `absenceEnd` is
 *      pinned at boot and never moves, so nothing that happens while you are
 *      sitting in the room can join the group labelled SINCE YOU LEFT.
 *   3. Everything after that accrues to a separate, differently-labelled group
 *      — SINCE YOU RETURNED, or SINCE YOU MARKED THIS SEEN once the cursor has
 *      moved past the absence window.

function isMine(m) { return m.actor === S.me || m.byMe === true; }

/* A GROUP'S BOUNDARIES DO NOT MOVE WHEN YOU READ IT.

 * the divider FADES TO MUTED; Slack keeps its New line until you leave the
 * channel. So the absence group is anchored to `absenceFrom` … `absenceEnd`,

}

/* the trailer — counted, not typed, INCLUDING its lead clause and its glyph.
   Round 2 hardcoded "everything else is green" over derived numbers, so a room
   with a failure in it would still have announced that everything was green. */
function clearSummary(r) {
  const owed = attention(r).map(o => o.id);
  /* AND THE PRUNE TAKES THE ARITHMETIC WITH THE LINE (round 12, raised by the
     codex reviewer). The first cut of this round deleted six statistics from
     the trailer and left the code that computed all six standing — dead work
     that reads like a guarantee to the next person to open the file, and the
     easiest way for a statistic to come back without a decision. What survives
     is what the two remaining facts need: the owed set, and `overdue`, which
     the lead's second branch reads. */
  const overdue = r.objects.filter(o => o.kind === "commitment" && !needsYou(o) && o.overdue).length;

  /* THE LEAD CONSULTS VERIFICATION, NOT JUST FAILURE AND LATENESS.
     Round 3 derived the glyph but still said "everything else is green" over
     eight objects nothing had checked — in the same sentence as "0/2 objectives
     clear of you". Green means checked by something other than the claimant, so
     the lead may only say it when that is true of everything outside the pin.
     When it is not, the lead says what is: how much is unverified, how much is
     owed, and what is actually settled. */
  /* AND THE TRAILER COUNTS OFF THE RECORD (round 11, raised by the grok
     reviewer). These were counted off `o.verification`, which is only pinned to
     the record by an invariant one function away; the histories ARE the record,
     and a line that says "6 of 10 still unverified" above ten of them reads
     them. */
  const rest = r.objects.filter(o => !owed.includes(o.id));

  /* AN AGGREGATE IS A SENTENCE ABOUT MANY RECORDS, AND IT IS MINTED FROM ALL OF
     THEM (round 11, raised by the codex reviewer). This line — the one sentence
     on the page that speaks for ten objects at once — was a literal composed
     beside them, outside `paintSaid` and outside the `data-obj` walk, which is
     precisely the escape the doctrine's completeness claim said could not
     exist. It reads every object it counts; each claim carries the record it
     came from, so the checkers re-read ten records rather than one; and the

     is a claim in one character. */

     was recomputed outside the mint from a second pass over the same records.
     It is a claim about ten verifications in one character, painted next to a

  const restViews = rest.map(x => fieldView(x, "verification"));

    const vs = Array.prototype.slice.call(arguments);
    const fail = vs.filter(v => v.value === "failed").length;
    /* THE SAME PREDICATE THE LENS COUNTS WITH (round 13, D3) — see isUnchecked().

    const unver = vs.filter(v => isUnchecked(v.value)).length;

      fail        ? `${fail} failure${fail === 1 ? "" : "s"} outside your list`

     `owedTo` and a verification — so it is minted from a read of each of them
     rather than composed beside the pane. */
  const objectives = say(r.objects.map(o => fieldView(o, "verification")), function () {
    const vs = Array.prototype.slice.call(arguments);
    const blocked = {};
    vs.forEach(v => { if (needsYouAt(v.owner, v.value)) v.owner.objectives.forEach(id => { blocked[id] = 1; }); });
    const clear = r.objectives.filter(ob => !blocked[ob.id]).length;
    return `${clear}/${r.objectives.length} objectives clear of you`;
    /* a slash-pair has no phrasing between its two numbers for a pattern to
       match — `9/9` over a room with three objectives was silent on every
       instrument here (round 14, D1) — so both ends name their predicate */
  }, r.objects[0], ["objectivesClear", "objectivesTotal"]);

  /* `last check HH:MM` — the sixth statistic — was REMOVED in round 12. It was
     r2's, made honest in round 11 (616bb07) by reading the record for the most
     recent dated verification, and then carrying a caveat about where the
     number came from when the record had no dated one. The lead one group to
     its left already reports how much of this room nothing has checked, which
     is the question a freshness timestamp was standing in for, and the lens
     header carries `updated HH:MM` for recency. Two facts, not eight. */
  return { lead, glyph, objectives };
}

/* --- THE ATTENTION INVARIANT --------------------------------------------
 * No attention item exists without an action path and a rationale. This is
 * checked at render time rather than asserted in a receipt: if a future change

 * ---------------------------------------------------------------------- */
const DEV = true;   /* prototype build — a shipping build would strip this */
function checkAttentionInvariant(r) {
  if (!DEV) return;
  attention(r).forEach(o => {
    if (!pinActions(o)) console.error("[atrium invariant] owed item has no action path — it is a dead end:", o.id, o);
    if (!normText(whyOf(r, o)).trim()) console.error("[atrium invariant] owed item has no rationale under WHY YOU:", o.id, o);
    if (!r.messages.some(m => linkedObject(r, m) === o) && !sourceRoomOf(o))
      console.error("[atrium invariant] owed item is unreachable — no row in this room and no cross-room source declared:", o.id, o);
    /* AND AN ACTION PATH IS ONE THE OBJECT CAN HONESTLY TAKE (round 9 D4). A
       dead end is an item with no action; this is the other failure, an item
       offering an action whose write it cannot survive. Round 9 rendered
       "Answer in your own words →" on a commitment owned by somebody else and
       on every kind it could not serve, and send() then called

    if (/data-bind/.test(pinActions(o)) && !canBind(o))

        "record — what a reader types would be written into this object as its own statement and accepted in their " +
        "name:", o.id, o.kind, "owner:", (o.kind === "commitment" ? commitmentOwner(o) : o.owedTo));

}

/* --- THE ROW-SCOPE INVARIANT ---------------------------------------------
 * Highlighted rows ⊆ rows linked to THIS room's attention items. Checked
 * against the rendered DOM, not against the function that drew it, so a future
 * change that re-globalises the linkage is caught by the thing on screen.
 * ---------------------------------------------------------------------- */
function checkRowScopeInvariant(r) {
  if (!DEV) return;
  const owned = attention(r);
  document.querySelectorAll('#feed .mrow[data-cls="need"], #feed .mrow.hit').forEach(el => {
    const m = msg(r, el.dataset.msg);
    if (!m) return;
    const o = linkedObject(r, m);
    if (el.dataset.cls === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] row classed NEED is not linked to this room's attention collection:", el.dataset.msg, o && o.id);
    if (el.classList.contains("hit") && S.ui.feedFilter && S.ui.feedFilter.k === "need" && owned.indexOf(o) < 0)
      console.error("[atrium invariant] highlighted row is outside this room's attention collection:", el.dataset.msg, o && o.id);
  });
  /* and the other direction: the count and the highlight must be the same
     predicate, so the two numbers can differ only in cardinality, never in set */
  const rows = attentionRows(r);
  if (rows.some(m => attention(r).indexOf(linkedObject(r, m)) < 0))
    console.error("[atrium invariant] attentionRows() returned a row outside attention()");

/* --- THE QUOTATION INVARIANT ---------------------------------------------
 * Round 3's cardinal defect, encoded so it cannot come back: anything rendered
 * as a person's words must prove where the words came from. Round 4 found the
 * encoding CIRCULAR and this is the closure of that loophole.
 *
 *   1. Every element in a quotation context (<q>, .ex, .quoted) carries
 *      data-quoted, and it resolves — either "msg:<id>[@room]", in which case
 *      the rendered text must actually appear in that message AND that message
 *      must have been authored by a human (origin 'typed' or 'seeded'), or
 *      "typed", in which case the text must be in the human-speech register.
 *      A message the PAGE authored on a human's behalf (origin 'chosen') can
 *      never satisfy a quotation context, however real its text is: the defect
 *      is the attribution, not the invention. Round 4 checked only that the
 *      cited message existed and contained the text — which a page-fabricated
 *      message trivially does, because the page wrote it to contain the text.
 *   2. No quotation marks are rendered anywhere else — SCOPED TO PAGE-AUTHORED
 *      TEXT. Round 4 walked every text node on the page, so a human typing
 *      “like this” tripped a page-integrity rule on their own words, on every
 *      render. A person's typographic quotes are their business; the rule is
 *      about what the PAGE puts in quotation marks.
 *   3. A row the page authored (origin 'chosen') is never dressed as human
 *      speech: not classed `.me`, no quotation marks in it, no quotation
 *      context inside it.
 * ---------------------------------------------------------------------- */
const QUOTED_SEL = "q, .ex, .quoted";
