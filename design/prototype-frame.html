       record still says it, is clause 0's — one rule in one place. */
    const paint = (sel, v, side) => {
      const node = el.querySelector(sel);
      if (!node) return console.error("[atrium invariant] a correction entry paints no " + side + " at all:", o.id, voicedText(c.hd));
      if (!isStated(v) || v.minted !== MINTED)
        console.error("[atrium invariant] a correction entry paints a " + side + " that was not read out of the record:",
          o.id, voicedText(c.hd), node.textContent.trim());
    };
    paint(".was", c.was, "before");
    paint(".aft", c.after, "after");
    /* 5a — AND THE HEADER, which is the entry's loudest claim and was the one
       part of it nothing read (round 9 D1b) */
    const hdt = el.querySelector(".hdt");
    if (!hdt)
      console.error("[atrium invariant] a correction entry paints no header at all:", o.id, voicedText(c.hd));
    else if (!isStated(c.hd))
      console.error("[atrium invariant] a correction entry paints a header that was not read out of the record — " +
        "a claim stated in a word rather than in a glyph is still a claim, and nothing constrains this one:",
        o.id, hdt.textContent.trim());
    else if (c.hd.minted !== MINTED)
      console.error("[atrium invariant] a correction entry's painted header carries claims the record did not mint:",
        o.id, hdt.textContent.trim());
    /* 5f — AND THE FACT LINE, which narrates the transition in prose beneath
       the two operands and was the one part of the entry nothing read */
    const ftx = el.querySelector(".ftx");
    if (ftx) {
      if (!isStated(c.fact) || c.fact.minted !== MINTED)
        console.error("[atrium invariant] a correction entry's fact line was not read out of the record — it narrates " +
          "this amendment in prose, under two operands that were:", o.id, ftx.textContent.trim());
    }
    /* 5h — AND THE LINK LABEL (round 11 minor). The arrow checker deliberately
       excludes it, because a route ends in an arrow for a reason that has
       nothing to do with a change; the record-narration rule does not. Round 10
       printed "the proposal it replaced is still in the room →" on a
       RE-AFFIRMED entry, where nothing was replaced. */
    const lnk = el.querySelector(".bd .lnk");
    if (lnk && c.link != null && (!isStated(c.link) || c.link.minted !== MINTED))
      console.error("[atrium invariant] a correction entry's link label narrates this amendment and was not read out of " +
        "the record — a route's label is a sentence about the object it routes to:", o.id, lnk.textContent.trim());
    /* the arrow the entry itself paints — the entry's own text, not the label
       on the link beside it, which ends in one because it is a route */
    const bd = el.querySelector(".bd");
    const arrow = !!bd && Array.prototype.some.call(bd.childNodes, n => n.nodeType === 3 && /→/.test(n.nodeValue));
    if (arrow && !c.change)
      console.error("[atrium invariant] a correction entry paints an arrow with no recorded change behind it:", o.id, voicedText(c.hd));
    if (c.change && sameValue(c.change.from, c.change.to))
      console.error("[atrium invariant] a correction entry paints an arrow with the same value on both sides:", o.id, voicedText(c.hd));
    /* an arrow between two sentences claims THOSE sentences moved. Round 8's
       re-answer painted one between two identical statements, backed by a
       change to a different field entirely. */
    if (arrow && !operandsMoved(c))
      console.error("[atrium invariant] a correction entry paints an arrow between two sentences about a field that did " +
        "not move — the change it carries is about something else:", o.id, voicedText(c.hd));
    if (arrow) {
      const w = el.querySelector(".was"), a = el.querySelector(".aft");
      if (w && a && normText(w.textContent) === normText(a.textContent))
        console.error("[atrium invariant] a correction entry paints the same sentence on both sides of an arrow:", o.id, voicedText(c.hd));
    }
    /* AND THE MIRROR CLAUSE (round 9 minor). Round 9 asked the arrow question of
       the fields the two sides SHARE, so a sign-off→reopen chain — where `was`
       reads the verification and `after` reads the verification and the
       settlement — printed "— unchanged ·" between two visibly different
       sentences, because the settlement moved and the verification did not.
       Asked from the record rather than from the predicate the render used: if
       the entry carries a minted change about a field one of its own sentences
       is about, the reader is owed the arrow. */
    if (!arrow && c.change && claimedFields(c.was).concat(claimedFields(c.after)).indexOf(c.change.of) >= 0)
      console.error("[atrium invariant] a correction entry paints no arrow between two sentences about a field the " +
        "record did move — it is reporting an amendment as though nothing happened:",
        o.id, voicedText(c.hd), c.change.of, c.change.from, "→", c.change.to);
  });

  /* 5b — WHAT HAPPENED. The section round 9 shipped a false sentence into, and
     the first thing a reader of a receipt reads. Every line is minted, its
     claims still hold, and the characters on screen are the minted ones. */
  document.querySelectorAll(".hap[data-hap-obj]").forEach(el => {
    const o = obj(r, el.dataset.hapObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.hapObj)).filter(Boolean)[0]);
    const h = o && (o.history || [])[Number(el.dataset.hap)];
    const node = el.querySelector(".htx");
    if (!h || !node)
      return console.error("[atrium invariant] a WHAT HAPPENED line is on screen with no entry behind it:",
        el.dataset.hapObj, el.dataset.hap);
    if (!isStated(h.text))
      return console.error("[atrium invariant] a WHAT HAPPENED line was not read out of the record — it is a sentence " +
        "composed beside the object it narrates, and nothing constrains what it claims:", o.id, node.textContent.trim());
    if (h.text.minted !== MINTED)
      console.error("[atrium invariant] a WHAT HAPPENED line carries claims the record did not mint:",
        o.id, node.textContent.trim());
  });

  /* 5g — the receipt's state line, which is the loudest sentence in a receipt */
  document.querySelectorAll("[data-rstate-obj]").forEach(el => {
    const o = obj(r, el.dataset.rstateObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.rstateObj)).filter(Boolean)[0]);
    if (!o) return console.error("[atrium invariant] a receipt state line is on screen with no object behind it:", el.dataset.rstateObj);
    const box = receiptState(o);
    el.querySelectorAll("[data-rstate]").forEach(part => {
      const want = box.said[Number(part.dataset.rstate)];
      if (want == null || normText(part.textContent) !== normText(String(want)))
        console.error("[atrium invariant] a receipt's state line is painting something other than what the record " +
          "produced for it:", o.id, part.textContent.trim(), "vs", String(want));
    });
    /* the state line is painted part by part rather than through voiced(), so
       it is handed to the same reader clause 0 uses — point reads, history
       queries and the quantifier rule. This is the surface round 10's D2 sat
       on: `nothing other than the claimant has checked it`, a hardcoded literal
       inside a say() branch, using none of the four views it was handed. */
    checkStatedBox("a receipt's state line", o.id, box);
  });

  /* 5c — the fact chips and the receipt's note. The chip is the one line about
     an object most readers ever see, and the note is the last thing a receipt
     says. Both also carry a person's own typed characters, so the rule is
     painted-equals-minted wherever a mint reached the surface. */
  document.querySelectorAll("[data-fact-obj]").forEach(el => {
    const o = obj(r, el.dataset.factObj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], el.dataset.factObj)).filter(Boolean)[0]);
    const f = o && (o.facts || [])[Number(el.dataset.fact)];
    if (!isStated(f))
      return console.error("[atrium invariant] a fact chip is on screen with no minted sentence behind it:",
        el.dataset.factObj, el.textContent.trim());
    if (f.minted !== MINTED)
      console.error("[atrium invariant] a fact chip carries claims the record did not mint:", o.id, el.textContent.trim());
  });
  /* AND A CHIP THAT WAS NOT MINTED MAY NOT STATE A VALUE THE RECORD HOLDS
     (round 10 self-review). A fact chip may honestly be page copy about
     something the record does not keep — a person's name, a confidence, "3
     sources". What it may not be is a recorded VALUE written down beside the
     record, because that is the defect class with a shorter sentence. The
     vocabulary is derived from the object's own history, exactly as the raw-enum
     clause below derives its own, so there is no list to maintain and no
     phrasing to enumerate. */
  /* AND IT IS A TOKEN TEST, OVER THE WHOLE HISTORY (round 11 D5). Round 10
     asked `text.indexOf(normText(enumText(v))) >= 0` against each field's LAST
     value, and got both directions of the same design choice wrong: it fired on
     every render between answering and reassigning a question, because
     `"reopened".indexOf("open")` is 2 — and it was blind to a surface stating an
     EARLIER recorded value, which is the half of this class the page had
     actually shipped. A word is matched as a word, and the record is the whole
     record. Console noise is not a cosmetic problem: it is what masks a real
     firing, and this file's own doctrine names that failure mode. */
  document.querySelectorAll(".oitem .mt span, .acard .mt span, .acomp .fx span").forEach(el => {
    if (el.dataset.factObj) return;                 // minted, and checked above
    /* a minted sentence, or a fragment of one — clause 0 owns it */
    if (el.closest("[data-said]") || el.querySelector("[data-said]")) return;
    if (el.closest(HUMAN_SEL)) return;              // a person's own characters
    const id = (el.closest("[data-lens-obj]") || {}).dataset;
    const o = id && (obj(r, id.lensObj) || Object.keys(S.rooms).map(k => obj(S.rooms[k], id.lensObj)).filter(Boolean)[0]);
    if (!o) return;
    const text = normText(el.textContent);
    Object.keys(o.recorded || {}).forEach(fld => {
      (o.recorded[fld] || []).forEach(e => {
        const v = e.value;
        if (typeof v !== "string" || !v) return;
        if (hasToken(text, normText(v)) || hasToken(text, normText(enumText(v))))
          console.error("[atrium invariant] a fact chip states a value this object's record holds for its " + fld +
            ", and was not read out of it — the shortest surface on the page is still a surface:",
            o.id, el.textContent.trim(), "vs", v);
      });
    });
  });
  /* the note is the receipt's closing sentence and it is about the record —
     round 9's said "Rescheduling never erases the original date … it moves the
     date and nothing else" under a reschedule that moved nothing — so a note on
     screen with no mint behind it is the defect, not an exemption */
  document.querySelectorAll(".rc-foot .note").forEach(el => {
    if (!el.textContent.trim()) return;
    const id = el.dataset.noteObj;
    const o = id && (obj(r, id) || Object.keys(S.rooms).map(k => obj(S.rooms[k], id)).filter(Boolean)[0]);
    if (!o || !isStated(o.note) || o.note.minted !== MINTED)
      console.error("[atrium invariant] a receipt's closing note was not read out of the record — it is a " +
        "sentence about this object composed beside it:", id || "(unmarked)", el.textContent.trim());
  });

  /* 3 + 5d — the permanent rows */
  document.querySelectorAll("#feed .mrow[data-msg]").forEach(el => {
    const m = msg(r, el.dataset.msg);
    if (!m || !m.sysFor) return;                    // only rows the page wrote ABOUT an object
    const body = el.querySelector(".mbody");
    const text = body ? body.textContent : "";
    /* 5d — where a segment of this row was minted, the row paints THAT and its
       claims still hold. A permanent row narrating a move the record did not
       make is the same defect as a chain entry doing it, and it is worse,
       because the row never goes away. */
    /* a row the page wrote ABOUT an object narrates that object, permanently,
       so at least one of its segments is a record read. Round 9's reschedule
       row said "rescheduled by lars" about a date that had not moved. */
    if (!(m.body || []).some(isStated))
      console.error("[atrium invariant] a transition row in the conversation was composed entirely beside the record — " +
        "this row is permanent and no part of it was read out of the object it narrates:", m.id, text.trim());
    (m.body || []).forEach(seg => {
      if (!isStated(seg)) return;
      if (seg.minted !== MINTED)
        return console.error("[atrium invariant] a transition row carries claims the record did not mint:", m.id, text.trim());
      if (normText(text).indexOf(normText(voicedText(seg))) < 0)
        console.error("[atrium invariant] a transition row is not painting the sentence the record minted for it:",
          m.id, text.trim(), "expected to contain", voicedText(seg));
    });
    if (!/→/.test(text)) return;
    const o = obj(r, m.sysFor) || (m.objectRoom && obj(S.rooms[m.objectRoom], m.sysFor));
    /* the cheapest clause first, and the one that needs nothing but the painted
       characters: an arrow with the same thing on both sides is a change that
       did not happen, whatever is or is not attached behind it */
    const halves = text.split("→");
    if (halves.length === 2 && sameText(halves[0].split("·").pop(), halves[1].split("·")[0]))
      console.error("[atrium invariant] a transition row in the conversation puts the same state on both sides of an " +
        "arrow — the row is permanent and it is asserting a change that did not happen:", m.id, text.trim());
    const ch = m.transition;
    if (!ch || ch.minted !== MINTED)
      return console.error("[atrium invariant] a transition row in the conversation states a change the record did not mint — " +
        "this row is permanent, and nothing proves what it says happened:", m.id, text.trim());
    if (sameValue(ch.from, ch.to))
      return console.error("[atrium invariant] a transition row puts the same value on both sides of an arrow — " +
        "it is asserting a change that did not happen:", m.id, text.trim(), ch.of, ch.from);
    if (o && !heldInSequence(o, ch.of, ch.from, ch.to))
      console.error("[atrium invariant] a transition row claims a move this object's record never made:",
        m.id, ch.of, ch.from, "→", ch.to);
    const from = ch.from == null ? null : enumText(ch.from), to = ch.to == null ? null : enumText(ch.to);
    const want = from != null && to != null ? from + " → " + to : from != null ? from + " → " : " → " + to;
    if (text.indexOf(want) < 0)
      console.error("[atrium invariant] a transition row's arrow is not painting the values the record moved between:",
        m.id, text.trim(), "expected", want);
  });

  /* 6 — AND THE COVERAGE ARGUMENT ITSELF IS CHECKED (round 11, CONVENTIONS 229).
     Clause 0 holds every minted sentence to the rule. What proves that the
     sentences on this page ARE minted is not a list of surfaces — that is the
     claim round 10 made and could not support — but a walk over every text node
     inside anything that renders an object. Any clause that pairs a quantifier
     with a recorded field's own vocabulary, and is neither inside a minted
     sentence nor a person's own characters, is a sentence about a history
     nothing asked. That is how `still the answer on the record` on a feed row
     tag, `pending again` in a WHY YOU line and `last check 09:07` in the pin
     trailer become findable rather than remembered. */
  document.querySelectorAll("[data-obj]").forEach(host => {
    const o = obj(r, host.dataset.obj) ||
              (Object.keys(S.rooms).map(k => obj(S.rooms[k], host.dataset.obj)).filter(Boolean)[0]);
    if (!o) return;
    const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest("[data-said], [data-said-parts]")) return NodeFilter.FILTER_REJECT;   // minted; clause 0 / 5g own it
        if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;       // a person's own characters
        /* a nested object's own container is that object's business */
        if (p.closest("[data-obj]") !== host) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    /* the record's own words are not the page's sentence — see pageWordsOf().
       R1's recorded statement ends "…replays inside the window still succeed". */
    let n;
    while ((n = walker.nextNode())) {
      clausesOf(pageWordsOf(o, String(n.nodeValue).replace(/\s+/g, " ").trim())).forEach(text => {
        const q = WHOLE_QUANT.concat(PAST_QUANT, CONTINUITY_QUANT).filter(w => hasToken(text, w));
        if (!q.length) return;
        Object.keys(RECORDED).forEach(f => {
          const words = (RECORDED[f].words || []).filter(w => hasToken(text, w));
          if (!words.length) return;
          console.error("[atrium invariant] a surface is quantifying over this object's " + f + " history in words " +
            "nothing read it for — the sentence was composed beside the record rather than out of it:",
            o.id, JSON.stringify(text), q[0], "/", words.join(", "), n.parentElement);
        });
      });
    }
  });

  /* 4 — the vocabulary of the record never reaches the reader raw */
  /* an enum value is a single snake_case token the RECORD holds — not any
     string with an underscore in it, because a person may well write about a
     table called users_legacy and that is their sentence, not the record's
     spelling of a state */
  const raw = [];
  eachObject(o => Object.keys(o.recorded || {}).forEach(f =>
    o.recorded[f].forEach(e => {
      if (typeof e.value === "string" && /^[a-z]+(_[a-z]+)+$/.test(e.value) && raw.indexOf(e.value) < 0) raw.push(e.value);
    })));
  if (raw.length) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (!raw.some(v => n.nodeValue.indexOf(v) >= 0)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest("script, style, template")) return NodeFilter.FILTER_REJECT;
        if (p.closest(HUMAN_SEL)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode()))
      console.error("[atrium invariant] a raw enum value is on screen — enumText() exists so a reader never reads the " +
        "record's spelling of a state:", n.nodeValue.trim(), n.parentElement);
  }
}

/* 5e — THE TOAST. The loudest surface on the page and the shortest-lived, which
   is exactly why it went unchecked: it is raised after the render it belongs to
   and is gone three seconds later, so nothing that only runs on render will ever
   see one. Rescheduling twice raised "rescheduled · the original due date stays
   on the record" over a record that had not moved. A toast raised while a write
   path has just touched a record is a sentence about that write. */
function checkToastInvariant(m) {
  if (!DEV) return;
  const pending = AMENDED_PENDING;
  AMENDED_PENDING = null;
  const node = $("toastMsg");
  if (!isStated(m)) {
    if (pending)
      console.error("[atrium invariant] a transition raised a toast that was not read out of the record — the loudest " +
        "sentence this page writes about an amendment, composed beside the object it describes:",
        pending.id, node ? node.textContent.trim() : String(m));
    /* AND PAGE COPY MAY NOT QUANTIFY EITHER (round 11 self-review, raised by
       the grok reviewer). A toast raised with no write pending is copy about an
       ACTION — "sent", "nobody is named on this question to hand it to" — and
       asserts nothing about a record, so it needs no mint. What it may not do
       is quantify over a field history anyway: that would be the one surface on
       the page where a literal about the record is reachable, and it is the
       loudest one. There is no object in scope to check it against, so the
       obligation is simply that it does not make the claim. */
    clausesOf(String(voicedText(m)).replace(/\s+/g, " ").trim()).forEach(text => {
      const q = WHOLE_QUANT.concat(PAST_QUANT, CONTINUITY_QUANT).filter(w => hasToken(text, w));
      if (!q.length) return;
      Object.keys(RECORDED).forEach(f => {
        if (!(RECORDED[f].words || []).some(w => hasToken(text, w))) return;
        console.error("[atrium invariant] a toast raised with no write behind it is quantifying over a " + f +
          " history — page copy about an action may not make a claim about a record:", JSON.stringify(text), q[0]);
      });
    });
    return;
  }
  if (m.minted !== MINTED)
    return console.error("[atrium invariant] a toast carries claims the record did not mint:", node && node.textContent.trim());
  if (node) checkPaintedSentence("a toast", (m.owner && m.owner.id) || "?", node, m);
}

/* every object in every loaded room — the invariants above are about the record,
   and the record is not only the room you are looking at */
function eachObject(fn) {
  Object.keys(S.rooms).forEach(k => (S.rooms[k].objects || []).forEach(o => fn(o, S.rooms[k])));
}

/* --- THE LAYOUT INVARIANT (round 4 D1) ------------------------------------
 * Round 4's blocking defect was invisible to every other check on this page:
 * the state was right, the strings were right, the DOM was right, and the
 * cross-room trace was 0px tall with the feed painting over it and both of its
 * controls unclickable. Nothing in a state-shaped invariant can see that. So
 * this one asserts against geometry, on the thing that was actually painted:
 *
 *   1. Every visible child of `.center` occupies a track with real height.
 *   2. No two of those children overlap — a collapsed track shows up as a
 *      sibling painting through, which is exactly what round 4 measured.
 *   3. Every interactive control's centre point hit-tests to itself. A control
 *      you cannot click is not an affordance, whatever it looks like.
 *
 * Controls scrolled out of their container are skipped — legitimately not on
 * screen — by intersecting each element with every clipping ancestor first.
 * ---------------------------------------------------------------------- */
const CONTROL_SEL = "button, input, textarea, select, a[href], [role='button'], [tabindex]:not([tabindex='-1'])";

/* an element is on screen only if NO ancestor hides it. getComputedStyle reports
   an element's OWN display, so a button inside a `hidden` panel still reads
   `display: flex` while having no box at all — the walk up is what tells the
   difference between "unclickable" and "not currently on the page". */
function shown(el) {
  for (let p = el; p && p.nodeType === 1; p = p.parentElement) {
    if (p.hidden) return false;
    const cs = getComputedStyle(p);
    if (cs.display === "none" || cs.visibility === "hidden") return false;
  }
  return true;
}
/* the element's box intersected with every scroll/clip ancestor and the
   viewport — i.e. the part of it a pointer could actually reach */
function visibleBox(el) {
  let box = el.getBoundingClientRect();
  box = { left: box.left, top: box.top, right: box.right, bottom: box.bottom };
  for (let p = el.parentElement; p; p = p.parentElement) {
    const cs = getComputedStyle(p);
    if (cs.overflow === "visible" && cs.overflowX === "visible" && cs.overflowY === "visible") continue;
    const r = p.getBoundingClientRect();
    box.left = Math.max(box.left, r.left); box.top = Math.max(box.top, r.top);
    box.right = Math.min(box.right, r.right); box.bottom = Math.min(box.bottom, r.bottom);
  }
  box.left = Math.max(box.left, 0); box.top = Math.max(box.top, 0);
  box.right = Math.min(box.right, window.innerWidth);
  box.bottom = Math.min(box.bottom, window.innerHeight);
  return box;
}

/* how wide a control has to be before the words in it mean anything. Six
   characters at its own type size is the floor: enough for a truncated title to
   name what it is about ("Stop is…"), and derived from the page's own scale so
   a type change moves the wire with it. A control that is not truncated at all
   is legible at whatever width it has — the rule is about lost words, not small
   ones — and a control with no words only needs to be aimable. */
const AIM_MIN = 6;
function legibleWidth(el) {
  if (!(el.textContent || "").trim()) return AIM_MIN;
  if (el.scrollWidth <= el.clientWidth + 1) return AIM_MIN;
  const fs = parseFloat(getComputedStyle(el).fontSize) || 12;
  return Math.max(24, Math.round(fs * 6));
}

function checkLayoutInvariant() {
  if (!DEV) return;
  const center = document.querySelector(".center");
  if (!center) return console.error("[atrium invariant] the conversation column is missing");

  const cbox = center.getBoundingClientRect();
  const kids = Array.from(center.children).filter(shown);
  const boxes = kids.map(el => el.getBoundingClientRect());
  kids.forEach((el, i) => {
    if (boxes[i].height < 1)
      console.error("[atrium invariant] a .center child owns a zero-height track — it is on the page and cannot be seen or clicked:",
        el.id || el.className, el);
    /* THE COLUMN IS AUTHORITATIVE AND DOES NOT SCROLL, so a child outside it is
       not "scrolled out of view", it is gone. Found while verifying the fix
       above: hiding the trace slid the composer to top: 900 on a 900px
       viewport, entirely below the fold — non-zero height, no overlap with the
       feed, and invisible to both of the other two rules. Its controls were
       skipped by the hit-test as legitimately off-screen. This is the rule that
       sees it. */
    if (boxes[i].bottom > cbox.bottom + 0.5 || boxes[i].top < cbox.top - 0.5)
      console.error("[atrium invariant] a .center child is outside the column that owns it — the track layout pushed it off:",
        el.id || el.className, boxes[i].top, boxes[i].bottom, "column:", cbox.top, cbox.bottom);
  });
  /* a track can collapse without the child reporting zero height (a min-height,
     an absolute child), and the symptom is always the same: siblings sharing
     pixels. Round 4 measured trace.top === feed.top at 306.14 on both. */
  for (let i = 0; i < kids.length - 1; i++) {
    if (boxes[i].bottom > boxes[i + 1].top + 0.5)
      console.error("[atrium invariant] two .center children overlap — a track collapsed and a sibling is painting through it:",
        (kids[i].id || kids[i].className), "over", (kids[i + 1].id || kids[i + 1].className),
        boxes[i].bottom, boxes[i + 1].top);
  }

  /* every control hit-tests to itself */
  document.querySelectorAll(CONTROL_SEL).forEach(el => {
    if (!shown(el)) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1)
      return console.error("[atrium invariant] an interactive control has no clickable area:", controlName(el), el);
    /* AND A CONTROL YOU CANNOT READ IS NOT A CONTROL (round 7 D2). The rule
       above catches 0px and was silent at 5.36px — an owed item's title,
       truncated past the first character, on a row that still counted it,
       glyphed it and offered its action. One pixel above the wire is the same
       defect, so the wire is a LEGIBILITY floor rather than a non-zero one:
       a control whose own words are being cut off has to keep enough of them to
       be identified, measured in its own type size rather than in a constant
       that would drift the moment the scale changed. A control showing all of
       its text is legible at whatever width its text needs, by definition. */
    const floor = legibleWidth(el);
    if (r.width < floor)
      return console.error("[atrium invariant] an interactive control is too narrow to read — its label is cut off past the point " +
        "where it identifies anything:", controlName(el), Math.round(r.width * 100) / 100 + "px", "needs", floor + "px", el);
    const v = visibleBox(el);
    if (v.right - v.left < 1 || v.bottom - v.top < 1) return;   // scrolled out of view — legitimately unreachable
    let cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (cx < v.left || cx > v.right || cy < v.top || cy > v.bottom) {
      cx = (v.left + v.right) / 2; cy = (v.top + v.bottom) / 2;  // partially scrolled: test the reachable part
    }
    let hit = document.elementFromPoint(cx, cy);
    if (hit === el || (hit && el.contains(hit))) return;
    /* THE CENTRE IS NOT THE WHOLE CONTROL. A sticky header or footer legitimately
       covers a band of a scrolling pane — the control under it is one scroll away,
       which is what sticky is for, and failing it would be exactly the cry-wolf
       mistake D4 is about. What is NOT legitimate is a control with no reachable
       point at all: round 4's trace controls were covered edge to edge by a feed
       that had swallowed their track, and no scroll position recovered them. So
       the rule is "at least one point of this control hit-tests to it". */
    const probes = [[.15, .5], [.85, .5], [.5, .15], [.5, .85], [.15, .15], [.85, .85], [.15, .85], [.85, .15]];
    const reachable = probes.some(([fx, fy]) => {
      const px = v.left + (v.right - v.left) * fx, py = v.top + (v.bottom - v.top) * fy;
      const h = document.elementFromPoint(px, py);
      return h === el || (h && el.contains(h));
    });
    if (reachable) return;
    /* ...and a sticky or fixed overlay is one scroll away, not a dead end. The
       receipt's sticky footer deliberately covers a band of a scrolling pane so
       that Reopen never falls below the fold; a source entry under it is reached
       by scrolling, which is the contract sticky signs. Round 4's trace controls
       were covered by a sibling in NORMAL FLOW inside a column that does not
       scroll at all, and that stays a failure. */
    if (scrollEscapable(el, hit)) return;
    console.error(el.closest("[data-prompt]")
      ? "[atrium invariant] a prompt this render opened is painted over — the page asked for input and then covered the control:"

/* --- REVEALING WHAT THE PAGE JUST OPENED (round 5 D1) ---------------------

 * The reopen prompt is inside it — under the receipt's sticky footer — so
 * focusing it moved nothing, and at 1440×900 the reader was asked to type into
 * a box that was 100% painted over.

 * band of the pane at every scroll position, so the band a reader can actually
 * see is the pane's box minus whatever is pinned to its edges. This scrolls an

/* every prompt currently on the page. There is at most one per pane, and each

/* Anything the page has just put in front of someone has to be on screen, and
   there are exactly two ways it can do that: open a prompt, or move focus.
   scrollEscapable() already refuses to whitelist either — so both have to be

/* is the thing covering `el` an overlay a scroll would move it out from under?

 *
 * NARROWED (round 5 D1). The exemption as written whitelisted the exact defect
 * it was written beside: the receipt's sticky footer painted over the reopen
 * prompt renderReceipt() had just appended and focused, `#rgo` was 100% covered,
 * a real click landed on SPAN.note, and this function said "one scroll away".
 *
 * Sticky's contract holds for a PASSIVE entry — a source row under the footer is
 * reached by scrolling, and that is what sticky is for. It does not hold for a
 * prompt the page opened in response to a click and put the cursor in: the page
 * has just told the reader to type, and the thing to type into is behind an
 * overlay, at a scroll position nobody invited them to find. So the exemption is

}

/* WHY YOU is never empty. When the seed carries a rationale, that is the
   rationale; when it does not — a reopened decision, say — one is synthesized
   from the object's own history, which is the only honest source for it. */
/* AND IT IS A RECORD READ WHEREVER IT QUANTIFIES (round 11). A rationale is
   about the READER — that is why it is excluded from the correction rules — but
   `so it is pending again` is a claim about the settlement history all the same,
   and round 10 appended it to every reopened object without asking anything. It
   is minted now, so the sweep over painted sentences covers it like any other. */
function whyOf(r, o) {
  if (o.why) return say([], () => o.why);
  /* a synthesized rationale still may not assert something the record
     contradicts. Round 4's version said "only you can settle it" about every
     reopened object, including a commitment that had gone back to its owner —
     the facts line one row below said "pending again · justin's". */
  const owner = o.kind === "commitment" ? (o.owner || o.claimant) : null;
  const mine = !owner || owner === S.me;
  const prior = [...o.history].reverse().find(h => h.k === "accepted" || h.k === "verified");
  const titles = o.objectives.map(id => (r.objectives.find(ob => ob.id === id) || {}).title).filter(Boolean);
  return stated(o, ["settlement"], s => {
    const bits = [];
    if (o.reopenedAt)
      bits.push(`you reopened this at ${o.reopenedAt}, so it is ${enumText(s.value)}` +
        (s.before(s.value) ? " again" : "") +
        (mine ? " and only you can settle it"
              : ` — it is ${owner}'s to sign off, and it is on your list because you are waiting on it`));
    else if (o.kind === "decision") bits.push("it is a decision routed to you — decisions never auto-accept");
    else if (o.kind === "commitment") bits.push(`it is ${mine ? "yours" : owner + "'s"} and it is waiting on you`);
    else bits.push("it was routed to you and nobody else has picked it up");
    /* one supporting clause, drawn from the object's own record — the prior call
       if there is one, otherwise the objective it sits under. Two clauses keep it
       readable inside the pin's line budget; a rationale that gets clipped is not
       a rationale. */
    if (prior) bits.push(`the call at ${prior.tm} was ${prior.who}'s, and it is on the record below`);
    else if (titles.length) bits.push(`it sits under the objective ${titles[0]}`);

}
/* ===========================================================================
 * RENDER HELPERS — all interpolation goes through esc(). Nothing typed by a
 * human is ever concatenated into innerHTML unescaped. (Round-1 defect B1.)
 * ======================================================================== */

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ESC[c]); }
function bodyHtml(body) {
  return body.map(seg => {
    if (typeof seg === "string") return esc(seg);
    /* a permanent row narrating the record carries the sentence the record
       minted, not a copy of it (round 9 D1) — and it registers as a painted
       surface exactly as every other one does (round 11) */
    if (isStated(seg)) return paintSaid(seg, bodyHtml(Array.isArray(seg.said) ? seg.said : [seg.said]));
    if (seg.code) return `<code>${esc(seg.code)}</code>`;
    if (seg.at) return `<span class="at">@${esc(seg.at)}</span>`;
    if (seg.h != null) return humanSpan(seg.h);
    return esc(seg.text || "");
  }).join("");
}

/* --- WHO TYPED THESE CHARACTERS (round 5 D4) ------------------------------
 * Two page-integrity rules police what the PAGE writes: no stray quotation
 * marks outside a checked quotation context, and no `undefined`/`null`/`NaN` in
 * a rendered record. Both are wrong when applied to a human's own sentence — a
 * person may type a curly quote, and a person may type the word "undefined",
 * and neither is the page's failure. Round 4 scoped the quote-mark rule
 * correctly and round 5 marked its `data-voice="human"` on FEED MESSAGE BODIES
 * ONLY, so the record-text rule cried wolf on every other surface a human's
 * words reach: a typed reopen reason quoted in the correction chain, a
 * verification note in the facts and the history, a bound answer that became
 * the object's own text.
 *
 * `human(s)` marks a fragment as characters a person typed. `voiced(v)` renders
 * a string (page-authored), a marked fragment, or an array mixing the two — so
 * a page sentence that embeds a human's words keeps the page's half checked and
 * exempts only the half the person wrote. `voicedText(v)` is the same value as
 * plain text, for the places that need one.
 * ---------------------------------------------------------------------- */
function human(s) { return { h: s }; }
function humanSpan(s) { return `<span data-voice="human">${esc(s)}</span>`; }
/* ===========================================================================
 * THE SURFACE LIST IS THE RENDER, NOT A LIST (round 11 — CONVENTIONS line 229)
 *
 * Round 10 wrote six selectors into checkRenderedRecordInvariant and the
 * doctrine beside it claimed the list "is taken from the object's own shape,
 * every property the page paints words from". It was neither: it was written
 * from memory of the code, and the surfaces it omitted are exactly where round
 * 10's four high-severity defects were found. A remembered list is a denylist
 * one layer up — the document said so, and then shipped one.
 *
 * There is exactly ONE function that turns a minted sentence into HTML. So the
 * surface registers itself as it is painted: every `[data-said]` node in the
 * document is a sentence the record minted, found by the render that painted

 * covered on the day it is written.
 * ======================================================================== */
const PAINTED = [];
function paintSaid(box, inner) { return `<span data-said="${PAINTED.push(box) - 1}">${inner}</span>`; }
/* and a sentence the render takes APART — the receipt's state line is five
   strings joined with middots and chipped separately — declares that in the DOM
   rather than being remembered as an exception in a checker. `data-said-parts`
   means: the minted sentence is here, painted in pieces, and clause 5g compares
   the pieces. Both markers count as "this text was read out of the record" for
   the completeness walk, so neither is an exemption. */
function paintParts(box) { return `data-said-parts="${PAINTED.push(box) - 1}"`; }

function voiced(v) {
  if (v == null) return "";

  if (Array.isArray(v)) return v.map(voiced).join("");
  /* a sentence read out of the record (see stated()) renders as its own text —
     the box is what carries the claims the checkers re-read, and the span is
     how the checker finds the box from the DOM without a selector list */
  if (isStated(v)) return paintSaid(v, voiced(v.said));

}

}

const $ = id => document.getElementById(id);

/* ===========================================================================
 * RAIL
 * ======================================================================== */

function renderRail() {
  const ids = Object.keys(S.rooms);
  $("railSub").textContent = `${S.people.length} people · ${ids.length} rooms`;
  const cur = room();
  $("railAway").textContent = `back after ${cur.away.len}`;

  const rooms = $("railRooms");
  rooms.innerHTML = "";
  ids.forEach(id => {
    const r = S.rooms[id];
    const owed = attention(r).length;      // items, not rows — everywhere
    const unseen = unseenCount(r);
    const b = document.createElement("button");
    b.className = "rrow" + (id === S.roomId ? " on" : "") + (unseen ? " unread" : "");
    b.dataset.room = id;                     // the rail row you switched with keeps focus (D3)
    if (id === S.roomId) b.setAttribute("aria-current", "true");
    b.innerHTML =
      `<span class="hash" aria-hidden="true">#</span><span class="nm">${esc(r.name)}</span>` +
      (owed ? `<span class="pill"><span aria-hidden="true">◆</span>${owed}</span>`
            : unseen ? `<span class="ct">${unseen}</span>` : "");
    b.title = `#${r.name} — ${owed} item${owed === 1 ? "" : "s"} needing you · ${unseen} message${unseen === 1 ? "" : "s"} you have not seen`;
    b.addEventListener("click", () => switchRoom(id));
    rooms.appendChild(b);
  });

  /* the humans list is a roster, not navigation — rendered as rows, not buttons */
  const hs = $("railHumans");
  hs.innerHTML = "";
  S.people.forEach(p => {
    const d = document.createElement("div");
    d.className = "hrow" + (p.id === S.me ? " me" : "");
    d.innerHTML = `<span class="pres ${p.presence}" aria-hidden="true"></span><span class="nm">${esc(p.id)}</span><span class="meta">${esc(p.note)}</span>`;
    hs.appendChild(d);
  });
}

/* ===========================================================================
 * ROOM HEADER + SURFACE FOCUS
 * ======================================================================== */

function renderHead() {
  const r = room();
  $("roomName").textContent = r.name;
  $("roomTopic").textContent = r.topic;
  $("roomTopic").title = r.topic;
  $("roomFaces").innerHTML = r.members.map(m => `<span class="av" title="${esc(m)}">${esc(initials(m))}</span>`).join("");

  const items = attention(r);
  const owed = items.length;
  const rows = attentionRows(r).length;
  $("surfNeedsN").textContent = String(owed);
  $("surfStateN").textContent = String(r.objects.length);
  /* the badge counts ITEMS; the filter it turns on highlights ROWS. The
     accessible name says which is which rather than implying one number. */
  $("surfNeeds").title = owed
    ? `${owed} item${owed === 1 ? "" : "s"} need you in this room. Filtering highlights the ${rows} row${rows === 1 ? "" : "s"} linked to them.`
    : "Nothing needs you in this room, so there is nothing to filter to.";
  $("surfNeeds").disabled = owed === 0;
  const f = S.ui.feedFilter;
  $("surfConv").setAttribute("aria-pressed", String(f === null));
  $("surfNeeds").setAttribute("aria-pressed", String(!!f && f.k === "need" && f.scope === "room"));
  $("surfState").setAttribute("aria-pressed", String(S.ui.lensFocus));
  $("lens").classList.toggle("focused", S.ui.lensFocus);
  $("lensRoom").textContent = "#" + r.name.toUpperCase();
}

/* ===========================================================================
 * PIN — corpus turn 17 under a 1340×820 budget:
 *   owed floats up and the hardest one opens; the rest compress to one-line
 *   rows that keep their glyph and their primary action; clean state
 *   compresses to the counted trailer. The pin folds, it never scrolls.
 * ======================================================================== */

function renderPin() {
  const r = room();
  const items = attention(r);
  const list = $("pinList"), trailer = $("pinTrailer");
  checkAttentionInvariant(r);

  /* the pin counts ITEMS. When a need filter is on, it also says how many rows
     those items produced, because that is the other number on the screen. */
  const f = S.ui.feedFilter;
  const rows = f && f.k === "need" ? groupMessages(r, f.scope).filter(m => msgClass(r, m) === "need").length : 0;
  $("pinCount").textContent = !items.length
    ? "nothing owed — this is the whole list"
    : (f && f.k === "need")
      /* "highlighted" is now literally what happens — round 6 said this while
         dropping every other row to 1.5:1, so the word was doing the work of
         hiding a legibility failure. It says what the other rows get, too. */
      ? `${items.length} item${items.length > 1 ? "s" : ""} · ${rows} linked row${rows === 1 ? "" : "s"} highlighted below · nothing else dimmed`
      : `${items.length} item${items.length > 1 ? "s" : ""} · hardest first`;
  $("pinFold").setAttribute("aria-pressed", String(S.ui.pinFolded));
  $("pinFold").textContent = S.ui.pinFolded ? "UNFOLD" : "FOLD";
  list.hidden = S.ui.pinFolded;
  trailer.hidden = S.ui.pinFolded;

  list.innerHTML = "";
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty rise";
    e.textContent = "NOTHING NEEDS YOU IN THIS ROOM — THAT IS A RESULT, NOT AN ABSENCE";
    list.appendChild(e);
  }

  const openId = items.some(o => o.id === S.ui.pinOpen) ? S.ui.pinOpen : (items[0] && items[0].id);
  items.forEach(o => {
    list.appendChild(o.id === openId ? pinCard(r, o) : pinCompact(r, o));
  });

  const c = clearSummary(r);
  trailer.innerHTML =
    `<span class="g ${TRAILER_GLYPH_CLASS[c.glyph] || ""}" aria-hidden="true">${c.glyph}</span>` +
    `<span>${voiced(c.lead)} — <b>${c.objectivesOnTrack}/${c.objectivesTotal} objectives</b> clear of you · ` +
    `${esc(c.scope)}: <b>${c.commitments} commitment${c.commitments === 1 ? "" : "s"}</b>, ${c.overdue} overdue` +
    (c.owedOverdue ? `, ${c.owedOverdue} more overdue in the list` : "") + ` · ` +
    `<b>${c.failures} failure${c.failures === 1 ? "" : "s"}</b> · last check ` +
    `${esc(fieldOr(c.lastVerified, "not on the record"))}${c.lastCheckOnLoad ? ", as this room loaded" : ""}</span>`;
}

/* the trailer's glyph is the lead's glyph — the tone follows the sentence */
const TRAILER_GLYPH_CLASS = { "✗": "bad", "◆": "warn", "?": "warn", "~": "claim", "✓": "" };

/* an owed item whose source message is not in this room says where it is and
   goes there. Round 2 counted it and highlighted nothing. */
function sourceChip(r, o, compact) {
  const xr = sourceRoomOf(o);
  /* the compact row says the same thing in fewer characters, because on that row
     the characters are competing with the item's own title (round 7 D2) */
  if (xr) return `<span aria-hidden="true">·</span><button class="xroom" data-jump="${esc(o.sourceMsg || "")}" data-jumproom="${esc(xr)}"` +
                 ` title="The source of this item is in #${esc(xr)}" data-why="the source of ${esc(glyphOf(o))} ${esc(o.id)}, which #${esc(r.name)} owes you">` +
                 `${compact ? "" : "source in "}#${esc(xr)} →</button>`;
  if (!o.sourceMsg) return "";
  /* the time already appears in the facts beside this, so the link is the link */
  return `<span aria-hidden="true">·</span><button class="lnk" data-jump="${esc(o.sourceMsg)}">${compact ? "source →" : "jump to source →"}</button>`;
}

/* A FACT CHIP IS THE SHORTEST SURFACE THAT NARRATES THE RECORD, and it is the
   one line about an object most readers see (round 9 D1c). Where a transition
   minted the chip out of a record read, the chip is addressable, so
   checkRenderedRecordInvariant() can hold the characters on the pin and in the
   lens to the sentence the record produced — exactly as it does the chain. */
function factHtml(o, f, i, cls) {
  return `<span class="${cls || ""}"${isStated(f) ? ` data-fact-obj="${esc(o.id)}" data-fact="${i}"` : ""}>${voiced(f)}</span>`;
}

function pinCard(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("article");
  el.className = "acard" + (g === "◆" ? " gate" : "") + (o.fresh ? " rise" : "");
  el.dataset.obj = o.id;              // this element renders THIS object — see checkNarrationInvariant
  const facts = (o.facts || []).map((f, i) => factHtml(o, f, i)).join(" · ");
  el.innerHTML =
    `<div class="g" aria-hidden="true">${g}</div>
     <div>
       <div class="ttl"><span class="${isClaim(o) ? "claim" : ""}">${voiced(pinTitleFrag(o))}</span></div>
       <div class="why">${voiced(whyOf(r, o))}</div>
       <div class="foot">
         <div class="mt">${facts}${sourceChip(r, o)}</div>
         <div class="acts">${pinActions(o)}</div>
       </div>
     </div>`;
  wireActions(el, o);
  return el;
}

/* turn-17 compression: still visible, still glyphed, still one click to act */
function pinCompact(r, o) {
  const g = glyphOf(o);
  const el = document.createElement("div");
  el.className = "acomp";
  el.dataset.obj = o.id;
  const primary = pinActions(o, true);
  const xr = sourceRoomOf(o);
  /* three flexible things, three tracks (D2). The facts are the only part of
     this row that is also somewhere else, so they are the only part that gives
     way: the title and every CONTROL on the row — the cross-room chip included,
     which is why it sits with the action and not with the prose — keep tracks
     that cannot be shrunk into illegibility. */
  const facts = (o.facts || []).slice(0, xr ? 1 : 2).map((f, i) => factHtml(o, f, i)).join(" · ");
  el.innerHTML =
    `<span class="g" aria-hidden="true">${g}</span>
     <button class="ct" data-open="${esc(o.id)}" title="Expand this item">${voiced(pinTitleFrag(o))}</button>
     <span class="mt">${facts ? `<span class="fx">${facts}</span>` : ""}</span>
     <span class="ac">${xr ? sourceChip(r, o, true) : ""}${primary}</span>`;
  /* the compact row is REPLACED by the expanded card, so its own key is gone;
     the successor is the card's first action, which is what the reader opened
     the row to reach, then the item's line in the lens (D3) */
  el.querySelector("[data-open]").addEventListener("click", () => {
    S.ui.pinOpen = o.id;
    focusOn(`#pin .acard .acts button`, `#pin .acard .mt button`, `[data-lens-obj="${o.id}"]`);
    render();
  });
  wireActions(el, o);
  return el;
}

/* NO DEAD ATTENTION ITEMS. Every pending decision offers the bound composer,
   whether or not it ever carried one-click options; reopening one that had
   options keeps them, and reopening one that never had any mints the single
   honest option there is — re-affirming the statement already on the record.
   checkAttentionInvariant() shouts if this ever returns nothing. */
/* --- WHAT THE BOUND COMPOSER CAN HONESTLY RECORD (round 9 D4) --------------
 * `send()` called `answerDecision()` for whatever was bound, and this function
 * offered the bound path on four kinds. `answerDecision()` amends the object's
 * STATEMENT and records the sender as having ACCEPTED it — which is the truth
 * for exactly one kind of object, and for a commitment somebody else owns it
 * walked straight around the ownership guard applyEffect() has enforced since
 * round 4: driven on dana's commitment it wrote lars's sentence into the record
 * as the commitment's own text and stamped `ACCEPTED · commitment · by lars`.
 *
 * So the bound path is kind-aware, and the kinds are decided by what the record
 * would hold afterwards, not by what is convenient:
 *
 *   decision   KEPT. A decision's statement of record IS the answer, and
 *              accepting it is what answering means. Guarded on ownership all
 *              the same: only the person it is owed to may record the call.
 *   question   KEPT, and routed to the question's own field. A question's
 *              record is its `answer`, not its `statement` — typing into the
 *              old path rewrote the QUESTION. It lands exactly where the
 *              one-click answer lands: `answer` amended, unverified, no
 *              sign-off attached. Ownership-guarded the same way.
 *   commitment REMOVED. You cannot decide somebody else's commitment and you
 *              cannot sign it off — that is the guard this was bypassing. When
 *              a commitment you do not own is owed to you, what you can
 *              honestly do is say something about it in the room.
 *   claim      REMOVED. A claim moves by being checked, with evidence, by
 *   (and any   somebody other than the claimant. Typing a sentence at it is not
 *    other)    a verification, and recording it as one is the defect the ~/✓
 *              pair exists to prevent.
 *
 * The two removals keep an action, because NO DEAD ATTENTION ITEMS still holds:
 * they get the reply composer, which appends a message and touches no record.
 * ------------------------------------------------------------------------ */
function boundKind(o) {
  if (!o) return null;
  if (o.kind === "decision") return "decision";
  if (o.kind === "question") return "question";
  return null;
}
/* WHO IS BEING ASKED. `owedTo` is the answer while something is owed — but
   handing a question on CLEARS it while setting the assignee, so reading
   `owedTo` alone says "nobody owes this, therefore anybody may answer it" about
   an item that was explicitly handed to a named person (round 10 self-review).
   The assignee is the fallback, and only when neither names anyone is the item
   genuinely unclaimed. */
function askedOf(o) {
  if (!o) return null;
  if (o.owedTo != null) return o.owedTo;
  return o.assignee != null ? o.assignee : null;
}
/* whose call it is. Only the person being asked may put an answer on the
   record — the same rule commitmentOwner() states for a sign-off. */
function canAnswer(o) {
  if (!o || (o.kind !== "decision" && o.kind !== "question")) return false;
  const who = askedOf(o);
  return who == null || who === S.me;
}
function canBind(o) { return !!boundKind(o) && canAnswer(o); }
/* the sentence the page says when it refuses. Never invents a name. */
function refusalFor(o) {
  if (!o) return "there is nothing here to record an answer against";
  if (o.kind === "commitment")
    return `${fieldOr(commitmentOwner(o), "someone else")} owns this commitment — typing at it would record your sentence as theirs and accept it in your name`;
  if (o.kind === "claim")
    return "a claim moves by being checked with evidence, by someone other than the claimant — typing at it is not a verification";
  const who = askedOf(o);
  if (who && who !== S.me)
    return `${who} is being asked this, not you — recording an answer in your name would be a decision you were not asked to make`;
  return "this is not something the composer can put on the record — say it in the room instead";
}

function pinActions(o, primaryOnly) {
  let acts = [];
  if (o.kind === "decision") {
    acts = (o.options || []).map((opt, i) =>
      `<button class="btn ${i === 0 ? "amber" : ""}" data-opt="${i}" title="${esc(opt.statement)}">${esc(opt.label)}</button>`);
    if (canBind(o)) acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
    else acts.push(aboutButton(o, "ghost sm"));
  } else if (o.kind === "commitment") {
    /* only the person who owes it can sign it off (round 4 D5). When a
       commitment that is not yours ends up owed to you, the honest action is
       the one you can actually take: say something about it in the room. The
       bound composer is NOT that action — it would record your sentence as the
       commitment's own text and accept it in your name (round 9 D4). */
    acts = commitmentOwner(o) === S.me
      ? [`<button class="btn sm" data-fx="signed">Mark signed off</button>`,
         `<button class="btn ghost sm" data-fx="resched">Reschedule</button>`]
      : [aboutButton(o, "sm")];
  } else if (o.kind === "question") {
    /* the one-click control is only offered when the card actually carries an
       answer to record — the page does not word an answer on a human's behalf
       (round 5 D2). Typing one yourself is always available to whoever is being
       asked, and it now writes the question's `answer`, not its statement. */
    acts = o.answerOption
      ? [`<button class="btn sm" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer — ${esc(o.answerOption.label)}</button>`]
      : canBind(o)
        ? [`<button class="btn sm" data-bind="1">Answer in your own words →</button>`]
        : [aboutButton(o, "sm")];
    /* the page does not invent a name to hand a question to */
    if (o.reassignTo) acts.push(`<button class="btn ghost sm" data-fx="reassign">Ask ${esc(o.reassignTo)} instead</button>`);
    else if (o.answerOption && canBind(o)) acts.push(`<button class="btn ghost sm" data-bind="1">Answer in your own words →</button>`);
  } else {
    /* a claim moves by being checked, not by being typed at — and anything else
       that ends up owed still gets a way out */
    acts = [aboutButton(o, "ghost sm")];
  }
  return primaryOnly ? (acts[0] || "") : acts.join("");
}
/* the honest alternative to a bound composer: a message in the room, which is
   what a person can always do about anything and which amends no record. */
function aboutButton(o, cls) {
  return `<button class="btn ${cls}" data-about="1">Say something about this in the room →</button>`;
}

function wireActions(el, o) {
  el.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    const opt = o.options[Number(b.dataset.opt)];
    answerDecision(o.id, { origin: "chosen", statement: opt.statement, label: opt.label, agrees: !!opt.agrees },
      opt.synthesized
        ? `one-click re-affirmation · the statement already on the record, recorded again verbatim · ${S.me} chose it, the page worded it · no model in the path`
        : `one-click answer · reversible gate · the card's statement recorded verbatim · ${S.me} chose it, the page worded it · no model in the path`);
  }));
  const bind = el.querySelector("[data-bind]");
  if (bind) bind.addEventListener("click", () => bindComposer(o.id));
  const about = el.querySelector("[data-about]");
  if (about) about.addEventListener("click", () => startAbout(o.id));
  el.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(o.id, b.dataset.fx)));
  el.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jump, b.dataset.jumproom, b.dataset.why)));
}

/* ===========================================================================
 * FEED
 * ======================================================================== */

const FILTER_LABEL = { need: "NEED YOU", change: "CHANGES", discussion: "DISCUSSION", routine: "ROUTINE" };

function renderFeed() {
  const r = room();
  const feed = $("feed");
  const keepTop = feed.scrollTop;
  feed.innerHTML = "";
  feed.classList.toggle("filtered", !!S.ui.feedFilter);

  /* two dividers, never one: the absence window (frozen at return) and whatever
     has landed since. They are different groups with different labels and
     separately-scoped chips, which is what stops your own post-return typing
     from being reported back to you as something you missed. */
  const cursorI = idx(r, r.seenAfter);
  const absStartI = idx(r, r.absenceFrom);      // pinned: marking seen never moves it
  const returnI = idx(r, r.absenceEnd);
  const absence = hasAbsenceGroup(r);
  let routineBuffer = [];

  const flushRoutine = () => {
    if (!routineBuffer.length) return;
    feed.appendChild(routineStrip(r, routineBuffer));
    routineBuffer = [];
  };

  r.messages.forEach((m, i) => {
    if (absence && i === absStartI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "absence")); }
    if (i === returnI + 1) { flushRoutine(); feed.appendChild(sylDivider(r, "return")); }
    if (m.routine) { routineBuffer.push(m); return; }
    flushRoutine();
    feed.appendChild(messageRow(r, m));
  });
  flushRoutine();
  if (cursorI === r.messages.length - 1) feed.appendChild(sylDivider(r, "seen"));
  feed.scrollTop = keepTop;
}

function messageRow(r, m) {
  const g = msgGlyph(r, m);
  const o = linkedObject(r, m);
  const cls = msgClass(r, m);
  const seen = idx(r, m.id) <= idx(r, r.seenAfter);
  const row = document.createElement("div");
  row.className = ["mrow", gclass(g), m.system ? "sys" : "", m.actor === S.me ? "me" : "",
                   seen ? "dim" : "", matchesFilter(r, m) ? "hit" : "",
                   S.ui.jumpTo === m.id ? "tgt" : "", m.fresh ? "rise" : ""].filter(Boolean).join(" ");
  row.dataset.msg = m.id;
  if (o) row.dataset.obj = o.id;       // a row about an object narrates it, permanently
  row.dataset.cls = cls;
  row.dataset.origin = m.origin || "seeded";

  let inner = "";
  if (m.replyTo) {
    const t = msg(r, m.replyTo);
    if (t) inner += `<span class="mreply">↩ ${esc(t.actor)} ${esc(t.t)} · <span class="quoted" data-quoted="msg:${esc(t.id)}" data-voice="human">${esc(plain(t.body).slice(0, 60))}</span></span>`;
  }
  /* the dotted treatment is derived from the object's epistemic state, not from
     the glyph — so a proposal that is ALSO a gate renders ◆ and dotted.
     `data-voice` says who authored the characters inside: a human's own words
     are exempt from the page-integrity rules that police what the PAGE writes
     (stray quotation marks, `undefined` in a record). A row the page authored
     on a human's behalf is 'system', not 'human' — that is the whole of D3. */
  const voice = (!m.system && (m.origin === "typed" || m.origin === "seeded")) ? "human" : "system";
  const claimWrap = msgIsClaim(r, m);
  /* `mbody` names the row's own sentence, so a checker can read what the row
     says without also reading the tag and the actions around it (round 8 D2) */
  inner += `<span class="mbody ${claimWrap ? "claim" : ""}" data-voice="${voice}">${bodyHtml(m.body)}</span>`;
  if (m.note) inner += `<span class="mnote">${esc(m.note)}</span>`;
  if (o && !m.sysFor) inner += objectTag(r, m, o);
  /* A TRANSITION ROW GETS A WAY INTO WHAT IT REPORTS ON (round 7 D7). Round 7
     declared `[data-msg="…"] .tag` and `[data-msg="…"] button` as the focus
     successors of every write, and a transition row rendered neither — no tag,
     because objectTag() is skipped for `sysFor` rows, and no Reply, because
     system rows do not get one. So two thirds of the declared chain could never
     apply and focus always fell through to the lens. The honest fix is not to
     delete the declaration: it is that a row saying "commitment K2 · rescheduled
     by lars" had no route to K2's receipt, which is the one thing a reader wants
     from it. The tag is DELIBERATELY STATELESS — this row's glyph is frozen at
     the state the transition landed in (round 4 D6), so a tag re-deriving the
     object's current state would contradict the row it sits on. */
  else if (m.sysFor && o) inner += sysTag(r, m, o);

  row.innerHTML =
    `<div class="t">${esc(m.t)}</div><div class="g" aria-hidden="true">${g}</div><div class="a">${esc(m.actor)}</div>
     <div class="m">${inner}<div class="acts">${rowActions(r, m, o)}</div></div>`;

  row.querySelectorAll("[data-receipt]").forEach(b => b.addEventListener("click", () => openReceipt(b.dataset.receipt, b.dataset.rcroom)));
  row.querySelectorAll("[data-reply]").forEach(b => b.addEventListener("click", () => startReply(m.id)));
  row.querySelectorAll("[data-verify]").forEach(b => b.addEventListener("click", () => { S.ui.verifying = b.dataset.verify; render(); focusVerify(); }));
  row.querySelectorAll("[data-fx]").forEach(b => b.addEventListener("click", () => applyEffect(b.dataset.obj, b.dataset.fx)));
  row.querySelectorAll("[data-pin]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.pinroom) switchRoom(b.dataset.pinroom, true);
    S.ui.pinOpen = b.dataset.pin; render(); scrollIntoView($("pin"), "nearest");
  }));

  if (o && S.ui.verifying === o.id) row.appendChild(verifyBox(o));
  return row;
}

function plain(body) { return body.map(s => typeof s === "string" ? s : isStated(s) ? voicedText(s) : (s.code || s.at || s.h || s.text || "")).join(""); }

/* the tag on a row is a render of the object's *current* state. Reopen an
   object and the historical row that settled it re-renders here — glyph,
   tag text and tone all downgrade together. (Round-1 defect B2.) */
/* the transition row's route into the object it reports on. It states no state:
   the row's own glyph already records the state this transition landed in, and
   the receipt is where the current one lives. */
function sysTag(r, m, o) {
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  return `<button class="tag" data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}>` +
         `the receipt for ${esc(o.id)}${home ? " · in #" + esc(home) : ""} →</button>`;
}

function objectTag(r, m, o) {
  const g = glyphOf(o);
  const home = m.objectRoom && m.objectRoom !== r.id ? m.objectRoom : null;
  const rc = `data-receipt="${esc(o.id)}"${home ? ` data-rcroom="${esc(home)}"` : ""}`;
  const where = home ? ` · in #${esc(home)} →` : "";

  /* ANSWER-ROW IDENTITY. Exactly one message — the one whose id is o.answerMsg
     — may carry the resolves/answer-bound tag, and only while the object is
     actually settled. Every other answer-bound row to the same object is a
     historical answer and says so, with the time it stopped being the answer.
     Round 2 compared nothing: answer → reopen → answer left the FIRST answer
     still dressed as the resolution. */
  if (m.boundTo) {
    const current = o.answerMsg === m.id;
    /* the tag says which kind of answer settled it, because "answer-bound" on a
       row the page wrote reads as a sentence the human composed (round 4 D3) */
    if (current && o.verification === "accepted")
      return `<button class="tag green" ${rc}>resolves ◆ · ${m.origin === "chosen" ? "chosen from the card" : "answer-bound"} · nothing inferred${where}</button>`;
    /* it was NOT superseded — nothing replaced it. The object it settled was
       reopened, so this is still the answer of record and the decision is
       pending again. Round 3 called this "superseded", which is the word for
       the other case entirely (a later answer), and the two now read apart. */
    /* AND IT SAYS SO ONLY WHILE IT IS TRUE (round 8 D3). `reopenedAt` is the
       fact that this object is STANDING reopened; round 8 set it and never
       cleared it, so after answer → reopen → answer the question's own current
       answer row said it had been reopened at 09:14 — a minute before that
       answer existed — and that the question was pending, while the receipt
       header, the lens and the object's state all said answered. The gate is
       the settlement the record derives, so a stale field cannot outvote it. */
    /* AND THE ROW TAG IS A RECORD READ TOO (round 11 D1/D4). This is the tag
       the critic read beside a receipt saying the question was unanswered: it
       says "still the answer on the record" and "pending again", two claims
       about two field histories, written as a literal on a row that never goes
       away. Both come out of the record now. */
    if (current && o.reopenedAt && RECORDED.settlement.get(o) === "pending")
      return `<button class="tag amber" ${rc}>` +
        /* the field that CARRIES the answer of record differs by kind — a
           question keeps it in `answer`, a decision in `statement` — so the
           sentence reads THAT field and no other. Reading both and or-ing them
           made the first query decoration, because the second can never be
           false, and declaring the unused one made the checkers verify a claim
           the sentence never consulted. */
        voiced(stated(o, [o.kind === "question" ? "answer" : "statement", "settlement"], (c, s) =>
          `answer reopened ${fieldOr(o.reopenedAt, "· time not recorded")} · ` +
          /* and it calls the field by ITS name: a decision's answer of record is
             its statement, and saying "answer" about a read of `statement` is
             CONVENTIONS line 230 in one word (round 11 self-review) */
          (c.everSet() ? `still the ${c.of} on the record · ` : `nothing is recorded as its ${c.of} · `) +
          `${o.kind} ${enumText(s.value)}${s.before(s.value) ? " again" : ""}`)) +
        `${where}</button>`;
    /* SETTLED WITHOUT BEING ACCEPTED (round 5 D2). An answered question is not
       accepted and has not been reopened; before the answer was recorded at all
       this case could not arise, and the reopened branch above would have
       claimed a reopen that never happened. It says what it is instead. */
    if (current)
      return `<button class="tag" ${rc}>` +
        voiced(stated(o, ["verification"], v => `records the answer · ${o.kind} ${enumText(v.value)} · no sign-off attached`)) +
        `${where}</button>`;
    return `<button class="tag amber" ${rc}>superseded answer · replaced ${esc(fieldOr(m.supersededAt, "· time not recorded"))} · kept on the record${where}</button>`;
  }
  /* A ◆ BADGE MEANS "THIS ROOM OWES YOU THIS" (round 4 minor). When the object
     lives in ANOTHER room, this room's Needs-you filter correctly does not count
     this row — so under that filter the row dimmed to .3 while still wearing an
     amber ◆ badge saying it needed you. The toast was honest and the badge was
     not. A cross-room gate now renders as a neutral pointer that says where the
     need actually is and goes there; amber is reserved for what this room owes. */
  if (needsYou(o) && home)
    return `<button class="tag" data-pin="${esc(o.id)}" data-pinroom="${esc(home)}">${g === "?" ? "? open question" : "◆ gate"} · needs ${esc(S.me)} in #${esc(home)} →</button>`;
  if (needsYou(o)) return `<button class="tag amber" data-pin="${esc(o.id)}">${g === "?" ? "? open question · needs " + esc(S.me) : "◆ needs " + esc(S.me)}</button>`;
  if (o.verification === "verified") return `<button class="tag green" ${rc}>verified · ${esc(fieldOr(o.verifiedBy, "no verifier on record"))}${where}</button>`;
  if (o.verification === "accepted") return `<button class="tag green" ${rc}>accepted · ${esc(fieldOr(o.acceptedBy, "no acceptor on record"))}${where}</button>`;
  if (o.kind === "commitment") return `<button class="tag" ${rc}>commitment · ${esc(fieldOr(o.owner || o.claimant, "no owner on record"))} · ${esc(fieldOr(o.due, "no due date"))} ~${where}</button>`;
  if (o.kind === "claim") return `<button class="tag" ${rc}>claim · unverified${where}</button>`;
  return `<button class="tag" ${rc}>${esc(o.kind)} · ${esc(o.verification)}${where}</button>`;
}

/* Only actions that do something are rendered. Round 1 shipped 32 inert
   buttons; the rule now is wire it or delete it. */
function rowActions(r, m, o) {
  const acts = [];
  if (!m.system) acts.push(`<button data-reply="1">Reply</button>`);
  /* you verify CLAIMS. A decision is answered, not verified, and a commitment is
     signed off — offering Verify on either would be a control that lies. */
  if (o && o.kind === "claim" && isClaim(o) && o.claimant !== S.me && !m.sysFor) {
    acts.push(`<button data-verify="${esc(o.id)}">Verify</button>`);
  }
  /* AND ONLY THE PERSON BEING ASKED (round 10 self-review). This control had no
     ownership check at all: after handing Q1 to justin — which clears `owedTo`
     and sets the assignee — the row still offered Answer to everyone, and
     applyEffect() would have recorded `answeredBy: lars` on a question that is
     justin's. Same class as the bound composer, on a different control. */
  if (o && o.kind === "question" && o.verification === "open" && o.answerOption && !m.sysFor && canAnswer(o)) {
    acts.push(`<button data-obj="${esc(o.id)}" data-fx="answered" title="${esc(o.answerOption.statement)}">Answer</button>`);
  }
  return acts.join("");
}

/* the ~ → ✓ pair, exercisable: verifying asks for the evidence, and records it */
function verifyBox(o) {
  const box = document.createElement("div");
  box.className = "vbox rise-s";
  /* an OPEN PROMPT, not a passive record entry: the page opened it, put the
     cursor in it, and is waiting. render() scrolls it clear of any sticky
     overlay and the layout invariant refuses to whitelist anything painting
     over it — both keyed on this attribute (round 5 D1). */
  box.dataset.prompt = "verify";
  box.innerHTML =
    `<div class="hd"><span class="lbl">VERIFY THIS CLAIM</span></div>
     <div class="row">
       <input id="vinput" type="text" aria-label="Evidence note" placeholder="what checked it? e.g. July AWS bill, write-throughput line: $912">
       <button class="btn sm" id="vgo">Attach &amp; verify</button>
       <button class="btn ghost sm" id="vcancel">Cancel</button>
     </div>
     <div class="hint">${esc(o.claimant)} said it, you are checking it — that is what makes it green. Verifying your own claim is not offered.</div>`;
  box.querySelector("#vgo").addEventListener("click", () => doVerify(o.id, box.querySelector("#vinput").value.trim()));
  /* the prompt closes back onto the Verify button that opened it (D3) */
  const closeVerify = () => { S.ui.verifying = null; focusOn(`[data-verify="${o.id}"]`, `[data-lens-obj="${o.id}"]`); render(); };
  box.querySelector("#vcancel").addEventListener("click", closeVerify);
  box.querySelector("#vinput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doVerify(o.id, e.target.value.trim()); }
    if (e.key === "Escape") closeVerify();
  });
  return box;
}
/* render() has already scrolled the prompt clear of the sticky band, so focus
   must not scroll again — preventScroll keeps the two from fighting. */
function focusVerify() { const i = $("vinput"); if (i) i.focus({ preventScroll: true }); }
function focusReopen() { const i = $("rinput"); if (i) i.focus({ preventScroll: true }); }

/* --- since you left ------------------------------------------------------ */

/* mode: "absence" — the frozen window you were away for
 *       "return"  — everything that has landed since you got back / marked seen
 *       "seen"    — the caught-up marker at the end of the room
 * A chip counts MESSAGES in its own group; the pin above counts the ITEMS those
 * messages are about. The when-line says so, and a chip that counts nothing is
 * disabled rather than a clickable no-op. */
/* WHAT THE FILTER DOES TO THE ROWS IT DID NOT MATCH, said on screen and counted
   rather than asserted (round 6 D2). CONVENTIONS: "If the affordance's own copy
   claims a dimmed row is still checkable, the measurement has to back it." This
   copy claims the opposite of dimming, and the CSS is what backs it. */
function filterNote(scope) {
  const f = S.ui.feedFilter;
  if (!f || f.scope !== scope) return "";
  const r = room();
  const hits = groupMessages(r, scope).filter(m => msgClass(r, m) === f.k).length;
  const rest = groupMessages(r, scope).length - hits;
  return `<span aria-hidden="true">·</span><span class="fnote">${FILTER_LABEL[f.k].toLowerCase()} filter on · ` +
         `${hits} row${hits === 1 ? "" : "s"} highlighted · the other ${rest} ` +
         `${rest === 1 ? "row is" : "rows are"} neither hidden nor dimmed — they read exactly as they did unfiltered</span>`;
}

function sylDivider(r, mode) {
  const read = mode !== "seen" && groupRead(r, mode === "absence" ? "absence" : "return");
  const el = document.createElement("div");
  el.className = "syl" + (mode === "seen" ? " seen" : mode === "return" ? " ret" : "") + (read ? " muted" : "");
  if (mode === "absence" || (mode === "seen" && !hasAbsenceGroup(r))) el.id = "syl";

  if (mode === "seen") {
    el.innerHTML =
      `<div class="bar"><span class="lbl">SEEN FROM HERE</span><span class="rule"></span></div>
       <div class="when"><span>caught up — ${r.readGroup || 0} message${r.readGroup === 1 ? "" : "s"} read · ${esc(r.away.len)} away · the seen cursor sits at the end of #${esc(r.name)}, and only this room's</span></div>`;
    return el;
  }

  const scope = mode === "absence" ? "absence" : "return";
  const c = counts(r, scope);
  const own = ownInGroup(r, scope);
  const cursorPastAbsence = idx(r, r.seenAfter) > idx(r, r.absenceEnd);
  const label = mode === "absence" ? "SINCE YOU LEFT"
              : cursorPastAbsence ? "SINCE YOU MARKED THIS SEEN" : "SINCE YOU RETURNED";

  const chips = ["need", "change", "discussion", "routine"].map(k => {
    const n = c[k], on = !!S.ui.feedFilter && S.ui.feedFilter.k === k && S.ui.feedFilter.scope === scope;
    const title = n
      ? `${n} message${n === 1 ? "" : "s"} in this group are ${k === "need" ? "linked to something that needs you — the pin counts the items, this counts the rows" : FILTER_LABEL[k].toLowerCase()}`
      : `no ${FILTER_LABEL[k].toLowerCase()} messages in this group — nothing to filter to`;
    return `<button class="cnt${k === "need" && n ? " need" : ""}" data-filter="${k}" data-scope="${scope}"` +
           `${n ? "" : " disabled"} title="${esc(title)}" aria-pressed="${on}">${n} ${FILTER_LABEL[k]}</button>`;
  }).join("");

  /* marking seen mutes this divider; it does not delete it. The window, the
     count and the four chips stay exactly where they were, and the mark is
     reversible from the same line that reports it. */
  const when = mode === "absence"
    ? `<span>${esc(r.away.from)} → ${esc(r.away.to)} · ${esc(r.away.len)} away · ${c.total} messages · frozen at return</span>
       <span aria-hidden="true">·</span>
       <span>chips count rows · NEEDS YOU counts the items behind them</span>` + filterNote(scope) + `
       <span aria-hidden="true">·</span>` +
      (read
        ? `<span class="marked">marked seen ${esc(r.markedAt || "")} · the group stays here, muted</span>
           <span aria-hidden="true">·</span>
           <button class="mark" id="unmarkSeen">unmark</button>`
        : `<button class="mark" id="markSeen">mark this group seen</button>`)
    : `<span>${c.total} ${read ? "message" + (c.total === 1 ? "" : "s") + " here, all read" : "unseen since " + esc(cursorPastAbsence ? "you marked this seen" : r.away.to)}</span>` +
      (own ? `<span aria-hidden="true">·</span><span class="own">${own} row${own === 1 ? " here is yours" : "s here are yours"} — your own activity is never counted back to you as unseen</span>` : "") +
      filterNote(scope) +
      (c.total
        ? read
          ? `<span aria-hidden="true">·</span><span class="marked">marked seen ${esc(r.markedAt || "")}</span>
             <span aria-hidden="true">·</span><button class="mark" id="unmarkSeen">unmark</button>`
          : `<span aria-hidden="true">·</span><button class="mark" id="markSeen">mark this group seen</button>`
        : "");

  el.innerHTML =
    `<div class="bar">
       <span class="lbl">${label}</span>
       <div class="counts">${chips}</div>
       <span class="rule"></span>
     </div>
     <div class="when">${when}</div>`;
  el.querySelectorAll(".cnt").forEach(b => b.addEventListener("click", () => setFilter(b.dataset.filter, b.dataset.scope)));
  const mk = el.querySelector("#markSeen");
  if (mk) mk.addEventListener("click", markSeen);
  const un = el.querySelector("#unmarkSeen");
  if (un) un.addEventListener("click", unmarkSeen);
  return el;
}

/* --- routine collapse: count, range and actors all derived from the rows --- */

function routineStrip(r, rows) {
  const wrap = document.createElement("div");
  wrap.className = "routine";
  const actors = [...new Set(rows.map(m => m.actor))];
  const routineFilter = !!S.ui.feedFilter && S.ui.feedFilter.k === "routine";
  const open = S.ui.routineOpen || routineFilter;
  const showAll = routineFilter;
  const shown = open ? (showAll ? rows : rows.slice(0, 6)) : [];

  const strip = document.createElement("button");
  strip.className = "strip";
  /* a toggle that survives its own render keeps focus, which needs a key that
     survives the rebuild. Round 7's strip carried neither id nor data attribute,
     so focusKey() had nothing to return and a peek dropped focus to BODY (D3). */
  strip.dataset.strip = "routine";
  strip.setAttribute("aria-expanded", String(open));
  strip.innerHTML =
    `<span aria-hidden="true">·</span><span><b>${rows.length} routine</b></span>
     <span aria-hidden="true">·</span><span>${esc(rows[0].t)}–${esc(rows[rows.length - 1].t)}</span>
     <span aria-hidden="true">·</span><span>${esc(actors.join(", "))}</span>
     <span class="peek">${open ? "click to collapse" : "click to peek"}</span>`;
  strip.addEventListener("click", () => {
    S.ui.routineOpen = !open;
    S.ui.routineOpenedByFilter = false;      // opened or closed by hand from here on
    if (!S.ui.routineOpen && routineFilter) S.ui.feedFilter = null;
    render();
  });
  wrap.appendChild(strip);

  if (open) {
