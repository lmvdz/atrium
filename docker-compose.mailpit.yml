# Local/CI production-topology mail relay. Never deploy this public: Mailpit
# stores verification links in cleartext and has no authentication here.
name: atrium

services:
  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: ''
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      ATRIUM_MAIL_TRANSPORT: smtp
      ATRIUM_MAIL_FROM: ${ATRIUM_MAIL_FROM:-Atrium <no-reply@atrium.test>}
      SMTP_URL: smtp://mailpit:1025
      SMTP_REQUIRE_TLS: 'false'

  app:
    depends_on:
      mailpit:
        condition: service_healthy
    environment:
      ATRIUM_MAIL_TRANSPORT: smtp
      ATRIUM_MAIL_FROM: ${ATRIUM_MAIL_FROM:-Atrium <no-reply@atrium.test>}
      SMTP_URL: smtp://mailpit:1025
      SMTP_REQUIRE_TLS: 'false'
